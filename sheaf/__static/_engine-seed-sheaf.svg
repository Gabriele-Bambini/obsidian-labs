<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure — cellular sheaves on a gene graph</title>
  <desc id="d">Four panels: stalks on nodes, restriction maps on edges, the sheaf Laplacian energy, and diffusion to a consistent section unless frustrated by holonomy.</desc>
  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="150" cy="60" r="230" fill="#a78bfa" opacity="0.05"/>
  <circle cx="820" cy="430" r="250" fill="#34d399" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE &#183; CELLULAR SHEAVES ON A GENE GRAPH</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">From local stalks to a consistent global regulatory state</text>

  <!-- (a) STALKS -->
  <g>
    <rect x="40" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="244" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Stalks</text><text x="86" y="124" fill="#8a99ad" font-size="12">a vector on each gene</text>
    <g stroke="#2c4a6e" stroke-width="1.6"><line x1="105" y1="180" x2="165" y2="160"/><line x1="165" y1="160" x2="135" y2="225"/><line x1="105" y1="180" x2="135" y2="225"/><line x1="165" y1="160" x2="220" y2="195"/><line x1="135" y1="225" x2="195" y2="265"/><line x1="220" y1="195" x2="195" y2="265"/></g>
    <g stroke="#4dd7ff" stroke-width="2.2" fill="none">
      <line x1="105" y1="180" x2="128" y2="166" marker-end="url(#av)"/><line x1="165" y1="160" x2="180" y2="138" marker-end="url(#av)"/><line x1="135" y1="225" x2="116" y2="241" marker-end="url(#av)"/>
      <line x1="220" y1="195" x2="244" y2="190" marker-end="url(#av)"/><line x1="195" y1="265" x2="205" y2="243" marker-end="url(#av)"/>
    </g>
    <g stroke="#0a1322" stroke-width="2"><circle cx="105" cy="180" r="8" fill="#7fd6b0"/><circle cx="165" cy="160" r="8" fill="#9bd0c0"/><circle cx="135" cy="225" r="8" fill="#f0a0b0"/><circle cx="220" cy="195" r="8" fill="#aacfb8"/><circle cx="195" cy="265" r="8" fill="#f0a0b0"/></g>
    <text x="162" y="306" fill="#8a99ad" font-size="12" text-anchor="middle">stalk uᵢ ∈ ℝ&#7496; (here d=2)</text>
  </g>

  <!-- (b) RESTRICTION MAPS -->
  <g>
    <rect x="326" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="326" y="82" width="244" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="350" cy="110" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="350" y="115" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="372" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Restriction maps</text><text x="372" y="124" fill="#8a99ad" font-size="12">edges transport stalks</text>
    <line x1="385" y1="200" x2="510" y2="200" stroke="#2c4a6e" stroke-width="2"/>
    <circle cx="385" cy="200" r="11" fill="#9bd0c0" stroke="#0a1322" stroke-width="2"/><text x="385" y="234" fill="#8a99ad" font-size="12" text-anchor="middle">gene i</text>
    <circle cx="510" cy="200" r="11" fill="#aacfb8" stroke="#0a1322" stroke-width="2"/><text x="510" y="234" fill="#8a99ad" font-size="12" text-anchor="middle">gene j</text>
    <line x1="385" y1="200" x2="385" y2="172" stroke="#4dd7ff" stroke-width="2.2" marker-end="url(#av)" fill="none"/>
    <line x1="510" y1="200" x2="528" y2="178" stroke="#4dd7ff" stroke-width="2.2" marker-end="url(#av)" fill="none"/>
    <path d="M430 178 A 24 24 0 0 1 470 178" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#av)"/>
    <text x="448" y="166" fill="#fde68a" font-size="12" text-anchor="middle">Rₑ = rot(θₑ)</text>
    <text x="448" y="288" fill="#cfe0f0" font-size="13.5" text-anchor="middle" font-family="'Cascadia Mono',monospace">consistent ⇔ uᵢ = Rₑ uⱼ</text>
    <text x="448" y="308" fill="#8a99ad" font-size="11.5" text-anchor="middle">θ encodes activation / repression</text>
  </g>

  <!-- (c) SHEAF LAPLACIAN -->
  <g>
    <rect x="612" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="612" y="82" width="244" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="636" cy="110" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/><text x="636" y="115" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="658" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Consistency energy</text><text x="658" y="124" fill="#8a99ad" font-size="12">the sheaf Laplacian L_F</text>
    <g transform="translate(648,150)">
      <rect x="0" y="0" width="20" height="20" fill="#3a6bcf"/><rect x="22" y="0" width="20" height="20" fill="#24507f"/><rect x="48" y="0" width="20" height="20" fill="#10243f"/><rect x="70" y="0" width="20" height="20" fill="#24507f"/>
      <rect x="0" y="22" width="20" height="20" fill="#24507f"/><rect x="22" y="22" width="20" height="20" fill="#3a6bcf"/><rect x="48" y="22" width="20" height="20" fill="#24507f"/><rect x="70" y="22" width="20" height="20" fill="#10243f"/>
      <rect x="0" y="48" width="20" height="20" fill="#10243f"/><rect x="22" y="48" width="20" height="20" fill="#24507f"/><rect x="48" y="48" width="20" height="20" fill="#3a6bcf"/><rect x="70" y="48" width="20" height="20" fill="#24507f"/>
      <rect x="0" y="70" width="20" height="20" fill="#24507f"/><rect x="22" y="70" width="20" height="20" fill="#10243f"/><rect x="48" y="70" width="20" height="20" fill="#24507f"/><rect x="70" y="70" width="20" height="20" fill="#3a6bcf"/>
    </g>
    <text x="760" y="180" fill="#8a99ad" font-size="11.5">block</text><text x="760" y="195" fill="#8a99ad" font-size="11.5">Laplacian</text><text x="760" y="210" fill="#8a99ad" font-size="11.5">(d×d blocks)</text>
    <text x="734" y="276" fill="#cfe0f0" font-size="13" text-anchor="middle" font-family="'Cascadia Mono',monospace">E = Σₑ ‖uᵢ − Rₑuⱼ‖²</text>
    <text x="734" y="308" fill="#8a99ad" font-size="11.5" text-anchor="middle">E = u&#7488; L_F u · zero ⇔ a global section</text>
  </g>

  <!-- (d) DIFFUSION VS FRUSTRATION -->
  <g>
    <rect x="40" y="342" width="816" height="150" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="342" width="816" height="4" rx="2" fill="#fb7185"/>
    <circle cx="64" cy="370" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="64" y="375" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="86" y="366" fill="#cfe0f0" font-size="14" font-weight="700">Sheaf diffusion → a global section, unless holonomy frustrates it</text>
    <!-- left: trivial, aligns (green) -->
    <text x="210" y="396" fill="#34d399" font-size="12" text-anchor="middle">trivial sheaf · energy → 0</text>
    <g stroke="#2c4a6e" stroke-width="1.5"><line x1="150" y1="450" x2="210" y2="430"/><line x1="210" y1="430" x2="270" y2="450"/><line x1="150" y1="450" x2="270" y2="450"/></g>
    <g stroke="#34d399" stroke-width="2.4" fill="none"><line x1="150" y1="450" x2="170" y2="436" marker-end="url(#av)"/><line x1="210" y1="430" x2="230" y2="416" marker-end="url(#av)"/><line x1="270" y1="450" x2="290" y2="436" marker-end="url(#av)"/></g>
    <g stroke="#0a1120" stroke-width="2"><circle cx="150" cy="450" r="7" fill="#7fd6b0"/><circle cx="210" cy="430" r="7" fill="#7fd6b0"/><circle cx="270" cy="450" r="7" fill="#7fd6b0"/></g>
    <text x="210" y="478" fill="#8a99ad" font-size="11" text-anchor="middle">stalks all agree</text>
    <!-- divider -->
    <line x1="448" y1="392" x2="448" y2="480" stroke="rgba(150,170,200,.16)" stroke-width="1"/>
    <!-- right: twisted, frustrated (rose) -->
    <text x="650" y="396" fill="#fb7185" font-size="12" text-anchor="middle">twisted sheaf · energy stalls &gt; 0</text>
    <g stroke="#2c4a6e" stroke-width="1.5"><line x1="590" y1="450" x2="650" y2="430"/><line x1="650" y1="430" x2="710" y2="450"/><line x1="590" y1="450" x2="710" y2="450"/></g>
    <g stroke="#fb7185" stroke-width="2.4" fill="none"><line x1="590" y1="450" x2="606" y2="434" marker-end="url(#av)"/><line x1="650" y1="430" x2="672" y2="438" marker-end="url(#av)"/><line x1="710" y1="450" x2="700" y2="430" marker-end="url(#av)"/></g>
    <g stroke="#0a1120" stroke-width="2"><circle cx="590" cy="450" r="7" fill="#f0a0b0"/><circle cx="650" cy="430" r="7" fill="#f0a0b0"/><circle cx="710" cy="450" r="7" fill="#f0a0b0"/></g>
    <text x="650" y="478" fill="#8a99ad" font-size="11" text-anchor="middle">θ₁+θ₂+θ₃ ≠ 0 around the cycle</text>
  </g>

  <!-- CAPTION -->
  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure (engine seed). </tspan><tspan>A cellular sheaf is a graph carrying local data. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> Each gene gets a vector stalk uᵢ (here in ℝ²).</tspan>
    <tspan x="40" dy="21"></tspan><tspan fill="#c4b5fd" font-weight="700">(b)</tspan><tspan> Each edge carries a restriction map Rₑ that transports a stalk across it; the pair is consistent when uᵢ = Rₑuⱼ, with θₑ encoding activation vs repression.</tspan>
    <tspan x="40" dy="21"></tspan><tspan fill="#fde68a" font-weight="700">(c)</tspan><tspan> The sheaf Laplacian L_F sums these disagreements into a consistency energy E = u&#7488;L_Fu, zero exactly when a global section exists.</tspan>
    <tspan x="40" dy="21"></tspan><tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> Sheaf diffusion descends E to that section — but if the restriction maps have non-trivial holonomy around a cycle, no section exists and the energy stalls above zero (nonzero sheaf cohomology).</tspan>
  </text>
</svg>
