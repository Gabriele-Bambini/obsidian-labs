<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 250" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A01 concept — feature matrix gains relations, then message passing</title>
  <defs><marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="250" rx="12" fill="#070b14"/>
  <text x="28" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A01 · TABLE → GRAPH → MESSAGE PASSING</text>

  <!-- feature matrix -->
  <text x="92" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">feature matrix</text>
  <g>
    <rect x="44" y="80" width="40" height="22" rx="3" fill="#3fa9e8"/><rect x="88" y="80" width="26" height="22" rx="3" fill="#fbbf24"/>
    <rect x="44" y="106" width="40" height="22" rx="3" fill="#2f6fb0"/><rect x="88" y="106" width="26" height="22" rx="3" fill="#16233a"/>
    <rect x="44" y="132" width="40" height="22" rx="3" fill="#244f7f"/><rect x="88" y="132" width="26" height="22" rx="3" fill="#16233a"/>
    <rect x="44" y="158" width="40" height="22" rx="3" fill="#3ba0de"/><rect x="88" y="158" width="26" height="22" rx="3" fill="#16233a"/>
  </g>
  <text x="92" y="202" fill="#6b7a8d" font-size="11" text-anchor="middle">no relations</text>

  <line x1="140" y1="130" x2="210" y2="130" stroke="#5a6b80" stroke-width="2" marker-end="url(#i)"/>
  <text x="175" y="120" fill="#a78bfa" font-size="11" text-anchor="middle">add edges</text>

  <!-- graph -->
  <text x="330" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">biological graph G=(V,E,X,Z,u)</text>
  <line x1="270" y1="130" x2="372" y2="96" stroke="#9fd0ff" stroke-width="4" marker-end="url(#i)"/>
  <line x1="270" y1="130" x2="372" y2="170" stroke="#4a6f8f" stroke-width="2" marker-end="url(#i)"/>
  <circle cx="270" cy="130" r="15" fill="#4dd7ff" stroke="#0a1322" stroke-width="2"/><text x="270" y="162" fill="#9fe0ff" font-size="10" text-anchor="middle">TF1</text>
  <circle cx="382" cy="92" r="12" fill="#e7a13a" stroke="#0a1322" stroke-width="2"/><text x="382" y="76" fill="#fbd089" font-size="10" text-anchor="middle">GeneA</text>
  <circle cx="382" cy="174" r="12" fill="#3f74c4" stroke="#0a1322" stroke-width="2"/><text x="382" y="200" fill="#9fb4cc" font-size="10" text-anchor="middle">GeneB</text>
  <circle cx="300" cy="198" r="11" fill="#6b7a8d" stroke="#fb7185" stroke-width="2"/><text x="332" y="202" fill="#fda4b0" font-size="10">GeneC (isolated)</text>

  <line x1="450" y1="130" x2="520" y2="130" stroke="#5a6b80" stroke-width="2" marker-end="url(#i)"/>
  <text x="485" y="120" fill="#fbbf24" font-size="11" text-anchor="middle">pass messages</text>

  <!-- after -->
  <text x="700" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">updated representations</text>
  <line x1="560" y1="120" x2="650" y2="100" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#i)"/>
  <circle cx="560" cy="120" r="15" fill="#4dd7ff" stroke="#0a1322" stroke-width="2"/><text x="560" y="152" fill="#9fe0ff" font-size="10" text-anchor="middle">TF1</text>
  <circle cx="664" cy="96" r="13" fill="#fbbf24" stroke="#0a1322" stroke-width="2"/><text x="664" y="78" fill="#fbd089" font-size="10" text-anchor="middle">GeneA↑</text>
  <text x="664" y="116" fill="#cfe0f0" font-size="11" text-anchor="middle" font-family="'Cascadia Mono',monospace">.45→.68</text>
  <circle cx="590" cy="190" r="11" fill="#6b7a8d" stroke="#fb7185" stroke-width="2"/><text x="622" y="194" fill="#fda4b0" font-size="10">GeneC unchanged</text>

  <line x1="744" y1="125" x2="788" y2="125" stroke="rgba(150,170,200,.2)" stroke-width="1"/>
  <text x="816" y="110" fill="#cfe0f0" font-size="13" font-weight="700" text-anchor="middle">structure</text>
  <text x="816" y="128" fill="#cfe0f0" font-size="13" font-weight="700" text-anchor="middle">decides</text>
  <text x="816" y="146" fill="#cfe0f0" font-size="13" font-weight="700" text-anchor="middle">what moves</text>
</svg>
