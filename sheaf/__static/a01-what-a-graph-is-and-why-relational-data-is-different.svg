<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A01 — why biology needs graph neural networks</title>
  <desc id="d">Four panels: a feature matrix has no relations; the biological graph G=(V,E,X,Z,u); one message-passing step; and the edge-evidence hierarchy.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="150" cy="60" r="230" fill="#4dd7ff" opacity="0.05"/>
  <circle cx="820" cy="430" r="250" fill="#fbbf24" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE A01 &#183; WHY BIOLOGY NEEDS GRAPH NEURAL NETWORKS</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">A table stores entities; a graph stores the relations that matter</text>

  <!-- (a) FEATURE MATRIX -->
  <g>
    <rect x="40" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="244" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">A feature matrix</text><text x="86" y="124" fill="#8a99ad" font-size="12">rows, but no relations</text>
    <g font-size="12" text-anchor="middle">
      <text x="150" y="150" fill="#8a99ad">expr</text><text x="192" y="150" fill="#8a99ad">TF?</text>
      <text x="108" y="172" fill="#9fb4cc" text-anchor="end">TF1</text><rect x="128" y="160" width="40" height="18" rx="3" fill="#3fa9e8"/><text x="148" y="173" fill="#06101f">.92</text><rect x="172" y="160" width="40" height="18" rx="3" fill="#fbbf24"/><text x="192" y="173" fill="#3a2a08">1</text>
      <text x="108" y="196" fill="#9fb4cc" text-anchor="end">GeneA</text><rect x="128" y="184" width="40" height="18" rx="3" fill="#2f6fb0"/><text x="148" y="197" fill="#06101f">.45</text><rect x="172" y="184" width="40" height="18" rx="3" fill="#16233a"/><text x="192" y="197" fill="#8a99ad">0</text>
      <text x="108" y="220" fill="#9fb4cc" text-anchor="end">GeneB</text><rect x="128" y="208" width="40" height="18" rx="3" fill="#244f7f"/><text x="148" y="221" fill="#cfe0f0">.31</text><rect x="172" y="208" width="40" height="18" rx="3" fill="#16233a"/><text x="192" y="221" fill="#8a99ad">0</text>
      <text x="108" y="244" fill="#9fb4cc" text-anchor="end">GeneC</text><rect x="128" y="232" width="40" height="18" rx="3" fill="#3ba0de"/><text x="148" y="245" fill="#06101f">.88</text><rect x="172" y="232" width="40" height="18" rx="3" fill="#16233a"/><text x="192" y="245" fill="#8a99ad">0</text>
    </g>
    <text x="162" y="300" fill="#8a99ad" font-size="12" text-anchor="middle">who regulates whom? not here.</text>
  </g>

  <!-- (b) THE GRAPH -->
  <g>
    <rect x="326" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="326" y="82" width="244" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="350" cy="110" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="350" y="115" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="372" y="106" fill="#cfe0f0" font-size="14" font-weight="700">The graph G=(V,E,X,Z,u)</text><text x="372" y="124" fill="#8a99ad" font-size="12">nodes + directed evidence edges</text>
    <line x1="372" y1="200" x2="470" y2="166" stroke="#9fd0ff" stroke-width="4.5" marker-end="url(#arT)"/>
    <line x1="372" y1="200" x2="470" y2="244" stroke="#4a6f8f" stroke-width="2" marker-end="url(#ar)"/>
    <circle cx="372" cy="200" r="16" fill="#4dd7ff" stroke="#0a1322" stroke-width="2"/><text x="372" y="232" fill="#9fe0ff" font-size="11" text-anchor="middle">TF1</text>
    <circle cx="478" cy="162" r="13" fill="#e7a13a" stroke="#0a1322" stroke-width="2"/><text x="478" y="140" fill="#fbd089" font-size="11" text-anchor="middle">GeneA</text>
    <circle cx="478" cy="246" r="13" fill="#3f74c4" stroke="#0a1322" stroke-width="2"/><text x="478" y="276" fill="#9fb4cc" font-size="11" text-anchor="middle">GeneB</text>
    <circle cx="392" cy="288" r="13" fill="#6b7a8d" stroke="#fb7185" stroke-width="2"/><text x="392" y="314" fill="#fda4b0" font-size="11" text-anchor="middle">GeneC</text>
    <text x="438" y="178" fill="#9fd0ff" font-size="10.5">.87</text><text x="438" y="226" fill="#7f9ab0" font-size="10.5">.34</text>
  </g>

  <!-- (c) MESSAGE PASSING STEP -->
  <g>
    <rect x="612" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="612" y="82" width="244" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="636" cy="110" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/><text x="636" y="115" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="658" y="106" fill="#cfe0f0" font-size="14" font-weight="700">One message-passing step</text><text x="658" y="124" fill="#8a99ad" font-size="12">structure decides what moves</text>
    <line x1="662" y1="170" x2="742" y2="170" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="650" cy="170" r="13" fill="#4dd7ff" stroke="#0a1322" stroke-width="2"/><text x="650" y="200" fill="#9fe0ff" font-size="10.5" text-anchor="middle">TF1</text>
    <circle cx="756" cy="170" r="14" fill="#e7a13a" stroke="#0a1322" stroke-width="2"/><text x="756" y="200" fill="#fbd089" font-size="10.5" text-anchor="middle">GeneA</text>
    <text x="700" y="160" fill="#fde68a" font-size="11" text-anchor="middle">msg .55</text>
    <text x="756" y="148" fill="#cfe0f0" font-size="11" text-anchor="middle" font-family="'Cascadia Mono',monospace">.45→.68</text>
    <circle cx="690" cy="262" r="13" fill="#6b7a8d" stroke="#fb7185" stroke-width="2"/><text x="690" y="291" fill="#fda4b0" font-size="10.5" text-anchor="middle">GeneC</text>
    <text x="730" y="266" fill="#fb7185" font-size="12">✗ no edge → no message</text>
    <text x="734" y="312" fill="#8a99ad" font-size="11.5" text-anchor="middle">high expression ≠ a message</text>
  </g>

  <!-- (d) EDGE EVIDENCE -->
  <g>
    <rect x="40" y="342" width="816" height="150" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="342" width="816" height="4" rx="2" fill="#fb7185"/>
    <circle cx="64" cy="370" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="64" y="375" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="86" y="366" fill="#cfe0f0" font-size="14" font-weight="700">An edge is a hypothesis with evidence — and a direction. Record it in Z, or all edges look equally true.</text>
    <g font-size="12.5">
      <rect x="86" y="392" width="180" height="30" rx="6" fill="#0f3a2a"/><text x="100" y="412" fill="#7fe7c0">curated (ChIP-seq)</text>
      <text x="276" y="412" fill="#5a6b80" font-size="16">&#8250;</text>
      <rect x="296" y="392" width="180" height="30" rx="6" fill="#173a16"/><text x="310" y="412" fill="#9bd06a">perturbation (CRISPRi)</text>
      <text x="486" y="412" fill="#5a6b80" font-size="16">&#8250;</text>
      <rect x="506" y="392" width="190" height="30" rx="6" fill="#33270a"/><text x="520" y="412" fill="#fbd089">motif + accessibility</text>
      <text x="706" y="412" fill="#5a6b80" font-size="16">&#8250;</text>
      <rect x="726" y="392" width="120" height="30" rx="6" fill="#3a1420"/><text x="740" y="412" fill="#fda4b0">co-expression</text>
    </g>
    <text x="86" y="452" fill="#8a99ad" font-size="12">stronger evidence &#8594; weaker · co-expression is correlation, not regulation · TF&#8594;target is directed, not symmetric.</text>
  </g>

  <!-- CAPTION -->
  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure A01. </tspan><tspan>Biology is relational. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> A feature matrix records what each gene measures, but never which gene regulates which —</tspan>
    <tspan x="40" dy="21">the most scientific part is missing. </tspan><tspan fill="#c4b5fd" font-weight="700">(b)</tspan><tspan> The biological graph G=(V,E,X,Z,u) adds it: directed TF→gene edges whose thickness is evidence (Z).</tspan>
    <tspan x="40" dy="21"></tspan><tspan fill="#fde68a" font-weight="700">(c)</tspan><tspan> One message-passing step moves TF1's signal into GeneA (.45→.68); GeneC, with no incoming edge, gets nothing despite high expression — structure, not magnitude, decides.</tspan>
    <tspan x="40" dy="21"></tspan><tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> Each edge is a hypothesis graded by evidence and carrying a direction; mixing tiers without recording them in Z makes curated and correlational edges indistinguishable.</tspan>
  </text>
</svg>
