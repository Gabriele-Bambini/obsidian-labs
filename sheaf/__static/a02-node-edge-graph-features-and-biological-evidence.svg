<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A02 — node features, edge evidence, and graph context</title>
  <desc id="d">Four panels: node feature matrix X, multi-channel edge evidence Z, the evidence channels and their claims, and graph-level context u.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="150" cy="60" r="230" fill="#4dd7ff" opacity="0.05"/>
  <circle cx="820" cy="430" r="250" fill="#34d399" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE A02 &#183; NODE, EDGE &amp; GRAPH FEATURES</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">The feature ledger: a graph is a skeleton, features are the tissue</text>

  <g>
    <rect x="40" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="244" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Node features X</text><text x="86" y="124" fill="#8a99ad" font-size="12">entity state · what it measures</text>
    <g font-size="11.5" text-anchor="middle">
      <text x="146" y="150" fill="#8a99ad">expr</text><text x="186" y="150" fill="#8a99ad">acc</text><text x="222" y="150" fill="#8a99ad">TF</text>
      <text x="108" y="172" fill="#9fb4cc" text-anchor="end">TF1</text><rect x="126" y="160" width="36" height="17" rx="3" fill="#3fa9e8"/><text x="144" y="172.5" fill="#06101f">.92</text><rect x="166" y="160" width="36" height="17" rx="3" fill="#2c9e74"/><text x="184" y="172.5" fill="#06101f">.85</text><rect x="206" y="160" width="34" height="17" rx="3" fill="#fbbf24"/><text x="223" y="172.5" fill="#3a2a08">1</text>
      <text x="108" y="194" fill="#9fb4cc" text-anchor="end">GeneA</text><rect x="126" y="182" width="36" height="17" rx="3" fill="#2f6fb0"/><text x="144" y="194.5" fill="#06101f">.45</text><rect x="166" y="182" width="36" height="17" rx="3" fill="#2c9e74"/><text x="184" y="194.5" fill="#06101f">.71</text><rect x="206" y="182" width="34" height="17" rx="3" fill="#16233a"/><text x="223" y="194.5" fill="#8a99ad">0</text>
      <text x="108" y="216" fill="#9fb4cc" text-anchor="end">GeneB</text><rect x="126" y="204" width="36" height="17" rx="3" fill="#244f7f"/><text x="144" y="216.5" fill="#cfe0f0">.31</text><rect x="166" y="204" width="36" height="17" rx="3" fill="#1e7d5a"/><text x="184" y="216.5" fill="#cfe0f0">.55</text><rect x="206" y="204" width="34" height="17" rx="3" fill="#16233a"/><text x="223" y="216.5" fill="#8a99ad">0</text>
      <text x="108" y="238" fill="#9fb4cc" text-anchor="end">GeneC</text><rect x="126" y="226" width="36" height="17" rx="3" fill="#3ba0de"/><text x="144" y="238.5" fill="#06101f">.88</text><rect x="166" y="226" width="36" height="17" rx="3" fill="#155a40"/><text x="184" y="238.5" fill="#cfe0f0">.43</text><rect x="206" y="226" width="34" height="17" rx="3" fill="#16233a"/><text x="223" y="238.5" fill="#8a99ad">0</text>
    </g>
    <text x="162" y="298" fill="#8a99ad" font-size="11.5" text-anchor="middle">grey-0 ≠ NA — record missingness.</text>
  </g>

  <g>
    <rect x="326" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="326" y="82" width="244" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="350" cy="110" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="350" y="115" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="372" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Edge evidence Z</text><text x="372" y="124" fill="#8a99ad" font-size="12">multi-channel, not one number</text>
    <text x="392" y="158" fill="#9fd0ff" font-size="11" text-anchor="middle">TF1→GeneA (strong)</text>
    <g><rect x="360" y="210" width="13" height="44" fill="#4dd7ff"/><rect x="376" y="218" width="13" height="36" fill="#34d399"/><rect x="392" y="234" width="13" height="20" fill="#fbbf24"/><rect x="408" y="204" width="13" height="50" fill="#a78bfa"/></g>
    <text x="392" y="270" fill="#7f93a8" font-size="10.5" text-anchor="middle">.87 .72 .41 1.0</text>
    <text x="500" y="158" fill="#7f9ab0" font-size="11" text-anchor="middle">TF1→GeneB (weak)</text>
    <g><rect x="476" y="237" width="13" height="17" fill="#4dd7ff"/><rect x="492" y="223" width="13" height="31" fill="#34d399"/><rect x="508" y="252" width="13" height="2" fill="#fbbf24"/><rect x="524" y="252" width="13" height="2" fill="#a78bfa"/></g>
    <text x="500" y="270" fill="#7f93a8" font-size="10.5" text-anchor="middle">.34 .61 .00 .0</text>
    <g font-size="10"><circle cx="358" cy="294" r="5" fill="#4dd7ff"/><text x="368" y="298" fill="#9fb4cc">motif</text><circle cx="416" cy="294" r="5" fill="#34d399"/><text x="426" y="298" fill="#9fb4cc">access</text><circle cx="486" cy="294" r="5" fill="#fbbf24"/><text x="496" y="298" fill="#9fb4cc">perturb</text><circle cx="356" cy="312" r="5" fill="#a78bfa"/><text x="366" y="316" fill="#9fb4cc">prior</text></g>
  </g>

  <g>
    <rect x="612" y="82" width="244" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="612" y="82" width="244" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="636" cy="110" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/><text x="636" y="115" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="658" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Channels ≠ interchangeable</text><text x="658" y="124" fill="#8a99ad" font-size="12">each a different claim</text>
    <g font-size="11.5">
      <circle cx="640" cy="160" r="6" fill="#4dd7ff"/><text x="654" y="164" fill="#cfe0f0">motif — sequence affinity</text>
      <circle cx="640" cy="190" r="6" fill="#34d399"/><text x="654" y="194" fill="#cfe0f0">access — chromatin is open</text>
      <circle cx="640" cy="220" r="6" fill="#fbbf24"/><text x="654" y="224" fill="#cfe0f0">perturb — causal (KO/CRISPRi)</text>
      <circle cx="640" cy="250" r="6" fill="#a78bfa"/><text x="654" y="254" fill="#cfe0f0">prior — previously reported</text>
    </g>
    <text x="734" y="292" fill="#8a99ad" font-size="11" text-anchor="middle">perturbation: causal but sparse;</text>
    <text x="734" y="310" fill="#8a99ad" font-size="11" text-anchor="middle">co-expression: abundant but weak.</text>
  </g>

  <g>
    <rect x="40" y="342" width="816" height="150" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="342" width="816" height="4" rx="2" fill="#fb7185"/>
    <circle cx="64" cy="370" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="64" y="375" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="86" y="366" fill="#cfe0f0" font-size="14" font-weight="700">Graph context u — same X and E, different cell type ⇒ different regulation</text>
    <text x="210" y="398" fill="#9fd0ff" font-size="12" text-anchor="middle">hepatocyte u</text>
    <g stroke="#0a1120" stroke-width="2"><circle cx="160" cy="440" r="13" fill="#e7a13a"/><circle cx="220" cy="430" r="13" fill="#34d399"/><circle cx="200" cy="468" r="13" fill="#2c9e74"/></g>
    <text x="210" y="488" fill="#8a99ad" font-size="10.5" text-anchor="middle">accessibility high</text>
    <line x1="320" y1="440" x2="430" y2="440" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/><text x="375" y="430" fill="#fda4b0" font-size="11" text-anchor="middle">swap u</text>
    <text x="560" y="398" fill="#fda4b0" font-size="12" text-anchor="middle">neural progenitor u</text>
    <g stroke="#0a1120" stroke-width="2"><circle cx="510" cy="440" r="13" fill="#3f74c4"/><circle cx="570" cy="430" r="13" fill="#244f7f"/><circle cx="550" cy="468" r="13" fill="#1e3a5a"/></g>
    <text x="560" y="488" fill="#8a99ad" font-size="10.5" text-anchor="middle">accessibility drops</text>
    <text x="724" y="436" fill="#cfe0f0" font-size="12" text-anchor="middle">a context-blind</text><text x="724" y="454" fill="#cfe0f0" font-size="12" text-anchor="middle">model can't tell</text><text x="724" y="472" fill="#cfe0f0" font-size="12" text-anchor="middle">them apart.</text>
  </g>

  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure A02. </tspan><tspan>A GNN learns from the vectors on a graph, not the names. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> Node features X give each gene's measured state (expr,</tspan>
    <tspan x="40" dy="21">accessibility, TF-flag); a 0 from "not measured" must be recorded as NA, not confused with a true zero. </tspan><tspan fill="#c4b5fd" font-weight="700">(b)</tspan><tspan> Each edge is a multi-channel</tspan>
    <tspan x="40" dy="21">evidence vector Z — tall bars = strong evidence in that channel; collapsing them to one number throws the evidence away. </tspan><tspan fill="#fde68a" font-weight="700">(c)</tspan><tspan> The channels make</tspan>
    <tspan x="40" dy="21">different claims (sequence affinity, open chromatin, causal perturbation, prior report) with different reliability. </tspan><tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> Graph context u sets the cell type;</tspan>
    <tspan x="40" dy="21">the same nodes and edges mean different regulation in a hepatocyte versus a neural progenitor.</tspan>
  </text>
</svg>
