<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A03 concept — one edge as arrow, adjacency cell, incidence column, sparse entry</title>
  <defs><marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A03 · ONE EDGE, FOUR STORAGE FORMS</text>

  <!-- arrow -->
  <text x="96" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">graph arrow</text>
  <line x1="60" y1="120" x2="130" y2="120" stroke="#fbbf24" stroke-width="3" marker-end="url(#i)"/>
  <circle cx="60" cy="120" r="14" fill="#4dd7ff" stroke="#0a1322" stroke-width="2"/><text x="60" y="148" fill="#9fe0ff" font-size="10" text-anchor="middle">TF1</text>
  <circle cx="138" cy="120" r="12" fill="#e7a13a" stroke="#0a1322" stroke-width="2"/><text x="138" y="146" fill="#fbd089" font-size="10" text-anchor="middle">GeneA</text>
  <text x="99" y="110" fill="#fde68a" font-size="10" text-anchor="middle">.92</text>

  <text x="196" y="124" fill="#5a6b80" font-size="18" text-anchor="middle">=</text>

  <!-- adjacency cell -->
  <text x="290" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">adjacency A[t,s]</text>
  <g transform="translate(248,84)">
    <rect x="0" y="0" width="24" height="24" rx="3" fill="#0c1622"/><rect x="26" y="0" width="24" height="24" rx="3" fill="#0c1622"/><rect x="52" y="0" width="24" height="24" rx="3" fill="#0c1622"/>
    <rect x="0" y="26" width="24" height="24" rx="3" fill="#fbbf24"/><text x="12" y="42" fill="#3a2a08" font-size="9" text-anchor="middle" font-weight="700">.92</text><rect x="26" y="26" width="24" height="24" rx="3" fill="#0c1622"/><rect x="52" y="26" width="24" height="24" rx="3" fill="#0c1622"/>
    <rect x="0" y="52" width="24" height="24" rx="3" fill="#0c1622"/><rect x="26" y="52" width="24" height="24" rx="3" fill="#0c1622"/><rect x="52" y="52" width="24" height="24" rx="3" fill="#0c1622"/>
  </g>
  <text x="286" y="180" fill="#7f93a8" font-size="9.5" text-anchor="middle">row=target, col=source</text>

  <text x="370" y="124" fill="#5a6b80" font-size="18" text-anchor="middle">=</text>

  <!-- incidence column -->
  <text x="452" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">incidence column</text>
  <g transform="translate(436,84)">
    <rect x="0" y="0" width="30" height="22" rx="3" fill="#fb7185"/><text x="15" y="16" fill="#3a0b14" font-size="11" text-anchor="middle" font-weight="700">−1</text>
    <rect x="0" y="24" width="30" height="22" rx="3" fill="#34d399"/><text x="15" y="40" fill="#06281c" font-size="11" text-anchor="middle" font-weight="700">+1</text>
    <rect x="0" y="48" width="30" height="22" rx="3" fill="#0c1622"/>
  </g>
  <text x="451" y="180" fill="#7f93a8" font-size="9.5" text-anchor="middle">−1 source · +1 target</text>

  <text x="520" y="124" fill="#5a6b80" font-size="18" text-anchor="middle">=</text>

  <!-- sparse + scaling -->
  <text x="640" y="64" fill="#8a99ad" font-size="12" text-anchor="middle">sparse (COO)</text>
  <text x="560" y="106" fill="#9fb4cc" font-size="11" font-family="'Cascadia Mono',monospace">edge_index=[[0],[1]]</text>
  <text x="560" y="124" fill="#7f93a8" font-size="11" font-family="'Cascadia Mono',monospace">attr=[0.92]</text>
  <rect x="560" y="138" width="74" height="26" rx="6" fill="#3a1420"/><text x="597" y="155" fill="#fda4b0" font-size="11" text-anchor="middle">1.6 GB</text>
  <text x="644" y="155" fill="#8a99ad" font-size="13">→</text>
  <rect x="658" y="138" width="74" height="26" rx="6" fill="#0f3a2a"/><text x="695" y="155" fill="#7fe7c0" font-size="11" text-anchor="middle">1.2 MB</text>

  <line x1="752" y1="100" x2="752" y2="150" stroke="rgba(150,170,200,.2)" stroke-width="1"/>
  <text x="826" y="110" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">same edge,</text>
  <text x="826" y="128" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">four views —</text>
  <text x="826" y="146" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">keep direction</text>

  <text x="450" y="210" fill="#6b7a8d" font-size="11" text-anchor="middle">transpose the cell and the model predicts the target regulates the factor — the orientation audit catches it</text>
</svg>
