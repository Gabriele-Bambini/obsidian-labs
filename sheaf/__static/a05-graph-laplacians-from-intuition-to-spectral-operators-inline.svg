<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A05 concept — Laplacian energy, smoothing, and the Fiedler split</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A05 · L = D − A  IS A DISAGREEMENT METER</text>

  <!-- energy: signal + hot edge -->
  <text x="120" y="60" fill="#8a99ad" font-size="12" text-anchor="middle">energy  w(xᵢ−xⱼ)²</text>
  <rect x="60" y="84" width="18" height="70" fill="#4dd7ff"/><text x="69" y="168" fill="#9fe0ff" font-size="9" text-anchor="middle">TF1 hi</text>
  <rect x="170" y="138" width="18" height="16" fill="#fb7185"/><text x="179" y="168" fill="#fda4b0" font-size="9" text-anchor="middle">GeneB lo</text>
  <line x1="78" y1="92" x2="170" y2="142" stroke="#ff4d6d" stroke-width="6"/><text x="124" y="108" fill="#ff8095" font-size="10" text-anchor="middle">hot</text>
  <text x="120" y="190" fill="#7f93a8" font-size="10" text-anchor="middle">disagreement = surprise</text>

  <text x="250" y="120" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>

  <!-- smoothing -->
  <text x="370" y="60" fill="#7fe7c0" font-size="12" text-anchor="middle">smooth  x←x−ηLx</text>
  <polyline points="300,150 330,132 360,112 390,100 430,96 470,95" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="300" cy="150" r="3" fill="#fb7185"/><circle cx="470" cy="95" r="3" fill="#34d399"/>
  <text x="385" y="172" fill="#8a99ad" font-size="10" text-anchor="middle">energy → 0 (constant mode)</text>

  <text x="520" y="120" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>

  <!-- spectrum / Fiedler -->
  <text x="640" y="60" fill="#c4b5fd" font-size="12" text-anchor="middle">spectrum · Fiedler λ₂</text>
  <line x1="572" y1="120" x2="712" y2="120" stroke="#3a4a5e" stroke-width="1.5"/>
  <circle cx="578" cy="120" r="5" fill="#7fe7c0"/><text x="578" y="140" fill="#7fe7c0" font-size="9" text-anchor="middle">0</text>
  <circle cx="610" cy="120" r="5" fill="#a78bfa"/><text x="610" y="140" fill="#c4b5fd" font-size="9" text-anchor="middle">λ₂</text>
  <circle cx="650" cy="120" r="4" fill="#6f86c4"/><circle cx="690" cy="120" r="4" fill="#fb7185"/>
  <text x="640" y="160" fill="#8a99ad" font-size="10" text-anchor="middle">k=1 splits 2 modules</text>

  <line x1="735" y1="80" x2="735" y2="160" stroke="rgba(150,170,200,.2)" stroke-width="1"/>
  <text x="818" y="100" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">smooth ≠ true —</text>
  <text x="818" y="118" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">repression &amp;</text>
  <text x="818" y="136" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">boundaries are</text>
  <text x="818" y="154" fill="#cfe0f0" font-size="12.5" font-weight="700" text-anchor="middle">meant to be sharp</text>

  <text x="450" y="214" fill="#6b7a8d" font-size="11" text-anchor="middle">zero eigenvalues = components · GCN layer = one smoothing step · sheaf Laplacian restores direction &amp; sign (C08)</text>
</svg>
