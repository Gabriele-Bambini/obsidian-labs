<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A05 — the graph Laplacian: energy, smoothing, spectrum</title>
  <desc id="d">Four panels: L=D-A construction, edge-energy disagreement, smoothing diffusion, and the eigenvalue spectrum with the Fiedler split.</desc>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="160" cy="70" r="230" fill="#fb7185" opacity="0.05"/><circle cx="800" cy="450" r="250" fill="#4dd7ff" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE A05 &#183; GRAPH LAPLACIAN — DISAGREEMENT METER</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">L = D − A turns a graph + signal into energy, smoothing, and spectrum</text>

  <!-- (a) construction -->
  <g>
    <rect x="40" y="82" width="300" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="300" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">L = D − A</text><text x="86" y="124" fill="#8a99ad" font-size="12">degree minus adjacency</text>
    <text x="60" y="158" fill="#9fb4cc" font-size="12.5" font-family="'Cascadia Mono',monospace">D = diag(deg)   A = weights</text>
    <g transform="translate(70,176)" font-size="12" font-family="'Cascadia Mono',monospace">
      <text x="0" y="14" fill="#cfe0f0"> 1.48  -0.92  -0.56   0.00</text>
      <text x="0" y="34" fill="#cfe0f0">-0.92   0.92   0.00   0.00</text>
      <text x="0" y="54" fill="#cfe0f0">-0.56   0.00   1.34  -0.78</text>
      <text x="0" y="74" fill="#cfe0f0"> 0.00   0.00  -0.78   0.78</text>
    </g>
    <text x="60" y="276" fill="#7fe7c0" font-size="12.5">rows sum to 0 → L·1 = 0</text>
    <text x="60" y="298" fill="#8a99ad" font-size="11.5">positive semidefinite · smallest λ = 0</text>
    <text x="60" y="318" fill="#8a99ad" font-size="11.5"># zero eigenvalues = # components</text>
  </g>

  <!-- (b) energy -->
  <g>
    <rect x="356" y="82" width="500" height="248" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="356" y="82" width="500" height="4" rx="2" fill="#fb7185"/>
    <circle cx="380" cy="110" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="380" y="115" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="402" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Energy E(x) = Σ wᵢⱼ(xᵢ − xⱼ)² — which edges disagree?</text>
    <!-- signal nodes with heights -->
    <text x="440" y="150" fill="#8a99ad" font-size="11">x = expression on nodes (bar = value)</text>
    <g>
      <rect x="430" y="170" width="22" height="86" fill="#4dd7ff"/><text x="441" y="270" fill="#9fe0ff" font-size="10" text-anchor="middle">TF1 .90</text>
      <rect x="500" y="178" width="22" height="78" fill="#3fa9e8"/><text x="511" y="270" fill="#9fb4cc" font-size="10" text-anchor="middle">GeneA .82</text>
      <rect x="570" y="238" width="22" height="18" fill="#fb7185"/><text x="581" y="270" fill="#fda4b0" font-size="10" text-anchor="middle">GeneB .18</text>
      <rect x="640" y="222" width="22" height="34" fill="#fb9aab"/><text x="651" y="270" fill="#fda4b0" font-size="10" text-anchor="middle">State .35</text>
    </g>
    <!-- edges with energy -->
    <line x1="452" y1="180" x2="500" y2="186" stroke="#244055" stroke-width="3"/><text x="476" y="172" fill="#7f93a8" font-size="9.5" text-anchor="middle">.006</text>
    <line x1="452" y1="184" x2="570" y2="244" stroke="#ff4d6d" stroke-width="6"/><text x="520" y="214" fill="#ff8095" font-size="11" text-anchor="middle" font-weight="700">.290 ←hot</text>
    <line x1="592" y1="246" x2="640" y2="238" stroke="#5a6b80" stroke-width="3"/><text x="616" y="262" fill="#7f93a8" font-size="9.5" text-anchor="middle">.023</text>
    <g transform="translate(720,168)" font-size="12" font-family="'Cascadia Mono',monospace">
      <text x="0" y="14" fill="#7f93a8">TF1–GeneA .006</text>
      <text x="0" y="36" fill="#ff8095">TF1–GeneB .290</text>
      <text x="0" y="58" fill="#7f93a8">GeneB–State .023</text>
      <text x="0" y="84" fill="#e8eef6" font-weight="700">E(x) = 0.319</text>
    </g>
    <text x="606" y="312" fill="#fde68a" font-size="11.5" text-anchor="middle">TF1 high but GeneB low across a strong edge — the biological surprise (repressor? lag? degradation?).</text>
  </g>

  <!-- (c) smoothing -->
  <g>
    <rect x="40" y="342" width="400" height="150" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="342" width="400" height="4" rx="2" fill="#34d399"/>
    <circle cx="64" cy="370" r="13" fill="#0f3a2a" stroke="#34d399" stroke-width="1"/><text x="64" y="375" fill="#7fe7c0" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="366" fill="#cfe0f0" font-size="14" font-weight="700">Smoothing  x ← x − η·Lx</text>
    <polyline points="70,470 110,452 150,420 190,400 230,392 270,388 310,386 350,385 410,385" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="70" cy="470" r="3" fill="#fb7185"/><circle cx="410" cy="385" r="3" fill="#34d399"/>
    <text x="70" y="486" fill="#8a99ad" font-size="10">step 0 (rough)</text><text x="360" y="486" fill="#7fe7c0" font-size="10">→ constant</text>
    <text x="250" y="410" fill="#8a99ad" font-size="11">energy decays</text>
    <text x="86" y="382" fill="#fda4b0" font-size="10.5">too many steps = oversmoothing (A12)</text>
  </g>

  <!-- (d) spectrum -->
  <g>
    <rect x="456" y="342" width="400" height="150" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="456" y="342" width="400" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="480" cy="370" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="480" y="375" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="502" y="366" fill="#cfe0f0" font-size="14" font-weight="700">Spectrum = graph Fourier modes</text>
    <!-- eigenvalue ticks -->
    <line x1="490" y1="430" x2="820" y2="430" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="498" cy="430" r="5" fill="#7fe7c0"/><text x="498" y="452" fill="#7fe7c0" font-size="10" text-anchor="middle">λ₁=0</text>
    <circle cx="545" cy="430" r="5" fill="#a78bfa"/><text x="545" y="452" fill="#c4b5fd" font-size="10" text-anchor="middle">λ₂</text>
    <circle cx="610" cy="430" r="4" fill="#6f86c4"/><circle cx="675" cy="430" r="4" fill="#6f86c4"/><circle cx="745" cy="430" r="4" fill="#fb7185"/><text x="745" y="452" fill="#fda4b0" font-size="10" text-anchor="middle">λmax</text>
    <text x="545" y="412" fill="#c4b5fd" font-size="10" text-anchor="middle">Fiedler</text>
    <text x="500" y="478" fill="#8a99ad" font-size="11">k=0 flat · k=1 splits 2 modules · high k = oscillation</text>
    <text x="660" y="478" fill="#9fb4cc" font-size="11">λ₂ small = bottleneck</text>
  </g>

  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure A05. </tspan><tspan>The Laplacian L = D − A asks every edge how much its endpoints disagree. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> Its rows sum to zero, it is positive-semidefinite, and the</tspan>
    <tspan x="40" dy="21">count of zero eigenvalues equals the number of connected components. </tspan><tspan fill="#fda4b0" font-weight="700">(b)</tspan><tspan> Energy E(x)=Σw(xᵢ−xⱼ)² lights up the edges where the signal fights the graph —</tspan>
    <tspan x="40" dy="21">here TF1 high but GeneB low dominates. </tspan><tspan fill="#7fe7c0" font-weight="700">(c)</tspan><tspan> Smoothing x←x−ηLx flows the signal downhill toward the constant mode (one GCN step); over-iterating oversmooths.</tspan>
    <tspan x="40" dy="21"></tspan><tspan fill="#c4b5fd" font-weight="700">(d)</tspan><tspan> Its eigenvectors are graph-frequency modes; the Fiedler vector (λ₂) splits the two most distinct modules, and λ₂ measures algebraic connectivity.</tspan>
  </text>
</svg>
