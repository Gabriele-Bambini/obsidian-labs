<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A06 — graph signal processing: Fourier transform and filters</title>
  <desc id="d">Four panels: the graph-Fourier filter pipeline, the filter taxonomy curves, low-pass smoothing, and high-pass boundary detection.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="160" cy="70" r="230" fill="#34d399" opacity="0.05"/><circle cx="800" cy="450" r="250" fill="#fb7185" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE A06 &#183; GRAPH SIGNAL PROCESSING</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">Filter a biological signal by graph frequency</text>

  <!-- (a) pipeline -->
  <g>
    <rect x="40" y="82" width="500" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="500" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">The graph-Fourier filter pipeline</text>
    <g font-size="12" text-anchor="middle">
      <rect x="60" y="150" width="78" height="40" rx="7" fill="#15263a"/><text x="99" y="168" fill="#cfe0f0">signal x</text><text x="99" y="183" fill="#7f93a8" font-size="10">on nodes</text>
      <line x1="140" y1="170" x2="166" y2="170" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/>
      <rect x="168" y="150" width="92" height="40" rx="7" fill="#1b2e22"/><text x="214" y="168" fill="#7fe7c0">x̂ = Uᵀx</text><text x="214" y="183" fill="#7f93a8" font-size="10">spectrum</text>
      <line x1="262" y1="170" x2="288" y2="170" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/>
      <rect x="290" y="150" width="98" height="40" rx="7" fill="#33270a"/><text x="339" y="168" fill="#fde68a">×  g(λ)</text><text x="339" y="183" fill="#7f93a8" font-size="10">filter</text>
      <line x1="390" y1="170" x2="416" y2="170" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/>
      <rect x="418" y="150" width="104" height="40" rx="7" fill="#15263a"/><text x="470" y="168" fill="#4dd7ff">y = U(·)</text><text x="470" y="183" fill="#7f93a8" font-size="10">filtered</text>
    </g>
    <text x="290" y="218" fill="#8a99ad" font-size="11" text-anchor="middle">y = U · g(Λ) · Uᵀ x   —   GCN = K=1 ChebNet polynomial (no explicit U)</text>
  </g>

  <!-- (b) taxonomy curves -->
  <g>
    <rect x="556" y="82" width="300" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="556" y="82" width="300" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="580" cy="110" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="580" y="115" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="602" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Filter taxonomy  g(λ)</text>
    <line x1="586" y1="212" x2="836" y2="212" stroke="#3a4a5e" stroke-width="1"/><line x1="586" y1="128" x2="586" y2="212" stroke="#3a4a5e" stroke-width="1"/>
    <text x="588" y="226" fill="#7f93a8" font-size="9">λ=0</text><text x="820" y="226" fill="#7f93a8" font-size="9">λmax</text><text x="572" y="134" fill="#7f93a8" font-size="9">1</text>
    <path d="M586 132 Q660 150 836 206" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="640" y="146" fill="#7fe7c0" font-size="10">low-pass</text>
    <path d="M586 210 Q660 168 836 134" fill="none" stroke="#fb7185" stroke-width="2.5"/><text x="780" y="150" fill="#fda4b0" font-size="10">high-pass</text>
    <path d="M586 208 Q665 138 760 186 T836 208" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="690" y="180" fill="#fde68a" font-size="10">band</text>
  </g>

  <!-- (c) low-pass -->
  <g>
    <rect x="40" y="244" width="400" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="244" width="400" height="4" rx="2" fill="#34d399"/>
    <circle cx="64" cy="272" r="13" fill="#0f3a2a" stroke="#34d399" stroke-width="1"/><text x="64" y="277" fill="#7fe7c0" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Low-pass — smooth the modules</text><text x="86" y="286" fill="#8a99ad" font-size="11.5">denoise dropout, find co-regulated modules (= 1 GCN layer)</text>
    <text x="120" y="318" fill="#8a99ad" font-size="10" text-anchor="middle">module M1</text><text x="340" y="318" fill="#8a99ad" font-size="10" text-anchor="middle">module M2</text>
    <g><rect x="70" y="340" width="20" height="60" fill="#4dd7ff"/><rect x="100" y="332" width="20" height="68" fill="#3fa9e8"/><rect x="130" y="348" width="20" height="52" fill="#4dd7ff"/>
      <rect x="290" y="392" width="20" height="14" fill="#fb7185"/><rect x="320" y="388" width="20" height="18" fill="#fb9aab"/><rect x="350" y="394" width="20" height="12" fill="#fb7185"/></g>
    <text x="240" y="430" fill="#fbd089" font-size="14" text-anchor="middle">→</text>
    <g opacity="0.95"><rect x="70" y="344" width="20" height="56" fill="#3fa9e8"/><rect x="100" y="344" width="20" height="56" fill="#3fa9e8"/><rect x="130" y="344" width="20" height="56" fill="#3fa9e8"/>
      <rect x="290" y="392" width="20" height="14" fill="#fb9aab"/><rect x="320" y="392" width="20" height="14" fill="#fb9aab"/><rect x="350" y="392" width="20" height="14" fill="#fb9aab"/></g>
    <text x="240" y="470" fill="#7fe7c0" font-size="11.5" text-anchor="middle">within-module variation blended to the module mean</text>
  </g>

  <!-- (d) high-pass -->
  <g>
    <rect x="456" y="244" width="400" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="456" y="244" width="400" height="4" rx="2" fill="#fb7185"/>
    <circle cx="480" cy="272" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="480" y="277" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="502" y="268" fill="#cfe0f0" font-size="14" font-weight="700">High-pass — expose the boundary</text><text x="502" y="286" fill="#8a99ad" font-size="11.5">repressed / escaped / cross-module genes pop out</text>
    <text x="560" y="318" fill="#8a99ad" font-size="10" text-anchor="middle">x_hp ≈ [.01 .01 .34  .30 .01 .01]</text>
    <g>
      <rect x="500" y="398" width="20" height="8" fill="#33485e"/><rect x="528" y="398" width="20" height="8" fill="#33485e"/>
      <rect x="556" y="332" width="20" height="74" fill="#fbbf24"/><rect x="584" y="344" width="20" height="62" fill="#fbbf24"/>
      <rect x="612" y="398" width="20" height="8" fill="#33485e"/><rect x="640" y="398" width="20" height="8" fill="#33485e"/>
    </g>
    <text x="566" y="324" fill="#fde68a" font-size="9" text-anchor="middle">boundary genes</text>
    <text x="660" y="446" fill="#9fb4cc" font-size="11">smooth module</text><text x="660" y="464" fill="#9fb4cc" font-size="11">background → 0</text>
    <text x="566" y="480" fill="#fda4b0" font-size="11.5" text-anchor="middle">the genes worth investigating</text>
  </g>

  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure A06. </tspan><tspan>A biological measurement is a signal on a graph; its graph-Fourier transform x̂ = Uᵀx says which frequencies it contains. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> Filtering multiplies each</tspan>
    <tspan x="40" dy="21">mode by a gain g(λ) and transforms back. </tspan><tspan fill="#c4b5fd" font-weight="700">(b)</tspan><tspan> Low-pass keeps slow module-scale modes, high-pass keeps sharp ones, band-pass keeps a middle scale. </tspan><tspan fill="#7fe7c0" font-weight="700">(c)</tspan><tspan> Low-pass —</tspan>
    <tspan x="40" dy="21">one GCN layer — blends co-regulated genes toward the module mean (denoising); stacking layers oversmooths. </tspan><tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> High-pass deletes the smooth background and leaves the</tspan>
    <tspan x="40" dy="21">boundary / repressed genes — the mechanistically interesting cases a low-pass GCN would erase. Smooth means consistent with the graph, not biologically true.</tspan>
  </text>
</svg>
