<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A07 concept — naive smoothing breaks on repression, signed channels fix it</title>
  <defs><marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A07 · EDGE MEANING CHOOSES THE MESSAGE RULE</text>

  <!-- TF -->
  <circle cx="80" cy="120" r="20" fill="#4dd7ff" stroke="#0a1322" stroke-width="2"/><text x="80" y="156" fill="#9fe0ff" font-size="10" text-anchor="middle">TF .80</text>
  <!-- activated target -->
  <line x1="100" y1="108" x2="190" y2="80" stroke="#34d399" stroke-width="3" marker-end="url(#i)"/><text x="150" y="76" fill="#7fe7c0" font-size="12" font-weight="700">+</text>
  <circle cx="205" cy="76" r="13" fill="#34d399" stroke="#0a1322" stroke-width="2"/><text x="205" y="58" fill="#7fe7c0" font-size="10" text-anchor="middle">act .80</text>
  <!-- repressed target -->
  <line x1="100" y1="132" x2="190" y2="160" stroke="#fb7185" stroke-width="3" marker-end="url(#i)"/><text x="150" y="166" fill="#fb7185" font-size="12" font-weight="700">−</text>
  <circle cx="205" cy="164" r="13" fill="#244f7f" stroke="#0a1322" stroke-width="2"/><text x="205" y="186" fill="#9fb4cc" font-size="10" text-anchor="middle">rep .18</text>

  <text x="300" y="124" fill="#5a6b80" font-size="16" text-anchor="middle">rule?</text>

  <!-- naive -->
  <text x="470" y="60" fill="#fda4b0" font-size="12" text-anchor="middle">naive mean (homophily)</text>
  <rect x="400" y="78" width="140" height="40" rx="7" fill="#2a0e14"/><text x="470" y="96" fill="#fda4b0" font-size="11" text-anchor="middle">rep edge |.80−.18|</text><text x="470" y="111" fill="#ff8095" font-size="12" text-anchor="middle" font-weight="700">0.62  ✗ rough</text>

  <!-- signed -->
  <text x="470" y="146" fill="#7fe7c0" font-size="12" text-anchor="middle">signed channels (SGCN)</text>
  <rect x="400" y="158" width="140" height="40" rx="7" fill="#15302a"/><text x="470" y="176" fill="#7fe7c0" font-size="11" text-anchor="middle">expect 1−.80 = .20</text><text x="470" y="191" fill="#34d399" font-size="12" text-anchor="middle" font-weight="700">|.20−.18| = 0.02 ✓</text>

  <line x1="580" y1="78" x2="580" y2="198" stroke="rgba(150,170,200,.2)" stroke-width="1"/>
  <text x="700" y="76" fill="#cfe0f0" font-size="11.5" text-anchor="middle">H_act 0.78  ·  H_rep 0.09</text>
  <text x="700" y="98" fill="#8a99ad" font-size="10.5" text-anchor="middle">aggregate H ≈ 0.35 lies</text>
  <rect x="624" y="112" width="152" height="10" rx="3" fill="#1b2e22"/><rect x="624" y="112" width="118" height="10" rx="3" fill="#34d399"/><text x="700" y="138" fill="#7fe7c0" font-size="9" text-anchor="middle">activating: homophilic</text>
  <rect x="624" y="150" width="152" height="10" rx="3" fill="#2a0e14"/><rect x="624" y="150" width="14" height="10" rx="3" fill="#fb7185"/><text x="700" y="176" fill="#fda4b0" font-size="9" text-anchor="middle">repressing: heterophilic</text>
  <text x="700" y="196" fill="#c4b5fd" font-size="10" text-anchor="middle">→ signed / sheaf maps</text>

  <text x="450" y="218" fill="#6b7a8d" font-size="11" text-anchor="middle">same edge: noise to a GCN, signal to a signed model · TF↔target, ligand↔receptor, drug↔protein are heterophilic by design</text>
</svg>
