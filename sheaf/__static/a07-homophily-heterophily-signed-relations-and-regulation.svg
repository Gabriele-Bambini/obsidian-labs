<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A07 — homophily, heterophily and signed regulation</title>
  <desc id="d">Four panels: homophily scale, repressor compatibility under signed rules, signed channels, and aggregate H hiding per-sign structure.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="160" cy="70" r="230" fill="#34d399" opacity="0.05"/><circle cx="800" cy="450" r="250" fill="#fb7185" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE A07 &#183; HOMOPHILY, HETEROPHILY &amp; SIGNED REGULATION</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">When neighbors are supposed to disagree</text>

  <!-- (a) homophily scale -->
  <g>
    <rect x="40" y="82" width="430" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="430" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Homophily  H = same-label edges / all edges</text>
    <line x1="70" y1="180" x2="440" y2="180" stroke="#3a4a5e" stroke-width="2"/>
    <text x="70" y="200" fill="#fda4b0" font-size="10">0 heterophilic</text><text x="440" y="200" fill="#7fe7c0" font-size="10" text-anchor="end">1 homophilic</text>
    <rect x="108" y="174" width="120" height="12" rx="3" fill="#fb7185" opacity="0.5"/><text x="168" y="166" fill="#fda4b0" font-size="10" text-anchor="middle">most biology 0.1–0.5</text>
    <circle cx="410" cy="180" r="6" fill="#4dd7ff"/><text x="410" y="166" fill="#9fe0ff" font-size="10" text-anchor="middle">citations ~0.8</text>
    <text x="86" y="222" fill="#8a99ad" font-size="11">averaging neighbors only helps when H is high.</text>
  </g>

  <!-- (b) repressor compatibility -->
  <g>
    <rect x="486" y="82" width="370" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="82" width="370" height="4" rx="2" fill="#fb7185"/>
    <circle cx="510" cy="110" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="510" y="115" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="532" y="106" fill="#cfe0f0" font-size="14" font-weight="700">A repressor edge: noise or signal?</text>
    <circle cx="540" cy="172" r="16" fill="#fb7185" stroke="#0a1322" stroke-width="2"/><text x="540" y="204" fill="#fda4b0" font-size="10" text-anchor="middle">TF 0.80</text>
    <line x1="558" y1="172" x2="612" y2="172" stroke="#fb7185" stroke-width="3" marker-end="url(#ar)"/><text x="585" y="162" fill="#fb7185" font-size="13" font-weight="700">−</text>
    <circle cx="630" cy="172" r="13" fill="#244f7f" stroke="#0a1322" stroke-width="2"/><text x="630" y="200" fill="#9fb4cc" font-size="10" text-anchor="middle">target 0.18</text>
    <text x="700" y="160" fill="#ff8095" font-size="11.5">naive |.80−.18| = 0.62  ✗</text>
    <text x="700" y="184" fill="#7fe7c0" font-size="11.5">signed |(1−.80)−.18| = 0.02 ✓</text>
    <text x="700" y="212" fill="#8a99ad" font-size="10.5">repression expects the complement</text>
  </g>

  <!-- (c) signed channels -->
  <g>
    <rect x="40" y="244" width="430" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="244" width="430" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="64" cy="272" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="64" y="277" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Signed channels (SGCN)</text><text x="86" y="286" fill="#8a99ad" font-size="11.5">separate W₊, W₋ — keep activation and repression apart</text>
    <text x="70" y="318" fill="#cfe0f0" font-size="12" font-family="'Cascadia Mono',monospace">h₊ = σ(W₊ · Σ_{N₊} hⱼ)</text>
    <text x="70" y="340" fill="#cfe0f0" font-size="12" font-family="'Cascadia Mono',monospace">h₋ = σ(W₋ · Σ_{N₋} hⱼ)</text>
    <text x="70" y="362" fill="#cfe0f0" font-size="12" font-family="'Cascadia Mono',monospace">h  = concat(h₊, h₋)</text>
    <g>
      <text x="150" y="398" fill="#8a99ad" font-size="10" text-anchor="middle">unregulated</text>
      <rect x="120" y="430" width="22" height="8" fill="#34d399"/><rect x="150" y="430" width="22" height="8" fill="#fb7185"/><text x="151" y="452" fill="#7f93a8" font-size="9" text-anchor="middle">h₊≈0 h₋≈0</text>
      <text x="340" y="398" fill="#8a99ad" font-size="10" text-anchor="middle">act + repressed</text>
      <rect x="310" y="404" width="22" height="34" fill="#34d399"/><rect x="340" y="404" width="22" height="34" fill="#fb7185"/><text x="341" y="452" fill="#7f93a8" font-size="9" text-anchor="middle">h₊ big h₋ big</text>
    </g>
    <text x="255" y="478" fill="#c4b5fd" font-size="11.5" text-anchor="middle">a single mean cannot tell these two apart</text>
  </g>

  <!-- (d) aggregate H hides structure -->
  <g>
    <rect x="486" y="244" width="370" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="244" width="370" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="510" cy="272" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/><text x="510" y="277" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="532" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Aggregate H hides the structure</text>
    <g>
      <text x="560" y="312" fill="#7fe7c0" font-size="11" text-anchor="middle">activating</text>
      <rect x="528" y="320" width="64" height="14" rx="3" fill="#1b2e22"/><rect x="528" y="320" width="50" height="14" rx="3" fill="#34d399"/><text x="560" y="350" fill="#7fe7c0" font-size="11" text-anchor="middle">H=0.78</text>
      <text x="700" y="312" fill="#fda4b0" font-size="11" text-anchor="middle">repressing</text>
      <rect x="668" y="320" width="64" height="14" rx="3" fill="#2a0e14"/><rect x="668" y="320" width="6" height="14" rx="3" fill="#fb7185"/><text x="700" y="350" fill="#fda4b0" font-size="11" text-anchor="middle">H=0.09</text>
    </g>
    <text x="630" y="384" fill="#fde68a" font-size="13" text-anchor="middle" font-weight="700">aggregate H ≈ 0.35</text>
    <text x="630" y="410" fill="#8a99ad" font-size="11" text-anchor="middle">one number averages a homophilic and a</text>
    <text x="630" y="426" fill="#8a99ad" font-size="11" text-anchor="middle">heterophilic subset and lies about both</text>
    <text x="630" y="456" fill="#cfe0f0" font-size="11.5" text-anchor="middle">H&lt;0.4 ⇒ naive GCN can lose to an MLP →</text>
    <text x="630" y="474" fill="#c4b5fd" font-size="11.5" text-anchor="middle">use signed / ego-sep / sheaf restriction maps</text>
  </g>

  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure A07. </tspan><tspan>Homophily — "neighbors agree" — is a citation-network habit biology breaks. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> Most biological graphs sit at H = 0.1–0.5. </tspan><tspan fill="#fda4b0" font-weight="700">(b)</tspan><tspan> A repressor at 0.80</tspan>
    <tspan x="40" dy="21">driving a target to 0.18 looks rough to naive smoothing (0.62) but is highly compatible once the edge expects the complement (0.02). </tspan><tspan fill="#c4b5fd" font-weight="700">(c)</tspan><tspan> Signed channels keep separate</tspan>
    <tspan x="40" dy="21">W₊/W₋ messages, so "unregulated" (both ≈0) stays distinct from "activated and repressed" (both large). </tspan><tspan fill="#fde68a" font-weight="700">(d)</tspan><tspan> The aggregate H averages a homophilic activating subset</tspan>
    <tspan x="40" dy="21">with a heterophilic repressing one — compute H per edge type, and reach for signed, ego-separated, or sheaf restriction maps when it is low.</tspan>
  </text>
</svg>
