<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A10 concept — same embeddings, different graph token per pooling rule</title>
  <defs><marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A10 · z_G = READOUT({hᵢ}) — POOLING IS A CLAIM</text>

  <!-- module nodes -->
  <text x="95" y="58" fill="#8a99ad" font-size="11" text-anchor="middle">one module</text>
  <circle cx="70" cy="110" r="16" fill="#fbbf24"/><text x="70" y="114" fill="#3a2a08" font-size="9" text-anchor="middle">.90</text><text x="70" y="138" fill="#fde68a" font-size="9" text-anchor="middle">TF1</text>
  <circle cx="112" cy="96" r="9" fill="#3fa9e8"/><circle cx="120" cy="124" r="9" fill="#3fa9e8"/><circle cx="96" cy="140" r="9" fill="#3fa9e8"/>
  <text x="120" y="160" fill="#8a99ad" font-size="9" text-anchor="middle">weak .1–.2</text>

  <text x="178" y="116" fill="#5a6b80" font-size="15" text-anchor="middle">→</text>

  <!-- three readouts -->
  <text x="350" y="58" fill="#8a99ad" font-size="11" text-anchor="middle">same nodes, three answers</text>
  <g text-anchor="middle">
    <rect x="232" y="96" width="50" height="44" rx="7" fill="#15302a"/><text x="257" y="114" fill="#7fe7c0" font-size="11">sum</text><text x="257" y="132" fill="#d6ffe9" font-size="13" font-weight="700">1.50</text>
    <rect x="300" y="96" width="50" height="44" rx="7" fill="#15263a"/><text x="325" y="114" fill="#9fd0ff" font-size="11">mean</text><text x="325" y="132" fill="#cfe6ff" font-size="13" font-weight="700">0.25</text>
    <rect x="368" y="96" width="50" height="44" rx="7" fill="#241a40"/><text x="393" y="114" fill="#c4b5fd" font-size="11">max</text><text x="393" y="132" fill="#e3d9ff" font-size="13" font-weight="700">0.90</text>
  </g>
  <text x="325" y="162" fill="#8a99ad" font-size="9.5" text-anchor="middle">strong driver vs average vs existence</text>

  <text x="448" y="116" fill="#5a6b80" font-size="13" text-anchor="middle">+12 bg</text>

  <!-- after background -->
  <text x="600" y="58" fill="#fda4b0" font-size="11" text-anchor="middle">add weak background (graph size ↑)</text>
  <g text-anchor="middle">
    <rect x="510" y="96" width="50" height="44" rx="7" fill="#15302a"/><text x="535" y="114" fill="#7fe7c0" font-size="11">sum</text><text x="535" y="132" fill="#34d399" font-size="13" font-weight="700">2.10 ▲</text>
    <rect x="578" y="96" width="50" height="44" rx="7" fill="#15263a"/><text x="603" y="114" fill="#9fd0ff" font-size="11">mean</text><text x="603" y="132" fill="#fb7185" font-size="13" font-weight="700">0.12 ▼</text>
    <rect x="646" y="96" width="50" height="44" rx="7" fill="#241a40"/><text x="671" y="114" fill="#c4b5fd" font-size="11">max</text><text x="671" y="132" fill="#a78bfa" font-size="13" font-weight="700">0.90 =</text>
  </g>
  <text x="603" y="162" fill="#8a99ad" font-size="9.5" text-anchor="middle">biology unchanged — only the readout moved</text>

  <line x1="720" y1="86" x2="720" y2="150" stroke="rgba(150,170,200,.2)" stroke-width="1"/>
  <text x="812" y="104" fill="#cfe0f0" font-size="12" font-weight="700" text-anchor="middle">match the bias</text>
  <text x="812" y="122" fill="#cfe0f0" font-size="12" font-weight="700" text-anchor="middle">to the claim;</text>
  <text x="812" y="140" fill="#fda4b0" font-size="11" text-anchor="middle">attention ≠ proof</text>

  <text x="450" y="208" fill="#6b7a8d" font-size="11" text-anchor="middle">sum confounds size · mean dilutes rare drivers · max is brittle · keep it permutation-invariant · audit vs perturbation</text>
</svg>
