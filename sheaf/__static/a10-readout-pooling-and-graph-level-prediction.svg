<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure A10 — readout, pooling, and graph-level prediction</title>
  <desc id="d">Four panels: the readout pipeline, the pooling rules, the worked example with background, and the biological risks.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="160" cy="70" r="230" fill="#34d399" opacity="0.05"/><circle cx="800" cy="450" r="250" fill="#fbbf24" opacity="0.05"/>
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE A10 &#183; READOUT &amp; GRAPH-LEVEL PREDICTION</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">Many node memories → one graph token</text>

  <!-- (a) pipeline -->
  <g>
    <rect x="40" y="82" width="430" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="430" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="110" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/><text x="64" y="115" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">The readout step</text>
    <g><circle cx="84" cy="168" r="9" fill="#4dd7ff"/><circle cx="84" cy="192" r="9" fill="#3fa9e8"/><circle cx="108" cy="180" r="9" fill="#4dd7ff"/><text x="96" y="214" fill="#8a99ad" font-size="10" text-anchor="middle">{hᵢ}</text></g>
    <line x1="128" y1="180" x2="158" y2="180" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="162" y="164" width="84" height="32" rx="7" fill="#15302a"/><text x="204" y="184" fill="#7fe7c0" font-size="11" text-anchor="middle">READOUT</text>
    <line x1="248" y1="180" x2="278" y2="180" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="282" y="166" width="44" height="28" rx="7" fill="#0f3a2a"/><text x="304" y="184" fill="#7fe7c0" font-size="11" text-anchor="middle">z_G</text>
    <line x1="328" y1="180" x2="356" y2="180" stroke="#5a6b80" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="360" y="166" width="44" height="28" rx="7" fill="#3a1420"/><text x="382" y="184" fill="#fda4b0" font-size="11" text-anchor="middle">HEAD</text>
    <text x="430" y="184" fill="#cfe0f0" font-size="12">ŷ</text>
    <text x="86" y="224" fill="#8a99ad" font-size="11">a permutation-invariant set function: node order must not change ŷ.</text>
  </g>

  <!-- (b) pooling rules -->
  <g>
    <rect x="486" y="82" width="370" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="82" width="370" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="510" cy="110" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/><text x="510" y="115" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="532" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Five pooling rules</text>
    <g font-size="11.5">
      <text x="506" y="136" fill="#34d399" font-weight="700">sum</text><text x="566" y="136" fill="#9fb4cc">total mass — size-sensitive</text>
      <text x="506" y="158" fill="#4dd7ff" font-weight="700">mean</text><text x="566" y="158" fill="#9fb4cc">average — dilutes rare nodes</text>
      <text x="506" y="180" fill="#a78bfa" font-weight="700">max</text><text x="566" y="180" fill="#9fb4cc">existence — ignores support</text>
      <text x="506" y="202" fill="#fbbf24" font-weight="700">attention</text><text x="566" y="202" fill="#9fb4cc">learned weights — can chase shortcuts</text>
      <text x="506" y="224" fill="#fb7185" font-weight="700">hierarchical</text><text x="566" y="224" fill="#9fb4cc">nodes→clusters→graph (modules)</text>
    </g>
  </g>

  <!-- (c) worked example -->
  <g>
    <rect x="40" y="244" width="430" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="244" width="430" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="64" cy="272" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/><text x="64" y="277" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Same nodes, three stories</text>
    <text x="86" y="288" fill="#8a99ad" font-size="11">module: TF1=.90 driver + 5 weak (.1–.2)</text>
    <g font-size="12.5" font-family="'Cascadia Mono',monospace">
      <text x="70" y="318" fill="#9fb4cc">           sum   mean   max</text>
      <text x="70" y="340" fill="#cfe0f0">base       1.50  0.25   0.90</text>
      <text x="70" y="362" fill="#cfe0f0">+12 bg .05 <tspan fill="#34d399">2.10</tspan>  <tspan fill="#fb7185">0.12</tspan>   <tspan fill="#a78bfa">0.90</tspan></text>
    </g>
    <text x="86" y="392" fill="#34d399" font-size="11.5">▲ sum grows with size</text>
    <text x="250" y="392" fill="#fb7185" font-size="11.5">▼ mean dilutes</text>
    <text x="86" y="412" fill="#a78bfa" font-size="11.5">■ max unchanged — driver survives</text>
    <text x="86" y="446" fill="#8a99ad" font-size="11.5">Adding weak background changed the claim without</text>
    <text x="86" y="464" fill="#8a99ad" font-size="11.5">changing the biology. No rule is universally right.</text>
  </g>

  <!-- (d) risks -->
  <g>
    <rect x="486" y="244" width="370" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="244" width="370" height="4" rx="2" fill="#fb7185"/>
    <circle cx="510" cy="272" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/><text x="510" y="277" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="532" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Match the bias to the claim</text>
    <g font-size="11.5">
      <text x="506" y="298" fill="#9fb4cc">• sum: confounds capture depth / DB coverage</text>
      <text x="506" y="320" fill="#9fb4cc">• mean: hides rare malignant / toxic / driver nodes</text>
      <text x="506" y="342" fill="#9fb4cc">• max: one noisy node hijacks the graph</text>
      <text x="506" y="364" fill="#9fb4cc">• attention ≠ explanation — audit vs perturbation</text>
      <text x="506" y="386" fill="#9fb4cc">• typed readout: don't average TFs with targets</text>
    </g>
    <text x="506" y="418" fill="#fda4b0" font-size="11.5">Diagnostics: plot score vs #nodes (size shortcut),</text>
    <text x="506" y="436" fill="#fda4b0" font-size="11.5">add/remove a rare node, compare simple baselines.</text>
    <text x="506" y="466" fill="#c4b5fd" font-size="11.5">architecture = node update rule + readout rule.</text>
  </g>

  <line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="538" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure A10. </tspan><tspan>Readout compresses many node embeddings into one graph token z_G for a graph-level claim. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> It must be permutation-invariant. </tspan><tspan fill="#c4b5fd" font-weight="700">(b)</tspan><tspan> Sum, mean, max,</tspan>
    <tspan x="40" dy="21">attention and hierarchical pooling each preserve different information. </tspan><tspan fill="#fde68a" font-weight="700">(c)</tspan><tspan> On the same module, adding weak background nodes grows the sum, shrinks the mean, and</tspan>
    <tspan x="40" dy="21">leaves the max untouched — the readout choice IS a biological assumption. </tspan><tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> Pick the pooling whose bias matches the claim, then prove it isn't exploiting graph size or a shortcut.</tspan>
  </text>
</svg>
