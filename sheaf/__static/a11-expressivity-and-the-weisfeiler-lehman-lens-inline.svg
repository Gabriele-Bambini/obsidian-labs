<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A11 concept — recolor by neighbour multiset; matching histograms = indistinguishable</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A11 · WL — CAN THE MODEL TELL THEM APART?</text>

  <!-- cycle -->
  <text x="120" y="58" fill="#9fd0ff" font-size="11" text-anchor="middle">6-cycle</text>
  <g stroke="#46627e" stroke-width="2" fill="none"><polygon points="120,72 150,84 150,116 120,128 90,116 90,84"/></g>
  <g fill="#4dd7ff"><circle cx="120" cy="72" r="6"/><circle cx="150" cy="84" r="6"/><circle cx="150" cy="116" r="6"/><circle cx="120" cy="128" r="6"/><circle cx="90" cy="116" r="6"/><circle cx="90" cy="84" r="6"/></g>

  <!-- triangles -->
  <text x="300" y="58" fill="#c4b5fd" font-size="11" text-anchor="middle">2 triangles</text>
  <g stroke="#46627e" stroke-width="2" fill="none"><polygon points="270,74 306,74 288,104"/><polygon points="270,128 306,128 288,98"/></g>
  <g fill="#4dd7ff"><circle cx="270" cy="74" r="6"/><circle cx="306" cy="74" r="6"/><circle cx="288" cy="104" r="6"/><circle cx="270" cy="128" r="6"/><circle cx="306" cy="128" r="6"/><circle cx="288" cy="98" r="6"/></g>

  <text x="200" y="160" fill="#8a99ad" font-size="10" text-anchor="middle">all degree 2 → recolor → same histogram</text>

  <text x="380" y="104" fill="#5a6b80" font-size="14" text-anchor="middle">→</text>

  <!-- histograms identical -->
  <text x="470" y="58" fill="#fda4b0" font-size="11" text-anchor="middle">histograms</text>
  <rect x="440" y="90" width="22" height="40" fill="#4dd7ff"/><text x="451" y="146" fill="#9fb4cc" font-size="9" text-anchor="middle">A: 6</text>
  <rect x="480" y="90" width="22" height="40" fill="#4dd7ff"/><text x="491" y="146" fill="#c4b5fd" font-size="9" text-anchor="middle">B: 6</text>
  <text x="471" y="170" fill="#fb7185" font-size="11" text-anchor="middle" font-weight="700">identical = 1-WL fails</text>

  <line x1="545" y1="78" x2="545" y2="160" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- fix -->
  <text x="710" y="58" fill="#7fe7c0" font-size="11" text-anchor="middle">add the missing variable</text>
  <g font-size="11">
    <text x="572" y="86" fill="#9fb4cc">direction →</text><text x="690" y="86" fill="#7fe7c0">loop ≠ feed-forward</text>
    <text x="572" y="108" fill="#9fb4cc">sign →</text><text x="690" y="108" fill="#7fe7c0">activation ≠ repression</text>
    <text x="572" y="130" fill="#9fb4cc">motif →</text><text x="690" y="130" fill="#7fe7c0">triangle visible</text>
    <text x="572" y="152" fill="#9fb4cc">sum vs mean →</text><text x="690" y="152" fill="#7fe7c0">keep multiplicity</text>
  </g>

  <text x="450" y="208" fill="#6b7a8d" font-size="11" text-anchor="middle">readout can't recover a distinction the node updates never created — expressivity starts at the graph representation</text>
</svg>
