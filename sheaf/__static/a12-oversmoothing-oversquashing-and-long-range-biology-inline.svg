<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A12 concept — too few layers underreach, too many oversmooth, narrow bridge oversquashes</title>
  <defs><marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A12 · DEPTH HELPS REACH, HURTS CONTRAST</text>

  <!-- underreach -->
  <text x="120" y="58" fill="#7fe7c0" font-size="11" text-anchor="middle">too few layers → underreach</text>
  <circle cx="60" cy="96" r="11" fill="#fbbf24"/><circle cx="100" cy="96" r="8" fill="#2c5f86"/><circle cx="140" cy="96" r="8" fill="#16233a"/><circle cx="180" cy="96" r="11" fill="#fb7185"/>
  <line x1="71" y1="96" x2="92" y2="96" stroke="#46627e" stroke-width="2"/><line x1="108" y1="96" x2="132" y2="96" stroke="#46627e" stroke-width="2"/><line x1="148" y1="96" x2="169" y2="96" stroke="#46627e" stroke-width="2"/>
  <text x="120" y="120" fill="#8a99ad" font-size="9" text-anchor="middle">signal never arrives at T</text>

  <!-- oversmooth -->
  <text x="120" y="152" fill="#fda4b0" font-size="11" text-anchor="middle">too many → oversmooth</text>
  <circle cx="70" cy="186" r="9" fill="#3fa9e8"/><circle cx="100" cy="186" r="9" fill="#3fa9e8"/><circle cx="130" cy="186" r="9" fill="#3fa9e8"/><circle cx="160" cy="186" r="9" fill="#3fa9e8"/>
  <text x="120" y="210" fill="#8a99ad" font-size="9" text-anchor="middle">all nodes the same → identities lost</text>

  <line x1="232" y1="70" x2="232" y2="210" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- oversquash -->
  <text x="380" y="58" fill="#fde68a" font-size="11" text-anchor="middle">narrow bridge → oversquash</text>
  <g fill="#4dd7ff"><circle cx="290" cy="100" r="8"/><circle cx="310" cy="128" r="8"/><circle cx="278" cy="150" r="8"/></g>
  <g stroke="#3a4a5e" stroke-width="1.5"><line x1="290" y1="100" x2="310" y2="128"/><line x1="278" y1="150" x2="310" y2="128"/></g>
  <line x1="310" y1="128" x2="430" y2="128" stroke="#fbbf24" stroke-width="4" marker-end="url(#i)"/>
  <g fill="#fb7185"><circle cx="450" cy="100" r="8"/><circle cx="470" cy="128" r="8"/><circle cx="458" cy="150" r="8"/></g>
  <text x="380" y="178" fill="#8a99ad" font-size="9" text-anchor="middle">many sources → one fixed vector</text>

  <line x1="520" y1="70" x2="520" y2="210" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- remedies -->
  <text x="710" y="58" fill="#c4b5fd" font-size="11" text-anchor="middle">diagnose, then fix</text>
  <g font-size="11">
    <text x="548" y="88" fill="#4dd7ff" font-weight="700">smooth →</text><text x="640" y="88" fill="#9fb4cc">residual · PairNorm · fewer L</text>
    <text x="548" y="112" fill="#fbbf24" font-weight="700">squash →</text><text x="640" y="112" fill="#9fb4cc">rewire · virtual edge · attention</text>
    <text x="548" y="136" fill="#34d399" font-weight="700">reach →</text><text x="640" y="136" fill="#9fb4cc">+layers · long-range edges</text>
  </g>
  <text x="710" y="170" fill="#fda4b0" font-size="10.5" text-anchor="middle">every added edge needs provenance,</text>
  <text x="710" y="186" fill="#fda4b0" font-size="10.5" text-anchor="middle">never the label (= leakage)</text>

  <text x="450" y="216" fill="#6b7a8d" font-size="11" text-anchor="middle">audit variance + long-range delivery + bottleneck across layers — choose depth as a biological hypothesis</text>
</svg>
