<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A13 concept — target-edge leakage inflates the score; tightening the split closes the gap</title>
  <defs><marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A13 · SPLIT THE CLAIM — APPARENT vs HONEST</text>

  <!-- leaky -->
  <text x="120" y="58" fill="#fda4b0" font-size="11" text-anchor="middle">target edge in message graph</text>
  <circle cx="60" cy="100" r="11" fill="#4dd7ff"/><text x="60" y="124" fill="#9fe0ff" font-size="8" text-anchor="middle">TF_A</text>
  <circle cx="130" cy="100" r="13" fill="#e7a13a"/><text x="130" y="126" fill="#fbd089" font-size="8" text-anchor="middle">Gene_C</text>
  <circle cx="200" cy="100" r="11" fill="#4dd7ff"/><text x="200" y="124" fill="#9fe0ff" font-size="8" text-anchor="middle">TF_D</text>
  <line x1="71" y1="100" x2="116" y2="100" stroke="#4dd7ff" stroke-width="2.5" marker-end="url(#i)"/>
  <line x1="189" y1="100" x2="145" y2="100" stroke="#fb4d6d" stroke-width="3" stroke-dasharray="5 3" marker-end="url(#i)"/>
  <text x="130" y="156" fill="#ff8095" font-size="10" text-anchor="middle">uses the answer → 0.733</text>
  <text x="130" y="174" fill="#7fe7c0" font-size="10" text-anchor="middle">remove it → honest 0.55</text>

  <text x="270" y="106" fill="#5a6b80" font-size="15" text-anchor="middle">→</text>

  <!-- bars apparent vs honest across protocols -->
  <text x="470" y="58" fill="#8a99ad" font-size="11" text-anchor="middle">tighten split → gap closes</text>
  <line x1="330" y1="170" x2="610" y2="170" stroke="#3a4a5e" stroke-width="1.5"/>
  <rect x="345" y="86" width="20" height="84" fill="#fb7185"/><rect x="370" y="138" width="20" height="32" fill="#34d399"/><text x="367" y="186" fill="#9fb4cc" font-size="9" text-anchor="middle">random</text>
  <rect x="440" y="118" width="20" height="52" fill="#fbbf24"/><rect x="465" y="138" width="20" height="32" fill="#34d399"/><text x="462" y="186" fill="#9fb4cc" font-size="9" text-anchor="middle">disjoint</text>
  <rect x="535" y="138" width="20" height="32" fill="#34d399"/><rect x="560" y="138" width="20" height="32" fill="#34d399" opacity="0.5"/><text x="557" y="186" fill="#9fb4cc" font-size="9" text-anchor="middle">group</text>
  <text x="355" y="80" fill="#fda4b0" font-size="9" text-anchor="middle">apparent</text><text x="548" y="130" fill="#7fe7c0" font-size="9" text-anchor="middle">= honest</text>

  <line x1="636" y1="74" x2="636" y2="172" stroke="rgba(150,170,200,.2)" stroke-width="1"/>
  <text x="770" y="94" fill="#cfe0f0" font-size="11.5" font-weight="700" text-anchor="middle">leak forms: target edge,</text>
  <text x="770" y="112" fill="#cfe0f0" font-size="11.5" font-weight="700" text-anchor="middle">reverse edge, prior=answer,</text>
  <text x="770" y="130" fill="#cfe0f0" font-size="11.5" font-weight="700" text-anchor="middle">easy negatives, preproc,</text>
  <text x="770" y="148" fill="#cfe0f0" font-size="11.5" font-weight="700" text-anchor="middle">shared batch / future time</text>

  <text x="450" y="212" fill="#6b7a8d" font-size="11" text-anchor="middle">E_msg ∩ E_test = ∅ · fit transforms on train only · test once · prior overlapping gold = "recovery", not discovery</text>
</svg>
