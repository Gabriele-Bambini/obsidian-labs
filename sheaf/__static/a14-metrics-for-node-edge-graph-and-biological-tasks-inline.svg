<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A14 concept — same predictions, metrics disagree; rare positives break accuracy</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">A14 · METRICS GRADE DIFFERENT MISTAKES</text>

  <!-- ranked candidates -->
  <text x="130" y="56" fill="#8a99ad" font-size="11" text-anchor="middle">ranked candidate edges</text>
  <g>
    <rect x="44" y="74" width="12" height="64" fill="#34d399"/><rect x="60" y="80" width="12" height="58" fill="#34d399"/><rect x="76" y="92" width="12" height="46" fill="#54667c"/><rect x="92" y="98" width="12" height="40" fill="#34d399"/><rect x="108" y="106" width="12" height="32" fill="#54667c"/><rect x="124" y="110" width="12" height="28" fill="#54667c"/><rect x="140" y="116" width="12" height="22" fill="#54667c"/><rect x="156" y="120" width="12" height="18" fill="#54667c"/><rect x="172" y="124" width="12" height="14" fill="#54667c"/><rect x="188" y="128" width="12" height="10" fill="#54667c"/>
    <line x1="40" y1="104" x2="206" y2="104" stroke="#fb7185" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text x="220" y="100" fill="#fda4b0" font-size="9">threshold</text>
  <text x="130" y="156" fill="#34d399" font-size="9" text-anchor="middle">green = real (rare)</text>

  <text x="270" y="112" fill="#5a6b80" font-size="15" text-anchor="middle">→</text>

  <!-- metric cards disagree -->
  <g text-anchor="middle">
    <rect x="310" y="78" width="62" height="40" rx="6" fill="#241a40"/><text x="341" y="96" fill="#c4b5fd" font-size="10">accuracy</text><text x="341" y="112" fill="#e3d9ff" font-size="13" font-weight="700">0.86</text>
    <rect x="380" y="78" width="62" height="40" rx="6" fill="#15263a"/><text x="411" y="96" fill="#9fd0ff" font-size="10">recall</text><text x="411" y="112" fill="#cfe6ff" font-size="13" font-weight="700">0.10</text>
    <rect x="310" y="124" width="62" height="40" rx="6" fill="#15302a"/><text x="341" y="142" fill="#7fe7c0" font-size="10">AUPRC</text><text x="341" y="158" fill="#d6ffe9" font-size="13" font-weight="700">0.28</text>
    <rect x="380" y="124" width="62" height="40" rx="6" fill="#33270a"/><text x="411" y="142" fill="#fde68a" font-size="10">prec@K</text><text x="411" y="158" fill="#fff0c4" font-size="13" font-weight="700">0.83</text>
  </g>
  <text x="376" y="182" fill="#fda4b0" font-size="9.5" text-anchor="middle">accuracy high, recall/AUPRC low = imbalance</text>

  <line x1="470" y1="74" x2="470" y2="168" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <text x="690" y="56" fill="#8a99ad" font-size="11" text-anchor="middle">match metric to decision</text>
  <g font-size="11">
    <text x="500" y="86" fill="#34d399" font-weight="700">rare edges →</text><text x="612" y="86" fill="#9fb4cc">AUPRC, baseline=prevalence</text>
    <text x="500" y="110" fill="#fbbf24" font-weight="700">discovery →</text><text x="612" y="110" fill="#9fb4cc">precision@K (lab budget)</text>
    <text x="500" y="134" fill="#4dd7ff" font-weight="700">rare classes →</text><text x="612" y="134" fill="#9fb4cc">macro-F1 · recall · MCC</text>
    <text x="500" y="158" fill="#fb7185" font-weight="700">continuous →</text><text x="612" y="158" fill="#9fb4cc">MAE · RMSE (with units)</text>
  </g>

  <text x="450" y="210" fill="#6b7a8d" font-size="11" text-anchor="middle">accuracy hides rare-positive failure · choose the primary metric before training, not the one that wins</text>
</svg>
