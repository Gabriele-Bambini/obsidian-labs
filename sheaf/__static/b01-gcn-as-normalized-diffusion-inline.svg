<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">B01 concept — GCN graph diffusion: operator P, self-loops, symmetric coefficient 1/√(d̃·d̃), and oversmoothing with depth</title>

  <defs>
    <marker id="ia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>

  <!-- Header strip -->
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">B01 · GCN = GRAPH DIFFUSION THEN FEATURE MIX</text>

  <!-- ── SECTION 1: The 4-node graph with signal ── -->
  <!-- label -->
  <text x="100" y="58" fill="#34d399" font-size="11" text-anchor="middle">signal source</text>

  <!-- T (signal=1) -->
  <circle cx="100" cy="84" r="14" fill="#fbbf24" stroke="#fde68a" stroke-width="1.5"/>
  <text x="100" y="88" fill="#333" font-size="10" font-weight="800" text-anchor="middle">T</text>
  <text x="100" y="106" fill="#fde68a" font-size="9"  text-anchor="middle">1.0</text>

  <!-- G1 -->
  <circle cx="56"  cy="140" r="11" fill="#2a4a6a" stroke="#4dd7ff" stroke-width="1.2"/>
  <text x="56"  y="144" fill="#9fe0ff" font-size="9"  font-weight="700" text-anchor="middle">G1</text>
  <text x="56"  y="160" fill="#8a99ad" font-size="9"  text-anchor="middle">0.0</text>

  <!-- G2 -->
  <circle cx="144" cy="140" r="11" fill="#2a4a6a" stroke="#4dd7ff" stroke-width="1.2"/>
  <text x="144" y="144" fill="#9fe0ff" font-size="9"  font-weight="700" text-anchor="middle">G2</text>
  <text x="144" y="160" fill="#8a99ad" font-size="9"  text-anchor="middle">0.0</text>

  <!-- H (hub) -->
  <circle cx="100" cy="194" r="13" fill="#3a1428" stroke="#fb7185" stroke-width="1.5"/>
  <text x="100" y="198" fill="#fda4b0" font-size="9"  font-weight="700" text-anchor="middle">H</text>
  <text x="100" y="214" fill="#8a99ad" font-size="9"  text-anchor="middle">0.0</text>

  <!-- edges -->
  <line x1="90"  y1="96"  x2="62"  y2="130" stroke="#46627e" stroke-width="1.8"/>
  <line x1="110" y1="96"  x2="138" y2="130" stroke="#46627e" stroke-width="1.8"/>
  <line x1="60"  y1="150" x2="90"  y2="184" stroke="#46627e" stroke-width="1.8"/>
  <line x1="140" y1="150" x2="110" y2="184" stroke="#46627e" stroke-width="1.8"/>
  <!-- self-loop arcs -->
  <path d="M 88 76 A 9 9 0 1 1 112 76" fill="none" stroke="#a78bfa" stroke-width="1.4"/>

  <!-- vertical divider -->
  <line x1="210" y1="50" x2="210" y2="218" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- ── SECTION 2: P operator + coefficient ── -->
  <text x="310" y="58" fill="#fbbf24" font-size="11" text-anchor="middle">propagation operator P</text>

  <!-- formula box -->
  <rect x="226" y="66" width="168" height="52" rx="8" fill="#0c1322" stroke="rgba(77,215,255,.3)"/>
  <text x="310" y="86"  fill="#4dd7ff" font-size="12" font-weight="800" text-anchor="middle">P = D̃⁻¹⸝² Ã D̃⁻¹⸝²</text>
  <text x="310" y="104" fill="#9fb4cc" font-size="10" text-anchor="middle">Ã = A + I  (self-loops)</text>

  <!-- coefficient highlight -->
  <rect x="226" y="126" width="168" height="40" rx="8" fill="#18120a" stroke="rgba(251,191,36,.3)"/>
  <text x="310" y="143" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">edge weight:</text>
  <text x="310" y="159" fill="#fde68a" font-size="11" text-anchor="middle">1/√(d̃ᵢ · d̃ⱼ)</text>

  <!-- example: all deg 3 -->
  <text x="310" y="182" fill="#8a99ad" font-size="9.5" text-anchor="middle">4-cycle: all d̃=3  →  coef = 0.333</text>
  <text x="310" y="198" fill="#8a99ad" font-size="9.5" text-anchor="middle">hub d̃=6  →  coef = 0.167  (tamed)</text>

  <!-- vertical divider -->
  <line x1="420" y1="50" x2="420" y2="218" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- ── SECTION 3: P^L diffusion + oversmoothing ── -->
  <text x="560" y="58" fill="#fb7185" font-size="11" text-anchor="middle">P^L diffusion → oversmoothing</text>

  <!-- L=0 bar (distinct signals) -->
  <text x="436" y="78"  fill="#8a99ad" font-size="9.5">L=0</text>
  <rect x="455" y="68" width="14" height="30" rx="3" fill="#fbbf24"/>
  <rect x="471" y="86" width="14" height="12" rx="3" fill="#4dd7ff"/>
  <rect x="487" y="88" width="14" height="10" rx="3" fill="#4dd7ff"/>
  <rect x="503" y="94" width="14" height="4"  rx="3" fill="#34d399"/>
  <text x="474" y="110" fill="#34d399" font-size="9" text-anchor="middle">distinct</text>

  <!-- L=4 bar (smoothed) -->
  <text x="436" y="138" fill="#8a99ad" font-size="9.5">L=4</text>
  <rect x="455" y="128" width="14" height="18" rx="3" fill="#3a7a9a"/>
  <rect x="471" y="130" width="14" height="16" rx="3" fill="#3a7a9a"/>
  <rect x="487" y="130" width="14" height="16" rx="3" fill="#3a7a9a"/>
  <rect x="503" y="132" width="14" height="14" rx="3" fill="#3a7a9a"/>
  <text x="474" y="158" fill="#fb7185" font-size="9" text-anchor="middle">oversmoothed</text>

  <!-- variance curve (small) -->
  <text x="560" y="78"  fill="#8a99ad" font-size="9.5">Var(H)</text>
  <polyline points="530,170 560,155 590,142 620,138 650,136 680,136" fill="none" stroke="#fb7185" stroke-width="2"/>
  <circle cx="530" cy="170" r="3" fill="#34d399"/>
  <circle cx="680" cy="136" r="3" fill="#fb7185"/>
  <text x="528" y="182" fill="#34d399"  font-size="8.5">L=0</text>
  <text x="672" y="130" fill="#fda4b0"  font-size="8.5">deep</text>

  <!-- vertical divider -->
  <line x1="702" y1="50" x2="702" y2="218" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- ── SECTION 4: key takeaways ── -->
  <text x="800" y="58" fill="#c4b5fd" font-size="11" text-anchor="middle">key points</text>
  <g font-size="10.5">
    <text x="716" y="84"  fill="#34d399" font-weight="700">self-loop →</text>
    <text x="716" y="98"  fill="#9fb4cc">node keeps own signal</text>
    <text x="716" y="118" fill="#fbbf24" font-weight="700">sym. norm →</text>
    <text x="716" y="132" fill="#9fb4cc">hub tamed, scale stable</text>
    <text x="716" y="152" fill="#4dd7ff" font-weight="700">each layer →</text>
    <text x="716" y="166" fill="#9fb4cc">low-pass; var. drops</text>
    <text x="716" y="186" fill="#fb7185" font-weight="700">too many L →</text>
    <text x="716" y="200" fill="#9fb4cc">oversmoothing (A12)</text>
  </g>

  <!-- bottom takeaway -->
  <text x="450" y="222" fill="#6b7a8d" font-size="11" text-anchor="middle">GCN = P·H (symmetric diffusion) then H·W (feature mix) — biological claim depends entirely on the graph you choose</text>
</svg>
