<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure B01 — GCN as normalized diffusion</title>
  <desc id="d">Four panels: (a) GCN formula and self-loop renormalization, (b) propagation operator P and edge coefficients on the worked-example graph, (c) diffusion step vs feature-mix step and SGC, (d) hub domination tamed by symmetric normalization.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <!-- Subtle accent glows -->
  <circle cx="160" cy="80"  r="240" fill="#4dd7ff" opacity="0.045"/>
  <circle cx="820" cy="480" r="260" fill="#fb7185" opacity="0.040"/>

  <!-- Header -->
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE B01 &#183; GCN AS NORMALIZED DIFFUSION</text>
  <text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">P = D̃⁻¹⸝² Ã D̃⁻¹⸝² — symmetric low-pass diffusion on biological graphs</text>

  <!-- ════════════════════════════════════════════════════════════════
       (a)  GCN formula and renormalization trick
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="82" width="430" height="178" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="430" height="4"   rx="2"  fill="#4dd7ff"/>

    <!-- panel letter badge -->
    <circle cx="64" cy="112" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/>
    <text x="64" y="117" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>

    <text x="86" y="108" fill="#cfe0f0" font-size="14" font-weight="700">GCN propagation rule</text>

    <!-- formula block -->
    <rect x="56" y="120" width="398" height="48" rx="8" fill="#08111e" stroke="rgba(77,215,255,.22)"/>
    <text x="72" y="142" fill="#4dd7ff" font-size="15" font-weight="800" font-family="'Courier New', monospace">H&#8242; = &#963;( D̃&#8315;&#xbd; Ã D̃&#8315;&#xbd; H W )</text>
    <text x="72" y="160" fill="#9fb4cc" font-size="12">where  Ã = A + I    and    D̃&#x1d62;&#x1d62; = &#8721;&#x2c7c; Ã&#x1d62;&#x2c7c;</text>

    <!-- step annotations -->
    <text x="56"  y="188" fill="#34d399" font-size="12" font-weight="700">1. self-loops</text>
    <text x="56"  y="204" fill="#9fb4cc" font-size="11">keeps each node&#8217;s own signal</text>

    <text x="218" y="188" fill="#fbbf24" font-size="12" font-weight="700">2. degree on Ã</text>
    <text x="218" y="204" fill="#9fb4cc" font-size="11">D̃&#x1d62;&#x1d62; = d&#x1d62; + 1   (self-loop counts)</text>

    <text x="380" y="188" fill="#fb7185" font-size="12" font-weight="700">3. normalize</text>
    <text x="380" y="204" fill="#9fb4cc" font-size="11">1/&#8730;(d̃&#x1d62;·d̃&#x2c7c;)</text>

    <text x="56"  y="230" fill="#a78bfa" font-size="12" font-weight="700">4. feature mix</text>
    <text x="56"  y="246" fill="#9fb4cc" font-size="11">W&#8480; mixes channels after diffusion</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       (b)  Propagation operator P on the worked-example graph
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="82" width="414" height="178" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="82" width="414" height="4"   rx="2"  fill="#fbbf24"/>

    <circle cx="510" cy="112" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/>
    <text x="510" y="117" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="532" y="108" fill="#cfe0f0" font-size="14" font-weight="700">Operator P &#183; 4-node worked example</text>

    <!-- graph: T-G1-H-G2-T diamond, all deg=3 after self-loops (shifted down to clear title) -->
    <!-- nodes -->
    <!-- T top center -->
    <circle cx="758" cy="132" r="14" fill="#fbbf24" stroke="#fde68a" stroke-width="1.5"/>
    <text x="758" y="125"  fill="#fde68a" font-size="10" text-anchor="middle" font-weight="700">T</text>
    <text x="758" y="152" fill="#8a99ad" font-size="9"  text-anchor="middle">d̃=3</text>
    <!-- G1 left -->
    <circle cx="700" cy="184" r="12" fill="#3a5a7a" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="691" y="183" fill="#9fe0ff" font-size="10" text-anchor="middle" font-weight="700">G1</text>
    <text x="700" y="204" fill="#8a99ad" font-size="9"  text-anchor="middle">d̃=3</text>
    <!-- G2 right -->
    <circle cx="818" cy="184" r="12" fill="#3a5a7a" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="827" y="183" fill="#9fe0ff" font-size="10" text-anchor="middle" font-weight="700">G2</text>
    <text x="818" y="204" fill="#8a99ad" font-size="9"  text-anchor="middle">d̃=3</text>
    <!-- H bottom center -->
    <circle cx="758" cy="236" r="14" fill="#5a1a2a" stroke="#fb7185" stroke-width="1.5"/>
    <text x="758" y="231" fill="#fda4b0" font-size="10" text-anchor="middle" font-weight="700">H</text>
    <text x="758" y="256" fill="#8a99ad" font-size="9"  text-anchor="middle">d̃=3</text>

    <!-- edges with coefficient labels -->
    <!-- T-G1 -->
    <line x1="748" y1="144" x2="710" y2="172" stroke="#4dd7ff" stroke-width="1.5" opacity="0.7"/>
    <text x="722" y="156" fill="#fbbf24" font-size="9.5" text-anchor="middle">1/√(3·3)=0.33</text>
    <!-- T-G2 -->
    <line x1="768" y1="144" x2="806" y2="172" stroke="#4dd7ff" stroke-width="1.5" opacity="0.7"/>
    <text x="795" y="156" fill="#fbbf24" font-size="9.5" text-anchor="middle">0.33</text>
    <!-- G1-H -->
    <line x1="706" y1="196" x2="746" y2="222" stroke="#4dd7ff" stroke-width="1.5" opacity="0.7"/>
    <text x="719" y="216" fill="#fbbf24" font-size="9.5" text-anchor="middle">0.33</text>
    <!-- G2-H -->
    <line x1="812" y1="196" x2="772" y2="222" stroke="#4dd7ff" stroke-width="1.5" opacity="0.7"/>
    <text x="799" y="216" fill="#fbbf24" font-size="9.5" text-anchor="middle">0.33</text>

    <!-- self-loop arcs (small) -->
    <path d="M 746 128 A 10 10 0 1 1 768 128" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <path d="M 688 179 A 10 10 0 1 1 692 192" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <path d="M 826 179 A 10 10 0 1 1 830 192" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <path d="M 746 238 A 10 10 0 1 1 768 242" fill="none" stroke="#a78bfa" stroke-width="1.4"/>

    <!-- formula for P_ij (left column, x=506, max width ~170px before graph at ~688) -->
    <text x="506" y="188" fill="#8a99ad" font-size="10.5">P&#x1d62;&#x2c7c; = 1/&#8730;(d̃&#x1d62;·d̃&#x2c7c;)  (i,j)&#8712;Ã</text>
    <text x="506" y="204" fill="#8a99ad" font-size="10.5">All equal: P = &#8531;Ã  (deg 3)</text>
    <text x="506" y="220" fill="#34d399" font-size="10.5" font-weight="700">After 1 step:</text>
    <text x="506" y="234" fill="#34d399" font-size="10.5" font-weight="700">T&#8594;.43  G1&#8594;.40  G2&#8594;.37  H&#8594;.10</text>
    <text x="506" y="248" fill="#9fb4cc" font-size="9.5">(T=1, G1=0.2, G2=0.1, H=0)</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       (c)  Diffusion step + feature mix; SGC
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="272" width="430" height="232" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="272" width="430" height="4"   rx="2"  fill="#34d399"/>

    <circle cx="64" cy="300" r="13" fill="#0f3a2a" stroke="#34d399" stroke-width="1"/>
    <text x="64" y="305" fill="#7fe7c0" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="296" fill="#cfe0f0" font-size="14" font-weight="700">Diffusion step vs feature-mix step</text>

    <!-- pipeline arrow diagram -->
    <!-- Step 1 box: PH -->
    <rect x="56"  y="310" width="90"  height="48" rx="8" fill="#0c1e10" stroke="#34d399" stroke-width="1.2"/>
    <text x="101" y="331" fill="#7fe7c0" font-size="13" font-weight="800" text-anchor="middle">PH</text>
    <text x="101" y="348" fill="#8a99ad" font-size="10"  text-anchor="middle">diffusion</text>

    <line x1="146" y1="334" x2="170" y2="334" stroke="#cfe0f0" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- Step 2 box: (PH)W -->
    <rect x="172" y="310" width="108" height="48" rx="8" fill="#0c1120" stroke="#4dd7ff" stroke-width="1.2"/>
    <text x="226" y="331" fill="#9fe0ff" font-size="13" font-weight="800" text-anchor="middle">(PH)W</text>
    <text x="226" y="348" fill="#8a99ad" font-size="10"  text-anchor="middle">feature mix</text>

    <line x1="280" y1="334" x2="306" y2="334" stroke="#cfe0f0" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- Output box -->
    <rect x="308" y="310" width="130" height="48" rx="8" fill="#131020" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="373" y="331" fill="#c4b5fd" font-size="13" font-weight="800" text-anchor="middle">&#963;((PH)W)</text>
    <text x="373" y="348" fill="#8a99ad" font-size="10"  text-anchor="middle">activation</text>

    <!-- conceptual: each step -->
    <text x="56"  y="380" fill="#34d399"  font-size="11.5" font-weight="700">diffusion (P):</text>
    <text x="56"  y="396" fill="#9fb4cc"  font-size="11">spreads each node&#8217;s features to its neighbors.</text>
    <text x="56"  y="412" fill="#9fb4cc"  font-size="11">low-pass filter — nearby nodes share context.</text>

    <text x="56"  y="434" fill="#4dd7ff"  font-size="11.5" font-weight="700">feature mix (W):</text>
    <text x="56"  y="450" fill="#9fb4cc"  font-size="11">learns which feature channels matter after diffusion.</text>

    <!-- SGC note -->
    <rect x="56" y="462" width="398" height="28" rx="6" fill="#11152a" stroke="rgba(167,139,250,.3)"/>
    <text x="72"  y="480" fill="#a78bfa" font-size="11" font-weight="700">SGC:</text>
    <text x="104" y="480" fill="#9fb4cc" font-size="11">collapse weights across K layers &#8594; (P&#7503;H)W — pure low-pass filter + linear classifier.</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       (d)  Hub domination vs symmetric normalization
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="272" width="414" height="232" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="272" width="414" height="4"   rx="2"  fill="#fb7185"/>

    <circle cx="510" cy="300" r="13" fill="#2a0f18" stroke="#fb7185" stroke-width="1"/>
    <text x="510" y="305" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="532" y="296" fill="#cfe0f0" font-size="14" font-weight="700">Hub domination tamed by normalization</text>

    <!-- raw side -->
    <text x="506" y="328" fill="#fb7185" font-size="12" font-weight="700">RAW (unnormalized)</text>
    <!-- hub with many edges -->
    <!-- hub center -->
    <circle cx="600" cy="390" r="18" fill="#5a1a2a" stroke="#fb7185" stroke-width="2"/>
    <text x="600" y="394" fill="#fda4b0" font-size="11" text-anchor="middle" font-weight="700">HUB</text>
    <!-- 5 leaf nodes -->
    <circle cx="558" cy="348" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="566" y1="354" x2="584" y2="376" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="576" cy="428" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="584" y1="423" x2="589" y2="407" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="620" cy="435" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="615" y1="428" x2="608" y2="408" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="544" cy="400" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="552" y1="400" x2="582" y2="393" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="640" cy="360" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="636" y1="368" x2="618" y2="379" stroke="#3a4a5e" stroke-width="1.5"/>
    <text x="600" y="460" fill="#fb7185" font-size="10" text-anchor="middle">raw sum = large!</text>
    <text x="600" y="474" fill="#8a99ad" font-size="9.5" text-anchor="middle">degree dominates</text>

    <!-- separator arrow -->
    <line x1="660" y1="340" x2="660" y2="490" stroke="rgba(150,170,200,.15)" stroke-width="1"/>

    <!-- normalized side -->
    <text x="670" y="328" fill="#34d399" font-size="12" font-weight="700">NORMALIZED  1/&#8730;(d̃&#x1d62;·d̃&#x2c7c;)</text>
    <!-- same hub but messages scaled -->
    <circle cx="760" cy="390" r="18" fill="#0a2a1a" stroke="#34d399" stroke-width="2"/>
    <text x="760" y="394" fill="#7fe7c0" font-size="11" text-anchor="middle" font-weight="700">HUB</text>
    <circle cx="718" cy="348" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="726" y1="354" x2="744" y2="376" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="736" cy="428" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="744" y1="423" x2="749" y2="407" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="780" cy="435" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="775" y1="428" x2="768" y2="408" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="704" cy="400" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="712" y1="400" x2="742" y2="393" stroke="#3a4a5e" stroke-width="1.5"/>
    <circle cx="800" cy="360" r="8" fill="#1a2a3a" stroke="#3a4a5e" stroke-width="1"/><line x1="796" y1="368" x2="778" y2="379" stroke="#3a4a5e" stroke-width="1.5"/>
    <text x="760" y="460" fill="#34d399" font-size="10" text-anchor="middle">&#215; 1/&#8730;(d̃&#x2095;&#x22C5;d̃&#x2097;) &#8594; tamed</text>
    <text x="760" y="474" fill="#8a99ad" font-size="9.5" text-anchor="middle">degree bias reduced</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       Caption
       ════════════════════════════════════════════════════════════════ -->
  <line x1="40" y1="516" x2="900" y2="516" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
  <text x="40" y="542" font-size="13" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure B01. </tspan><tspan>GCN as normalized diffusion over biological graphs. </tspan>
    <tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> The full GCN rule H&#8242;=&#963;(D̃&#8315;&#xbd;ÃD̃&#8315;&#xbd;HW) with Ã=A+I: self-loops preserve each node&#8217;s own signal, degree is computed on Ã, and</tspan>
    <tspan x="40" dy="21">symmetric normalization 1/&#8730;(d̃&#x1d62;d̃&#x2c7c;) scales every message by the degrees of both source and target. </tspan><tspan fill="#fde68a" font-weight="700">(b)</tspan><tspan> The 4-node worked example [T,G1,G2,H]:</tspan>
    <tspan x="40" dy="21">all degrees equal 3 after self-loops, so P=&#8531;Ã; one propagation step moves T&#8217;s signal to its neighbors. </tspan><tspan fill="#7fe7c0" font-weight="700">(c)</tspan><tspan> The two conceptual stages: diffusion (PH, low-pass graph filter) then</tspan>
    <tspan x="40" dy="21">feature mixing ((PH)W); SGC collapses K layers into a single P&#7503;H followed by a linear classifier. </tspan><tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> Without normalization, a high-degree hub accumulates a large raw sum; symmetric</tspan>
  </text>
  <text x="40" y="626" font-size="13" fill="#c7d2dd">
    <tspan>normalization divides each message by 1/&#8730;(d̃&#x1d62;d̃&#x2c7c;), taming hub domination — degree bias is reduced but not eliminated.</tspan>
  </text>
</svg>
