<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">B02 concept — hub neighbourhood sampled to S, aggregated, concatenated, embedded inductively</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="30" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">B02 · GRAPHSAGE: SAMPLE → AGGREGATE → CONCAT → EMBED (INDUCTIVE)</text>

  <!-- STEP 1: Hub neighbourhood (full, many edges) -->
  <text x="82" y="54" fill="#8a99ad" font-size="10.5" text-anchor="middle">full neighbourhood</text>
  <!-- hub target -->
  <circle cx="82" cy="130" r="16" fill="#3a1020" stroke="#fb7185" stroke-width="1.5"/>
  <text x="82" y="125" fill="#fb7185" font-size="9.5" font-weight="700" text-anchor="middle">HubP</text>
  <text x="82" y="137" fill="#fda4b0" font-size="8" text-anchor="middle">deg=12</text>
  <!-- faded full ring -->
  <g opacity="0.22" stroke="#54667c" stroke-width="1" fill="#54667c">
    <circle cx="54"  cy="80"  r="7"/><line x1="54"  y1="87"  x2="72"  y2="117"/>
    <circle cx="82"  cy="72"  r="7"/><line x1="82"  y1="79"  x2="82"  y2="114"/>
    <circle cx="110" cy="80"  r="7"/><line x1="110" y1="87"  x2="92"  y2="117"/>
    <circle cx="126" cy="106" r="7"/><line x1="119" y1="109" x2="98"  y2="124"/>
    <circle cx="126" cy="130" r="7"/><line x1="119" y1="130" x2="98"  y2="130"/>
    <circle cx="54"  cy="130" r="7"/><line x1="61"  y1="130" x2="66"  y2="130"/>
    <circle cx="54"  cy="154" r="7"/><line x1="61"  y1="151" x2="66"  y2="143"/>
    <circle cx="82"  cy="170" r="7"/><line x1="82"  y1="163" x2="82"  y2="146"/>
    <circle cx="110" cy="160" r="7"/><line x1="110" y1="153" x2="96"  y2="143"/>
  </g>
  <!-- S=3 sampled (bright) -->
  <circle cx="54" cy="80" r="9" fill="#1a6080" stroke="#4dd7ff" stroke-width="1.5"/>
  <text x="54" y="84" fill="#4dd7ff" font-size="8" text-anchor="middle">TF1</text>
  <circle cx="110" cy="80" r="9" fill="#1a6080" stroke="#4dd7ff" stroke-width="1.5"/>
  <text x="110" y="84" fill="#4dd7ff" font-size="8" text-anchor="middle">K1</text>
  <circle cx="82" cy="170" r="9" fill="#1a6080" stroke="#4dd7ff" stroke-width="1.5"/>
  <text x="82" y="174" fill="#4dd7ff" font-size="8" text-anchor="middle">mB</text>
  <line x1="62"  y1="87"  x2="71"  y2="116" stroke="#4dd7ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="102" y1="87"  x2="92"  y2="116" stroke="#4dd7ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="82"  y1="161" x2="82"  y2="146" stroke="#4dd7ff" stroke-width="1.5" opacity="0.8"/>

  <!-- arrow 1 -->
  <text x="172" y="125" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>
  <rect x="152" y="135" width="42" height="18" rx="4" fill="#0e2030"/>
  <text x="173" y="147" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">S=3 only</text>

  <!-- STEP 2: AGG box -->
  <rect x="198" y="100" width="90" height="54" rx="10" fill="#0e4030" stroke="#34d399" stroke-width="1.5"/>
  <text x="243" y="124" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">AGG</text>
  <text x="243" y="140" fill="#7fe7c0" font-size="9.5" text-anchor="middle">mean/pool/lstm</text>
  <text x="243" y="152" fill="#7fe7c0" font-size="9" text-anchor="middle">→ 0.467</text>
  <text x="243" y="86" fill="#8a99ad" font-size="10" text-anchor="middle">aggregate</text>

  <!-- arrow 2 -->
  <text x="316" y="125" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>

  <!-- STEP 3: CONCAT box -->
  <rect x="332" y="90" width="100" height="68" rx="10" fill="#2a1a50" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="382" y="116" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">CONCAT</text>
  <text x="382" y="132" fill="#c4b5fd" font-size="9.5" text-anchor="middle">h_v = 0.40</text>
  <text x="382" y="146" fill="#c4b5fd" font-size="9.5" text-anchor="middle">h_N = 0.467</text>
  <line x1="382" y1="120" x2="382" y2="126" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <text x="382" y="78" fill="#8a99ad" font-size="10" text-anchor="middle">concat self+neigh</text>

  <!-- arrow 3 -->
  <text x="458" y="125" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>

  <!-- STEP 4: W·σ box -->
  <rect x="474" y="100" width="76" height="54" rx="10" fill="#4a3000" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="512" y="124" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">W · σ</text>
  <text x="512" y="140" fill="#fde68a" font-size="9.5" text-anchor="middle">→ h_v new</text>
  <text x="512" y="86" fill="#8a99ad" font-size="10" text-anchor="middle">learnable project</text>

  <!-- arrow 4 -->
  <text x="574" y="125" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>

  <!-- STEP 5: New node embedding -->
  <circle cx="628" cy="127" r="28" fill="#3a1020" stroke="#fb7185" stroke-width="2"/>
  <text x="628" y="121" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">G_new</text>
  <text x="628" y="133" fill="#fde68a" font-size="9" text-anchor="middle">h=0.732</text>
  <text x="628" y="145" fill="#7fe7c0" font-size="9" text-anchor="middle">✓ inductive</text>
  <text x="628" y="84" fill="#fb7185" font-size="10" text-anchor="middle">unseen node</text>

  <!-- vertical separator -->
  <line x1="690" y1="64" x2="690" y2="175" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- takeaway text -->
  <text x="720" y="80" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Key payoff</text>
  <text x="720" y="100" fill="#9fb4cc" font-size="10.5" text-anchor="middle">G_new was NOT in training.</text>
  <text x="720" y="116" fill="#9fb4cc" font-size="10.5" text-anchor="middle">Shared weights W embed it</text>
  <text x="720" y="132" fill="#9fb4cc" font-size="10.5" text-anchor="middle">from S sampled neighbours.</text>
  <text x="720" y="154" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">GraphSAGE: ✓ inductive</text>
  <text x="720" y="170" fill="#fb7185" font-size="10.5" font-weight="700" text-anchor="middle">Embedding table: ✗ N/A</text>

  <!-- bottom takeaway line -->
  <text x="450" y="208" fill="#6b7a8d" font-size="11" text-anchor="middle">sampling bounds compute (hub degree irrelevant) · aggregator compresses evidence · concat preserves self · induction transfers to new biology</text>
</svg>
