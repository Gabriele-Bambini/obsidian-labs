<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">B03 concept — GAT attention: learned α weights, softmax competition, attention ≠ causation</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">B03 · GAT — LEARNED α WEIGHTS ON SPARSE GRAPH EDGES</text>

  <!-- ── target node + neighbours ───────────────────────────────── -->
  <!-- target -->
  <circle cx="130" cy="122" r="18" fill="#0e2740" stroke="#4dd7ff" stroke-width="2.5"/>
  <text x="130" y="127" fill="#4dd7ff" font-size="10" font-weight="700" text-anchor="middle">G*</text>
  <text x="130" y="152" fill="#8a99ad" font-size="9" text-anchor="middle">target gene</text>

  <!-- TF1 (high α) -->
  <circle cx="44"  cy="72"  r="12" fill="#082234" stroke="#4dd7ff" stroke-width="2"/>
  <text x="44"  y="76"  fill="#9fe0ff" font-size="8" text-anchor="middle">TF1</text>
  <line x1="118" y1="110" x2="55"  y2="80"  stroke="#4dd7ff" stroke-width="5.5"/>
  <text x="70"  y="92"  fill="#4dd7ff" font-size="8.5" font-weight="700">α=0.42</text>

  <!-- TF2 (medium α) -->
  <circle cx="44"  cy="172" r="12" fill="#082234" stroke="#34d399" stroke-width="1.8"/>
  <text x="44"  y="176" fill="#7fe7c0" font-size="8" text-anchor="middle">TF2</text>
  <line x1="118" y1="134" x2="55"  y2="164" stroke="#34d399" stroke-width="3.0"/>
  <text x="62"  y="162" fill="#34d399" font-size="8.5">α=0.35</text>

  <!-- HUB (low α) -->
  <circle cx="130" cy="48"  r="12" fill="#14082a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="130" y="52"  fill="#c4b5fd" font-size="8" text-anchor="middle">HUB</text>
  <line x1="130" y1="104" x2="130" y2="60"  stroke="#a78bfa" stroke-width="1.4"/>
  <text x="148" y="80"  fill="#a78bfa" font-size="8.5">α=0.23</text>

  <!-- softmax competition arrow -->
  <text x="200" y="100" fill="#5a6b80" font-size="18" text-anchor="middle">→</text>
  <text x="200" y="120" fill="#9fb4cc" font-size="8.5" text-anchor="middle">softmax</text>
  <text x="200" y="132" fill="#9fb4cc" font-size="8.5" text-anchor="middle">competition</text>
  <text x="200" y="148" fill="#8a99ad" font-size="8" text-anchor="middle">Σα = 1</text>

  <!-- bar chart of α values -->
  <rect x="232" y="86"  width="38" height="50" rx="2" fill="#4dd7ff" opacity="0.85"/>
  <rect x="276" y="104" width="38" height="32" rx="2" fill="#34d399" opacity="0.85"/>
  <rect x="320" y="117" width="38" height="19" rx="2" fill="#a78bfa" opacity="0.85"/>
  <text x="251" y="82"  fill="#4dd7ff" font-size="9" text-anchor="middle">0.42</text>
  <text x="295" y="100" fill="#34d399" font-size="9" text-anchor="middle">0.35</text>
  <text x="339" y="113" fill="#a78bfa" font-size="9" text-anchor="middle">0.23</text>
  <text x="251" y="150" fill="#9fb4cc" font-size="8.5" text-anchor="middle">TF1</text>
  <text x="295" y="150" fill="#9fb4cc" font-size="8.5" text-anchor="middle">TF2</text>
  <text x="339" y="150" fill="#9fb4cc" font-size="8.5" text-anchor="middle">HUB</text>
  <text x="286" y="168" fill="#8a99ad" font-size="9" text-anchor="middle">if TF1 logit ↑, TF2 and HUB α ↓</text>

  <!-- divider -->
  <line x1="388" y1="50" x2="388" y2="185" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- right: key facts -->
  <text x="410" y="56" fill="#cfe0f0" font-size="10.5" font-weight="700">GAT formula</text>
  <text x="410" y="74"  fill="#fde68a" font-size="9.5" font-family="'Cascadia Mono',monospace">eᵢⱼ = LeakyReLU( aᵀ[Whᵢ ‖ Whⱼ] )</text>
  <text x="410" y="90"  fill="#7fe7c0" font-size="9.5" font-family="'Cascadia Mono',monospace">αᵢⱼ = exp(eᵢⱼ) / Σₖ∈N(i) exp(eᵢₖ)</text>
  <text x="410" y="106" fill="#9fe0ff" font-size="9.5" font-family="'Cascadia Mono',monospace">h′ᵢ = σ( Σⱼ αᵢⱼ W hⱼ )</text>

  <line x1="410" y1="116" x2="874" y2="116" stroke="rgba(150,170,200,.15)" stroke-width="1"/>

  <text x="410" y="132" fill="#9fb4cc" font-size="10" font-weight="700">Multi-head:</text>
  <text x="500" y="132" fill="#8a99ad" font-size="9.5">K independent heads → concat/avg → robustness</text>
  <text x="410" y="148" fill="#9fb4cc" font-size="10" font-weight="700">vs GCN:</text>
  <text x="455" y="148" fill="#8a99ad" font-size="9.5">GCN uses fixed 1/√(d̃ᵢd̃ⱼ) ≈ uniform · GAT learns per-edge α</text>
  <text x="410" y="164" fill="#9fb4cc" font-size="10" font-weight="700">entropy:</text>
  <text x="460" y="164" fill="#8a99ad" font-size="9.5">H = −Σ α·log α · low H → concentrated attention</text>

  <!-- caution banner -->
  <rect x="410" y="176" width="464" height="22" rx="5" fill="#3a0814" stroke="#fb7185" stroke-width="0.8"/>
  <text x="642" y="191" fill="#fda4b0" font-size="9.5" text-anchor="middle" font-weight="700">High α ≠ causal regulation — validate with perturbation (Perturb-seq / CRISPR) before biological claims</text>

  <text x="450" y="215" fill="#6b7a8d" font-size="10" text-anchor="middle">attention is a model routing weight · softmax competition: raising one α lowers the rest · inspect entropy + edge provenance</text>
</svg>
