<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure B03 — GAT and attention on sparse neighborhoods</title>
  <desc id="d">Four panels: (a) GAT vs GCN/SAGE learned vs fixed weights; (b) attention pipeline eij to softmax to alpha; (c) multi-head attention; (d) attention not causation.</desc>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <!-- ambient glows -->
  <circle cx="200" cy="100" r="260" fill="#4dd7ff" opacity="0.04"/>
  <circle cx="760" cy="480" r="220" fill="#a78bfa" opacity="0.04"/>

  <!-- header -->
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE B03 · GAT AND ATTENTION ON SPARSE NEIGHBORHOODS</text>
  <text x="40" y="60" fill="#e8eef6" font-size="22" font-weight="700">Graph Attention Networks: learned α weights over sparse graph edges</text>

  <!-- ═══════════════════════════════════════════════════════════
       PANEL (a)  GAT vs GCN/SAGE  — left top
  ═══════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="78" width="430" height="175" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="78" width="430" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="105" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="64" y="110" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="103" fill="#cfe0f0" font-size="13" font-weight="700">GAT vs GCN / GraphSAGE — learned vs fixed edge weights</text>

    <!-- GCN column -->
    <text x="115" y="130" fill="#9fb4cc" font-size="10.5" text-anchor="middle" font-weight="700">GCN / SAGE</text>
    <text x="115" y="145" fill="#8a99ad" font-size="9.5" text-anchor="middle">fixed weights</text>
    <!-- target node -->
    <circle cx="115" cy="185" r="14" fill="#0e2740" stroke="#4dd7ff" stroke-width="2"/>
    <text x="115" y="190" fill="#4dd7ff" font-size="9" font-weight="700" text-anchor="middle">G*</text>
    <!-- neighbours with equal-thickness edges -->
    <line x1="115" y1="171" x2="80"  y2="145" stroke="#54667c" stroke-width="2.8"/>
    <line x1="115" y1="171" x2="115" y2="143" stroke="#54667c" stroke-width="2.8"/>
    <line x1="115" y1="171" x2="150" y2="145" stroke="#54667c" stroke-width="2.8"/>
    <circle cx="80"  cy="140" r="9" fill="#0c2237" stroke="#54667c" stroke-width="1.5"/>
    <circle cx="115" cy="138" r="9" fill="#0c2237" stroke="#54667c" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="9" fill="#0c2237" stroke="#54667c" stroke-width="1.5"/>
    <text x="80"  y="144" fill="#9fb4cc" font-size="7.5" text-anchor="middle">TF1</text>
    <text x="115" y="142" fill="#9fb4cc" font-size="7.5" text-anchor="middle">HUB</text>
    <text x="150" y="144" fill="#9fb4cc" font-size="7.5" text-anchor="middle">TF2</text>
    <text x="76"  y="214" fill="#8a99ad" font-size="9" text-anchor="middle">w = 1/√d̃ᵢd̃ⱼ</text>
    <text x="155" y="214" fill="#8a99ad" font-size="9" text-anchor="middle">≈ uniform</text>

    <!-- GAT column -->
    <text x="320" y="130" fill="#4dd7ff" font-size="10.5" text-anchor="middle" font-weight="700">GAT</text>
    <text x="320" y="145" fill="#8a99ad" font-size="9.5" text-anchor="middle">learned α per edge</text>
    <circle cx="320" cy="185" r="14" fill="#0e2740" stroke="#4dd7ff" stroke-width="2"/>
    <text x="320" y="190" fill="#4dd7ff" font-size="9" font-weight="700" text-anchor="middle">G*</text>
    <!-- thick TF1 edge -->
    <line x1="320" y1="171" x2="285" y2="145" stroke="#4dd7ff" stroke-width="5.5"/>
    <!-- medium TF2 edge -->
    <line x1="320" y1="171" x2="320" y2="143" stroke="#34d399" stroke-width="3.0"/>
    <!-- thin HUB edge -->
    <line x1="320" y1="171" x2="355" y2="145" stroke="#a78bfa" stroke-width="1.4"/>
    <circle cx="285" cy="140" r="9" fill="#082234" stroke="#4dd7ff" stroke-width="1.5"/>
    <circle cx="320" cy="138" r="9" fill="#082234" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="355" cy="140" r="9" fill="#0e0e25" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="285" y="144" fill="#9fe0ff" font-size="7.5" text-anchor="middle">TF1</text>
    <text x="320" y="142" fill="#7fe7c0" font-size="7.5" text-anchor="middle">TF2</text>
    <text x="355" y="144" fill="#c4b5fd" font-size="7.5" text-anchor="middle">HUB</text>
    <text x="285" y="214" fill="#4dd7ff" font-size="8.5" text-anchor="middle">α=0.42</text>
    <text x="320" y="214" fill="#34d399" font-size="8.5" text-anchor="middle">α=0.35</text>
    <text x="355" y="214" fill="#a78bfa" font-size="8.5" text-anchor="middle">α=0.23</text>

    <!-- divider -->
    <line x1="245" y1="120" x2="245" y2="230" stroke="rgba(150,170,200,.15)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="245" y="243" fill="#8a99ad" font-size="9" text-anchor="middle">vs</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       PANEL (b)  Attention pipeline  — right top
  ═══════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="78" width="416" height="175" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="78" width="416" height="4" rx="2" fill="#34d399"/>
    <circle cx="510" cy="105" r="13" fill="#0f2a1a" stroke="#34d399" stroke-width="1.5"/>
    <text x="510" y="110" fill="#7fe7c0" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="532" y="103" fill="#cfe0f0" font-size="13" font-weight="700">Attention pipeline: eᵢⱼ → softmax → αᵢⱼ → aggregate</text>

    <!-- step 1: linear transform -->
    <rect x="502" y="116" width="58" height="28" rx="5" fill="#0e2318" stroke="#34d399" stroke-width="1"/>
    <text x="531" y="127" fill="#7fe7c0" font-size="8.5" text-anchor="middle" font-weight="700">W hᵢ , W hⱼ</text>
    <text x="531" y="138" fill="#8a99ad" font-size="7.5" text-anchor="middle">linear xform</text>

    <!-- arrow -->
    <line x1="560" y1="130" x2="576" y2="130" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- step 2: concatenate + score -->
    <rect x="578" y="116" width="70" height="28" rx="5" fill="#1a1a08" stroke="#fbbf24" stroke-width="1"/>
    <text x="613" y="127" fill="#fde68a" font-size="8" text-anchor="middle" font-weight="700">[Whᵢ ‖ Whⱼ]</text>
    <text x="613" y="138" fill="#8a99ad" font-size="7" text-anchor="middle">concat + aᵀ·</text>

    <!-- arrow -->
    <line x1="648" y1="130" x2="664" y2="130" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr2)"/>

    <!-- step 3: LeakyReLU -->
    <rect x="666" y="116" width="66" height="28" rx="5" fill="#1f0a0d" stroke="#fb7185" stroke-width="1"/>
    <text x="699" y="127" fill="#fda4b0" font-size="8.5" text-anchor="middle" font-weight="700">LeakyReLU</text>
    <text x="699" y="138" fill="#fda4b0" font-size="7.5" text-anchor="middle">→ eᵢⱼ</text>

    <!-- arrow -->
    <line x1="732" y1="130" x2="748" y2="130" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr3)"/>

    <!-- step 4: softmax -->
    <rect x="750" y="116" width="68" height="28" rx="5" fill="#0e2318" stroke="#34d399" stroke-width="1"/>
    <text x="784" y="127" fill="#7fe7c0" font-size="8.5" text-anchor="middle" font-weight="700">softmax</text>
    <text x="784" y="138" fill="#8a99ad" font-size="7.5" text-anchor="middle">over N(i) only</text>

    <!-- softmax bar chart showing competition -->
    <text x="531" y="164" fill="#9fb4cc" font-size="9.5" font-weight="700">Softmax competition — Σ αᵢⱼ = 1</text>
    <!-- bars -->
    <rect x="510" y="175" width="32" height="12" rx="2" fill="#4dd7ff"/>
    <rect x="548" y="179" width="22" height="8" rx="2" fill="#34d399"/>
    <rect x="576" y="183" width="10" height="4" rx="2" fill="#a78bfa"/>
    <rect x="592" y="181" width="16" height="6" rx="2" fill="#fbbf24"/>
    <text x="526" y="198" fill="#4dd7ff" font-size="8" text-anchor="middle">α=0.42</text>
    <text x="559" y="198" fill="#34d399" font-size="8" text-anchor="middle">α=0.29</text>
    <text x="581" y="198" fill="#a78bfa" font-size="8" text-anchor="middle">α=0.12</text>
    <text x="600" y="198" fill="#fbbf24" font-size="8" text-anchor="middle">α=0.17</text>
    <text x="554" y="212" fill="#8a99ad" font-size="8.5" text-anchor="middle">if one logit ↑, its α ↑ and all others ↓ (competition)</text>

    <!-- aggregate formula -->
    <text x="700" y="164" fill="#cfe0f0" font-size="9" font-weight="700">Aggregate:</text>
    <text x="700" y="178" fill="#fde68a" font-size="9" font-family="'Cascadia Mono',monospace">h′ᵢ = σ( Σⱼ αᵢⱼ Whⱼ )</text>
    <text x="700" y="196" fill="#8a99ad" font-size="8.5">weighted sum of</text>
    <text x="700" y="208" fill="#8a99ad" font-size="8.5">neighbour messages</text>

    <!-- defs for arrowheads -->
    <defs>
      <marker id="arr"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker>
      <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
      <marker id="arr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fb7185"/></marker>
      <marker id="arr4" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/></marker>
    </defs>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       PANEL (c)  Multi-head attention — left bottom
  ═══════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="264" width="430" height="240" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="264" width="430" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="64" cy="291" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="64" y="296" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="289" fill="#cfe0f0" font-size="13" font-weight="700">Multi-head attention: K independent α distributions</text>

    <!-- target node -->
    <circle cx="255" cy="390" r="16" fill="#0e2740" stroke="#4dd7ff" stroke-width="2.5"/>
    <text x="255" y="395" fill="#4dd7ff" font-size="9" font-weight="700" text-anchor="middle">G*</text>

    <!-- 4 neighbours at angles -->
    <!-- NW: TF1 -->
    <circle cx="155" cy="330" r="12" fill="#082234" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="155" y="334" fill="#9fe0ff" font-size="7.5" text-anchor="middle">TF1</text>
    <!-- N: TF2 -->
    <circle cx="255" cy="308" r="12" fill="#082234" stroke="#34d399" stroke-width="1.5"/>
    <text x="255" y="312" fill="#7fe7c0" font-size="7.5" text-anchor="middle">TF2</text>
    <!-- NE: HUB -->
    <circle cx="355" cy="330" r="12" fill="#14082a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="355" y="334" fill="#c4b5fd" font-size="7.5" text-anchor="middle">HUB</text>
    <!-- E: TF3 -->
    <circle cx="390" cy="390" r="12" fill="#0e2318" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="390" y="394" fill="#fde68a" font-size="7.5" text-anchor="middle">TF3</text>

    <!-- Head 1 (cyan) — strong TF1 -->
    <line x1="239" y1="376" x2="165" y2="340" stroke="#4dd7ff" stroke-width="4.5" opacity="0.8"/>
    <line x1="255" y1="374" x2="255" y2="320" stroke="#4dd7ff" stroke-width="1.8" opacity="0.5"/>
    <line x1="271" y1="376" x2="345" y2="340" stroke="#4dd7ff" stroke-width="1.2" opacity="0.4"/>
    <line x1="271" y1="390" x2="378" y2="390" stroke="#4dd7ff" stroke-width="0.8" opacity="0.3"/>
    <text x="145" y="322" fill="#4dd7ff" font-size="8.5">H₁</text>

    <!-- Head 2 (green) — strong TF2 -->
    <line x1="243" y1="375" x2="163" y2="339" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
    <line x1="255" y1="374" x2="255" y2="320" stroke="#34d399" stroke-width="4.8" opacity="0.85"/>
    <line x1="267" y1="375" x2="347" y2="339" stroke="#34d399" stroke-width="1.3" opacity="0.4"/>
    <line x1="269" y1="390" x2="378" y2="390" stroke="#34d399" stroke-width="0.9" opacity="0.3"/>
    <text x="235" y="300" fill="#34d399" font-size="8.5">H₂</text>

    <!-- Head 3 (amber) — spread -->
    <line x1="241" y1="377" x2="161" y2="341" stroke="#fbbf24" stroke-width="2.2" opacity="0.55"/>
    <line x1="255" y1="374" x2="255" y2="320" stroke="#fbbf24" stroke-width="2.5" opacity="0.5"/>
    <line x1="269" y1="377" x2="349" y2="341" stroke="#fbbf24" stroke-width="3.5" opacity="0.7"/>
    <line x1="270" y1="391" x2="378" y2="391" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
    <text x="362" y="323" fill="#fbbf24" font-size="8.5">H₃</text>

    <!-- Head 4 (violet) — strong TF3 -->
    <line x1="240" y1="378" x2="160" y2="342" stroke="#a78bfa" stroke-width="1.2" opacity="0.4"/>
    <line x1="255" y1="374" x2="255" y2="320" stroke="#a78bfa" stroke-width="1.5" opacity="0.45"/>
    <line x1="270" y1="378" x2="350" y2="342" stroke="#a78bfa" stroke-width="2.0" opacity="0.5"/>
    <line x1="271" y1="392" x2="378" y2="392" stroke="#a78bfa" stroke-width="4.8" opacity="0.85"/>
    <text x="383" y="385" fill="#a78bfa" font-size="8.5">H₄</text>

    <!-- legend -->
    <text x="86" y="310" fill="#9fb4cc" font-size="10" font-weight="700">Each head attends to different neighbours → concat/avg for robustness</text>
    <text x="86" y="328" fill="#8a99ad" font-size="9.5">h′ᵢ = ‖ₘ σ( Σⱼ α⁽ᵐ⁾ᵢⱼ W⁽ᵐ⁾ hⱼ )   |   heads disagree = complementary evidence</text>

    <text x="86" y="490" fill="#9fb4cc" font-size="10">H₁ focuses TF1 · H₂ focuses TF2 · H₃ spreads · H₄ focuses TF3 → averaged output is robust</text>
    <text x="86" y="505" fill="#8a99ad" font-size="9.5">if all heads agree on one edge, model preference is stable; if heads diverge, investigate</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       PANEL (d)  Attention ≠ causation — right bottom
  ═══════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="264" width="416" height="240" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="264" width="416" height="4" rx="2" fill="#fb7185"/>
    <circle cx="510" cy="291" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1.5"/>
    <text x="510" y="296" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="532" y="289" fill="#cfe0f0" font-size="13" font-weight="700">Attention ≠ causation — hub concentration danger</text>

    <!-- graph: target + hub + true TFs -->
    <circle cx="694" cy="390" r="16" fill="#0e2740" stroke="#4dd7ff" stroke-width="2.5"/>
    <text x="694" y="395" fill="#4dd7ff" font-size="9" font-weight="700" text-anchor="middle">G*</text>

    <!-- hub: large rose node -->
    <circle cx="590" cy="350" r="22" fill="#3a0814" stroke="#fb7185" stroke-width="2.5"/>
    <text x="590" y="345" fill="#fda4b0" font-size="8" font-weight="700" text-anchor="middle">HUB</text>
    <text x="590" y="357" fill="#fda4b0" font-size="7.5" text-anchor="middle">DB / co-expr</text>

    <!-- TF1 (true causal) — small, thin edge -->
    <circle cx="660" cy="308" r="10" fill="#082218" stroke="#34d399" stroke-width="1.5"/>
    <text x="660" y="312" fill="#7fe7c0" font-size="7.5" text-anchor="middle">TF1</text>

    <!-- TF2 — thin edge -->
    <circle cx="790" cy="330" r="10" fill="#082218" stroke="#34d399" stroke-width="1.5"/>
    <text x="790" y="334" fill="#7fe7c0" font-size="7.5" text-anchor="middle">TF2</text>

    <!-- thick edge to hub (high attention) -->
    <line x1="678" y1="376" x2="610" y2="360" stroke="#fb7185" stroke-width="7.5"/>
    <!-- thin edges to real TFs -->
    <line x1="686" y1="375" x2="668" y2="318" stroke="#34d399" stroke-width="1.8"/>
    <line x1="708" y1="376" x2="782" y2="338" stroke="#34d399" stroke-width="1.2"/>

    <!-- alpha labels -->
    <text x="620" y="372" fill="#fb7185" font-size="9" font-weight="700">α=0.72</text>
    <text x="670" y="348" fill="#34d399" font-size="8.5">α=0.17</text>
    <text x="745" y="355" fill="#34d399" font-size="8.5">α=0.11</text>

    <!-- entropy bar -->
    <text x="502" y="430" fill="#9fb4cc" font-size="9.5" font-weight="700">Attention entropy H = −Σ α·log α</text>
    <rect x="502" y="436" width="180" height="10" rx="3" fill="#1a2030"/>
    <rect x="502" y="436" width="38"  height="10" rx="3" fill="#fb7185"/>
    <text x="502" y="460" fill="#fb7185" font-size="9">H=0.71 (low = concentrated)</text>
    <text x="502" y="476" fill="#8a99ad" font-size="9">uniform over 3 neighbours: H=1.10</text>

    <!-- warning box -->
    <rect x="502" y="488" width="388" height="10" rx="3" fill="#3a0814" stroke="#fb7185" stroke-width="0.5"/>
    <text x="696" y="497" fill="#fda4b0" font-size="8.5" text-anchor="middle" font-weight="700">High α = routing weight, not regulatory proof. Validate: Perturb-seq / CRISPR / independent assay.</text>

    <!-- sources of spurious attention -->
    <text x="502" y="316" fill="#9fb4cc" font-size="10" font-weight="700">Why hub gets high α (not causation):</text>
    <text x="502" y="332" fill="#fda4b0" font-size="9.5">• Expression magnitude / database popularity</text>
    <text x="502" y="348" fill="#fda4b0" font-size="9.5">• Co-expression or batch effect correlation</text>
    <text x="502" y="364" fill="#fda4b0" font-size="9.5">• Feature similarity with target</text>
    <text x="502" y="380" fill="#fda4b0" font-size="9.5">• Graph construction bias (curated priors)</text>
  </g>

  <!-- caption rule -->
  <line x1="40" y1="514" x2="900" y2="514" stroke="rgba(150,170,200,.18)" stroke-width="1"/>

  <!-- caption -->
  <text x="40" y="540" font-size="12.5" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure B03. </tspan><tspan>GAT learns per-edge attention weights over existing graph edges; a local softmax over each target's neighbourhood ensures Σ αᵢⱼ = 1. </tspan>
  </text>
  <text x="40" y="558" font-size="12.5" fill="#c7d2dd">
    <tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> GAT replaces GCN's fixed 1/√(d̃ᵢd̃ⱼ) normalisation with learned α values — edge thickness reflects model-assigned importance. </tspan>
  </text>
  <text x="40" y="576" font-size="12.5" fill="#c7d2dd">
    <tspan fill="#7fe7c0" font-weight="700">(b)</tspan><tspan> The attention pipeline: concatenate linearly-transformed representations → dot with attention vector aᵀ → LeakyReLU → softmax over N(i) → αᵢⱼ; raising one logit increases its α while lowering all others (competition). </tspan>
  </text>
  <text x="40" y="594" font-size="12.5" fill="#c7d2dd">
    <tspan fill="#fde68a" font-weight="700">(c)</tspan><tspan> Multi-head attention runs K independent heads; heads attend to different neighbours and the concatenated output is robust to per-head noise. </tspan>
  </text>
  <text x="40" y="612" font-size="12.5" fill="#c7d2dd">
    <tspan fill="#fda4b0" font-weight="700">(d)</tspan><tspan> Attention is a routing weight, not causal proof: high α on a hub can reflect database coverage, co-expression, or expression magnitude — not direct regulation. Entropy H = −Σ α·log α quantifies concentration; validate high-α edges with perturbation experiments.</tspan>
  </text>
</svg>
