<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">B04 concept — sum keeps multiplicity, mean and max collapse neighbour bags</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>
  <text x="28" y="32" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="1.5">B04 · GIN — SUM KEEPS MULTIPLICITY, MEAN AND MAX DO NOT</text>

  <!-- LEFT: two bags -->
  <!-- Bag A: {1,1,1,1} -->
  <text x="78" y="56" fill="#8a99ad" font-size="10.5" text-anchor="middle">bag A</text>
  <circle cx="52" cy="80" r="9" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
  <text x="52" y="84" fill="#7fe7c0" font-size="8" text-anchor="middle">1</text>
  <circle cx="72" cy="70" r="9" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
  <text x="72" y="74" fill="#7fe7c0" font-size="8" text-anchor="middle">1</text>
  <circle cx="92" cy="70" r="9" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
  <text x="92" y="74" fill="#7fe7c0" font-size="8" text-anchor="middle">1</text>
  <circle cx="110" cy="80" r="9" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
  <text x="110" y="84" fill="#7fe7c0" font-size="8" text-anchor="middle">1</text>
  <text x="78" y="104" fill="#9fb4cc" font-size="9.5" text-anchor="middle">{1,1,1,1}</text>

  <!-- Bag B: {1,1} -->
  <text x="78" y="130" fill="#8a99ad" font-size="10.5" text-anchor="middle">bag B</text>
  <circle cx="63" cy="152" r="9" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
  <text x="63" y="156" fill="#7fe7c0" font-size="8" text-anchor="middle">1</text>
  <circle cx="87" cy="152" r="9" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
  <text x="87" y="156" fill="#7fe7c0" font-size="8" text-anchor="middle">1</text>
  <text x="78" y="178" fill="#9fb4cc" font-size="9.5" text-anchor="middle">{1,1}</text>

  <!-- Arrow to aggregations -->
  <text x="148" y="120" fill="#5a6b80" font-size="20">→</text>

  <!-- MEAN card -->
  <rect x="180" y="56" width="100" height="120" rx="8" fill="#160e18" stroke="#fb7185" stroke-width="1.5"/>
  <text x="230" y="80" fill="#fda4b0" font-size="12" font-weight="700" text-anchor="middle">MEAN</text>
  <text x="230" y="102" fill="#e8eef6" font-size="11" text-anchor="middle">A: 4/4=</text>
  <text x="230" y="119" fill="#fda4b0" font-size="22" font-weight="700" text-anchor="middle">1</text>
  <text x="230" y="137" fill="#e8eef6" font-size="11" text-anchor="middle">B: 2/2=</text>
  <text x="230" y="154" fill="#fda4b0" font-size="22" font-weight="700" text-anchor="middle">1</text>
  <text x="230" y="170" fill="#fb7185" font-size="9.5" text-anchor="middle">COLLAPSE ✗</text>

  <!-- MAX card -->
  <rect x="290" y="56" width="100" height="120" rx="8" fill="#1a1205" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="340" y="80" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">MAX</text>
  <text x="340" y="102" fill="#e8eef6" font-size="11" text-anchor="middle">A: max=</text>
  <text x="340" y="119" fill="#fde68a" font-size="22" font-weight="700" text-anchor="middle">1</text>
  <text x="340" y="137" fill="#e8eef6" font-size="11" text-anchor="middle">B: max=</text>
  <text x="340" y="154" fill="#fde68a" font-size="22" font-weight="700" text-anchor="middle">1</text>
  <text x="340" y="170" fill="#fbbf24" font-size="9.5" text-anchor="middle">COLLAPSE ✗</text>

  <!-- SUM card — highlighted -->
  <rect x="400" y="50" width="108" height="132" rx="8" fill="#071a10" stroke="#34d399" stroke-width="2.5"/>
  <text x="454" y="76" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">SUM</text>
  <text x="454" y="98" fill="#e8eef6" font-size="11" text-anchor="middle">A: 1+1+1+1=</text>
  <text x="454" y="118" fill="#34d399" font-size="24" font-weight="700" text-anchor="middle">4</text>
  <text x="454" y="136" fill="#e8eef6" font-size="11" text-anchor="middle">B: 1+1=</text>
  <text x="454" y="156" fill="#34d399" font-size="24" font-weight="700" text-anchor="middle">2</text>
  <text x="454" y="174" fill="#34d399" font-size="9.5" text-anchor="middle" font-weight="700">4 ≠ 2  DISTINCT ✓</text>

  <!-- Vertical divider -->
  <line x1="536" y1="46" x2="536" y2="188" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- RIGHT: GIN update formula + biology note -->
  <text x="558" y="56" fill="#8a99ad" font-size="10.5">GIN update</text>
  <text x="558" y="76" fill="#c4b5fd" font-size="11" font-family="'Cascadia Mono','Courier New',monospace">h'_v = MLP((1+ε)·h_v + Σ N(v))</text>
  <text x="558" y="96" fill="#9fb4cc" font-size="10.5">Sum aggregation → injective over multisets</text>
  <text x="558" y="114" fill="#9fb4cc" font-size="10.5">→ GIN matches 1-WL discriminative power</text>

  <line x1="554" y1="124" x2="888" y2="124" stroke="rgba(150,170,200,.15)" stroke-width="1"/>

  <text x="558" y="142" fill="#8a99ad" font-size="10.5">Biology</text>
  <text x="558" y="160" fill="#34d399" font-size="10.5">✓ 4 real TF regulators vs 2 → dosage signal</text>
  <text x="558" y="178" fill="#fb7185" font-size="10.5">✗ 4 duplicate DB edges vs 2 → GIN amplifies bias</text>

  <!-- Takeaway bar -->
  <rect x="28" y="196" width="844" height="26" rx="6" fill="#0c1520"/>
  <text x="450" y="213" fill="#e8eef6" font-size="11" text-anchor="middle">
    <tspan font-weight="700">sum keeps multiplicity — </tspan>
    <tspan fill="#34d399">signal </tspan>
    <tspan fill="#9fb4cc">or </tspan>
    <tspan fill="#fb7185">bias</tspan>
    <tspan fill="#9fb4cc">: verify counts are biological before trusting GIN's extra power</tspan>
  </text>
</svg>
