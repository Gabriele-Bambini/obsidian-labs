<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure B04 — GIN and injective aggregation</title>
  <desc id="d">Four panels: (a) three aggregators on a neighbour multiset — mean/max forget counts, sum keeps them; (b) canonical {1,1,1,1} vs {1,1} collapse proof; (c) GIN update vs GCN mean; (d) biology — counts as dosage signal vs database bias.</desc>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <circle cx="180" cy="80" r="240" fill="#4dd7ff" opacity="0.04"/>
  <circle cx="820" cy="500" r="220" fill="#a78bfa" opacity="0.04"/>

  <!-- Header -->
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE B04 · GIN — INJECTIVE AGGREGATION OVER MULTISETS</text>
  <text x="40" y="62" fill="#e8eef6" font-size="23" font-weight="700">Sum keeps different bags different — mean and max may not</text>

  <!-- ══════════════════════════════════════════════════════════════
       (a)  Three aggregators on a neighbour multiset
       Panel: x=40 y=82 w=430 h=190
  ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="82" width="430" height="190" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="82" width="430" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="111" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/>
    <text x="64" y="116" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="107" fill="#cfe0f0" font-size="14" font-weight="700">Three aggregators — which one is injective?</text>

    <!-- Bag of neighbours: feature nodes -->
    <!-- Target node A -->
    <circle cx="100" cy="165" r="16" fill="#0e2740" stroke="#4dd7ff" stroke-width="2"/>
    <text x="100" y="170" fill="#4dd7ff" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <!-- 4 neighbours (h=1 each) -->
    <circle cx="145" cy="140" r="11" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="145" y="144" fill="#7fe7c0" font-size="9" text-anchor="middle">1</text>
    <line x1="116" y1="157" x2="136" y2="147" stroke="#3a4a5e" stroke-width="1.2"/>
    <circle cx="145" cy="165" r="11" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="145" y="169" fill="#7fe7c0" font-size="9" text-anchor="middle">1</text>
    <line x1="116" y1="165" x2="134" y2="165" stroke="#3a4a5e" stroke-width="1.2"/>
    <circle cx="145" cy="190" r="11" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="145" y="194" fill="#7fe7c0" font-size="9" text-anchor="middle">1</text>
    <line x1="116" y1="173" x2="136" y2="183" stroke="#3a4a5e" stroke-width="1.2"/>
    <circle cx="120" cy="207" r="11" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="120" y="211" fill="#7fe7c0" font-size="9" text-anchor="middle">1</text>
    <line x1="108" y1="181" x2="114" y2="197" stroke="#3a4a5e" stroke-width="1.2"/>
    <text x="100" y="230" fill="#9fb4cc" font-size="9.5" text-anchor="middle">bag A: {1,1,1,1}</text>

    <!-- Arrow -->
    <text x="173" y="170" fill="#5a6b80" font-size="16">→</text>

    <!-- Aggregation results — three columns -->
    <!-- MEAN column -->
    <rect x="198" y="128" width="60" height="72" rx="6" fill="#16202c" stroke="rgba(150,170,200,.15)"/>
    <text x="228" y="148" fill="#9fb4cc" font-size="9.5" text-anchor="middle">MEAN</text>
    <text x="228" y="172" fill="#fda4b0" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="228" y="193" fill="#fda4b0" font-size="8.5" text-anchor="middle">4/4 = 1</text>

    <!-- MAX column -->
    <rect x="268" y="128" width="60" height="72" rx="6" fill="#16202c" stroke="rgba(150,170,200,.15)"/>
    <text x="298" y="148" fill="#9fb4cc" font-size="9.5" text-anchor="middle">MAX</text>
    <text x="298" y="172" fill="#fbbf24" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="298" y="193" fill="#fbbf24" font-size="8.5" text-anchor="middle">max{1,1,1,1}</text>

    <!-- SUM column -->
    <rect x="338" y="128" width="60" height="72" rx="6" fill="#0d2318" stroke="#34d399" stroke-width="1.5"/>
    <text x="368" y="148" fill="#7fe7c0" font-size="9.5" text-anchor="middle">SUM</text>
    <text x="368" y="172" fill="#34d399" font-size="20" font-weight="700" text-anchor="middle">4</text>
    <text x="368" y="193" fill="#34d399" font-size="8.5" text-anchor="middle">1+1+1+1 = 4</text>

    <!-- Forget / keep labels -->
    <text x="228" y="213" fill="#fda4b0" font-size="9" text-anchor="middle">forgets</text>
    <text x="228" y="224" fill="#fda4b0" font-size="9" text-anchor="middle">count</text>
    <text x="298" y="213" fill="#fbbf24" font-size="9" text-anchor="middle">forgets</text>
    <text x="298" y="224" fill="#fbbf24" font-size="9" text-anchor="middle">count</text>
    <text x="368" y="213" fill="#34d399" font-size="9" text-anchor="middle" font-weight="700">KEEPS</text>
    <text x="368" y="224" fill="#34d399" font-size="9" text-anchor="middle" font-weight="700">count</text>

    <!-- Injective label -->
    <rect x="420" y="130" width="38" height="68" rx="5" fill="#0d2318" stroke="#34d399" stroke-width="1"/>
    <text x="439" y="158" fill="#34d399" font-size="8" text-anchor="middle" transform="rotate(-90,439,165)">injective</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       (b)  Canonical {1,1,1,1} vs {1,1} collapse proof + 1-WL link
       Panel: x=486 y=82 w=414 h=190
  ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="82" width="414" height="190" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="82" width="414" height="4" rx="2" fill="#fb7185"/>
    <circle cx="510" cy="111" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1"/>
    <text x="510" y="116" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="532" y="107" fill="#cfe0f0" font-size="14" font-weight="700">{1,1,1,1} vs {1,1} — who collapses?</text>

    <!-- Left bag: {1,1,1,1} -->
    <text x="598" y="132" fill="#9fb4cc" font-size="11" text-anchor="middle">{1,1,1,1}</text>

    <!-- Right bag: {1,1} -->
    <text x="762" y="132" fill="#9fb4cc" font-size="11" text-anchor="middle">{1,1}</text>

    <!-- Comparison table -->
    <g font-family="'Cascadia Mono','Courier New',monospace" font-size="11">
      <!-- Header row -->
      <text x="510" y="152" fill="#8a99ad">agg</text>
      <text x="562" y="152" fill="#9fb4cc">bag A</text>
      <text x="628" y="152" fill="#9fb4cc">bag B</text>
      <text x="694" y="152" fill="#9fb4cc">A == B?</text>
      <text x="780" y="152" fill="#9fb4cc">verdict</text>
      <!-- Divider -->
      <line x1="506" y1="156" x2="894" y2="156" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

      <!-- mean row -->
      <text x="510" y="173" fill="#fda4b0">mean</text>
      <text x="562" y="173" fill="#e8eef6">1.00</text>
      <text x="628" y="173" fill="#e8eef6">1.00</text>
      <text x="694" y="173" fill="#fb7185" font-weight="700">YES ✗</text>
      <text x="780" y="173" fill="#fda4b0">collapse</text>

      <!-- max row -->
      <text x="510" y="192" fill="#fde68a">max</text>
      <text x="562" y="192" fill="#e8eef6">1.00</text>
      <text x="628" y="192" fill="#e8eef6">1.00</text>
      <text x="694" y="192" fill="#fb7185" font-weight="700">YES ✗</text>
      <text x="780" y="192" fill="#fde68a">collapse</text>

      <!-- sum row — highlighted -->
      <rect x="506" y="198" width="388" height="20" rx="3" fill="#0d2318"/>
      <text x="510" y="213" fill="#34d399" font-weight="700">sum</text>
      <text x="562" y="213" fill="#34d399" font-weight="700">4.00</text>
      <text x="628" y="213" fill="#34d399" font-weight="700">2.00</text>
      <text x="694" y="213" fill="#34d399" font-weight="700">NO ✓</text>
      <text x="780" y="213" fill="#34d399" font-weight="700">distinct!</text>
    </g>

    <!-- 1-WL link -->
    <text x="510" y="248" fill="#c4b5fd" font-size="11">1-WL: injective multiset agg → GIN matches</text>
    <text x="510" y="262" fill="#c4b5fd" font-size="11">1-WL discriminative power (under theory conditions).</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       (c)  GIN update vs GCN mean
       Panel: x=40 y=284 w=430 h=200
  ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="284" width="430" height="200" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="284" width="430" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="64" cy="313" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/>
    <text x="64" y="318" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="309" fill="#cfe0f0" font-size="14" font-weight="700">GIN update vs GCN mean</text>

    <!-- GIN formula box -->
    <rect x="55" y="325" width="400" height="36" rx="6" fill="#100a28"/>
    <text x="70" y="340" fill="#c4b5fd" font-size="10.5" font-family="'Cascadia Mono','Courier New',monospace">GIN:  h'_v = MLP( (1+ε)·h_v  +  Σ_{u∈N(v)} h_u )</text>
    <text x="70" y="355" fill="#fbbf24" font-size="9.5" font-family="'Cascadia Mono','Courier New',monospace">                  └─ self ─┘   └─── sum (count-sensitive) ───┘</text>

    <!-- GCN formula box -->
    <rect x="55" y="366" width="400" height="36" rx="6" fill="#1a0d10"/>
    <text x="70" y="381" fill="#fda4b0" font-size="10.5" font-family="'Cascadia Mono','Courier New',monospace">GCN:  h'_v = σ( Σ_{u∈N(v)∪{v}} h_u / deg )</text>
    <text x="70" y="396" fill="#8a99ad" font-size="9.5" font-family="'Cascadia Mono','Courier New',monospace">                  └────── mean (count-blind) ──────┘</text>

    <!-- Concrete example: node with 3 vs 2 neighbours, h_v=2, ε=0.2 -->
    <text x="56" y="418" fill="#9fb4cc" font-size="10.5">Example: h_v=2, ε=0.2, all h_u=1 — node A (|N|=3) vs node B (|N|=2):</text>
    <g font-family="'Cascadia Mono','Courier New',monospace" font-size="10.5">
      <text x="70" y="436" fill="#c4b5fd">GIN A = (1.2)·2 + 3 = 5.4   GIN B = (1.2)·2 + 2 = 4.4   </text>
      <text x="466" y="436" fill="#34d399" font-weight="700">DISTINCT</text>
      <text x="70" y="454" fill="#fda4b0">GCN A = (2+3)/4  = 1.25  GCN B = (2+2)/3  = 1.33  </text>
      <text x="466" y="454" fill="#fbbf24">closer</text>
    </g>
    <text x="56" y="474" fill="#8a99ad" font-size="10">MLP receives different inputs for GIN → can learn different outputs. Mean may collapse.</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       (d)  Biology — counts as dosage vs database bias
       Panel: x=486 y=284 w=414 h=200
  ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="284" width="414" height="200" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="284" width="414" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="510" cy="313" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/>
    <text x="510" y="318" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="532" y="309" fill="#cfe0f0" font-size="14" font-weight="700">Biology — counts: signal or bias?</text>

    <!-- Left sub-panel: dosage -->
    <rect x="496" y="322" width="188" height="148" rx="8" fill="#071410" stroke="#34d399" stroke-width="1"/>
    <text x="590" y="340" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">DOSAGE — real signal</text>
    <!-- Target gene, 4 real TF nodes -->
    <circle cx="558" cy="380" r="12" fill="#0e2740" stroke="#4dd7ff" stroke-width="2"/>
    <text x="558" y="384" fill="#4dd7ff" font-size="9" font-weight="700" text-anchor="middle">gene</text>
    <!-- 4 TF neighbours -->
    <circle cx="528" cy="355" r="8" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="528" y="359" fill="#7fe7c0" font-size="7" text-anchor="middle">TF</text>
    <line x1="548" y1="371" x2="536" y2="362" stroke="#34d399" stroke-width="1"/>
    <circle cx="528" cy="380" r="8" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="528" y="384" fill="#7fe7c0" font-size="7" text-anchor="middle">TF</text>
    <line x1="546" y1="380" x2="536" y2="380" stroke="#34d399" stroke-width="1"/>
    <circle cx="530" cy="405" r="8" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="530" y="409" fill="#7fe7c0" font-size="7" text-anchor="middle">TF</text>
    <line x1="549" y1="388" x2="537" y2="397" stroke="#34d399" stroke-width="1"/>
    <circle cx="556" cy="413" r="8" fill="#1a3a2a" stroke="#34d399" stroke-width="1.5"/>
    <text x="556" y="417" fill="#7fe7c0" font-size="7" text-anchor="middle">TF</text>
    <line x1="558" y1="392" x2="558" y2="405" stroke="#34d399" stroke-width="1"/>
    <!-- label and verdict -->
    <text x="620" y="370" fill="#9fb4cc" font-size="9.5">4 active</text>
    <text x="620" y="384" fill="#9fb4cc" font-size="9.5">regulators</text>
    <text x="620" y="402" fill="#34d399" font-size="9.5" font-weight="700">sum=4 ✓</text>
    <text x="620" y="416" fill="#34d399" font-size="9">GIN helps</text>
    <text x="590" y="438" fill="#9fb4cc" font-size="9" text-anchor="middle">counts = independent</text>
    <text x="590" y="450" fill="#9fb4cc" font-size="9" text-anchor="middle">biological evidence</text>
    <text x="590" y="462" fill="#34d399" font-size="9" text-anchor="middle" font-weight="700">→ GIN correctly separates</text>

    <!-- Right sub-panel: artifact -->
    <rect x="692" y="322" width="196" height="148" rx="8" fill="#14070a" stroke="#fb7185" stroke-width="1"/>
    <text x="790" y="340" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">DB ARTIFACT — bias</text>
    <!-- Target hub, 4 dup edges -->
    <circle cx="758" cy="380" r="12" fill="#0e2740" stroke="#4dd7ff" stroke-width="2"/>
    <text x="758" y="384" fill="#4dd7ff" font-size="9" font-weight="700" text-anchor="middle">hub</text>
    <!-- 4 duplicate neighbours -->
    <circle cx="728" cy="355" r="8" fill="#3a1420" stroke="#fb7185" stroke-width="1.5"/>
    <text x="728" y="359" fill="#fda4b0" font-size="7" text-anchor="middle">dup</text>
    <line x1="748" y1="371" x2="736" y2="362" stroke="#fb7185" stroke-width="1"/>
    <circle cx="728" cy="380" r="8" fill="#3a1420" stroke="#fb7185" stroke-width="1.5"/>
    <text x="728" y="384" fill="#fda4b0" font-size="7" text-anchor="middle">dup</text>
    <line x1="746" y1="380" x2="736" y2="380" stroke="#fb7185" stroke-width="1"/>
    <circle cx="730" cy="405" r="8" fill="#3a1420" stroke="#fb7185" stroke-width="1.5"/>
    <text x="730" y="409" fill="#fda4b0" font-size="7" text-anchor="middle">dup</text>
    <line x1="749" y1="388" x2="737" y2="397" stroke="#fb7185" stroke-width="1"/>
    <circle cx="756" cy="413" r="8" fill="#3a1420" stroke="#fb7185" stroke-width="1.5"/>
    <text x="756" y="417" fill="#fda4b0" font-size="7" text-anchor="middle">dup</text>
    <line x1="758" y1="392" x2="758" y2="405" stroke="#fb7185" stroke-width="1"/>
    <!-- label and verdict -->
    <text x="820" y="370" fill="#9fb4cc" font-size="9.5">4 copies of</text>
    <text x="820" y="384" fill="#9fb4cc" font-size="9.5">same entry</text>
    <text x="820" y="402" fill="#fb7185" font-size="9.5" font-weight="700">sum=4 ✗</text>
    <text x="820" y="416" fill="#fb7185" font-size="9">GIN amplifies</text>
    <text x="790" y="438" fill="#9pb4cc" font-size="9" text-anchor="middle">counts = redundant</text>
    <text x="790" y="450" fill="#9fb4cc" font-size="9" text-anchor="middle">database entries</text>
    <text x="790" y="462" fill="#fb7185" font-size="9" text-anchor="middle" font-weight="700">→ GIN amplifies the bias</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       Caption
  ════════════════════════════════════════════════════════════════ -->
  <line x1="40" y1="492" x2="900" y2="492" stroke="rgba(150,170,200,.18)" stroke-width="1"/>

  <text x="40" y="506" font-size="12.5" fill="#c7d2dd">
    <tspan fill="#e8eef6" font-weight="700">Figure B04. </tspan>
    <tspan>Injective aggregation in GIN. </tspan>
    <tspan fill="#9fe0ff" font-weight="700">(a)</tspan>
    <tspan> Three aggregators applied to a neighbour multiset of all-1 values: mean and max both</tspan>
    <tspan x="40" dy="16">output 1 regardless of bag size — they forget the count. Sum outputs the bag size — it keeps the count and is</tspan>
    <tspan x="40" dy="16">injective for this multiset. </tspan>
    <tspan fill="#fda4b0" font-weight="700">(b)</tspan>
    <tspan> Canonical proof: {1,1,1,1} vs {1,1}. Mean=1=1, Max=1=1 — both collapse. Sum=4≠2 — distinct.</tspan>
    <tspan x="40" dy="16">Injective multiset aggregation links GIN to 1-WL discriminative power. </tspan>
    <tspan fill="#c4b5fd" font-weight="700">(c)</tspan>
    <tspan> GIN update: (1+ε)·h_v + Σ neighbours → MLP. The sum</tspan>
    <tspan x="40" dy="16">preserves neighbour count; GCN mean normalises it away. With h_v=2, ε=0.2, |N|∈{3,2}: GIN gives 5.4 vs 4.4</tspan>
    <tspan x="40" dy="16">(distinct); GCN mean gives 1.25 vs 1.33 (closer). </tspan>
    <tspan fill="#fde68a" font-weight="700">(d)</tspan>
    <tspan> Biology: counts as dosage (4 real TFs vs 2 → GIN correctly separates)</tspan>
    <tspan x="40" dy="16">vs counts as artifact (4 duplicate DB edges → GIN amplifies the bias equally). Sum aggregation preserves</tspan>
    <tspan x="40" dy="16">whatever multiplicity encodes — verify whether counts are biology before trusting GIN's extra power.</tspan>
  </text>
</svg>
