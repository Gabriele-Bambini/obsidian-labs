<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 230" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">B05 concept — edge-blind conflates activation and repression; edge-aware signs and weights each message</title>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#070b14"/>

  <!-- Header -->
  <text x="28" y="30" fill="#4dd7ff" font-size="11.5" font-weight="700" letter-spacing="1.5">B05 · IGNORE THE EDGE = THROW AWAY THE BIOLOGICAL CLAIM</text>

  <!-- ── LEFT: GeneX neighbourhood ──────────────────────────────────────── -->
  <!-- Activation TF -->
  <circle cx="72" cy="80" r="18" fill="#15302a" stroke="#34d399" stroke-width="1.5"/>
  <text x="72" y="76" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">TF-Act</text>
  <text x="72" y="88" fill="#34d399" font-size="9" text-anchor="middle">h=2.0</text>

  <!-- Repression TF -->
  <circle cx="72" cy="130" r="18" fill="#3a1420" stroke="#fb7185" stroke-width="1.5"/>
  <text x="72" y="126" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">TF-Rep</text>
  <text x="72" y="138" fill="#fb7185" font-size="9" text-anchor="middle">h=3.0</text>

  <!-- Weak CoExpr -->
  <circle cx="72" cy="180" r="18" fill="#33270a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="72" y="176" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">CoExpr</text>
  <text x="72" y="188" fill="#fbbf24" font-size="9" text-anchor="middle">h=4.0</text>

  <!-- GeneX target -->
  <circle cx="192" cy="130" r="24" fill="#0e2740" stroke="#4dd7ff" stroke-width="2"/>
  <text x="192" y="126" fill="#4dd7ff" font-size="11" font-weight="700" text-anchor="middle">Gene</text>
  <text x="192" y="139" fill="#4dd7ff" font-size="11" font-weight="700" text-anchor="middle">X</text>

  <!-- Edges from neighbours to GeneX -->
  <!-- Act edge: thick green solid -->
  <line x1="90" y1="80" x2="170" y2="118" stroke="#34d399" stroke-width="2.5"/>
  <!-- Rep edge: medium rose solid -->
  <line x1="90" y1="130" x2="168" y2="130" stroke="#fb7185" stroke-width="2"/>
  <!-- Weak edge: thin amber dashed -->
  <line x1="90" y1="180" x2="170" y2="142" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Edge labels -->
  <text x="124" y="96" fill="#34d399" font-size="9">act conf=0.9</text>
  <text x="118" y="125" fill="#fda4b0" font-size="9">rep conf=0.7</text>
  <text x="118" y="168" fill="#fde68a" font-size="9">co-exp conf=0.3</text>

  <!-- ── SEPARATOR ─────────────────────────────────────────────────────── -->
  <line x1="240" y1="50" x2="240" y2="200" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- ── MIDDLE: Edge-BLIND ─────────────────────────────────────────────── -->
  <text x="270" y="54" fill="#fb7185" font-size="11" font-weight="700">EDGE-BLIND</text>
  <text x="270" y="68" fill="#8a99ad" font-size="10" font-family="'Cascadia Mono',monospace">mᵢⱼ = W·hⱼ</text>

  <!-- Blind message bars (all positive, same colour) -->
  <!-- TF-Act: +2.0 -->
  <rect x="270" y="80" width="80" height="14" rx="3" fill="#34d399" opacity="0.7"/>
  <text x="356" y="91" fill="#9fb4cc" font-size="9.5">+2.0</text>

  <!-- TF-Rep blind: +3.0 (wrong! should subtract) -->
  <rect x="270" y="102" width="120" height="14" rx="3" fill="#fb7185" opacity="0.6"/>
  <text x="396" y="113" fill="#fda4b0" font-size="9.5">+3.0 ✗</text>
  <text x="396" y="124" fill="#6b3a42" font-size="8.5">(repressor adds!)</text>

  <!-- CoExpr blind: +4.0 (too loud) -->
  <rect x="270" y="124" width="160" height="14" rx="3" fill="#fbbf24" opacity="0.5"/>
  <text x="436" y="135" fill="#fde68a" font-size="9.5">+4.0 ✗</text>
  <text x="436" y="146" fill="#6b5a20" font-size="8.5">(low conf, too loud)</text>

  <!-- Sum box blind -->
  <rect x="270" y="152" width="110" height="22" rx="5" fill="#3a0b14" stroke="#fb7185" stroke-width="1.2"/>
  <text x="325" y="167" fill="#fda4b0" font-size="11" font-weight="700" text-anchor="middle">h\'ₓ = 9.0 ✗</text>

  <!-- ── RIGHT: Edge-AWARE ──────────────────────────────────────────────── -->
  <text x="570" y="54" fill="#34d399" font-size="11" font-weight="700">EDGE-AWARE</text>
  <text x="570" y="68" fill="#8a99ad" font-size="10" font-family="'Cascadia Mono',monospace">mᵢⱼ = sign·conf·hⱼ</text>

  <!-- Act aware: +1.8 (conf 0.9 × h 2.0) -->
  <rect x="570" y="80" width="72" height="14" rx="3" fill="#34d399" opacity="0.85"/>
  <text x="648" y="91" fill="#9fb4cc" font-size="9.5">+1.8 ✓</text>

  <!-- Rep aware: −2.1 (sign −1 × conf 0.7 × h 3.0) — draws left from baseline -->
  <rect x="498" y="102" width="72" height="14" rx="3" fill="#fb7185" opacity="0.75"/>
  <text x="482" y="113" fill="#fda4b0" font-size="9.5" text-anchor="end">−2.1 ✓</text>
  <!-- baseline marker -->
  <line x1="570" y1="98" x1="570" y1="120" stroke="#9fb4cc" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- CoExpr aware: +1.2 (conf 0.3 × h 4.0) — short -->
  <rect x="570" y="124" width="48" height="14" rx="3" fill="#fbbf24" opacity="0.55"/>
  <text x="624" y="135" fill="#fde68a" font-size="9.5">+1.2 ✓ quiet</text>

  <!-- Sum box aware -->
  <rect x="570" y="152" width="110" height="22" rx="5" fill="#0e2a18" stroke="#34d399" stroke-width="1.5"/>
  <text x="625" y="167" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">h\'ₓ = 0.9 ✓</text>

  <!-- Baseline vertical for aware -->
  <line x1="570" y1="76" x2="570" y2="148" stroke="#9fb4cc" stroke-width="0.7" stroke-dasharray="3 3"/>
  <text x="573" y="76" fill="#6b7a8d" font-size="8">0</text>

  <!-- ── SEPARATOR ─────────────────────────────────────────────────────── -->
  <line x1="540" y1="50" x2="540" y2="200" stroke="rgba(150,170,200,.2)" stroke-width="1"/>

  <!-- ── TAKEAWAY ───────────────────────────────────────────────────────── -->
  <rect x="730" y="68" width="148" height="110" rx="10" fill="#0c1322" stroke="rgba(150,170,200,.2)"/>
  <text x="804" y="90" fill="#4dd7ff" font-size="10.5" font-weight="700" text-anchor="middle">KEY TAKEAWAY</text>
  <text x="744" y="110" fill="#9fb4cc" font-size="9.5">blind: every edge</text>
  <text x="744" y="124" fill="#9fb4cc" font-size="9.5">speaks the same.</text>
  <text x="744" y="142" fill="#cfe0f0" font-size="9.5">aware: sign flips</text>
  <text x="744" y="156" fill="#cfe0f0" font-size="9.5">repressors; conf</text>
  <text x="744" y="170" fill="#cfe0f0" font-size="9.5">silences weak edges.</text>

  <!-- Bottom label -->
  <text x="450" y="214" fill="#6b7a8d" font-size="10.5" text-anchor="middle">edge-blind h\'ₓ=9.0 vs edge-aware h\'ₓ=0.9 — same graph, opposite biological interpretation</text>
</svg>
