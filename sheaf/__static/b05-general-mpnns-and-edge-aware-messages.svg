<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Figure B05 — General MPNNs and edge-aware messages</title>
  <desc id="d">Four panels: general MPNN triple (phi/AGG/psi), edge-blind vs edge-aware, NNConv edge-feature-conditioned message, heterogeneous R-GCN relation routing.</desc>
  <rect x="0" y="0" width="940" height="664" fill="#070b14"/>
  <!-- ambient glows -->
  <circle cx="180" cy="80" r="220" fill="#34d399" opacity="0.04"/>
  <circle cx="790" cy="460" r="240" fill="#a78bfa" opacity="0.04"/>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE B05 · GENERAL MPNN AND EDGE-AWARE MESSAGES</text>
  <text x="40" y="60" fill="#e8eef6" font-size="23" font-weight="700">The edge is part of the message, not a label</text>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL (a): General MPNN triple  mᵢⱼ=φ(hᵢ,hⱼ,eᵢⱼ) / AGG / ψ       -->
  <!-- rect 40,78  w=430 h=178                                               -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="78" width="430" height="178" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="78" width="430" height="4" rx="2" fill="#4dd7ff"/>
    <circle cx="64" cy="106" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1.2"/>
    <text x="64" y="111" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
    <text x="86" y="102" fill="#cfe0f0" font-size="14" font-weight="700">General MPNN: the three-part rule</text>

    <!-- Nodes: neighbour j, target i, edge e_ji -->
    <!-- j circle -->
    <circle cx="108" cy="162" r="22" fill="#15302a" stroke="#34d399" stroke-width="1.5"/>
    <text x="108" y="167" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">hⱼ</text>
    <!-- i circle -->
    <circle cx="108" cy="228" r="22" fill="#0e2740" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="108" y="233" fill="#4dd7ff" font-size="13" font-weight="700" text-anchor="middle">hᵢ</text>
    <!-- edge diamond -->
    <polygon points="108,188 118,198 108,208 98,198" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="108" y="202" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle">eᵢⱼ</text>

    <!-- arrow hj -> phi -->
    <line x1="131" y1="162" x2="165" y2="182" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <!-- arrow hi -> phi -->
    <line x1="131" y1="228" x2="165" y2="202" stroke="#4dd7ff" stroke-width="1.5" marker-end="url(#arr-c)"/>
    <!-- arrow eij -> phi -->
    <line x1="120" y1="198" x2="165" y2="192" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-v)"/>

    <!-- phi box -->
    <rect x="168" y="176" width="52" height="28" rx="7" fill="#102030" stroke="#4dd7ff" stroke-width="1.2"/>
    <text x="194" y="194" fill="#9fe0ff" font-size="12" font-weight="700" text-anchor="middle">φ</text>

    <!-- arrow phi -> m_ij -->
    <line x1="220" y1="190" x2="250" y2="190" stroke="#9fb4cc" stroke-width="1.4" marker-end="url(#arr-s)"/>
    <text x="255" y="186" fill="#8a99ad" font-size="10">mᵢⱼ</text>

    <!-- AGG box -->
    <rect x="275" y="176" width="56" height="28" rx="7" fill="#0c1c2e" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="303" y="194" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">AGG</text>
    <!-- arrow mij -> AGG -->
    <line x1="253" y1="190" x2="272" y2="190" stroke="#9fb4cc" stroke-width="1.4" marker-end="url(#arr-s)"/>
    <!-- label aᵢ -->
    <text x="336" y="186" fill="#fde68a" font-size="10">aᵢ</text>
    <line x1="331" y1="190" x2="352" y2="190" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#arr-a)"/>

    <!-- ψ box -->
    <rect x="355" y="176" width="52" height="28" rx="7" fill="#1a0a20" stroke="#fb7185" stroke-width="1.2"/>
    <text x="381" y="194" fill="#fda4b0" font-size="12" font-weight="700" text-anchor="middle">ψ</text>
    <!-- arrow ψ -> h'i -->
    <line x1="407" y1="190" x2="430" y2="190" stroke="#fda4b0" stroke-width="1.4" marker-end="url(#arr-r)"/>
    <text x="434" y="186" fill="#fb7185" font-size="10">h\'ᵢ</text>

    <!-- hᵢ also feeds ψ -->
    <path d="M108 250 Q108 258 350 258 Q365 258 381 208" fill="none" stroke="#4dd7ff" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-c)"/>

    <!-- formula label -->
    <text x="86" y="246" fill="#6b7a8d" font-size="10.5" font-family="'Cascadia Mono',monospace">mᵢⱼ = φ(hᵢ, hⱼ, eᵢⱼ)   aᵢ = ⊕ⱼ mᵢⱼ   h\'ᵢ = ψ(hᵢ, aᵢ)</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL (b): Edge-blind vs Edge-aware                                   -->
  <!-- rect 486,78  w=414 h=178                                              -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="78" width="414" height="178" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="78" width="414" height="4" rx="2" fill="#fb7185"/>
    <circle cx="510" cy="106" r="13" fill="#3a0b14" stroke="#fb7185" stroke-width="1.2"/>
    <text x="510" y="111" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">b</text>
    <text x="532" y="102" fill="#cfe0f0" font-size="14" font-weight="700">Edge-blind vs edge-aware</text>

    <!-- BLIND side: left half -->
    <text x="540" y="124" fill="#fb7185" font-size="11" font-weight="700">EDGE-BLIND  mᵢⱼ = W·hⱼ</text>

    <!-- TF-Act → GeneX  (blind ignores sign) -->
    <circle cx="552" cy="150" r="12" fill="#15302a" stroke="#34d399" stroke-width="1.2"/>
    <text x="552" y="154" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">+</text>
    <line x1="564" y1="150" x2="650" y2="168" stroke="#34d399" stroke-width="2" stroke-dasharray="0"/>
    <text x="600" y="148" fill="#9fb4cc" font-size="9">+2.0</text>

    <!-- TF-Rep → GeneX  (blind still adds!) -->
    <circle cx="552" cy="175" r="12" fill="#3a1420" stroke="#fb7185" stroke-width="1.2"/>
    <text x="552" y="179" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">−</text>
    <line x1="564" y1="175" x2="650" y2="175" stroke="#fb7185" stroke-width="2"/>
    <text x="600" y="170" fill="#fda4b0" font-size="9">+3.0 ✗ wrong!</text>

    <!-- CoExpr → GeneX (blind treats same as TF-Act) -->
    <circle cx="552" cy="200" r="12" fill="#33270a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="552" y="204" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">≈</text>
    <line x1="564" y1="200" x2="650" y2="182" stroke="#fbbf24" stroke-width="2"/>
    <text x="600" y="196" fill="#fde68a" font-size="9">+4.0 ✗ too loud</text>

    <!-- GeneX target blind -->
    <circle cx="662" cy="175" r="16" fill="#0e2740" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="662" y="172" fill="#4dd7ff" font-size="8.5" text-anchor="middle">Gene</text>
    <text x="662" y="183" fill="#fb7185" font-size="8.5" text-anchor="middle">9.0✗</text>

    <!-- AWARE side: right half -->
    <text x="705" y="124" fill="#34d399" font-size="11" font-weight="700">EDGE-AWARE  mᵢⱼ=sign·conf·hⱼ</text>


    <!-- TF-Act → GeneX aware -->
    <circle cx="715" cy="150" r="12" fill="#15302a" stroke="#34d399" stroke-width="1.2"/>
    <text x="715" y="154" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">+</text>
    <line x1="727" y1="150" x2="820" y2="168" stroke="#34d399" stroke-width="2.5"/>
    <text x="765" y="148" fill="#9fb4cc" font-size="9">+1.8</text>

    <!-- TF-Rep → GeneX aware (subtracts!) -->
    <circle cx="715" cy="175" r="12" fill="#3a1420" stroke="#fb7185" stroke-width="1.2"/>
    <text x="715" y="179" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">−</text>
    <line x1="727" y1="175" x2="820" y2="175" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="765" y="170" fill="#fda4b0" font-size="9">−2.1 ✓</text>

    <!-- CoExpr → GeneX aware (downweighted) -->
    <circle cx="715" cy="200" r="12" fill="#33270a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="715" y="204" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">≈</text>
    <line x1="727" y1="200" x2="820" y2="182" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3 4"/>
    <text x="765" y="196" fill="#fde68a" font-size="9">+1.2 ✓ quiet</text>

    <!-- GeneX target aware -->
    <circle cx="832" cy="175" r="16" fill="#0e2740" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="832" y="172" fill="#4dd7ff" font-size="8.5" text-anchor="middle">Gene</text>
    <text x="832" y="183" fill="#34d399" font-size="8.5" text-anchor="middle">0.9✓</text>

    <text x="532" y="240" fill="#8a99ad" font-size="10.5">
      <tspan x="532" dy="0">repressor wrongly adds blind (9.0); aware flips sign → 0.9.</tspan>
      <tspan x="532" dy="14">Ignore edge = lose the biological claim.</tspan>
    </text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL (c): Edge-feature-conditioned NNConv  eᵢⱼ=[type,conf,sign]     -->
  <!-- rect 40,268  w=430 h=208                                              -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="268" width="430" height="208" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="40" y="268" width="430" height="4" rx="2" fill="#fbbf24"/>
    <circle cx="64" cy="296" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="64" y="301" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
    <text x="86" y="292" fill="#cfe0f0" font-size="14" font-weight="700">Edge-feature-conditioned message (NNConv)</text>

    <!-- Edge feature vector box -->
    <rect x="60" y="312" width="152" height="64" rx="9" fill="#0e1e30" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="136" y="330" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">eᵢⱼ = [type, conf, sign]</text>
    <text x="80" y="350" fill="#a78bfa" font-size="10.5">"TF→gene"</text>
    <text x="80" y="365" fill="#34d399" font-size="10.5">conf = 0.88</text>
    <text x="168" y="350" fill="#fbbf24" font-size="10.5" text-anchor="end">sign = +1</text>

    <!-- Arrow eij -> h_theta -->
    <line x1="212" y1="344" x2="255" y2="344" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>

    <!-- h_Theta (small MLP) box -->
    <rect x="258" y="328" width="86" height="32" rx="8" fill="#1a0e00" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="301" y="349" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">h_Θ(eᵢⱼ)</text>

    <!-- Arrow -> W(e) -->
    <line x1="344" y1="344" x2="368" y2="344" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <text x="372" y="340" fill="#8a99ad" font-size="10">W(e)</text>

    <!-- hj node -->
    <circle cx="90" cy="420" r="20" fill="#15302a" stroke="#34d399" stroke-width="1.5"/>
    <text x="90" y="425" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">hⱼ</text>

    <!-- Arrow hj -> multiply -->
    <line x1="110" y1="420" x2="365" y2="380" stroke="#34d399" stroke-width="1.4" marker-end="url(#arr-g)"/>

    <!-- multiply symbol -->
    <circle cx="378" cy="368" r="12" fill="#102020" stroke="#4dd7ff" stroke-width="1.2"/>
    <text x="378" y="373" fill="#4dd7ff" font-size="14" font-weight="700" text-anchor="middle">×</text>

    <!-- Arrow -> mij result -->
    <line x1="390" y1="368" x2="418" y2="368" stroke="#4dd7ff" stroke-width="1.5" marker-end="url(#arr-c)"/>
    <text x="422" y="364" fill="#4dd7ff" font-size="12" font-weight="700">mᵢⱼ</text>

    <!-- caption line -->
    <text x="60" y="460" fill="#9fb4cc" font-size="11">mᵢⱼ = h_Θ(eᵢⱼ) · hⱼ  — the edge generates its own weight matrix.</text>
    <text x="60" y="474" fill="#6b7a8d" font-size="10.5">conf scales magnitude · sign flips direction · type selects the filter</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <!-- PANEL (d): Heterogeneous edge types / R-GCN                          -->
  <!-- rect 486,268  w=414 h=208                                             -->
  <!-- ══════════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="486" y="268" width="414" height="208" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
    <rect x="486" y="268" width="414" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="510" cy="296" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="510" y="301" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">d</text>
    <text x="532" y="292" fill="#cfe0f0" font-size="14" font-weight="700">Heterogeneous edge types (R-GCN)</text>

    <!-- GeneX target -->
    <circle cx="840" cy="375" r="22" fill="#0e2740" stroke="#4dd7ff" stroke-width="1.8"/>
    <text x="840" y="371" fill="#4dd7ff" font-size="10" font-weight="700" text-anchor="middle">Gene</text>
    <text x="840" y="383" fill="#4dd7ff" font-size="9" text-anchor="middle">X</text>

    <!-- Relation 1: TF→gene (violet) -->
    <circle cx="545" cy="318" r="16" fill="#241a40" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="545" y="323" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle">TF</text>
    <rect x="615" y="308" width="50" height="20" rx="5" fill="#1a1230" stroke="#a78bfa" stroke-width="1"/>
    <text x="640" y="322" fill="#c4b5fd" font-size="10" font-weight="700" text-anchor="middle">W_TF</text>
    <line x1="561" y1="318" x2="612" y2="318" stroke="#a78bfa" stroke-width="1.8"/>
    <line x1="665" y1="318" x2="816" y2="360" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arr-v)"/>

    <!-- Relation 2: PPI (amber) -->
    <circle cx="545" cy="365" r="16" fill="#1a1400" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="545" y="370" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">PPI</text>
    <rect x="615" y="355" width="50" height="20" rx="5" fill="#1a1400" stroke="#fbbf24" stroke-width="1"/>
    <text x="640" y="369" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">W_PPI</text>
    <line x1="561" y1="365" x2="612" y2="365" stroke="#fbbf24" stroke-width="1.8"/>
    <line x1="665" y1="365" x2="816" y2="375" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-a)"/>

    <!-- Relation 3: co-expression (cyan) -->
    <circle cx="545" cy="412" r="16" fill="#051520" stroke="#4dd7ff" stroke-width="1.5"/>
    <text x="545" y="415" fill="#4dd7ff" font-size="7.5" font-weight="700" text-anchor="middle">CoEx</text>
    <rect x="615" y="402" width="50" height="20" rx="5" fill="#051520" stroke="#4dd7ff" stroke-width="1"/>
    <text x="640" y="416" fill="#9fd0ff" font-size="9.5" font-weight="700" text-anchor="middle">W_CoEx</text>
    <line x1="561" y1="412" x2="612" y2="412" stroke="#4dd7ff" stroke-width="0.9" stroke-dasharray="4 3"/>
    <line x1="665" y1="412" x2="816" y2="390" stroke="#4dd7ff" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arr-c)"/>

    <!-- AGG label -->
    <text x="810" y="430" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">AGG</text>
    <text x="810" y="444" fill="#fde68a" font-size="9" text-anchor="middle">Σᵣ</text>

    <!-- Labels on arrows -->
    <text x="694" y="345" fill="#a78bfa" font-size="9">TF channel</text>
    <text x="694" y="368" fill="#fbbf24" font-size="9">PPI channel</text>
    <text x="694" y="407" fill="#4dd7ff" font-size="9">CoExpr (faint)</text>

    <text x="506" y="460" fill="#9fb4cc" font-size="11">Each relation type routes through its own Wᵣ and aggregates separately —</text>
    <text x="506" y="473" fill="#9fb4cc" font-size="11">a noisy co-expression channel cannot corrupt a strong TF perturbation channel.</text>
  </g>

  <!-- ── Arrow markers ───────────────────────────────────────────────────── -->
  <defs>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#34d399"/></marker>
    <marker id="arr-c" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#4dd7ff"/></marker>
    <marker id="arr-v" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#a78bfa"/></marker>
    <marker id="arr-a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#fbbf24"/></marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#fb7185"/></marker>
    <marker id="arr-s" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#9fb4cc"/></marker>
  </defs>

  <!-- ── Divider ───────────────────────────────────────────────────────── -->
  <line x1="40" y1="490" x2="900" y2="490" stroke="rgba(150,170,200,.18)" stroke-width="1"/>

  <!-- ── Caption ───────────────────────────────────────────────────────── -->
  <text x="40" y="515" font-size="12.5" fill="#c7d2dd">
    <tspan x="40" dy="0"><tspan fill="#e8eef6" font-weight="700">Figure B05. </tspan><tspan>Three design choices: message function, aggregation, update. </tspan><tspan fill="#9fe0ff" font-weight="700">(a)</tspan><tspan> mᵢⱼ=φ(hᵢ,hⱼ,eᵢⱼ): both node states and edge evidence feed φ;</tspan></tspan>
    <tspan x="40" dy="19">AGG combines incoming messages; ψ updates the target. </tspan><tspan fill="#fda4b0" font-weight="700">(b)</tspan><tspan> Edge-blind sums raw values (9.0), wrongly adding the repressor;</tspan>
    <tspan x="40" dy="19">edge-aware multiplies by sign×confidence (0.9), letting a repressor subtract and a weak co-expression edge whisper. </tspan><tspan fill="#fde68a" font-weight="700">(c)</tspan>
    <tspan x="40" dy="19">NNConv: eᵢⱼ=[type,conf,sign] is fed to MLP h_Θ producing a per-edge weight matrix; the edge controls its own filter. </tspan><tspan fill="#c4b5fd" font-weight="700">(d)</tspan>
    <tspan x="40" dy="19">R-GCN routes each relation type through its own Wᵣ — a noisy co-expression channel cannot corrupt a TF perturbation channel.</tspan>
  </text>
</svg>
