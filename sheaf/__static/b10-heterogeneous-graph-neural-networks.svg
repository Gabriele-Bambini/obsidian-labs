<text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Why the channel matters</text>
<text x="56" y="301" fill="#9fb4cc" font-size="11">The TF channel carries 51% of the inflow. If a GRN</text>
<text x="56" y="321" fill="#9fb4cc" font-size="11">prediction leans on the cell-expression channel it is a</text>
<text x="56" y="341" fill="#9fb4cc" font-size="11">marker, not regulation; if on the drug channel it is</text>
<text x="56" y="361" fill="#9fb4cc" font-size="11">therapeutic, not transcriptional. The decomposition, not</text>
<text x="56" y="381" fill="#9fb4cc" font-size="11">the total, carries the biology.</text>
