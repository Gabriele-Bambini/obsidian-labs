<title id="t">Figure E07 — Knock out the cause, read every effect: the causal perturbation graph</title>
<desc id="d">Four-panel captioned figure: Knock out the cause, read every effect: the causal perturbation graph</desc>
<rect x="0" y="0" width="940" height="664" fill="#070b14"/>
