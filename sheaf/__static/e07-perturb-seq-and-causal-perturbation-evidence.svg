<text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE E07 · BLOCK E · SINGLE-CELL &amp; MULTI-OMICS</text>
<text x="40" y="62" fill="#e8eef6" font-size="19" font-weight="700">Knock out the cause, read every effect: the causal perturbation graph</text>
