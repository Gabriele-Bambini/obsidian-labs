<text x="56" y="179.5" fill="#4dd7ff" font-size="11.5" font-weight="700">readout</text>
<text x="196" y="179.5" fill="#9fb4cc" font-size="11.5">scRNA-seq</text>
<text x="56" y="199.5" fill="#4dd7ff" font-size="11.5" font-weight="700">evidence</text>
<text x="196" y="199.5" fill="#9fb4cc" font-size="11.5">causal</text>
