<text x="196" y="413.5" fill="#9fb4cc" font-size="11.5">40% → fail</text>
<text x="56" y="441" fill="#8a99ad" font-size="11">Only perturbations that silenced their own gene earn</text>
<text x="56" y="461" fill="#8a99ad" font-size="11">high-confidence edges.</text>
<rect x="486" y="244" width="414" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
