<text x="642" y="321.5" fill="#9fb4cc" font-size="11.5">null (g3 0.34)</text>
<text x="502" y="341.5" fill="#a78bfa" font-size="11.5" font-weight="700">Perturb-seq</text>
<text x="642" y="341.5" fill="#9fb4cc" font-size="11.5">interventional</text>
<text x="502" y="361.5" fill="#a78bfa" font-size="11.5" font-weight="700">GENIE3</text>
