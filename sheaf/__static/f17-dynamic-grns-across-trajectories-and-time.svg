<text x="64" y="275" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
<text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Δ = G2 − G1 classifies edges</text>
<text x="56" y="301.5" fill="#fb7185" font-size="11.5" font-weight="700">TF1→GeneA</text>
<text x="196" y="301.5" fill="#9fb4cc" font-size="11.5">-0.74</text>
<text x="56" y="321.5" fill="#34d399" font-size="11.5" font-weight="700">TF2→GeneB</text>
<text x="196" y="321.5" fill="#9fb4cc" font-size="11.5">+0.57</text>
<text x="56" y="341.5" fill="#fbbf24" font-size="11.5" font-weight="700">→GeneC</text>
<text x="196" y="341.5" fill="#9fb4cc" font-size="11.5">-0.01</text>
<text x="56" y="369" fill="#9fb4cc" font-size="11">|Δ|&gt;0.30: silenced (−0.74), activated (+0.57); GeneC</text>
<text x="56" y="389" fill="#9fb4cc" font-size="11">stable.</text>
<rect x="486" y="244" width="414" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
<rect x="486" y="244" width="414" height="4" rx="2" fill="#a78bfa"/>
<circle cx="510" cy="270" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/>
<text x="510" y="275" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">d</text>
<text x="532" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Static pooling hides the switch</text>
<text x="502" y="301.5" fill="#a78bfa" font-size="11.5" font-weight="700">pooled ρ(TF2,B)</text>
<text x="642" y="301.5" fill="#9fb4cc" font-size="11.5">1.00</text>
<text x="502" y="321.5" fill="#a78bfa" font-size="11.5" font-weight="700">binned</text>
<text x="642" y="321.5" fill="#9fb4cc" font-size="11.5">0.31 → 0.88</text>
<text x="502" y="341.5" fill="#a78bfa" font-size="11.5" font-weight="700">lost</text>
<text x="642" y="341.5" fill="#9fb4cc" font-size="11.5">WHEN it activated</text>
<text x="502" y="369" fill="#8a99ad" font-size="11">Pooling 4 cells gives ρ=0.998 but cannot say when</text>
<text x="502" y="389" fill="#8a99ad" font-size="11">TF2→GeneB turned on.</text>
<line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
<text x="40" y="538" fill="#e8eef6" font-size="13" font-weight="700">Figure F17. </text>
<text x="143.1" y="538" fill="#c7d2dd" font-size="13">A </text>
<text x="160.43" y="538" fill="#c7d2dd" font-size="13">dynamic </text>
<text x="224.91" y="538" fill="#c7d2dd" font-size="13">GRN </text>
<text x="260.78" y="538" fill="#c7d2dd" font-size="13">over </text>
<text x="301.08" y="538" fill="#c7d2dd" font-size="13">4 </text>
<text x="317.2" y="538" fill="#c7d2dd" font-size="13">cells </text>
<text x="365.56" y="538" fill="#c7d2dd" font-size="13">(pseudotime </text>
<text x="462.28" y="538" fill="#c7d2dd" font-size="13">0.1→0.9), </text>
<text x="549.33" y="538" fill="#c7d2dd" font-size="13">5 </text>
<text x="565.45" y="538" fill="#c7d2dd" font-size="13">genes, </text>
<text x="621.87" y="538" fill="#c7d2dd" font-size="13">2 </text>
<text x="637.99" y="538" fill="#c7d2dd" font-size="13">bins. </text>
<text x="686.35" y="538" fill="#9fe0ff" font-size="13" font-weight="700">(a) </text>
<text x="719.88" y="538" fill="#c7d2dd" font-size="13">TF1 </text>
<text x="754.54" y="538" fill="#c7d2dd" font-size="13">decays </text>
<text x="810.96" y="538" fill="#c7d2dd" font-size="13">8.1→0.9</text>
<text x="40" y="559" fill="#c7d2dd" font-size="13">while </text>
<text x="88.36" y="559" fill="#c7d2dd" font-size="13">TF2 </text>
<text x="123.02" y="559" fill="#c7d2dd" font-size="13">rises </text>
<text x="171.38" y="559" fill="#c7d2dd" font-size="13">1.2→8.8. </text>
<text x="250.37" y="559" fill="#fda4b0" font-size="13" font-weight="700">(b) </text>
<text x="283.9" y="559" fill="#c7d2dd" font-size="13">Per-bin </text>
<text x="349.58" y="559" fill="#c7d2dd" font-size="13">GRNs: </text>
<text x="401.57" y="559" fill="#c7d2dd" font-size="13">TF1→GeneA </text>
<text x="493.46" y="559" fill="#c7d2dd" font-size="13">0.85→0.11, </text>
<text x="588.56" y="559" fill="#c7d2dd" font-size="13">TF2→GeneB </text>
<text x="680.45" y="559" fill="#c7d2dd" font-size="13">0.31→0.88. </text>
<text x="775.56" y="559" fill="#fde68a" font-size="13" font-weight="700">(c) </text>
<text x="809.09" y="559" fill="#c7d2dd" font-size="13">Δ </text>
<text x="825.21" y="559" fill="#c7d2dd" font-size="13">= </text>
<text x="841.33" y="559" fill="#c7d2dd" font-size="13">G2 </text>
<text x="866.71" y="559" fill="#c7d2dd" font-size="13">−</text>
<text x="40" y="580" fill="#c7d2dd" font-size="13">G1: </text>
<text x="73.45" y="580" fill="#c7d2dd" font-size="13">silenced </text>
<text x="145.99" y="580" fill="#c7d2dd" font-size="13">-0.74, </text>
<text x="202.41" y="580" fill="#c7d2dd" font-size="13">activated </text>
<text x="283.01" y="580" fill="#c7d2dd" font-size="13">+0.57, </text>
<text x="339.43" y="580" fill="#c7d2dd" font-size="13">stable </text>
<text x="395.85" y="580" fill="#c7d2dd" font-size="13">-0.01. </text>
<text x="452.27" y="580" fill="#c4b5fd" font-size="13" font-weight="700">(d) </text>
<text x="485.8" y="580" fill="#c7d2dd" font-size="13">Static </text>
<text x="543.43" y="580" fill="#c7d2dd" font-size="13">pooled </text>
<text x="599.85" y="580" fill="#c7d2dd" font-size="13">ρ=1.00 </text>
<text x="656.27" y="580" fill="#c7d2dd" font-size="13">erases </text>
<text x="712.69" y="580" fill="#c7d2dd" font-size="13">when </text>
<text x="752.99" y="580" fill="#c7d2dd" font-size="13">the </text>
<text x="785.23" y="580" fill="#c7d2dd" font-size="13">program</text>
<text x="40" y="601" fill="#c7d2dd" font-size="13">switched.</text>
