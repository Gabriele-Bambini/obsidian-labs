<text x="508" y="216" fill="#8a99ad" font-size="9" text-anchor="middle">A1</text>
<rect x="520" y="200.75" width="12" height="3.25" rx="2" fill="#4dd7ff"/>
<text x="526" y="216" fill="#8a99ad" font-size="9" text-anchor="middle">A2</text>
<rect x="538" y="194.84" width="12" height="9.16" rx="2" fill="#fb7185"/>
