<circle cx="800" cy="450" r="250" fill="#a78bfa" opacity="0.05"/>
<text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE F17 · BLOCK F · GRN INFERENCE</text>
<text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">A GRN is a sequence G(t), not one averaged graph</text>
