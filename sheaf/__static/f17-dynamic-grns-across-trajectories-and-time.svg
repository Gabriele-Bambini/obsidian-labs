<text x="532" y="106" fill="#cfe0f0" font-size="14" font-weight="700">Per-bin GRNs: the TF switch</text>
<text x="502" y="139.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">G1 = GRN(cells 1,2)</text>
<text x="502" y="159.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">G2 = GRN(cells 3,4)</text>
