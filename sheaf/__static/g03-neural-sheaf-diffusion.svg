<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 664" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Figure G03 — Learn the restriction maps: an MLP predicts R, the sheaf rebuilds every layer</title>
<desc id="d">Four-panel captioned figure: Learn the restriction maps: an MLP predicts R, the sheaf rebuilds every layer</desc>
<rect x="0" y="0" width="940" height="664" fill="#070b14"/>
<circle cx="160" cy="70" r="230" fill="#4dd7ff" opacity="0.05"/>
<circle cx="800" cy="450" r="250" fill="#a78bfa" opacity="0.05"/>
<text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE G03 · BLOCK G · SHEAF GNN FOR BIOLOGY</text>
<text x="40" y="62" fill="#e8eef6" font-size="17" font-weight="700">Learn the restriction maps: an MLP predicts R, the sheaf rebuilds every layer</text>
<rect x="40" y="82" width="430" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
<rect x="40" y="82" width="430" height="4" rx="2" fill="#4dd7ff"/>
<circle cx="64" cy="108" r="13" fill="#0e2740" stroke="#4dd7ff" stroke-width="1"/>
<text x="64" y="113" fill="#9fe0ff" font-size="14" font-weight="700" text-anchor="middle">a</text>
<text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">MLP-predicted restriction map</text>
<text x="56" y="139.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">R_{TF1→e} = MLP_θ(h_TF1 ‖ h_A)</text>
<text x="56" y="159.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">head R_{GeneA→e} = I</text>
<text x="56" y="187.5" fill="#4dd7ff" font-size="11.5" font-weight="700">h_TF1</text>
<text x="196" y="187.5" fill="#9fb4cc" font-size="11.5">[3.0, 2.0]</text>
<text x="56" y="207.5" fill="#8a99ad" font-size="11">…</text>
<rect x="486" y="82" width="414" height="150" rx="12" fill="#0c1322" stroke="rgba(150,170,200,.18)"/>
<rect x="486" y="82" width="414" height="4" rx="2" fill="#fb7185"/>
<circle cx="510" cy="108" r="13" fill="#3a1420" stroke="#fb7185" stroke-width="1"/>
<text x="510" y="113" fill="#fda4b0" font-size="14" font-weight="700" text-anchor="middle">b</text>
<text x="532" y="106" fill="#cfe0f0" font-size="14" font-weight="700">One diffusion step on GeneA</text>
<text x="502" y="139.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">∇E = h_A − R·h_TF1</text>
<text x="502" y="159.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">h_A¹ = h_A − (α/λ)·∇E</text>
<text x="502" y="187.5" fill="#4dd7ff" font-size="11.5" font-weight="700">R·h_TF1</text>
<text x="642" y="187.5" fill="#9fb4cc" font-size="11.5">[2.30, 1.35]</text>
<text x="502" y="207.5" fill="#8a99ad" font-size="11">…</text>
<rect x="40" y="244" width="430" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
<rect x="40" y="244" width="430" height="4" rx="2" fill="#fbbf24"/>
<circle cx="64" cy="270" r="13" fill="#33270a" stroke="#fbbf24" stroke-width="1"/>
<text x="64" y="275" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
<text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Three NSD variants</text>
<text x="56" y="301" fill="#9fb4cc" font-size="11">General R is free (max expressivity, may be</text>
<text x="56" y="321" fill="#9fb4cc" font-size="11">ill-conditioned). Symmetric R=LLᵀ is always</text>
<text x="56" y="341" fill="#9fb4cc" font-size="11">positive-definite. Diagonal at d=1 is a learned signed</text>
<text x="56" y="361" fill="#9fb4cc" font-size="11">adjacency weight — the most interpretable for GRNs.</text>
<rect x="56" y="380" width="12" height="64" rx="2" fill="#4dd7ff"/>
<text x="62" y="456" fill="#8a99ad" font-size="9" text-anchor="middle">Gen</text>
<rect x="86" y="396" width="12" height="48" rx="2" fill="#34d399"/>
<text x="92" y="456" fill="#8a99ad" font-size="9" text-anchor="middle">Sym</text>
<rect x="116" y="412" width="12" height="32" rx="2" fill="#fbbf24"/>
<text x="122" y="456" fill="#8a99ad" font-size="9" text-anchor="middle">Diag</text>
<line x1="56" y1="380" x2="146" y2="380" stroke="#fb7185" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="486" y="244" width="414" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
<rect x="486" y="244" width="414" height="4" rx="2" fill="#a78bfa"/>
<circle cx="510" cy="270" r="13" fill="#241a40" stroke="#a78bfa" stroke-width="1"/>
<text x="510" y="275" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">d</text>
<text x="532" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Why learn the sheaf</text>
<text x="502" y="301.5" fill="#a78bfa" font-size="11.5" font-weight="700">maps</text>
<text x="642" y="301.5" fill="#9fb4cc" font-size="11.5">predicted, not fixed</text>
<text x="502" y="321.5" fill="#a78bfa" font-size="11.5" font-weight="700">L_F^l</text>
<text x="642" y="321.5" fill="#9fb4cc" font-size="11.5">rebuilt every layer</text>
<text x="502" y="341.5" fill="#a78bfa" font-size="11.5" font-weight="700">deep layers</text>
<text x="642" y="341.5" fill="#9fb4cc" font-size="11.5">no oversmoothing</text>
<text x="502" y="361.5" fill="#a78bfa" font-size="11.5" font-weight="700">heterophily</text>
<text x="642" y="361.5" fill="#9fb4cc" font-size="11.5">signed maps win</text>
<line x1="40" y1="512" x2="900" y2="512" stroke="rgba(150,170,200,.18)" stroke-width="1"/>
<text x="40" y="538" fill="#e8eef6" font-size="13" font-weight="700">Figure G03. </text>
<text x="143.1" y="538" fill="#c7d2dd" font-size="13">Section-5 </text>
<text x="224.91" y="538" fill="#c7d2dd" font-size="13">NSD </text>
<text x="260.78" y="538" fill="#c7d2dd" font-size="13">example: </text>
<text x="333.32" y="538" fill="#c7d2dd" font-size="13">TF1 </text>
<text x="367.98" y="538" fill="#c7d2dd" font-size="13">activates </text>
<text x="448.58" y="538" fill="#c7d2dd" font-size="13">GeneA </text>
<text x="499.36" y="538" fill="#c7d2dd" font-size="13">(learned), </text>
<text x="588.02" y="538" fill="#c7d2dd" font-size="13">GeneB </text>
<text x="638.79" y="538" fill="#c7d2dd" font-size="13">unrelated, </text>
<text x="727.45" y="538" fill="#c7d2dd" font-size="13">R² </text>
<text x="750.42" y="538" fill="#c7d2dd" font-size="13">stalks. </text>
<text x="814.9" y="538" fill="#9fe0ff" font-size="13" font-weight="700">(a) </text>
<text x="848.43" y="538" fill="#c7d2dd" font-size="13">An</text>
<text x="40" y="559" fill="#c7d2dd" font-size="13">MLP </text>
<text x="75.87" y="559" fill="#c7d2dd" font-size="13">predicts </text>
<text x="148.41" y="559" fill="#c7d2dd" font-size="13">R_{TF1→e} </text>
<text x="239.08" y="559" fill="#c7d2dd" font-size="13">from </text>
<text x="279.38" y="559" fill="#c7d2dd" font-size="13">h_TF1‖h_A; </text>
<text x="371.67" y="559" fill="#c7d2dd" font-size="13">the </text>
<text x="403.91" y="559" fill="#c7d2dd" font-size="13">GeneA </text>
<text x="454.69" y="559" fill="#c7d2dd" font-size="13">head </text>
<text x="494.99" y="559" fill="#c7d2dd" font-size="13">is </text>
<text x="519.17" y="559" fill="#c7d2dd" font-size="13">identity. </text>
<text x="599.77" y="559" fill="#fda4b0" font-size="13" font-weight="700">(b) </text>
<text x="633.3" y="559" fill="#c7d2dd" font-size="13">∇E </text>
<text x="658.69" y="559" fill="#c7d2dd" font-size="13">= </text>
<text x="674.81" y="559" fill="#c7d2dd" font-size="13">h_A </text>
<text x="708.25" y="559" fill="#c7d2dd" font-size="13">− </text>
<text x="724.37" y="559" fill="#c7d2dd" font-size="13">R·h_TF1 </text>
<text x="798.93" y="559" fill="#c7d2dd" font-size="13">= </text>
<text x="815.05" y="559" fill="#c7d2dd" font-size="13">[0.10,</text>
<text x="40" y="580" fill="#c7d2dd" font-size="13">0.25] </text>
<text x="88.36" y="580" fill="#c7d2dd" font-size="13">gives </text>
<text x="136.72" y="580" fill="#c7d2dd" font-size="13">one </text>
<text x="168.96" y="580" fill="#c7d2dd" font-size="13">step </text>
<text x="209.26" y="580" fill="#c7d2dd" font-size="13">h_A¹ </text>
<text x="248.35" y="580" fill="#c7d2dd" font-size="13">= </text>
<text x="264.47" y="580" fill="#c7d2dd" font-size="13">[2.375, </text>
<text x="328.95" y="580" fill="#c7d2dd" font-size="13">1.5375] </text>
<text x="393.43" y="580" fill="#c7d2dd" font-size="13">(‖δ‖²=0.072, </text>
<text x="495.79" y="580" fill="#c7d2dd" font-size="13">‖R‖_F=0.93). </text>
<text x="602.99" y="580" fill="#fde68a" font-size="13" font-weight="700">(c) </text>
<text x="636.52" y="580" fill="#c7d2dd" font-size="13">Gen/Sym/Diag </text>
<text x="744.93" y="580" fill="#c7d2dd" font-size="13">trade </text>
<text x="793.29" y="580" fill="#c7d2dd" font-size="13">expressivity</text>
<text x="40" y="601" fill="#c7d2dd" font-size="13">vs </text>
<text x="64.18" y="601" fill="#c7d2dd" font-size="13">conditioning. </text>
<text x="177.02" y="601" fill="#c4b5fd" font-size="13" font-weight="700">(d) </text>
<text x="210.55" y="601" fill="#c7d2dd" font-size="13">L_F </text>
<text x="245.21" y="601" fill="#c7d2dd" font-size="13">rebuilt </text>
<text x="309.69" y="601" fill="#c7d2dd" font-size="13">every </text>
<text x="358.05" y="601" fill="#c7d2dd" font-size="13">layer </text>
<text x="406.41" y="601" fill="#c7d2dd" font-size="13">⇒ </text>
<text x="428.98" y="601" fill="#c7d2dd" font-size="13">no </text>
<text x="453.16" y="601" fill="#c7d2dd" font-size="13">oversmoothing, </text>
<text x="574.06" y="601" fill="#c7d2dd" font-size="13">a </text>
<text x="590.18" y="601" fill="#c7d2dd" font-size="13">signed-map </text>
<text x="678.84" y="601" fill="#c7d2dd" font-size="13">edge </text>
<text x="719.14" y="601" fill="#c7d2dd" font-size="13">on </text>
<text x="743.32" y="601" fill="#c7d2dd" font-size="13">heterophilic</text>
<text x="40" y="622" fill="#c7d2dd" font-size="13">GRNs.</text>
</svg>