<text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Why the sign matters (GRN)</text>
<text x="56" y="301" fill="#9fb4cc" font-size="11">Across all three edges the signed total is 41% below the</text>
<text x="56" y="321" fill="#9fb4cc" font-size="11">unsigned total, so the correct repressed state reads as</text>
<text x="56" y="341" fill="#9fb4cc" font-size="11">coherent instead of broken.</text>
<text x="56" y="369.5" fill="#34d399" font-size="11.5" font-weight="700">total signed</text>
<text x="196" y="369.5" fill="#9fb4cc" font-size="11.5">0.410</text>
<text x="56" y="389.5" fill="#fb7185" font-size="11.5" font-weight="700">total unsigned</text>
<text x="196" y="389.5" fill="#9fb4cc" font-size="11.5">0.699</text>
