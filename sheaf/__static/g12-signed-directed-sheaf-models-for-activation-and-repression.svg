<text x="532" y="268" fill="#cfe0f0" font-size="14" font-weight="700">Takeaway</text>
<text x="502" y="301.5" fill="#a78bfa" font-size="11.5" font-weight="700">correct state</text>
<text x="642" y="301.5" fill="#9fb4cc" font-size="11.5">signed low (0.38)</text>
<text x="502" y="321.5" fill="#a78bfa" font-size="11.5" font-weight="700">wrong state</text>
<text x="642" y="321.5" fill="#9fb4cc" font-size="11.5">scalar leaks (0.03)</text>
