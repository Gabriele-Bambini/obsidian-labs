<text x="86" y="106" fill="#cfe0f0" font-size="14" font-weight="700">The 3-gene signed circuit</text>
<text x="56" y="139.5" fill="#4dd7ff" font-size="11.5" font-weight="700">e1</text>
<text x="196" y="139.5" fill="#9fb4cc" font-size="11.5">TF1 ⊣ GeneA  (−)</text>
