<text x="40" y="34" fill="#4dd7ff" font-size="12" font-weight="700" letter-spacing="2.5">FIGURE G12 · BLOCK G · SHEAF GNN FOR BIOLOGY</text>
<text x="40" y="62" fill="#e8eef6" font-size="24" font-weight="700">Repression flips the energy term to a sum</text>
