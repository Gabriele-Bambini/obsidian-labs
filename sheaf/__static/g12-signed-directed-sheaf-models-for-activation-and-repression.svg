<text x="502" y="159.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">= (−0.9·0.8 + 1.0·0.1)²</text>
<text x="502" y="187.5" fill="#34d399" font-size="11.5" font-weight="700">signed E₁</text>
