<text x="243.45" y="538" fill="#c7d2dd" font-size="13">biological </text>
<text x="332.11" y="538" fill="#c7d2dd" font-size="13">graphs </text>
<text x="388.53" y="538" fill="#c7d2dd" font-size="13">and </text>
<text x="420.77" y="538" fill="#c7d2dd" font-size="13">the </text>
