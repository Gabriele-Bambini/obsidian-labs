<text x="782" y="559" fill="#c7d2dd" font-size="13">3 </text>
<text x="798.12" y="559" fill="#c7d2dd" font-size="13">organisms</text>
<text x="40" y="580" fill="#c7d2dd" font-size="13">(~13.5K </text>
<text x="105.69" y="580" fill="#c7d2dd" font-size="13">test </text>
<text x="145.99" y="580" fill="#c7d2dd" font-size="13">nodes), </text>
<text x="210.47" y="580" fill="#c7d2dd" font-size="13">blocking </text>
<text x="283.01" y="580" fill="#c7d2dd" font-size="13">the </text>
<text x="315.25" y="580" fill="#c7d2dd" font-size="13">0.95-identity </text>
