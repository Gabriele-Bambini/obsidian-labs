<text x="64" y="275" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">c</text>
<text x="86" y="268" fill="#cfe0f0" font-size="14" font-weight="700">pos_weight rescues rare GO</text>
<text x="56" y="301" fill="#9fb4cc" font-size="11">Rare GO terms (2% positive) make plain BCE predict</text>
<text x="56" y="321" fill="#9fb4cc" font-size="11">all-negative (ROC ~0.5). pos_weight = (1-p)/p amplifies</text>
<text x="56" y="341" fill="#9fb4cc" font-size="11">each false negative up to x49, so rare terms become</text>
<text x="56" y="361" fill="#9fb4cc" font-size="11">learnable.</text>
<text x="56" y="389.5" fill="#fb7185" font-size="11.5" font-weight="700">plain BCE mean</text>
<text x="196" y="389.5" fill="#9fb4cc" font-size="11.5">0.68</text>
<text x="56" y="409.5" fill="#34d399" font-size="11.5" font-weight="700">pos_weight mean</text>
<text x="196" y="409.5" fill="#9fb4cc" font-size="11.5">0.86</text>
<rect x="56" y="435.53" width="12" height="28.47" rx="2" fill="#fb7185"/>
<text x="62" y="476" fill="#8a99ad" font-size="9" text-anchor="middle">plain</text>
<rect x="107" y="428" width="12" height="36" rx="2" fill="#34d399"/>
