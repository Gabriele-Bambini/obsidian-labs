<text x="642" y="187.5" fill="#9fb4cc" font-size="11.5">~105K</text>
<text x="502" y="207.5" fill="#fbbf24" font-size="11.5" font-weight="700">test nodes</text>
<text x="642" y="207.5" fill="#9fb4cc" font-size="11.5">~13.5K</text>
<rect x="40" y="244" width="430" height="248" rx="12" fill="#0a1120" stroke="rgba(150,170,200,.18)"/>
