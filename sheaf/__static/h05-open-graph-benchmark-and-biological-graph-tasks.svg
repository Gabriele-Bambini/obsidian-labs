<title id="t">Figure H05 — Principled splits and pos_weight make OGB an honest scale test</title>
<desc id="d">Four-panel captioned figure: Principled splits and pos_weight make OGB an honest scale test</desc>
<rect x="0" y="0" width="940" height="664" fill="#070b14"/>
