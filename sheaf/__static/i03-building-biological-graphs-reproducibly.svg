<title id="t">Figure I03 — A biological graph is a construction pipeline, not a fixed object</title>
<desc id="d">Four-panel captioned figure: A biological graph is a construction pipeline, not a fixed object</desc>
<rect x="0" y="0" width="940" height="664" fill="#070b14"/>
