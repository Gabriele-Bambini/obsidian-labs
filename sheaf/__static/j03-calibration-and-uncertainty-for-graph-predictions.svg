<text x="56" y="341" fill="#9fb4cc" font-size="11">understudied ones.</text>
<text x="56" y="369.5" fill="#cfe0f0" font-size="11.5" font-family="Cascadia Code, 'Cascadia Mono', Consolas, monospace">var̂ = (1/T)Σ_t (f_t − p̂)²</text>
