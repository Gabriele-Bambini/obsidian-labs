<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A01 Â· Biological graph & message passing</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";
  // ---------- the worked example, generalized: 1 TF regulates some genes; others are isolated ----------
  const sig=x=>1/(1+Math.exp(-x));
  const frac=x=>x-Math.floor(x);
  const NAME=["TF1","GeneA","GeneB","GeneC"];
  function model(n){
    const node=[];
    for(let i=0;i<n;i++){
      const isTF=i===0;
      const role = isTF?"tf":((i===3||i%4===0)?"isolated":"target");
      const x = i===0?0.92:i===1?0.45:i===2?0.31:i===3?0.88:(0.25+0.6*frac(i*0.37+0.11));
      const ev = role==="target"?(i===1?0.87:i===2?0.34:(0.3+0.6*frac(i*0.618+0.2))):0;
      node.push({name:i<4?NAME[i]:"G"+i,isTF,x,role,ev});
    }
    return node;
  }
  function layout(node){
    const pos=[], targets=[], iso=[];
    node.forEach((d,i)=>{if(d.role==="target")targets.push(i);else if(d.role==="isolated")iso.push(i);});
    pos[0]=[-2.6,0];
    targets.forEach((i,k)=>{const ang=-0.95+(targets.length>1?1.9*k/(targets.length-1):0.0);pos[i]=[-2.6+3.4*Math.cos(ang),3.4*Math.sin(ang)];});
    iso.forEach((i,k)=>{pos[i]=[2.2+0.9*(k%2),-2.3-1.0*Math.floor(k/2)];});
    return pos;
  }
  function propagate(node,edges,L,ws,wm){
    const n=node.length; let h=node.map(d=>d.x);
    const inc=Array.from({length:n},()=>[]); for(const e of edges)inc[e[1]].push([e[0],e[2]]);
    for(let t=0;t<L;t++){const nh=h.slice();
      for(let i=0;i<n;i++){let s=ws*h[i];for(const q of inc[i])s+=wm*q[1]*h[q[0]];nh[i]=sig(s);}
      h=nh;}
    return h;
  }
  let scene={};

  function build(api){
    const T=api.THREE, s=api.state, n=Math.round(s.genes), node=model(n), pos=layout(node);
    const edges=[]; node.forEach((d,i)=>{if(d.role==="target"&&d.ev>=s.thresh)edges.push([0,i,d.ev]);});
    const L=(s.mode==="message")?Math.round(s.layers):0;
    const h=propagate(node,edges,L,s.wself,s.wmsg);
    const gG=api.group("graph"), eG=api.group("edges"), lG=api.group("labels"), tG=api.group("table");
    const H=v=>0.25+v*1.7;
    const P=pos.map((p,i)=>[p[0],H(L?h[i]:node[i].x),p[1]]);
    if(s.mode==="table"){
      const step=0.62, x0=-5.6;
      const hd=api.bigLabel("feature matrix X (no relations)","#bcdcff",3.4); hd.position.set(x0+step,0.05,-n*step/2-0.9); tG.add(hd);
      for(let i=0;i<n;i++){
        const exprCol=api.ramp(node[i].x,"#10243f","#4dd7ff"), tfCol=node[i].isTF?api.ramp(1,"#10243f","#fbbf24"):new T.Color("#16233a");
        for(let c=0;c<2;c++){const col=c===0?exprCol:tfCol;
          const m=new T.Mesh(new T.BoxGeometry(0.52,0.12,0.52),new T.MeshStandardMaterial({color:col,roughness:0.6,emissive:col.clone().multiplyScalar(0.15)}));
          m.position.set(x0+c*step,0.06,i*step-n*step/2); tG.add(m);
          if(c===0){const nl=api.flatNum(node[i].x.toFixed(2),"#06101f",0.4);nl.position.set(x0,0.13,i*step-n*step/2);tG.add(nl);}}
        const lb=api.label(node[i].name,"#9fb4cc",0.5); lb.position.set(x0-0.75,0.1,i*step-n*step/2); tG.add(lb);
      }
    }
    if(s.mode!=="table"){
      for(const e of edges){const a=new T.Vector3(P[e[0]][0],P[e[0]][1],P[e[0]][2]),b=new T.Vector3(P[e[1]][0],P[e[1]][1],P[e[1]][2]);
        const dir=b.clone().sub(a),len=dir.length();
        eG.add(new T.ArrowHelper(dir.normalize(),a,len*0.9,e[2]>0.6?0x9fd0ff:0x4a6f8f,0.3,0.12+0.16*e[2]));}
    }
    const sel=(s.sel&&s.sel.i<n)?s.sel.i:-1;
    for(let i=0;i<n;i++){
      const d=node[i], isSel=i===sel;
      const col = d.isTF?new T.Color("#4dd7ff"):(d.role==="isolated"?new T.Color("#6b7a8d"):api.ramp(L?h[i]:d.x,"#3b6fd6","#fbbf24"));
      const rad = d.isTF?0.32:0.24;
      const mat=new T.MeshStandardMaterial({color:col,roughness:0.4,metalness:0.1,emissive:col.clone().multiplyScalar(isSel?0.8:0.28),emissiveIntensity:isSel?0.7:0.3});
      const m=new T.Mesh(new T.SphereGeometry(rad*(isSel?1.25:1),24,24),mat); m.position.set(P[i][0],P[i][1],P[i][2]); api.pick(m,{i}); gG.add(m);
      if(d.role==="isolated"){const ring=new T.Mesh(new T.TorusGeometry(rad+0.08,0.022,8,30),new T.MeshBasicMaterial({color:0xfb7185}));ring.position.copy(m.position);ring.rotation.x=Math.PI/2;gG.add(ring);}
      const lb=api.label(d.name,d.isTF?"#9fe0ff":(d.role==="isolated"?"#fda4b0":"#cfe0f0"),0.5); lb.position.set(P[i][0],P[i][1]+rad+0.26,P[i][2]); lG.add(lb);
    }
    const ttl=s.mode==="table"?"left: feature matrix Â· right: same nodes, no edges â†’ no messages":(s.mode==="message"?"message passing Â· háµ¢ = Ïƒ(W_selfÂ·xáµ¢ + Î£ W_msgÂ·eâ±¼áµ¢Â·hâ±¼)":"biological graph  G = (V, E, X, Z, u)");
    gG.add((sp=>(sp.position.set(0,2.7,-3.4),sp))(api.bigLabel(ttl,"#d4e4f4",6.8)));
    const isoCount=node.filter(d=>d.role==="isolated").length;
    scene={n,node,edges:edges.length,iso:isoCount,h,geneA:h[1],geneAx:node[1].x,L};
    let formula,insight,state,badge;
    if(s.mode==="structure"){badge="Graph G=(V,E,X,Z,u)";
      formula="height = expression (X) Â· arrow thickness = evidence (Z) Â· "+edges.length+" directed edges.";
      insight="A graph adds the relational hypothesis a feature matrix can't hold: directed TFâ†’gene edges with evidence. An isolated gene (rose ring) has no regulator â€” and the absence of an edge is itself a claim.";
      state=isoCount+" isolated gene"+(isoCount===1?"":"s")+": high expression but no incoming edge â†’ they receive no message.";}
    else if(s.mode==="message"){badge=L+" message-passing layer"+(L===1?"":"s");
      formula="W_self=<b>"+s.wself.toFixed(2)+"</b> Â· W_msg=<b>"+s.wmsg.toFixed(2)+"</b> Â· evidence-weighted mean.";
      insight="Each gene updates from its regulators only. GeneA rises as TF1's signal arrives; isolated genes drift on self-weight alone. Structure decides what information can move.";
      state=L===0?"Layer 0: raw expression. Press Propagate.":"GeneA: "+node[1].x.toFixed(2)+" â†’ "+h[1].toFixed(2)+" (got TF1's message); isolated genes unchanged by neighbours.";}
    else{badge="Feature matrix vs graph";
      formula="X = [expression, TF-indicator] per gene. The table has rows â€” but no edges.";
      insight="The count matrix tells you what each gene measures; the graph tells you which genes may communicate. The relational structure is the new information a GNN needs.";
      state="Same "+n+" nodes on both sides â€” only the graph carries the regulatory edges.";}
    return {badge,formula,insight,state,
      metrics:{nodes:n,edges:edges.length,isolated:isoCount,geneA:(L?h[1].toFixed(2):node[1].x.toFixed(2))},
      focus:{center:[s.mode==="table"?-1.4:0,0.7,0],radius:s.mode==="table"?15:13}};
  }

  MathLab.create({
    id:"a01", kind:"bio-graph",
    eyebrow:"Block A Â· Why biology needs GNNs", title:"A01 Â· Biological graph & message passing",
    subtitle:"Genes are nodes, regulation is directed edges with evidence. Compare a feature matrix to the graph, then pass messages: structure â€” not expression â€” decides what moves.",
    selectedLabel:"Selected gene", selectedHint:"Click a node â€” see its features and regulators.",
    modes:[{value:"structure",label:"Graph Â· G=(V,E,X,Z,u)"},{value:"message",label:"Message passing Â· háµ¢ update"},{value:"table",label:"Feature matrix vs graph"}],
    params:[
      {key:"genes",label:"genes",min:5,max:12,step:1,value:7},
      {key:"layers",label:"layers (hops)",min:0,max:6,step:1,value:1,modes:["message"]},
      {key:"wself",label:"W_self",min:0,max:1,step:0.05,value:0.4,fmt:v=>v.toFixed(2),modes:["message"]},
      {key:"wmsg",label:"W_msg",min:0,max:1,step:0.05,value:0.6,fmt:v=>v.toFixed(2),modes:["message"]},
      {key:"thresh",label:"evidence â‰¥",min:0,max:0.9,step:0.05,value:0,fmt:v=>v.toFixed(2),modes:["structure","message"]}
    ],
    metrics:[{key:"nodes",label:"Nodes |V|",accent:"cyan"},{key:"edges",label:"Edges |E|",accent:"violet"},
      {key:"isolated",label:"Isolated genes",accent:"rose"},{key:"geneA",label:"GeneA háµ¢",accent:"amber"}],
    layers:[{group:"edges",label:"Edges"},{group:"labels",label:"Labels"},{group:"table",label:"Matrix"}],
    primary:{label:"Propagate +1 layer",on:api=>{if(api.state.mode!=="message")api.setParam("layers",1);else api.setParam("layers",Math.min(6,Math.round(api.state.layers)+1));}},
    secondary:{label:"Reset layers",on:api=>{api.setParam("layers",0);}},
    defaultCam:{theta:-0.62,phi:0.66,r:12},
    hint:'<b>cyan</b>=transcription factor Â· gene colour = feature value (blueâ†’<span class="a">amber</span>) Â· <span class="r">rose ring</span>=isolated (no regulator) Â· arrow thickness = evidence.',
    onMode(api){const s=api.state; if(s.mode==="structure")api.setParam("layers",0); if(s.mode==="message"&&Math.round(s.layers)===0)api.setParam("layers",1);},
    onParam(api){api.frame([api.state.mode==="table"?-1.4:0,0.7,0],api.state.mode==="table"?15:13);},
    onSelect(api,d){const sc=scene;if(!sc||!sc.node||d.i>=sc.n){api.setSelected("Click a node.");return;}
      const nd=sc.node[d.i], regs=nd.role==="target"?"TF1":(nd.role==="isolated"?"none (isolated)":"â€”");
      api.setSelected(nd.name+" Â· "+(nd.isTF?"transcription factor":"gene")+" Â· expr "+nd.x.toFixed(2)+(nd.role!=="tf"?" Â· regulators: "+regs:"")+(sc.L?" Â· h="+sc.h[d.i].toFixed(2):""));},
    build,
    snapshot(s){const sc=scene;return {mode:s.mode,nodes:Math.round(s.genes),layers:Math.round(s.layers),edges:sc.edges,isolated:sc.iso,geneA:sc.geneA!=null?+sc.geneA.toFixed(3):null};}
  });
})();
</script>
</body>
</html>
