<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A04 · Degree, normalization & scale</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";
  const HUB_H=0.82, SPEC_H=0.60, SELF_H=0.46, SPEC_CONF=0.90;
  function compute(s){
    const k=Math.round(s.specCount), hubDeg=Math.round(s.hubDeg), self=s.selfloop===1?1:0;
    const dX=k+1, tdX=dX+self;
    function alpha(dj){const tdj=dj+self;
      if(s.mode==="raw")return 1;
      if(s.mode==="mean")return 1/tdX;
      return 1/Math.sqrt(tdj*tdX);}
    function conf(isHub){ if(s.mode!=="evidence")return 1; return isHub?s.hubConf:SPEC_CONF; }
    const neigh=[];
    const aHub=alpha(hubDeg)*conf(true);
    neigh.push({id:"HubTF",h:HUB_H,deg:hubDeg,a:aHub,hub:true,contrib:aHub*HUB_H});
    for(let i=0;i<k;i++){const a=alpha(2)*conf(false);neigh.push({id:"SpecTF"+(i+1),h:SPEC_H+0.04*i,deg:2,a:a,hub:false,contrib:a*(SPEC_H+0.04*i)});}
    let aSelf=0,selfC=0; if(self){aSelf=(s.mode==="raw"?1:s.mode==="mean"?1/tdX:1/Math.sqrt(tdX*tdX));selfC=aSelf*SELF_H;}
    const update=neigh.reduce((q,x)=>q+x.contrib,0)+selfC;
    const aSpec=neigh[1]?neigh[1].a:0;
    return {k,hubDeg,self,neigh,aSelf,selfC,update,aHub,aSpec,ratio:aHub>0?aSpec/aHub:0,dX:tdX};
  }
  function cyl(api,a,b,r,col,emi){const T=api.THREE,d=b.clone().sub(a),L=d.length();
    const m=new T.Mesh(new T.CylinderGeometry(r,r,L,10),new T.MeshStandardMaterial({color:col,roughness:0.4,emissive:col.clone().multiplyScalar(emi||0.3),emissiveIntensity:emi?0.6:0.3}));
    m.position.copy(a).add(b).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize());return m;}
  function bar(api,x,z,h,col,lbl){const T=api.THREE,g=new T.Group();
    const m=new T.Mesh(new T.BoxGeometry(0.26,Math.max(0.02,h),0.26),new T.MeshStandardMaterial({color:col,roughness:0.35,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.5}));
    m.position.set(x,h/2,z);g.add(m);if(lbl){const t=api.label(lbl,"#cfe0f0",0.4);t.position.set(x,h+0.3,z);g.add(t);}return g;}
  let scene={};
  function build(api){
    const T=api.THREE,s=api.state,M=compute(s);scene=M;
    const nG=api.group("nodes"),eG=api.group("edges"),bG=api.group("bars"),lG=api.group("labels"),sG=api.group("satellites");
    const X=new T.Vector3(0,0.2,0);
    const xm=new T.Mesh(new T.SphereGeometry(0.42,28,28),new T.MeshStandardMaterial({color:0xe7a13a,roughness:0.35,emissive:0x6a3d08,emissiveIntensity:0.5}));
    xm.position.copy(X);nG.add(xm);
    const xl=api.label("GeneX (target)","#fbd089",0.5);xl.position.set(0,0.95,0);lG.add(xl);
    const N=M.neigh.length, amax=Math.max.apply(null,M.neigh.map(n=>n.a).concat(0.001)), cmax=Math.max.apply(null,M.neigh.map(n=>n.contrib).concat(M.selfC,0.001));
    M.neigh.forEach((nd,i)=>{
      const hub=nd.hub, ang=hub?Math.PI:(-0.7+(i)/Math.max(1,N-1)*1.4);
      const rad=hub?3.4:3.0, px=Math.cos(ang)*rad, pz=Math.sin(ang)*rad, P=new T.Vector3(px,0.2,pz);
      const sz=hub?(0.3+0.22*Math.min(1,Math.log(nd.deg)/4)):0.22;
      const col=hub?new T.Color("#4dd7ff"):api.ramp(i/N,"#7c5cff","#a78bfa");
      const m=new T.Mesh(new T.SphereGeometry(sz,24,24),new T.MeshStandardMaterial({color:col,roughness:0.4,emissive:col.clone().multiplyScalar(0.3),emissiveIntensity:0.35}));
      m.position.copy(P);nG.add(m);
      const lb=api.label(nd.id+" · d="+nd.deg,hub?"#9fe0ff":"#c4b5fd",0.42);lb.position.set(px,0.2+sz+0.34,pz);lG.add(lb);
      const t=nd.a/amax, ecol=api.ramp(t,"#26405e","#ffd166");
      const e=cyl(api,P.clone(),X.clone(),0.03+0.1*t,ecol,1);api.pick(e,{edge:nd});eG.add(e);
      const acoef=api.flatNum("α="+nd.a.toFixed(3),"#0a1622",0.95);acoef.position.set(px/2,0.16,pz/2);bG.add(acoef);
      bG.add(bar(api,px,pz, nd.contrib/cmax*2.4, hub?new T.Color("#4dd7ff"):new T.Color("#a78bfa"), nd.contrib.toFixed(2)));
      if(hub){const sat=Math.min(nd.deg,46);for(let q=0;q<sat;q++){const a2=q/sat*Math.PI*2;
        const dp=new T.Vector3(px+Math.cos(a2)*(sz+0.55),0.2+Math.sin(a2)*0.35,pz+Math.sin(a2)*(sz+0.55));
        const dot=new T.Mesh(new T.SphereGeometry(0.06,8,8),new T.MeshBasicMaterial({color:0x2b5f86}));dot.position.copy(dp);sG.add(dot);
        sG.add(cyl(api,P.clone(),dp,0.012,new T.Color("#1e3a52"),0));}}
    });
    if(M.self){const sl=new T.Mesh(new T.TorusGeometry(0.6,0.04,10,28),new T.MeshStandardMaterial({color:0x9aa7b5,emissive:0x222a33,emissiveIntensity:0.4}));
      sl.position.set(0,0.9,0);sl.rotation.x=Math.PI/2;eG.add(sl);
      bG.add(bar(api,0.0,1.4,M.selfC/cmax*2.4,new T.Color("#9aa7b5"),"self "+M.selfC.toFixed(2)));}
    bG.add(bar(api,0,0,M.update/cmax*2.4+0.001,new T.Color("#34d399"),"Σ update "+M.update.toFixed(2)));
    const modeName={raw:"Raw sum",mean:"Mean (÷ d_target)",gcn:"Symmetric GCN  1/√(dⱼ·dᵢ)",evidence:"Evidence-weighted  w/√(dⱼ·dᵢ)"}[s.mode];
    let insight,state;
    if(s.mode==="raw"){insight="Raw sum ignores degree entirely — every edge enters at full strength. A hub TF with 40 targets sends GeneX the same coefficient as a specific 2-target regulator. Database coverage becomes signal: well-studied genes dominate by edge count alone.";
      state="α = 1 for every edge. Raising hub degree does NOTHING to its message — that insensitivity is the bias.";}
    else if(s.mode==="mean"){insight="Mean divides by the TARGET's degree (GeneX), so total incoming mass is fixed. But SOURCE degree is untouched — the hub's 40-target breadth still isn't penalised. Target-side scale control only.";
      state="Every edge shares α = 1/d_target = "+M.aHub.toFixed(3)+". Hub degree still irrelevant to its own message.";}
    else if(s.mode==="gcn"){insight="Symmetric GCN divides each edge by √(source·target degree). Now the hub's high degree shrinks its coefficient and the specific regulator out-votes the broad hub per edge. The structural correction for hub/coverage bias — but √ damps it, so it is partial.";
      state="Hub α="+M.aHub.toFixed(3)+" vs Spec α="+M.aSpec.toFixed(3)+" → the specific edge is "+M.ratio.toFixed(1)+"× the hub. Raise hub degree: hub bar shrinks.";}
    else {insight="Evidence-weighted multiplies the GCN coefficient by edge confidence. Low-confidence padding on the hub is down-weighted directly — the strongest correction, but it needs calibrated, comparable confidence across assay types.";
      state="Hub conf="+s.hubConf.toFixed(2)+" → hub α="+M.aHub.toFixed(3)+". Drop hub confidence to suppress padded edges.";}
    return {badge:modeName+" · hub d="+M.hubDeg,
      formula:"h'_X = Σ α_(j→X)·h_j "+(M.self?"+ self-loop":""),
      insight, state,
      metrics:{hubDeg:M.hubDeg,hubA:M.aHub.toFixed(3),ratio:M.ratio.toFixed(2)+"×",update:M.update.toFixed(2)},
      focus:{center:[0,0.6,0],radius:13}};
  }
  MathLab.create({
    id:"a04", kind:"degree-norm",
    eyebrow:"Block A · Degree, normalization & scale", title:"A04 · How much does each neighbor count?",
    subtitle:"One target gene, a broad hub TF and specific regulators. Switch normalization and watch each edge's coefficient α and its contribution to GeneX reshape — and who dominates.",
    selectedLabel:"Edge", selectedHint:"Click an edge to read its coefficient.",
    modes:[{value:"raw",label:"Raw sum"},{value:"mean",label:"Mean ÷ d_target"},{value:"gcn",label:"Symmetric GCN"},{value:"evidence",label:"Evidence-weighted"}],
    params:[
      {key:"hubDeg",label:"hub TF degree",min:4,max:50,step:2,value:40},
      {key:"specCount",label:"specific TFs",min:1,max:5,step:1,value:2},
      {key:"selfloop",label:"self-loop (A+I)",min:0,max:1,step:1,value:1,fmt:v=>v?"on":"off"},
      {key:"hubConf",label:"hub edge confidence",min:0.05,max:1,step:0.05,value:0.30,fmt:v=>v.toFixed(2),modes:["evidence"]}
    ],
    metrics:[{key:"hubDeg",label:"Hub degree",accent:"cyan"},{key:"hubA",label:"Hub α",accent:"amber"},
      {key:"ratio",label:"Spec : Hub α",accent:"violet"},{key:"update",label:"GeneX update",accent:"green"}],
    layers:[{group:"edges",label:"Edges (α)"},{group:"bars",label:"Contributions"},{group:"satellites",label:"Hub degree"},{group:"labels",label:"Labels"}],
    primary:{label:"Spike hub degree",on:api=>{api.setParam("hubDeg",api.state.hubDeg>=50?8:50);}},
    secondary:{label:"Cycle normalization",on:api=>{const o=["raw","mean","gcn","evidence"],st=document.getElementById('ml-mode');st.value=o[(o.indexOf(api.state.mode)+1)%4];st.dispatchEvent(new Event('change'));}},
    defaultCam:{theta:-0.6,phi:0.75,r:13},
    hint:'edge colour = coefficient α (<span class="a">bright = strong</span>) · bar height = contribution α·h to GeneX · <span class="g">green</span> = Σ update · faint dots = hub\'s other targets.',
    onParam(api){api.frame([0,0.6,0],13);},
    onSelect(api,d){if(d.edge)api.setSelected(d.edge.id+" → GeneX · α="+d.edge.a.toFixed(3)+" · contribution α·h = "+d.edge.contrib.toFixed(3)+(d.edge.hub?"  (broad hub, degree "+d.edge.deg+")":"  (specific regulator)"));},
    build,
    snapshot(s){const M=scene;return {mode:s.mode,hubDeg:Math.round(s.hubDeg),specCount:Math.round(s.specCount),hubA:+(M.aHub||0).toFixed(3),specA:+(M.aSpec||0).toFixed(3),ratio:+(M.ratio||0).toFixed(2),update:+(M.update||0).toFixed(2)};}
  });
})();
</script>
</body>
</html>
