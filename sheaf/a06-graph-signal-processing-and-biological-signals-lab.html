<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A06 · Graph signal processing — filter the spectrum</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";
  function jacobi(Ain,n){
    const A=Ain.map(r=>r.slice()), V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
    for(let sweep=0;sweep<60;sweep++){let off=0;for(let p=0;p<n;p++)for(let q=p+1;q<n;q++)off+=A[p][q]*A[p][q];if(off<1e-12)break;
      for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){if(Math.abs(A[p][q])<1e-14)continue;
        const th=(A[q][q]-A[p][p])/(2*A[p][q]),t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1)),c=1/Math.sqrt(t*t+1),sN=t*c;
        for(let i=0;i<n;i++){const aip=A[i][p],aiq=A[i][q];A[i][p]=c*aip-sN*aiq;A[i][q]=sN*aip+c*aiq;}
        for(let i=0;i<n;i++){const api=A[p][i],aqi=A[q][i];A[p][i]=c*api-sN*aqi;A[q][i]=sN*api+c*aqi;}
        for(let i=0;i<n;i++){const vip=V[i][p],viq=V[i][q];V[i][p]=c*vip-sN*viq;V[i][q]=sN*vip+c*viq;}}}
    const val=[],idx=[];for(let i=0;i<n;i++){val.push(A[i][i]);idx.push(i);}idx.sort((a,b)=>val[a]-val[b]);
    return {val:idx.map(i=>val[i]),vec:idx.map(i=>V.map(r=>r[i]))};
  }
  const NAMES=["A1","A2","A3","B1","B2","B3","A4","B4"];
  function graph(s){
    const sz=Math.round(s.moduleSize),n=2*sz,pos=[],comm=[];
    for(let m=0;m<2;m++)for(let i=0;i<sz;i++){const a=i/sz*Math.PI*2;pos.push([(m?3.0:-3.0)+Math.cos(a)*1.25,0,Math.sin(a)*1.25]);comm.push(m);}
    const A=Array.from({length:n},()=>new Float64Array(n)),add=(i,j,w)=>{A[i][j]=w;A[j][i]=w;};
    for(let m=0;m<2;m++){const off=m*sz;for(let i=0;i<sz;i++)for(let j=i+1;j<sz;j++)add(off+i,off+j,0.85);}
    add(sz-1,sz,0.2);
    const D=new Float64Array(n);for(let i=0;i<n;i++){let d=0;for(let j=0;j<n;j++)d+=A[i][j];D[i]=d;}
    const Ls=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>{const di=D[i]||1,dj=D[j]||1;return (i===j?1:0)-A[i][j]/Math.sqrt(di*dj);}));
    return {n,sz,pos,comm,A,D,Ls,bound:[sz-1,sz]};
  }
  function baseSignal(g,noise){const x=new Float64Array(g.n);
    for(let i=0;i<g.n;i++){x[i]=(g.comm[i]===0?0.87:0.20) + noise*0.5*((i%2)?1:-1);} return x;}
  function gain(type,lam,tau,tau2){
    if(type==="lowpass")return Math.exp(-tau*lam);
    if(type==="highpass")return 1-Math.exp(-tau*lam);
    return Math.max(0,Math.exp(-tau2*lam)-Math.exp(-tau*lam));
  }
  function edgeEnergy(g,x){let E=0;for(let i=0;i<g.n;i++)for(let j=i+1;j<g.n;j++)if(g.A[i][j]>0)E+=g.A[i][j]*(x[i]-x[j])*(x[i]-x[j]);return E;}
  function setPos(sp,x,y,z){sp.position.set(x,y,z);return sp;}
  let scene={};
  function build(api){
    const T=api.THREE,s=api.state,g=graph(s),n=g.n;
    const eg=jacobi(g.Ls.map(r=>Array.from(r)),n), U=eg.vec, lam=eg.val;
    const x=baseSignal(g,(s.mode==="bandpass"?0:s.noise));
    const xhat=lam.map((_,k)=>{let v=0;for(let i=0;i<n;i++)v+=U[k][i]*x[i];return v;});
    const gains=lam.map(l=>gain(s.mode,l,s.tau,s.tau2));
    const yhat=xhat.map((c,k)=>c*gains[k]);
    const y=new Float64Array(n);for(let i=0;i<n;i++){let v=0;for(let k=0;k<n;k++)v+=U[k][i]*yhat[k];y[i]=v;}
    const meanY=y.reduce((a,b)=>a+b,0)/n;
    const nG=api.group("nodes"),eG=api.group("edges"),gh=api.group("ghost"),spG=api.group("spectrum"),lG=api.group("labels");
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(g.A[i][j]>0){
      const a=new T.Vector3(g.pos[i][0],0.1+y[i]*2,g.pos[i][2]),b=new T.Vector3(g.pos[j][0],0.1+y[j]*2,g.pos[j][2]);
      const isB=(i===g.bound[0]&&j===g.bound[1]);const col=isB?new T.Color("#fbbf24"):new T.Color("#33506e");
      const d=b.clone().sub(a),L=d.length();const m=new T.Mesh(new T.CylinderGeometry(0.028,0.028,L,8),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(isB?0.6:0.25),emissiveIntensity:isB?0.6:0.3,roughness:0.45}));
      m.position.copy(a).add(b).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize());eG.add(m);}
    for(let i=0;i<n;i++){
      const dv=y[i]-meanY, isB=(i===g.bound[0]||i===g.bound[1]);
      const col=dv>=0?api.ramp(Math.min(1,Math.abs(dv)*2.4),"#1b2a3a","#4dd7ff"):api.ramp(Math.min(1,Math.abs(dv)*2.4),"#1b2a3a","#fb7185");
      const yv=0.1+y[i]*2;
      const m=new T.Mesh(new T.SphereGeometry(isB?0.26:0.2,22,22),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(isB?0.7:0.4),emissiveIntensity:isB?0.7:0.42,roughness:0.35}));
      m.position.set(g.pos[i][0],yv,g.pos[i][2]);api.pick(m,{node:{i,y:y[i],x:x[i],bound:isB}});nG.add(m);
      const stem=new T.Mesh(new T.CylinderGeometry(0.012,0.012,Math.max(0.02,yv),6),new T.MeshBasicMaterial({color:0x24384a}));stem.position.set(g.pos[i][0],yv/2,g.pos[i][2]);nG.add(stem);
      const gy=0.1+x[i]*2;const gm=new T.Mesh(new T.SphereGeometry(0.12,12,12),new T.MeshBasicMaterial({color:0x4a5a6e,transparent:true,opacity:0.32}));gm.position.set(g.pos[i][0],gy,g.pos[i][2]);gh.add(gm);
      const lb=api.label(NAMES[i],isB?"#fde68a":"#cfe0f0",isB?0.42:0.36);lb.position.set(g.pos[i][0],yv+0.32,g.pos[i][2]);lG.add(lb);
    }
    const x0=-3.6,x1=3.6,zb=-2.8,maxc=Math.max.apply(null,xhat.map(Math.abs).concat(0.2));
    for(let k=0;k<n;k++){const px=x0+(x1-x0)*(n>1?k/(n-1):0.5);
      const ho=Math.abs(xhat[k])/maxc*1.8, hf=Math.abs(yhat[k])/maxc*1.8;
      const go=new T.Mesh(new T.BoxGeometry(0.16,Math.max(0.01,ho),0.16),new T.MeshBasicMaterial({color:0x39485a,transparent:true,opacity:0.4}));go.position.set(px,ho/2,zb);spG.add(go);
      const col=api.ramp(n>1?k/(n-1):0,"#34d399","#fb7185");
      const fb=new T.Mesh(new T.BoxGeometry(0.2,Math.max(0.01,hf),0.2),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.55,roughness:0.4}));fb.position.set(px,hf/2,zb-0.25);api.pick(fb,{mode_k:{k,lam:lam[k],g:gains[k],xhat:xhat[k]}});spG.add(fb);
      if(n<=8){const ml=api.label("λ"+k+"="+lam[k].toFixed(2),"#7f93a8",0.3);ml.position.set(px,-0.18,zb+0.1);lG.add(ml);}
    }
    const pts=[];for(let k=0;k<n;k++){const px=x0+(x1-x0)*(n>1?k/(n-1):0.5);pts.push(new T.Vector3(px,0.06+gain(s.mode,lam[k],s.tau,s.tau2)*1.9,zb+0.35));}
    spG.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:0xffd166})));
    spG.add(setPos(api.bigLabel("graph spectrum  ŷ_k = g(λ_k)·x̂_k","#cfe0f0",4.2),0,0.06,zb-0.7));
    spG.add(setPos(api.bigLabel("low freq","#7fe7c0",1.4),x0,0.06,zb+0.7));
    spG.add(setPos(api.bigLabel("high freq","#fda4b0",1.4),x1,0.06,zb+0.7));
    const Ey=edgeEnergy(g,y), Ex=edgeEnergy(g,x);
    let kept=0,tot=0;for(let k=0;k<n;k++){kept+=(gains[k]*xhat[k])**2;tot+=xhat[k]*xhat[k];}
    const bMax=Math.max(Math.abs(y[g.bound[0]]-meanY),Math.abs(y[g.bound[1]]-meanY));
    scene={g,x,y,U,lam,xhat,yhat,gains};
    const fname={lowpass:"Low-pass  g=e^(−τλ)",highpass:"High-pass  g=1−e^(−τλ)",bandpass:"Band-pass  e^(−τ₂λ)−e^(−τλ)"}[s.mode];
    let insight,state;
    if(s.mode==="lowpass"){insight="Low-pass keeps the smooth, module-scale modes and kills high frequencies. Co-regulated genes converge to their module mean — denoising scRNA-seq dropout, or finding SCENIC modules. One GCN layer IS this filter (K=1 ChebNet); stacking layers = repeated low-pass = oversmoothing.";
      state="τ="+s.tau.toFixed(1)+". Bigger τ → flatter within each module. Watch the high-λ spectrum bars shrink and the ghost (original) noise vanish.";}
    else if(s.mode==="highpass"){insight="High-pass suppresses the smooth module background and amplifies sharp differences. The boundary genes (amber, on the weak cross-module edge) and any repressed / escaped genes pop out — exactly the mechanistically interesting cases a GCN would erase.";
      state="τ="+s.tau.toFixed(1)+". Boundary genes "+NAMES[g.bound[0]]+" & "+NAMES[g.bound[1]]+" carry the largest response. Low-λ bars are killed; high-λ bars survive.";}
    else {insight="Band-pass keeps an intermediate graph scale — neither module-wide nor single-edge. Useful for sub-module / intermediate regulatory clusters, but sensitive to the two width parameters.";
      state="τ="+s.tau.toFixed(1)+", τ₂="+s.tau2.toFixed(1)+". The yellow curve is the pass band; only modes under it survive.";}
    return {badge:fname,
      formula:"y = U·g(Λ)·Uᵀx   ·   GCN = K=1 ChebNet low-pass",
      insight,state,
      metrics:{rough:Ey.toFixed(3),roughX:Ex.toFixed(3),lowP:(tot>0?(kept/tot*100):0).toFixed(0)+"%",bnd:bMax.toFixed(2)},
      focus:{center:[0,0.7,-0.8],radius:13}};
  }
  MathLab.create({
    id:"a06", kind:"gsp",
    eyebrow:"Block A · Graph signal processing", title:"A06 · Filter a biological signal on the graph",
    subtitle:"A signal on a 2-module GRN, decomposed into graph-Fourier modes (back strip). Pick a filter and watch which genes survive — smooth modules or sharp boundaries.",
    selectedLabel:"Selected", selectedHint:"Click a node or a spectrum bar.",
    modes:[{value:"lowpass",label:"Low-pass (smooth / GCN)"},{value:"highpass",label:"High-pass (boundaries)"},{value:"bandpass",label:"Band-pass (mid-scale)"}],
    params:[
      {key:"moduleSize",label:"module size",min:2,max:4,step:1,value:3},
      {key:"tau",label:"filter strength τ",min:0.2,max:4,step:0.2,value:1.6,fmt:v=>v.toFixed(1)},
      {key:"noise",label:"dropout noise",min:0,max:0.6,step:0.1,value:0,fmt:v=>v.toFixed(1),modes:["lowpass","highpass"]},
      {key:"tau2",label:"band edge τ₂",min:0.1,max:3,step:0.1,value:0.4,fmt:v=>v.toFixed(1),modes:["bandpass"]}
    ],
    metrics:[{key:"rough",label:"Roughness E(y)",accent:"rose"},{key:"roughX",label:"E(x) before",accent:"violet"},
      {key:"lowP",label:"Energy kept",accent:"cyan"},{key:"bnd",label:"Boundary resp.",accent:"amber"}],
    layers:[{group:"edges",label:"Edges"},{group:"nodes",label:"Filtered y"},{group:"ghost",label:"Original x"},{group:"spectrum",label:"Spectrum"},{group:"labels",label:"Labels"}],
    primary:{label:"Toggle dropout noise",on:api=>{if(api.state.mode!=="bandpass")api.setParam("noise",api.state.noise>0?0:0.4);}},
    secondary:{label:"Cycle filter",on:api=>{const o=["lowpass","highpass","bandpass"],st=document.getElementById('ml-mode');st.value=o[(o.indexOf(api.state.mode)+1)%3];st.dispatchEvent(new Event('change'));}},
    defaultCam:{theta:-0.5,phi:0.66,r:13},
    hint:'node height = filtered value · <span style="color:#7f93a8">ghost</span> = original · <span class="a">amber</span> = boundary genes / edge · back strip = graph-Fourier spectrum, <span class="a">yellow</span> = filter g(λ).',
    onParam(api){api.frame([0,0.7,-0.8],13);},
    onSelect(api,d){if(d.node)api.setSelected("gene "+NAMES[d.node.i]+" · x="+d.node.x.toFixed(2)+" → y="+d.node.y.toFixed(2)+(d.node.bound?"  (boundary gene)":""));
      else if(d.mode_k)api.setSelected("mode k="+d.mode_k.k+" · λ="+d.mode_k.lam.toFixed(3)+" · gain g(λ)="+d.mode_k.g.toFixed(3)+" · coeff x̂="+d.mode_k.xhat.toFixed(3));},
    build,
    snapshot(s){const sc=scene;return {mode:s.mode,n:sc.g?sc.g.n:0,tau:s.tau,noise:s.noise,tau2:s.tau2,roughY:sc.y&&sc.g?+edgeEnergy(sc.g,sc.y).toFixed(3):0,roughX:sc.x&&sc.g?+edgeEnergy(sc.g,sc.x).toFixed(3):0};}
  });
})();
</script>
</body>
</html>
