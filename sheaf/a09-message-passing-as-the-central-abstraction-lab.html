<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A09 · Message passing — φ · AGG · ψ</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";
  // GRN: sources (no in-edges) → intermediate → GeneC. Cascade TF1→GeneA→GeneC.
  const NODES=[
    {id:"TF1",x:-4,z:-1.6,h0:0.90,src:true},
    {id:"Enhancer",x:-4,z:0.4,h0:0.68,src:true},
    {id:"TF2",x:-4,z:2.2,h0:0.70,src:true},
    {id:"GeneA",x:0,z:-1.8,h0:0.45},
    {id:"GeneD",x:0,z:0.2,h0:0.50},
    {id:"GeneB",x:0,z:2.0,h0:0.22},
    {id:"GeneC",x:4,z:0.2,h0:0.30}
  ];
  const IDX={}; NODES.forEach((n,i)=>IDX[n.id]=i);
  const EDGES=[
    ["TF1","GeneA",0.85,+1],["Enhancer","GeneA",0.55,+1],
    ["TF1","GeneD",0.60,+1],["TF2","GeneB",0.80,-1],
    ["GeneA","GeneC",0.70,+1],["GeneD","GeneC",0.30,+1],["GeneB","GeneC",0.40,+1]
  ].map(e=>({s:IDX[e[0]],t:IDX[e[1]],w:e[2],sign:e[3]}));
  function inEdges(i){return EDGES.filter(e=>e.t===i);}
  function aggregate(mode,msgs,confs){
    if(!msgs.length)return null;
    if(mode==="sum")return msgs.reduce((a,b)=>a+b,0);
    if(mode==="max")return Math.max.apply(null,msgs.map(Math.abs)).valueOf()* (msgs.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a));// signed max by magnitude
    if(mode==="attention"){const ex=confs.map(c=>Math.exp(2*c)),Z=ex.reduce((a,b)=>a+b,0);return msgs.reduce((acc,m,k)=>acc+m*ex[k]/Z,0);}
    return msgs.reduce((a,b)=>a+b,0)/msgs.length; // mean
  }
  function maxSigned(arr){let best=arr[0];for(const v of arr)if(Math.abs(v)>Math.abs(best))best=v;return best;}
  function propagate(mode,L,signed){
    let h=NODES.map(n=>n.h0);
    const history=[h.slice()];
    for(let t=0;t<L;t++){
      const nh=h.slice();
      for(let i=0;i<NODES.length;i++){
        if(NODES[i].src){nh[i]=h[i];continue;}
        const ie=inEdges(i); if(!ie.length){nh[i]=h[i];continue;}
        const msgs=ie.map(e=>{const sg=(signed&&e.sign<0)?-1:1; return e.w*h[e.s]*sg;});
        const confs=ie.map(e=>e.w);
        let a = mode==="max"?maxSigned(msgs):aggregate(mode,msgs,confs);
        nh[i]=Math.max(0,Math.min(1, 0.45*h[i]+0.55*a ));
      }
      h=nh; history.push(h.slice());
    }
    return {h,history};
  }
  // receptive field of TF1 (source 0): nodes reachable in <=L hops along directed edges
  function receptive(L){const reach=new Set([0]); let frontier=[0];
    for(let t=0;t<L;t++){const nf=[];for(const u of frontier)for(const e of EDGES)if(e.s===u&&!reach.has(e.t)){reach.add(e.t);nf.push(e.t);}frontier=nf;}
    return reach;
  }
  function variance(h){const m=h.reduce((a,b)=>a+b,0)/h.length;return h.reduce((a,b)=>a+(b-m)*(b-m),0)/h.length;}
  let scene={};
  function cyl(api,a,b,r,col,emi){const T=api.THREE,d=b.clone().sub(a),L=d.length();
    const m=new T.Mesh(new T.CylinderGeometry(r,r,L,9),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(emi),emissiveIntensity:emi>0.4?0.7:0.3,roughness:0.45}));
    m.position.copy(a).add(b).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize());return m;}
  function build(api){
    const T=api.THREE,s=api.state,mode=s.mode,L=Math.round(s.layers),signed=s.signed===1;
    const {h,history}=propagate(mode,L,signed);
    const reach=receptive(L), v=variance(h), v0=variance(NODES.map(n=>n.h0));
    const nG=api.group("nodes"),eG=api.group("edges"),mG=api.group("messages"),lG=api.group("labels");
    const pos=NODES.map(n=>new T.Vector3(n.x*0.9-0.5,0.1+h[IDX[n.id]]*2.2,n.z));
    // edges with arrows; message thickness ~ |w*h_src|
    EDGES.forEach(e=>{
      const a=pos[e.s].clone(), b=pos[e.t].clone();
      const rep=signed&&e.sign<0;
      const msg=Math.abs(e.w*h[e.s]); const col=rep?new T.Color("#fb7185"):api.ramp(Math.min(1,msg),"#2b4a63","#4dd7ff");
      eG.add(cyl(api,a,b,0.025+0.06*Math.min(1,msg),col,0.4));
      const dir=b.clone().sub(a).normalize();const head=new T.Mesh(new T.ConeGeometry(0.11,0.24,10),new T.MeshBasicMaterial({color:rep?0xfb7185:0x8fd4ff}));
      head.position.copy(b).addScaledVector(dir,-0.42);head.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);eG.add(head);
      if(rep){const mm=api.flatNum("−","#2a0a10",0.8);mm.position.copy(a.clone().add(b).multiplyScalar(0.5)).setY(0.14);mG.add(mm);}
    });
    // nodes
    NODES.forEach((n,i)=>{
      const yv=pos[i].y, inField=reach.has(i);
      const base=n.src?new T.Color("#e7a13a"):api.ramp(h[i],"#1b2a3a","#4dd7ff");
      const m=new T.Mesh(new T.SphereGeometry(n.src?0.28:0.24,24,24),new T.MeshStandardMaterial({color:base,emissive:base.clone().multiplyScalar(0.4),emissiveIntensity:0.45,roughness:0.35}));
      m.position.copy(pos[i]);api.pick(m,{node:{i,id:n.id,h:h[i]}});nG.add(m);
      nG.add(cyl(api,new T.Vector3(pos[i].x,0,pos[i].z),pos[i].clone(),0.012,new T.Color("#24384a"),0));
      if(inField){const ring=new T.Mesh(new T.TorusGeometry(n.src?0.4:0.36,0.03,8,28),new T.MeshBasicMaterial({color:0x34d399}));ring.position.copy(pos[i]);ring.rotation.x=Math.PI/2;nG.add(ring);}
      lG.add(setP(api.label(n.id+" "+h[i].toFixed(2),n.src?"#fbd089":"#cfe0f0",0.4),pos[i].x,yv+0.4,pos[i].z));
    });
    lG.add(setP(api.bigLabel("φ message →","#6f8aa6",1.4),-2.2,0.05,-2.6));
    lG.add(setP(api.bigLabel("AGG · ψ update","#6f8aa6",1.4),2.0,0.05,-2.6));
    scene={h,reach,v,mode};
    const aggName={mean:"mean (GCN)",sum:"sum (GIN)",max:"max (SAGE)",attention:"attention (GAT)"}[mode];
    const geneC=h[IDX["GeneC"]];
    let insight,state;
    if(L===0){insight="Layer 0 — initial node states, before any message passing. Sources (amber: TF1, Enhancer, TF2) hold their measured values; targets start at their own features. Press '+1 layer' to pass one round of messages.";
      state="Aggregator = "+aggName+". No messages sent yet. State variance "+v.toFixed(3)+".";}
    else {insight="Each round: every gene builds a message φ = w·h_source along each in-edge, combines them with "+aggName+" (AGG), then updates ψ = blend(own state, aggregate). After "+L+" round(s), TF1's influence has reached its "+L+"-hop neighbourhood (green rings). The cascade TF1→GeneA→GeneC lands at GeneC by round 2.";
      state="Receptive field of TF1 = "+(reach.size-1)+" downstream genes. GeneC = "+geneC.toFixed(2)+". Variance "+v.toFixed(3)+" (was "+v0.toFixed(3)+")"+(mode==="mean"&&L>=4?" — collapsing → oversmoothing":"")+".";}
    return {badge:aggName+" · layer "+L+(signed?" · signed":""),
      formula:"mᵢⱼ = φ(hᵢ,hⱼ,eⱼᵢ) · aᵢ = AGG{mⱼᵢ} · hᵢ' = ψ(hᵢ,aᵢ)",
      insight,state,
      metrics:{layer:"L="+L,field:(reach.size-1)+" genes",geneC:geneC.toFixed(2),variance:v.toFixed(3)},
      focus:{center:[0,0.9,0.2],radius:13}};
  }
  function setP(sp,x,y,z){sp.position.set(x,y,z);return sp;}
  MathLab.create({
    id:"a09", kind:"message-passing",
    eyebrow:"Block A · Message passing", title:"A09 · φ build · AGG combine · ψ update",
    subtitle:"Every GNN is this loop. Pass messages round by round and watch a regulator's influence cascade across hops — and the aggregator decide how neighbours combine.",
    selectedLabel:"Node", selectedHint:"Add layers; switch aggregator; click a gene.",
    modes:[{value:"mean",label:"mean (GCN)"},{value:"sum",label:"sum (GIN)"},{value:"max",label:"max (SAGE)"},{value:"attention",label:"attention (GAT)"}],
    params:[
      {key:"layers",label:"message-passing rounds L",min:0,max:6,step:1,value:1},
      {key:"signed",label:"signed messages (A07)",min:0,max:1,step:1,value:0,fmt:v=>v?"on":"off"}
    ],
    metrics:[{key:"layer",label:"Rounds",accent:"violet"},{key:"field",label:"TF1 receptive field",accent:"green"},
      {key:"geneC",label:"GeneC state",accent:"cyan"},{key:"variance",label:"State variance",accent:"amber"}],
    layers:[{group:"edges",label:"Messages (φ)"},{group:"nodes",label:"States"},{group:"messages",label:"Signs"},{group:"labels",label:"Labels"}],
    primary:{label:"+1 layer",on:api=>{api.setParam("layers",Math.min(6,Math.round(api.state.layers)+1));}},
    secondary:{label:"Reset to L=0",on:api=>{api.setParam("layers",0);}},
    defaultCam:{theta:-0.5,phi:0.64,r:13},
    hint:'amber = source regulators · node height/colour = current state · <span class="g">green ring</span> = inside TF1\'s receptive field · <span class="r">rose</span> = repressing message (signed). Watch variance collapse under mean at deep L = oversmoothing.',
    onParam(api){api.frame([0,0.9,0.2],13);},
    onSelect(api,d){if(d.node)api.setSelected(d.node.id+" · state h = "+d.node.h.toFixed(3)+(scene.reach&&scene.reach.has(d.node.i)?"  (in TF1's receptive field)":"  (not yet reached from TF1)"));},
    build,
    snapshot(s){const sc=scene;return {mode:s.mode,layers:Math.round(s.layers),signed:Math.round(s.signed),geneC:sc.h?+sc.h[6].toFixed(3):0,field:sc.reach?sc.reach.size-1:0,variance:sc.v!=null?+sc.v.toFixed(4):0};}
  });
})();
</script>
</body>
</html>
