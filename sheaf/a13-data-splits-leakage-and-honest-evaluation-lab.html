<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A13 · Leakage audit cockpit</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";
  // worked-example GRN: TF_A(0) Gene_B(1) Gene_C(2) TF_D(3); target = TF_D->Gene_C
  const NODES=[{id:"TF_A",x:-4,z:-1.6,h:1.0},{id:"Gene_B",x:-4,z:1.4,h:0.8},{id:"Gene_C",x:0,z:0,h:0.1},{id:"TF_D",x:4,z:0,h:1.1}];
  const MSG=[{s:0,t:1},{s:0,t:2}];                 // legitimate message edges
  const TARGET={s:3,t:2};                            // held-out edge to predict
  const HONEST=0.60;
  function model(s){
    const proto=s.mode; // random | disjoint | group
    const allowEdgeLeak = proto==="random";
    const allowPriorLeak = proto!=="group";
    const tIn = s.targetInMsg===1 && allowEdgeLeak;
    const rev = s.reverseEdge===1 && allowEdgeLeak;
    const prior = allowPriorLeak ? s.priorOverlap : 0;
    const easy = allowPriorLeak ? s.negEasy : 0;
    let apparent = HONEST + (tIn?0.18:0) + (rev?0.12:0) + prior*0.22 + easy*0.15;
    apparent=Math.max(HONEST,Math.min(0.99,apparent));
    // Gene_C embedding (mean agg) leaky includes TF_D
    const geneC_leak=(NODES[0].h+NODES[3].h+NODES[2].h)/3, geneC_honest=(NODES[0].h+NODES[2].h)/2;
    return {proto,tIn,rev,prior,easy,apparent,honest:HONEST,gap:apparent-HONEST,
      geneC: tIn?geneC_leak:geneC_honest, fnRisk:easy};
  }
  let scene={};
  function cyl(api,a,b,r,col,emi,dashed){const T=api.THREE,d=b.clone().sub(a),L=d.length();
    const m=new T.Mesh(new T.CylinderGeometry(r,r,L,9),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(emi),emissiveIntensity:emi>0.4?0.7:0.3,roughness:0.45,transparent:dashed,opacity:dashed?0.55:1}));
    m.position.copy(a).add(b).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize());return m;}
  function arrow(api,a,b,col){const T=api.THREE,dir=b.clone().sub(a).normalize();const h=new T.Mesh(new T.ConeGeometry(0.12,0.26,10),new T.MeshBasicMaterial({color:col}));h.position.copy(b).addScaledVector(dir,-0.36);h.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);return h;}
  function build(api){
    const T=api.THREE,s=api.state,M=model(s);scene=M;
    const nG=api.group("nodes"),eG=api.group("edges"),sG=api.group("score"),lG=api.group("labels");
    const P=NODES.map(n=>new T.Vector3(n.x,0.14,n.z));
    // legit message edges
    MSG.forEach(e=>{eG.add(cyl(api,P[e.s],P[e.t],0.04,new T.Color("#4dd7ff"),0.35));eG.add(arrow(api,P[e.s],P[e.t],0x8fd4ff));});
    // target edge (held out) — dashed grey normally; RED if leaking into message graph
    const tcol = M.tIn? new T.Color("#fb4d6d") : new T.Color("#5b6b80");
    eG.add(cyl(api,P[TARGET.s],P[TARGET.t],M.tIn?0.07:0.035,tcol,M.tIn?0.8:0.2,!M.tIn));eG.add(arrow(api,P[TARGET.s],P[TARGET.t],M.tIn?0xfb4d6d:0x5b6b80));
    lG.add(setP(api.label(M.tIn?"TARGET edge LEAKING in message graph":"TARGET edge (held out) — predict me","#fda4b0",0.46),0,0.9,1.0));
    // reverse leak
    if(M.rev){eG.add(cyl(api,P[TARGET.t],P[TARGET.s],0.06,new T.Color("#fb4d6d"),0.8));eG.add(arrow(api,P[TARGET.t],P[TARGET.s],0xfb4d6d));
      lG.add(setP(api.label("reverse edge leak","#fda4b0",0.4),2,0.6,-1.0));}
    // prior DB node feeding the gold (red if overlapping)
    if(M.prior>0){const pp=new T.Vector3(0,0.14,3.0);const pc=api.ramp(M.prior,"#5b6b80","#fb4d6d");
      const pm=new T.Mesh(new T.SphereGeometry(0.3,18,18),new T.MeshStandardMaterial({color:pc,emissive:pc.clone().multiplyScalar(0.6),emissiveIntensity:0.6}));pm.position.copy(pp);nG.add(pm);
      eG.add(cyl(api,pp,P[2],0.03+0.05*M.prior,pc,0.7,false));
      lG.add(setP(api.label("prior DB = answer key ("+(M.prior*100).toFixed(0)+"% overlap)","#fda4b0",0.4),0,0.5,3.0));}
    // nodes
    NODES.forEach((n,i)=>{const isC=i===2,isTF=n.id.startsWith("TF");
      const col=isC?new T.Color("#e7a13a"):(isTF?new T.Color("#4dd7ff"):api.ramp(n.h,"#26405e","#7c9fce"));
      const m=new T.Mesh(new T.SphereGeometry(0.3,22,22),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.4),emissiveIntensity:0.45,roughness:0.35}));
      m.position.copy(P[i]);nG.add(m);
      lG.add(setP(api.label(n.id,isC?"#fbd089":"#cfe0f0",0.44),P[i].x,0.62,P[i].z));});
    // score bars (apparent vs honest)
    function bar(x,val,col,lbl,sub){const h=0.1+val*4.0;
      const m=new T.Mesh(new T.CylinderGeometry(0.34,0.34,h,22),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.55,roughness:0.4}));
      m.position.set(x,h/2,-3.2);sG.add(m);
      sG.add(setP(api.bigLabel(lbl,col.getStyle(),2.0),x,h+0.5,-3.2));
      sG.add(setP(api.bigLabel(val.toFixed(2),"#e8eef6",2.4),x,h+0.16,-3.2));
      sG.add(setP(api.label(sub,"#8a99ad",0.36),x,0.06,-3.2));}
    bar(-1.4,M.apparent,new T.Color(M.gap>0.05?"#fb7185":"#34d399"),"apparent","reported AUC");
    bar(1.4,M.honest,new T.Color("#34d399"),"honest","true skill");
    const modeName={random:"Random split (porous)",disjoint:"Edge-disjoint split",group:"Group / temporal split"}[M.proto];
    let insight,state;
    if(M.proto==="random"){insight="A random split lets exam evidence leak back. Each red path is held-out biology touching training: the target edge sits in the message graph, its reverse survives, the prior database doubles as the answer key, easy negatives pad the score. Apparent AUC climbs while true skill stays "+HONEST.toFixed(2)+".";
      state="Leakage gap = "+M.gap.toFixed(2)+". Gene_C embedding "+(M.tIn?"= mean(TF_A,TF_D,Gene_C) = "+M.geneC.toFixed(3)+" (used the answer!)":"= mean(TF_A,Gene_C) = "+M.geneC.toFixed(3)+" (honest)")+".";}
    else if(M.proto==="disjoint"){insight="Edge-disjoint split removes the target edge (and its reverse) from the message-passing graph — E_msg ∩ E_test = ∅. The embedding can no longer use the answer it predicts. Edge-level leaks vanish; prior/negative leaks may remain.";
      state="Target & reverse leaks forced off. Gap now "+M.gap.toFixed(2)+(M.prior>0||M.easy>0?" — still inflated by prior overlap / easy negatives.":" — clean on the edge axis.");}
    else {insight="Group / temporal split is strictest: separate by patient, cell line, gene family, or time, and forbid the prior database from being the gold standard. All shortcut paths close — apparent AUC falls to the honest skill. This is the number a deployment claim should rest on.";
      state="Every leak path closed → apparent = honest = "+M.honest.toFixed(2)+". A strict split makes a simple baseline look worse but tells the truth.";}
    return {badge:modeName+" · gap "+M.gap.toFixed(2),
      formula:"E_msg ∩ E_test = ∅ · fit transforms on train only · test once",
      insight,state,
      metrics:{apparent:M.apparent.toFixed(2),honest:M.honest.toFixed(2),gap:M.gap.toFixed(2),fn:(M.fnRisk*100).toFixed(0)+"%"},
      focus:{center:[0,0.7,0],radius:13}};
  }
  function setP(sp,x,y,z){sp.position.set(x,y,z);return sp;}
  MathLab.create({
    id:"a13", kind:"leakage-audit",
    eyebrow:"Block A · Data splits, leakage & honest evaluation", title:"A13 · The leakage audit cockpit",
    subtitle:"Predict the held-out edge TF_D→Gene_C. Each leak lets exam evidence touch training and inflates the reported score above the model's true skill. Tighten the split to close the gap.",
    selectedLabel:"Audit", selectedHint:"Toggle leaks; tighten the split protocol.",
    modes:[{value:"random",label:"Random split (porous)"},{value:"disjoint",label:"Edge-disjoint split"},{value:"group",label:"Group / temporal split"}],
    params:[
      {key:"targetInMsg",label:"target edge in message graph",min:0,max:1,step:1,value:1,fmt:v=>v?"leaking":"removed",modes:["random"]},
      {key:"reverseEdge",label:"reverse edge remains",min:0,max:1,step:1,value:0,fmt:v=>v?"yes":"no",modes:["random"]},
      {key:"priorOverlap",label:"prior = answer-key overlap",min:0,max:1,step:0.1,value:0.4,fmt:v=>v.toFixed(1),modes:["random","disjoint"]},
      {key:"negEasy",label:"easy negatives",min:0,max:1,step:0.1,value:0.3,fmt:v=>v.toFixed(1),modes:["random","disjoint"]}
    ],
    metrics:[{key:"apparent",label:"Apparent AUC",accent:"rose"},{key:"honest",label:"Honest AUC",accent:"green"},
      {key:"gap",label:"Leakage gap",accent:"amber"},{key:"fn",label:"False-neg risk",accent:"violet"}],
    layers:[{group:"edges",label:"Edges / leaks"},{group:"nodes",label:"Genes"},{group:"score",label:"Scores"},{group:"labels",label:"Labels"}],
    primary:{label:"Tighten split",on:api=>{const o=["random","disjoint","group"],st=document.getElementById('ml-mode');st.value=o[Math.min(2,o.indexOf(api.state.mode)+1)];st.dispatchEvent(new Event('change'));}},
    secondary:{label:"Toggle target-edge leak",on:api=>{if(api.state.mode==="random")api.setParam("targetInMsg",api.state.targetInMsg?0:1);}},
    defaultCam:{theta:-0.5,phi:0.66,r:13},
    hint:'<span class="r">red path</span> = held-out biology touching training · <span class="a">amber</span> Gene_C is the target · left bar = reported AUC, right bar = true skill. The gap is the leak.',
    onParam(api){api.frame([0,0.7,0],13);},
    onSelect(api,d){},
    build,
    snapshot(s){const M=scene;return {mode:s.mode,targetInMsg:Math.round(s.targetInMsg),reverseEdge:Math.round(s.reverseEdge),priorOverlap:s.priorOverlap,negEasy:s.negEasy,apparent:M.apparent!=null?+M.apparent.toFixed(3):0,honest:HONEST,gap:M.gap!=null?+M.gap.toFixed(3):0,geneC:M.geneC!=null?+M.geneC.toFixed(3):0};}
  });
})();
</script>
</body>
</html>
