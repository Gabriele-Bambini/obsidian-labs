<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A14 · Metrics cockpit</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";
  const N=36;
  const prand=i=>{const x=Math.sin(i*127.1+31.7)*43758.5453;return x-Math.floor(x);};
  function dataset(prev,sep){
    const P=Math.max(1,Math.round(prev*N));
    const prop=[]; for(let i=0;i<N;i++)prop.push({i,k:prand(i)});
    prop.sort((a,b)=>b.k-a.k); const posSet=new Set(prop.slice(0,P).map(o=>o.i));
    const arr=[];
    for(let i=0;i<N;i++){const pos=posSet.has(i),r2=prand(i+100);
      let sc=pos?(0.5+sep*0.45+0.12*(r2-0.5)):(0.5-sep*0.42+0.12*(r2-0.5));
      sc=Math.max(0.02,Math.min(0.98,sc)); arr.push({i,pos,score:sc});}
    arr.sort((a,b)=>b.score-a.score);
    return {arr,P,Nneg:N-P};
  }
  function confusion(arr,t){let TP=0,FP=0,FN=0,TN=0;
    arr.forEach(c=>{const pred=c.score>=t; if(c.pos&&pred)TP++;else if(!c.pos&&pred)FP++;else if(c.pos&&!pred)FN++;else TN++;});
    return {TP,FP,FN,TN};}
  function auroc(arr,P,Nneg){if(!P||!Nneg)return 0;let s=0;
    arr.forEach(a=>{if(a.pos)arr.forEach(b=>{if(!b.pos){if(a.score>b.score)s+=1;else if(a.score===b.score)s+=0.5;}});});
    return s/(P*Nneg);}
  function ap(arr,P){if(!P)return 0;let tp=0,sum=0;
    for(let k=0;k<arr.length;k++){if(arr[k].pos){tp++;sum+=tp/(k+1);}}
    return sum/P;}
  function precAtK(arr,K){let tp=0;for(let k=0;k<Math.min(K,arr.length);k++)if(arr[k].pos)tp++;return tp/K;}
  let scene={};
  function build(api){
    const T=api.THREE,s=api.state,prev=s.prevalence,sep=s.separation,t=s.threshold,K=Math.round(s.topK);
    const D=dataset(prev,sep), arr=D.arr, cm=confusion(arr,t);
    const prec=cm.TP/(cm.TP+cm.FP||1), rec=cm.TP/(cm.TP+cm.FN||1), f1=(prec+rec)?2*prec*rec/(prec+rec):0;
    const acc=(cm.TP+cm.TN)/N, roc=auroc(arr,D.P,D.Nneg), aupr=ap(arr,D.P), pK=precAtK(arr,K);
    const bG=api.group("bars"),thG=api.group("thr"),cmG=api.group("conf"),lG=api.group("labels");
    const x0=-5.2, dx=10.4/(N-1), scale=3.4;
    arr.forEach((c,k)=>{const h=0.04+c.score*scale, px=x0+k*dx, pred=c.score>=t;
      const within = k<K;
      const col=c.pos?new T.Color("#34d399"):new T.Color("#54667c");
      const m=new T.Mesh(new T.BoxGeometry(0.2,h,0.2),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(pred?0.7:0.18),emissiveIntensity:pred?0.65:0.2,roughness:0.4}));
      m.position.set(px,h/2,0);api.pick(m,{cand:{rank:k+1,pos:c.pos,score:c.score,pred}});bG.add(m);
      if(within){const r=new T.Mesh(new T.BoxGeometry(0.24,0.03,0.24),new T.MeshBasicMaterial({color:0xfbbf24}));r.position.set(px,0.0,0.18);bG.add(r);}
    });
    // threshold plane
    const tp=new T.Mesh(new T.PlaneGeometry(11.2,0.6),new T.MeshBasicMaterial({color:0xfb7185,transparent:true,opacity:0.32,side:T.DoubleSide}));
    tp.rotation.x=-Math.PI/2; tp.position.set(0,0.04+t*scale,0.0); thG.add(tp);
    lG.add(setP(api.bigLabel("threshold "+t.toFixed(2),"#fda4b0",1.6),5.9,0.04+t*scale,0));
    lG.add(setP(api.bigLabel("top "+K+" (validation budget)","#fde68a",1.5),x0+K*dx*0.5-0.2,0.05,0.55));
    lG.add(setP(api.bigLabel("score","#7f93a8",1.4),-5.9,scale*0.5,0));
    // confusion matrix tiles behind
    function tile(x,val,col,lbl){const h=0.05+val/N*2.6;const m=new T.Mesh(new T.BoxGeometry(0.7,h,0.7),new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));m.position.set(x,h/2,-2.6);cmG.add(m);
      cmG.add(setP(api.bigLabel(""+val,"#e8eef6",1.8),x,h+0.3,-2.6));cmG.add(setP(api.label(lbl,col.getStyle(),0.36),x,0.02,-2.6));}
    tile(-2.4,cm.TP,new T.Color("#34d399"),"TP"); tile(-0.8,cm.FP,new T.Color("#fb7185"),"FP");
    tile(0.8,cm.FN,new T.Color("#fbbf24"),"FN"); tile(2.4,cm.TN,new T.Color("#54667c"),"TN");
    scene={prev,P:D.P,acc,prec,rec,f1,roc,aupr,pK,K};
    const modeName={imbalance:"Node labels — the accuracy trap",ranking:"Edge ranking — AUROC vs AUPRC",discovery:"Discovery — top-K validation"}[s.mode];
    let insight,state;
    if(s.mode==="imbalance"){insight="Only "+D.P+" of "+N+" candidates are real ("+(prev*100).toFixed(0)+"%). Push the threshold up to 'predict almost nothing' and accuracy stays high while recall and AUPRC crater — accuracy is dominated by the easy true-negatives. Never read accuracy before class balance.";
      state="accuracy "+acc.toFixed(2)+" but recall "+rec.toFixed(2)+", AUPRC "+aupr.toFixed(2)+". A 'predict all negative' model scores acc="+((N-D.P)/N).toFixed(2)+", recall 0.";}
    else if(s.mode==="ranking"){insight="AUROC asks 'do positives outrank negatives?' — easy when most negatives are obvious. AUPRC asks 'are predicted positives real?' and its random baseline is the prevalence ("+prev.toFixed(2)+"). With rare positives, AUROC can look strong while AUPRC is modest. Report both, plus the density baseline.";
      state="AUROC "+roc.toFixed(2)+" vs AUPRC "+aupr.toFixed(2)+" (random AUPRC ≈ "+prev.toFixed(2)+"). Lower 'skill' to watch AUROC stay higher than AUPRC.";}
    else {insight="Discovery has a budget: you can validate only the top K candidates. precision@K asks how many of the first K are real — that is what the wet lab feels. A model with modest global AUPRC but excellent top-K precision can be the more useful one.";
      state="precision@"+K+" = "+pK.toFixed(2)+" vs prevalence "+prev.toFixed(2)+" → "+(pK/Math.max(0.001,prev)).toFixed(1)+"× enrichment. Amber ticks mark the top-K validation list.";}
    return {badge:modeName+" · "+D.P+"/"+N+" positive",
      formula:"precision=TP/(TP+FP) · recall=TP/(TP+FN) · AUPRC baseline = prevalence",
      insight,state,
      metrics:{acc:acc.toFixed(2),recall:rec.toFixed(2),aupr:aupr.toFixed(2),pk:pK.toFixed(2)},
      focus:{center:[0,1.3,-0.6],radius:13}};
  }
  function setP(sp,x,y,z){sp.position.set(x,y,z);return sp;}
  MathLab.create({
    id:"a14", kind:"metrics-cockpit",
    eyebrow:"Block A · Metrics for node, edge, graph & biological tasks", title:"A14 · The metric cockpit",
    subtitle:"Ranked candidate edges, green = real. Move the threshold, the prevalence, the model skill and the top-K budget, and watch the metrics disagree — because each grades a different mistake.",
    selectedLabel:"Candidate", selectedHint:"Adjust threshold / prevalence / skill / top-K.",
    modes:[{value:"imbalance",label:"Node labels (accuracy trap)"},{value:"ranking",label:"Edge ranking (AUROC vs AUPRC)"},{value:"discovery",label:"Discovery (top-K)"}],
    params:[
      {key:"prevalence",label:"positive prevalence",min:0.05,max:0.5,step:0.05,value:0.15,fmt:v=>v.toFixed(2)},
      {key:"separation",label:"model skill (separation)",min:0,max:1,step:0.05,value:0.6,fmt:v=>v.toFixed(2)},
      {key:"threshold",label:"decision threshold",min:0,max:1,step:0.05,value:0.5,fmt:v=>v.toFixed(2),modes:["imbalance","ranking"]},
      {key:"topK",label:"validation budget K",min:3,max:20,step:1,value:8,modes:["discovery"]}
    ],
    metrics:[{key:"acc",label:"Accuracy",accent:"violet"},{key:"recall",label:"Recall",accent:"cyan"},
      {key:"aupr",label:"AUPRC",accent:"green"},{key:"pk",label:"Precision@K",accent:"amber"}],
    layers:[{group:"bars",label:"Candidates"},{group:"thr",label:"Threshold"},{group:"conf",label:"Confusion"},{group:"labels",label:"Labels"}],
    primary:{label:"Predict all negative",on:api=>{if(api.state.mode!=="discovery")api.setParam("threshold",1.0);}},
    secondary:{label:"Cycle task",on:api=>{const o=["imbalance","ranking","discovery"],st=document.getElementById('ml-mode');st.value=o[(o.indexOf(api.state.mode)+1)%3];st.dispatchEvent(new Event('change'));}},
    defaultCam:{theta:-0.5,phi:0.7,r:13},
    hint:'<span class="g">green</span> = real edge · slate = non-edge · bright = predicted positive (above threshold) · <span class="r">rose plane</span> = threshold · <span class="a">amber ticks</span> = top-K list. Confusion tiles: TP·FP·FN·TN.',
    onParam(api){api.frame([0,1.3,-0.6],13);},
    onSelect(api,d){if(d.cand)api.setSelected("rank #"+d.cand.rank+" · "+(d.cand.pos?"REAL edge":"non-edge")+" · score "+d.cand.score.toFixed(2)+" · predicted "+(d.cand.pred?"positive":"negative"));},
    build,
    snapshot(s){const sc=scene;return {mode:s.mode,prevalence:s.prevalence,separation:s.separation,threshold:s.threshold,topK:Math.round(s.topK),positives:sc.P,accuracy:sc.acc!=null?+sc.acc.toFixed(3):0,recall:sc.rec!=null?+sc.rec.toFixed(3):0,auroc:sc.roc!=null?+sc.roc.toFixed(3):0,auprc:sc.aupr!=null?+sc.aupr.toFixed(3):0,precAtK:sc.pK!=null?+sc.pK.toFixed(3):0};}
  });
})();
</script>
</body>
</html>
