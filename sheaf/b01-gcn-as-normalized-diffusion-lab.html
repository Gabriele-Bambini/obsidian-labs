<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B01 · GCN as normalized diffusion</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  /* ── deterministic pseudo-random (no Math.random / Date.now) ──────── */
  function frac(x){ return x - Math.floor(x); }
  // unused but available for future deterministic jitter

  /* ─────────────────────────────────────────────────────────────────────
   * GRAPH CONSTRUCTION
   * Default 4 nodes [T, G1, G2, H] in diamond layout.
   * Extra nodes k = 4..7 attach to H (hub) to let hub degree grow.
   * ─────────────────────────────────────────────────────────────────────*/
  function buildGraph(n){
    /* positions (2D xz plane) */
    const corePos = [
      [ 0,   2.8],   // 0 = T  (transcription factor, top)
      [-2.4,  0  ],  // 1 = G1 (target gene, left)
      [ 2.4,  0  ],  // 2 = G2 (target gene, right)
      [ 0,  -2.8],   // 3 = H  (hub gene, bottom)
    ];
    const labels = ["T","G1","G2","H"];
    const pos    = corePos.slice();

    for(let k = 4; k < n; k++){
      const a = (k - 4) / Math.max(1, n - 4) * Math.PI * 1.6 + Math.PI * 0.85;
      pos.push([Math.cos(a) * 3.6, -2.8 + Math.sin(a) * 2.0]);
      labels.push("X" + (k - 3));
    }

    /* base edges: the 4-cycle (T-G1, T-G2, G1-H, G2-H) */
    const edges = [[0,1],[0,2],[1,3],[2,3]];
    /* extra nodes always connect to H */
    for(let k = 4; k < n; k++) edges.push([3, k]);

    /* adjacency list (undirected) */
    const adj = Array.from({length: n}, () => []);
    edges.forEach(([a,b]) => { adj[a].push(b); adj[b].push(a); });

    return {n, labels, edges, adj, pos};
  }

  /* ─────────────────────────────────────────────────────────────────────
   * DEGREE with / without self-loops (Ã = A + I)
   * ─────────────────────────────────────────────────────────────────────*/
  function computeDegrees(adj, n, selfLoops){
    const d = new Float64Array(n);
    for(let i = 0; i < n; i++) d[i] = adj[i].length + (selfLoops ? 1 : 0);
    return d;
  }

  /* ─────────────────────────────────────────────────────────────────────
   * ONE GCN PROPAGATION STEP
   *   normalize=true  : h_i' = Σ_{j∈Ñ(i)} (1/√(d̃_i·d̃_j)) h_j
   *   normalize=false : h_i' = Σ_{j∈Ñ(i)} h_j   (raw sum)
   * where Ñ(i) = N(i) ∪ {i} when selfLoops=true, else N(i).
   * ─────────────────────────────────────────────────────────────────────*/
  function gcnStep(h, adj, deg, n, selfLoops, normalize){
    const out = new Float64Array(n);
    for(let i = 0; i < n; i++){
      /* self contribution */
      if(selfLoops){
        const sc = normalize ? 1.0 / deg[i] : 1.0;   // j==i: 1/√(d̃_i·d̃_i)=1/d̃_i
        out[i] += sc * h[i];
      }
      /* neighbor contributions */
      adj[i].forEach(j => {
        const c = normalize ? 1.0 / Math.sqrt(deg[i] * deg[j]) : 1.0;
        out[i] += c * h[j];
      });
    }
    return out;
  }

  /* ─────────────────────────────────────────────────────────────────────
   * APPLY L LAYERS
   * initAllOnes: when true, start from h=[1,1,…,1] (used in raw-vs-norm
   *              mode so hub-domination contrast is visible at layer 1).
   * ─────────────────────────────────────────────────────────────────────*/
  function propagate(g, L, selfLoops, normalize, source, initAllOnes){
    const deg = computeDegrees(g.adj, g.n, selfLoops);
    let h = new Float64Array(g.n);
    if(initAllOnes){
      for(let i = 0; i < g.n; i++) h[i] = 1.0;
    } else {
      h[source] = 1.0;
    }
    for(let l = 0; l < L; l++){
      h = gcnStep(h, g.adj, deg, g.n, selfLoops, normalize);
    }
    return {h, deg};
  }

  /* ─────────────────────────────────────────────────────────────────────
   * STATISTICS
   * ─────────────────────────────────────────────────────────────────────*/
  function nodeVariance(h){
    const n = h.length;
    let sum = 0; for(let i = 0; i < n; i++) sum += h[i];
    const mean = sum / n;
    let v = 0; for(let i = 0; i < n; i++) v += (h[i]-mean)*(h[i]-mean);
    return v / n;
  }

  /* ─────────────────────────────────────────────────────────────────────
   * SCENE STATE (shared across snapshot)
   * ─────────────────────────────────────────────────────────────────────*/
  let scene = {v:0, hubVal:0, targetVal:0, maxCoef:0, L:0};

  /* ─────────────────────────────────────────────────────────────────────
   * HELPER: stem bar below a sphere
   * ─────────────────────────────────────────────────────────────────────*/
  function stem(api, x, z, yTop){
    const T = api.THREE;
    const h = Math.max(0.02, yTop);
    const m = new T.Mesh(
      new T.CylinderGeometry(0.012, 0.012, h, 6),
      new T.MeshBasicMaterial({color: 0x24384a})
    );
    m.position.set(x, h / 2, z);
    return m;
  }

  function setP(sp, x, y, z){ sp.position.set(x, y, z); return sp; }

  /* ─────────────────────────────────────────────────────────────────────
   * BUILD — called by engine on every state change
   * ─────────────────────────────────────────────────────────────────────*/
  function build(api){
    const T = api.THREE;
    const s = api.state;
    const mode      = s.mode;
    const nNodes    = Math.round(s.nodes);
    const L         = Math.round(s.layers);
    const selfLoops = s.selfLoops  >= 0.5;
    const normalize = s.normalize  >= 0.5;
    const source    = Math.min(Math.round(s.signalSource), nNodes - 1);

    const g          = buildGraph(nNodes);
    const initAllOnes = (mode === "raw-vs-norm");
    const {h, deg}   = propagate(g, L, selfLoops, normalize, source, initAllOnes);
    const v          = nodeVariance(h);
    const hubVal     = nNodes >= 4 ? h[3] : 0;
    const targetVal  = h[source];

    /* max edge coefficient */
    let maxCoef = 0;
    g.edges.forEach(([a,b]) => {
      const c = normalize ? 1.0 / Math.sqrt(deg[a] * deg[b]) : 1.0;
      if(c > maxCoef) maxCoef = c;
    });
    if(selfLoops){
      for(let i = 0; i < g.n; i++){
        const c = normalize ? 1.0 / deg[i] : 1.0;
        if(c > maxCoef) maxCoef = c;
      }
    }

    /* color range */
    let maxV = 0, minV = Infinity;
    for(let i = 0; i < g.n; i++){ if(h[i] > maxV) maxV = h[i]; if(h[i] < minV) minV = h[i]; }
    if(maxV < 0.001) maxV = 0.001;

    /* groups */
    const nG = api.group("nodes");
    const eG = api.group("edges");
    const lG = api.group("labels");
    const cG = api.group("coefs");

    /* ── EDGES ─────────────────────────────────────────────────── */
    g.edges.forEach(([a,b]) => {
      const pa = new T.Vector3(g.pos[a][0], 0.12, g.pos[a][1]);
      const pb = new T.Vector3(g.pos[b][0], 0.12, g.pos[b][1]);
      const c  = normalize ? 1.0 / Math.sqrt(deg[a] * deg[b]) : 1.0;
      const br = normalize ? Math.min(1.0, c * (deg[a] + deg[b]) * 0.5) : 0.35;
      const col = new T.Color().setHSL(0.56, 0.55, 0.18 + br * 0.28);

      const d  = pb.clone().sub(pa);
      const Ln = d.length();
      const m  = new T.Mesh(
        new T.CylinderGeometry(0.032, 0.032, Ln, 8),
        new T.MeshStandardMaterial({color: col, emissive: col.clone().multiplyScalar(0.22), roughness: 0.5})
      );
      m.position.copy(pa).add(pb).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), d.clone().normalize());
      eG.add(m);

      /* coefficient label in operator mode */
      if(mode === "operator"){
        const mx = (g.pos[a][0] + g.pos[b][0]) / 2;
        const mz = (g.pos[a][1] + g.pos[b][1]) / 2;
        const coefStr = normalize
          ? "1/√(" + deg[a] + "·" + deg[b] + ")=" + c.toFixed(3)
          : "raw=1";
        cG.add(setP(api.label(coefStr, "#fbbf24", 0.21), mx, 0.55, mz));
      }
    });

    /* ── SELF-LOOPS (small tori) ──────────────────────────────── */
    if(selfLoops){
      for(let i = 0; i < g.n; i++){
        const px = g.pos[i][0];
        const pz = g.pos[i][1];
        const sc  = normalize ? 1.0 / deg[i] : 1.0;
        const col = new T.Color("#a78bfa");
        const loop = new T.Mesh(
          new T.TorusGeometry(0.30, 0.042, 8, 24, Math.PI * 1.3),
          new T.MeshStandardMaterial({color: col, emissive: col.clone().multiplyScalar(0.45), roughness: 0.5})
        );
        loop.position.set(px, 0.36, pz);
        loop.rotation.x = Math.PI / 2;
        loop.rotation.z = -Math.PI * 0.25;
        eG.add(loop);

        if(mode === "operator"){
          cG.add(setP(api.label("self=" + sc.toFixed(3), "#c4b5fd", 0.20), px + 0.6, 0.65, pz));
        }
      }
    }

    /* ── NODES ─────────────────────────────────────────────────── */
    g.pos.forEach((p, i) => {
      const val      = h[i];
      const norm_v   = (val - minV) / (maxV - minV);
      const yv       = 0.12 + val * 2.4;
      const isSource = (i === source);
      const isHub    = (i === 3 && nNodes >= 4);

      let col;
      if(isSource) col = new T.Color("#fbbf24");
      else if(isHub) col = api.ramp(Math.min(1, norm_v), "#16233a", "#fb7185");
      else           col = api.ramp(Math.min(1, norm_v), "#16233a", "#4dd7ff");

      const radius = (isSource || isHub) ? 0.30 : 0.22;
      const m = new T.Mesh(
        new T.SphereGeometry(radius, 22, 22),
        new T.MeshStandardMaterial({
          color: col, emissive: col.clone().multiplyScalar(0.4),
          emissiveIntensity: 0.5, roughness: 0.35
        })
      );
      m.position.set(p[0], yv, p[1]);
      api.pick(m, {node: {id: g.labels[i], v: val, deg: deg[i], role: isSource ? "source" : (isHub ? "hub" : "")}});
      nG.add(m);
      nG.add(stem(api, p[0], p[1], yv));

      /* label: node id + degree in operator mode + current value */
      const degStr   = (mode === "operator") ? (" d̃=" + deg[i]) : "";
      const labelClr = isSource ? "#fde68a" : (isHub ? "#fda4b0" : "#cfe0f0");
      lG.add(setP(
        api.label(g.labels[i] + degStr + " " + val.toFixed(3), labelClr, 0.32),
        p[0], yv + 0.38, p[1]
      ));
    });

    /* ── MODE-SPECIFIC TEXT ─────────────────────────────────────── */
    let badge, formula, insight, state;

    if(mode === "operator"){
      badge   = "Operator · L=" + L;
      formula = "h_i'=Σ_{j∈Ñ(i)} (1/√(d̃_i·d̃_j)) h_j · Ã=A+I";
      insight = "Each edge carries the symmetric coefficient 1/√(d̃_i·d̃_j). In the default 4-cycle all degrees equal 3 after self-loops, so every coefficient is 1/3. Add extra nodes to H: its degree rises, its coefficient shrinks, and hub domination is tamed.";
      state   = "src=" + g.labels[source] + " · hubH=" + hubVal.toFixed(3) + " · maxCoef=" + maxCoef.toFixed(3) + " · L=" + L + (selfLoops ? " self-ON" : " self-OFF") + (normalize ? " norm-ON" : " norm-OFF");
    } else if(mode === "layers"){
      badge   = "Diffusion · P^" + L;
      formula = "H^(L) = P^L H^(0)  →  low-pass smoothing";
      insight = "Each layer applies P once. Node variance falls monotonically: at L=0 one node holds all signal; at large L the signal spreads uniformly — oversmoothing. This is the same variance collapse described in A12.";
      state   = "L=" + L + " · variance=" + v.toFixed(4) + (v < 0.005 && L > 3 ? " ← oversmoothed" : "") + " · hubH=" + hubVal.toFixed(3);
    } else {
      /* raw-vs-norm */
      badge   = (normalize ? "Normalized" : "Raw sum") + " · L=" + L;
      formula = normalize
        ? "P = D̃^{-½} Ã D̃^{-½}  (symmetric — tames hub)"
        : "P = Ã  (raw — hub dominates)";
      insight = "Toggle normalization: with raw adjacency the hub H accumulates a sum proportional to its degree and dominates. With symmetric normalization each message is scaled by 1/√(d̃_i·d̃_j) and the hub is tamed. Toggle self-loops to compare A vs Ã.";
      state   = (normalize ? "NORM" : "RAW") + (selfLoops ? "+selfLoops" : "-selfLoops") + " · hubH=" + hubVal.toFixed(3) + " · variance=" + v.toFixed(4);
    }

    scene = {v, hubVal, targetVal, maxCoef, L};

    return {
      badge, formula, insight, state,
      metrics: {
        hub:      hubVal.toFixed(3),
        variance: v.toFixed(4),
        maxCoef:  maxCoef.toFixed(3),
        layer:    "L=" + L
      },
      focus: {center: [0, 0.8, 0], radius: Math.min(22, 11 + nNodes * 0.9)}
    };
  }

  /* ─────────────────────────────────────────────────────────────────────
   * MathLab config — mirrors a12 structure exactly
   * ─────────────────────────────────────────────────────────────────────*/
  MathLab.create({
    id: "b01",
    kind: "gcn-diffusion",

    eyebrow:  "Block B · GNN Architectures",
    title:    "B01 · GCN as normalized diffusion",
    subtitle: "The operator P = D̃⁻¹⸝² Ã D̃⁻¹⸝² spreads one node's signal to its neighbors. Each layer lowers variance; too many layers oversmoothes. Remove normalization and watch the hub dominate.",

    selectedLabel: "Node",
    selectedHint:  "Click any node to inspect its value, degree, and role.",

    modes: [
      {value: "operator",    label: "Operator (coefficients)"},
      {value: "layers",      label: "Layers (P^L diffusion)"},
      {value: "raw-vs-norm", label: "Raw vs normalized"}
    ],

    params: [
      {key: "nodes",
       label: "graph size (nodes)",
       min: 4, max: 8, step: 1, value: 4},

      {key: "layers",
       label: "diffusion layers L",
       min: 0, max: 8, step: 1, value: 1},

      {key: "signalSource",
       label: "signal source (0=T…3=H)",
       min: 0, max: 3, step: 1, value: 0},

      {key: "selfLoops",
       label: "self-loops  Ã = A+I",
       min: 0, max: 1, step: 1, value: 1,
       fmt: v => v >= 0.5 ? "ON" : "OFF"},

      {key: "normalize",
       label: "symmetric normalize",
       min: 0, max: 1, step: 1, value: 1,
       fmt: v => v >= 0.5 ? "ON" : "OFF",
       modes: ["operator","raw-vs-norm"]}
    ],

    metrics: [
      {key: "hub",      label: "Hub H value",      accent: "rose"},
      {key: "variance", label: "Node variance",    accent: "cyan"},
      {key: "maxCoef",  label: "Max coefficient",  accent: "amber"},
      {key: "layer",    label: "Depth",            accent: "violet"}
    ],

    layers: [
      {group: "edges",  label: "Edges / self-loops"},
      {group: "nodes",  label: "Signal / height"},
      {group: "labels", label: "Labels"},
      {group: "coefs",  label: "Coefficients"}
    ],

    primary: {
      label: "+1 layer",
      on: api => { api.setParam("layers", Math.min(8, Math.round(api.state.layers) + 1)); }
    },
    secondary: {
      label: "Toggle normalize",
      on: api => { api.setParam("normalize", api.state.normalize >= 0.5 ? 0 : 1); }
    },

    defaultCam: {theta: -0.45, phi: 0.62, r: 13},

    hint: '<span class="a">amber</span> = signal source · <span class="r">rose</span> = hub H · node height/colour = current value · <span style="color:#a78bfa">violet rings</span> = self-loops · edge labels show 1/√(d̃·d̃) in operator mode.',

    onParam(api){
      const n = Math.round(api.state.nodes);
      api.frame([0, 0.8, 0], Math.min(22, 11 + n * 0.9));
    },

    onSelect(api, d){
      if(d.node) api.setSelected(
        d.node.id + (d.node.role ? " (" + d.node.role + ")" : "") +
        " · val=" + d.node.v.toFixed(3) + " · d̃=" + d.node.deg
      );
    },

    build,

    snapshot(s){
      const sc = scene;
      return {
        mode:       s.mode,
        layers:     Math.round(s.layers),
        nodes:      Math.round(s.nodes),
        selfLoops:  s.selfLoops  >= 0.5,
        normalize:  s.normalize  >= 0.5,
        source:     Math.round(s.signalSource),
        hubVal:     sc.hubVal   != null ? +sc.hubVal.toFixed(4)   : 0,
        variance:   sc.v        != null ? +sc.v.toFixed(4)        : 0,
        maxCoef:    sc.maxCoef  != null ? +sc.maxCoef.toFixed(4)  : 0
      };
    }
  });

})();
</script>
</body>
</html>
