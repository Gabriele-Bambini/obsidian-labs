<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B03 · GAT attention microscope</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  /* ─────────────────────────────────────────────────────────────
     Deterministic pseudo-random — NO Math.random / Date anywhere.
     frac(sin(.)) hash, stable across reloads & snapshots.
  ────────────────────────────────────────────────────────────────*/
  const frac = x => x - Math.floor(x);
  const prand = (i,seed) => frac(Math.sin(i*127.1 + (seed||0)*311.7 + 31.7) * 43758.5453);

  /* ── palette ─────────────────────────────────────────────────── */
  const C = {
    cyan:0x4dd7ff, green:0x34d399, amber:0xfbbf24, violet:0xa78bfa, rose:0xfb7185,
    slate:0x54667c, target:0x7fd6ff
  };
  const CS = { cyan:"#4dd7ff", green:"#34d399", amber:"#fbbf24", violet:"#a78bfa", rose:"#fb7185",
    slate:"#9fb4cc", muted:"#8a99ad", target:"#9fe0ff" };
  /* per-neighbour accent ring (TF1..) — TF1 always cyan so the focus slider target is obvious */
  const NCOL = [C.cyan, C.green, C.amber, C.violet, C.rose, C.green, C.amber];
  const NCOLS= [CS.cyan, CS.green, CS.amber, CS.violet, CS.rose, CS.green, CS.amber];
  const HEADCOL = [C.cyan, C.green, C.amber, C.violet];
  const HEADCOLS= [CS.cyan, CS.green, CS.amber, CS.violet];

  /* ── exact math ──────────────────────────────────────────────── */
  function softmax(z){ const m=Math.max.apply(null,z); const e=z.map(v=>Math.exp(v-m));
    const s=e.reduce((a,b)=>a+b,0); return e.map(v=>v/s); }
  function entropy(a){ let h=0; for(const p of a) if(p>1e-12) h-=p*Math.log(p); return h; }

  /* neighbour names — TF1 is the slider target; HubP is the database hub */
  const NAME = ["TF1","TF2","HubP","TF3","TF4","TF5","TF6"];

  /* base un-normalised logit e_ij for neighbour i (deterministic, distinct) */
  function baseLogit(i){ return 0.45 + prand(i*17.3+5.1, 2) * 1.35; }

  /* neighbour fan positions — upper semicircle in the camera (XY) plane.
     Target sits at the focus; neighbours arc above it so the floor below is
     free for the softmax bars and the caption row. */
  function ringPos(n, R){
    const pts=[]; const spread = Math.PI*0.92;          // ~166° fan across the top
    for(let i=0;i<n;i++){
      const t = (n===1)?0 : (i/(n-1) - 0.5)*spread;
      const ang = Math.PI/2 + t;                         // centred on +Y
      pts.push([ R*Math.cos(ang), R*Math.sin(ang) + 2.6, 0 ]);
    }
    return pts;
  }

  /* ── persistent scene state for snapshot ─────────────────────── */
  let SNAP = {};
  /* reusable bar meshes get rebuilt each frame (engine clears groups) */

  /* helper: tube edge from a→b */
  function tube(T, a, b, rad, mat){
    const av=new T.Vector3(a[0],a[1],a[2]), bv=new T.Vector3(b[0],b[1],b[2]);
    const dir=bv.clone().sub(av), len=dir.length();
    const m=new T.Mesh(new T.CylinderGeometry(rad,rad,len,12), mat);
    m.position.copy(av.clone().add(bv).multiplyScalar(0.5));
    m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir.clone().normalize());
    return m;
  }

  /* ════════════════════════════════════════════════════════════════
     BUILD
  ═════════════════════════════════════════════════════════════════*/
  function build(api){
    const T=api.THREE, s=api.state;
    const N=Math.round(s.neighbors), mode=s.mode;
    const focus = (mode==="attention") ? (+s.focusEvidence||0) : 0;
    const K     = (mode==="multihead") ? Math.max(1,Math.round(s.heads)) : 1;
    const gcnOn = (mode==="attention") ? ((+s.gcnCompare||0)>=0.5) : false;

    const gEdge=api.group("edges"), gNode=api.group("nodes"),
          gBars=api.group("softmax"), gLbl=api.group("labels");

    const R=3.8;
    const TY=2.6;                       // target height (base of the neighbour fan)
    const target=[0,TY,0];
    const pos=ringPos(N,R);

    /* ── logits → α  (softmax over the neighbourhood, sums to 1) ── */
    const logit=pos.map((_,i)=>baseLogit(i));
    logit[0] += focus*2.6;                               // focusEvidence raises TF1 ONLY
    const hubIdx=Math.min(2, N-1);                       // HubP is index 2 (or last if N<3)
    if(mode==="not-causal"){ logit[hubIdx] = 3.0 + (1-0)*0; } // database-bias hub dominates

    const alpha=softmax(logit);
    const maxA=Math.max.apply(null,alpha);
    const H=entropy(alpha);
    const Hmax=Math.log(N);                              // entropy ceiling (uniform)
    const sumA=alpha.reduce((a,b)=>a+b,0);

    /* toy transformed messages z_j = W h_j (scalar, deterministic) for h'ᵢ */
    const z=pos.map((_,i)=>0.25 + prand(i*41.7+9.3, 3)*0.75);
    const hPrime=alpha.reduce((acc,a,i)=>acc + a*z[i], 0);

    /* GCN fixed weight 1/√(d̃ᵢ d̃ⱼ): self-loops ⇒ both degrees = N+1 ⇒ 1/(N+1), uniform */
    const gcnW = 1/(N+1);

    /* multi-head: K independent (a^(k), W^(k)) → K different α distributions */
    const headA=[];
    for(let k=0;k<K;k++){
      const zk=pos.map((_,i)=> baseLogit(i) + (prand(i*11.3 + k*53.7 + 7.1, 4)-0.5)*2.4 );
      headA.push(softmax(zk));
    }
    const avgA = pos.map((_,i)=> headA.reduce((acc,ha)=>acc+ha[i],0)/K );
    const disp = (mode==="multihead") ? avgA : alpha;   // what the main edges show

    /* ───────────────────────── TARGET NODE ──────────────────────── */
    (function(){
      const col=new T.Color(C.target);
      const core=new T.Mesh(new T.SphereGeometry(0.66,32,32),
        new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.85),emissiveIntensity:0.9,roughness:0.18,metalness:0.1}));
      core.position.set(target[0],target[1],target[2]); gNode.add(core);
      // halo
      const halo=new T.Mesh(new T.SphereGeometry(0.98,28,28),
        new T.MeshBasicMaterial({color:col,transparent:true,opacity:0.10,blending:T.AdditiveBlending,depthWrite:false}));
      halo.position.set(target[0],target[1],target[2]); gNode.add(halo);
      // self-loop ring (target attends to itself) — sits in the camera plane
      const sl=new T.Mesh(new T.TorusGeometry(0.92,0.05,10,44),
        new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.6),emissiveIntensity:0.6,roughness:0.4}));
      sl.position.set(target[0],target[1],target[2]); gNode.add(sl);
      const lab=api.bigLabel("G*  (target gene)", CS.target, 1.9); lab.position.set(0,TY-1.15,0); gLbl.add(lab);
    })();

    /* ───────────────────────── EDGES + NEIGHBOURS ───────────────── */
    pos.forEach((p,i)=>{
      const a=disp[i];
      const isHub=(mode==="not-causal" && i===hubIdx);
      const col=new T.Color(isHub?C.rose:NCOL[i%NCOL.length]);

      /* GAT attention edge — thickness & glow ∝ α */
      const lit=0.22 + a*0.9;
      const eCol=col.clone().multiplyScalar(0.35+a*0.65);
      const eMat=new T.MeshStandardMaterial({color:eCol,emissive:eCol.clone().multiplyScalar(0.8),
        emissiveIntensity:0.35+a*0.85, roughness:0.35});
      const edge=tube(T, target, p, 0.05 + a*0.58, eMat);
      api.pick(edge,{neighbour:i,alpha:a,logit:logit[i],isHub,name:isHub?"HubP(DB)":NAME[i%NAME.length]});
      gEdge.add(edge);

      /* moving "message" pip whose brightness ∝ α (static position, deterministic) */
      const pip=new T.Mesh(new T.SphereGeometry(0.07+a*0.10,12,12),
        new T.MeshBasicMaterial({color:col.clone().multiplyScalar(0.6+a*0.5)}));
      pip.position.set(target[0]+(p[0]-target[0])*0.62, target[1]+(p[1]-target[1])*0.62, target[2]+(p[2]-target[2])*0.62);
      gEdge.add(pip);

      /* GCN comparison edge — fixed uniform 1/(N+1), slate, offset beside the GAT edge */
      if(gcnOn){
        const dir=new T.Vector3(p[0]-target[0],p[1]-target[1],p[2]-target[2]);
        const perp=new T.Vector3(-dir.y,dir.x,0).normalize().multiplyScalar(0.34);
        const a2=[target[0]+perp.x,target[1]+perp.y,target[2]], b2=[p[0]+perp.x,p[1]+perp.y,p[2]];
        const gcCol=new T.Color(C.slate);
        const gcMat=new T.MeshStandardMaterial({color:gcCol,emissive:gcCol.clone().multiplyScalar(0.3),
          emissiveIntensity:0.3,roughness:0.6,transparent:true,opacity:0.62});
        gEdge.add(tube(T,a2,b2, 0.05 + gcnW*0.58, gcMat)); // SAME scale as GAT ⇒ visibly uniform
      }

      /* per-head thin routes (multihead) — fan each head slightly around the
         target→neighbour direction and push it to its own z-layer */
      if(mode==="multihead" && K>1){
        const vx=p[0]-target[0], vy=p[1]-target[1];
        for(let k=0;k<K;k++){
          const ha=headA[k][i];
          const ang=((k+0.5)/K-0.5)*0.42;
          const c=Math.cos(ang),sn=Math.sin(ang);
          const rx=vx*c - vy*sn, ry=vx*sn + vy*c;
          const hb=[target[0]+rx*0.86, target[1]+ry*0.86, 0.45*(k-(K-1)/2)];
          const hc=new T.Color(HEADCOL[k]).multiplyScalar(0.3+ha*0.7);
          const hm=new T.MeshStandardMaterial({color:hc,emissive:hc.clone().multiplyScalar(0.5),
            emissiveIntensity:0.45,roughness:0.45,transparent:true,opacity:0.72});
          gEdge.add(tube(T,target,hb, 0.02 + ha*0.15, hm));
        }
      }

      /* neighbour node — radius grows with α */
      const r=0.30 + a*0.34 + (isHub?0.16:0);
      const nMat=new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(isHub?0.95:0.5),
        emissiveIntensity:isHub?0.95:(0.4+a*0.55),roughness:0.28,metalness:0.05});
      const node=new T.Mesh(new T.SphereGeometry(r,26,26),nMat);
      node.position.set(p[0],p[1],p[2]);
      api.pick(node,{neighbour:i,alpha:a,logit:logit[i],isHub,name:isHub?"HubP(DB)":NAME[i%NAME.length]});
      gNode.add(node);

      const cs=isHub?CS.rose:NCOLS[i%NCOLS.length];
      const nm=api.label(isHub?"HubP":NAME[i%NAME.length], cs, 0.42); nm.position.set(p[0], p[1]+r+0.40, p[2]); gLbl.add(nm);
      const al=api.label("α="+a.toFixed(3), cs, 0.36); al.position.set(p[0], p[1]+r+0.78, p[2]); gLbl.add(al);
      if(gcnOn){ const gl=api.label("gcn="+gcnW.toFixed(3), CS.muted, 0.30); gl.position.set(p[0], p[1]-r-0.34, p[2]); gLbl.add(gl); }
    });

    /* ──────────────── LIVE SOFTMAX BAR PANEL (floor row, Σα=1) ───
       Bars sit on a baseline in FRONT of the graph (toward camera) so they
       never occlude or get occluded. Each bar's height = α; they always
       stack to 1, so growing TF1 visibly steals height from the rest.       */
    const BAR_BASE=-3.1, BAR_Z=2.1, BAR_SCALE=4.4;
    (function(){
      const bw=0.56, span=Math.min(7.6, N*0.95), bx0=-(span/2)+ (span/(2*N));
      const step=span/N;
      // baseline plate
      const plate=new T.Mesh(new T.BoxGeometry(span+0.7,0.06,0.7),
        new T.MeshStandardMaterial({color:0x18324c,emissive:0x0c1626,emissiveIntensity:0.5,roughness:0.6}));
      plate.position.set(0,BAR_BASE-0.03,BAR_Z); gBars.add(plate);
      pos.forEach((p,i)=>{
        const a=disp[i]; const isHub=(mode==="not-causal" && i===hubIdx);
        const col=new T.Color(isHub?C.rose:NCOL[i%NCOL.length]);
        const h=0.05 + a*BAR_SCALE, px=bx0+i*step;
        const bar=new T.Mesh(new T.BoxGeometry(Math.min(bw,step*0.7),h,0.42),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.6),emissiveIntensity:0.6,roughness:0.32}));
        bar.position.set(px, BAR_BASE+h/2, BAR_Z);
        api.pick(bar,{neighbour:i,alpha:a,logit:logit[i],isHub,name:isHub?"HubP(DB)":NAME[i%NAME.length]});
        gBars.add(bar);
        const cs=isHub?CS.rose:NCOLS[i%NCOLS.length];
        gBars.add(setP(api.label(a.toFixed(2), cs, 0.42), px, BAR_BASE+h+0.30, BAR_Z));
        gBars.add(setP(api.label(isHub?"HubP":NAME[i%NAME.length], cs, 0.30), px, BAR_BASE-0.30, BAR_Z));
      });
      gBars.add(setP(api.bigLabel("softmax over N(i):  Σα = "+sumA.toFixed(3)+"  (= 1)", CS.green, 3.2),
        0, BAR_BASE+BAR_SCALE+0.55, BAR_Z));
    })();

    /* ──────────────── ENTROPY GAUGE (right side) ───────────────── */
    (function(){
      const gx=R+2.9, gy=3.0, gh=4.2;
      const track=new T.Mesh(new T.BoxGeometry(0.36,gh,0.36),
        new T.MeshStandardMaterial({color:0x16273a,emissive:0x16273a,emissiveIntensity:0.4,roughness:0.6}));
      track.position.set(gx, gy, 0); gBars.add(track);
      const fr=Hmax>1e-6? H/Hmax : 0;
      const fillCol=new T.Color().setHSL(0.0 + fr*0.35, 0.78, 0.55); // rose(low)→green(high)
      const fh=Math.max(0.06, gh*fr);
      const fill=new T.Mesh(new T.BoxGeometry(0.36,fh,0.36),
        new T.MeshStandardMaterial({color:fillCol,emissive:fillCol.clone().multiplyScalar(0.7),emissiveIntensity:0.65,roughness:0.3}));
      fill.position.set(gx, gy-gh/2+fh/2, 0); gBars.add(fill);
      gBars.add(setP(api.bigLabel("entropy", CS.muted, 1.7), gx, gy+gh/2+0.55, 0));
      gBars.add(setP(api.bigLabel("H="+H.toFixed(2), fillCol.getStyle(), 1.8), gx, gy-gh/2-0.45, 0));
      gBars.add(setP(api.label("of Hmax="+Hmax.toFixed(2), CS.muted, 0.36), gx, gy-gh/2-0.95, 0));
    })();

    /* ──────────────── h'ᵢ aggregation readout (left side) ──────── */
    (function(){
      const hx=-R-2.9, hy=3.0;
      const dot=new T.Mesh(new T.SphereGeometry(0.32+hPrime*0.5,26,26),
        new T.MeshStandardMaterial({color:C.target,emissive:new T.Color(C.target).multiplyScalar(0.7),emissiveIntensity:0.7,roughness:0.25}));
      dot.position.set(hx,hy,0); gBars.add(dot);
      gBars.add(setP(api.bigLabel("h′ᵢ = σ(Σ α·z)", CS.target, 2.2), hx, hy+1.45, 0));
      gBars.add(setP(api.bigLabel(hPrime.toFixed(3), CS.target, 1.9), hx, hy-1.45, 0));
    })();

    /* ──────────────── mode captions (very bottom row) ───────────── */
    const CAP_Y=-4.4;
    if(mode==="attention"){
      const t = focus>0.001
        ? "Raise focusEvidence → TF1's α climbs, every other α falls (softmax competition, Σα stays 1)."
        : "Move focusEvidence → watch TF1 win attention mass from its neighbours.";
      gLbl.add(setP(api.bigLabel(t, CS.cyan, 3.6), 0, CAP_Y, BAR_Z));
      if(gcnOn) gLbl.add(setP(api.bigLabel("bright = GAT learned α   ·   slate = GCN fixed 1/(N+1) (uniform)", CS.muted, 3.2), 0, CAP_Y-0.62, BAR_Z));
    }
    if(mode==="multihead" && K>1){
      for(let k=0;k<K;k++){
        const hl=api.label("head "+(k+1), HEADCOLS[k], 0.44); hl.position.set(-R-0.7, 6.6-k*0.62, 0.6); gLbl.add(hl);
      }
      gLbl.add(setP(api.bigLabel("K="+K+" heads → K different α; main edges & bars show the average (concat/avg = robustness)", CS.violet, 3.6), 0, CAP_Y, BAR_Z));
    }
    if(mode==="not-causal"){
      gLbl.add(setP(api.bigLabel("α concentrates on the database hub — high α is a ROUTING weight, not proof of regulation.", CS.rose, 3.6), 0, CAP_Y, BAR_Z));
      gLbl.add(setP(api.bigLabel("Validate causal claims with perturbation (Perturb-seq / CRISPRi), not attention.", CS.amber, 3.2), 0, CAP_Y-0.62, BAR_Z));
    }

    /* ── snapshot cache ──────────────────────────────────────────── */
    SNAP = {
      mode, neighbors:N, heads:K, gcnCompare:gcnOn?1:0,
      focusEvidence:+focus.toFixed(3),
      alphas: alpha.map(a=>+a.toFixed(4)),
      displayAlphas: disp.map(a=>+a.toFixed(4)),
      headAlphas: headA.map(h=>h.map(a=>+a.toFixed(4))),
      maxAlpha:+maxA.toFixed(4),
      alphaTF1:+alpha[0].toFixed(4),
      alphaHub: mode==="not-causal" ? +alpha[hubIdx].toFixed(4) : null,
      entropy:+H.toFixed(4),
      entropyMax:+Hmax.toFixed(4),
      hPrime:+hPrime.toFixed(4),
      gcnWeight:+gcnW.toFixed(4),
      sumAlpha:+sumA.toFixed(6),
      sumAlphaIsOne: Math.abs(sumA-1)<1e-6
    };

    /* ── narrative ───────────────────────────────────────────────── */
    const modeName={
      attention:"GAT · learned attention on a sparse neighbourhood",
      multihead:"Multi-head GAT · K parallel attention distributions",
      "not-causal":"Attention ≠ causation · database-hub concentration"
    }[mode];

    let insight, state;
    if(mode==="attention"){
      insight = "Each edge gets a score eᵢⱼ = LeakyReLU(aᵀ[Whᵢ‖Whⱼ]); a softmax over the "+N+" neighbours turns the scores into αᵢⱼ that sum to 1 (Σα="+sumA.toFixed(3)+"). "
        + "Raising focusEvidence adds up to +2.6 to TF1's logit: its α rises to "+alpha[0].toFixed(3)+" and every other α is pushed down — the mass is conserved, so attention is a competition. "
        + (gcnOn ? "Slate edges show GCN's fixed 1/(N+1)="+gcnW.toFixed(3)+" — the same weight for every neighbour, no learning." : "Toggle GAT⇄GCN to compare learned α against GCN's fixed uniform weight.");
      state = "TF1 α="+alpha[0].toFixed(3)+" · max α="+maxA.toFixed(3)+" · entropy H="+H.toFixed(3)+" / "+Hmax.toFixed(3)+" · h′ᵢ="+hPrime.toFixed(3);
    } else if(mode==="multihead"){
      const agree = headA.map(h=>h.indexOf(Math.max.apply(null,h))); // each head's argmax
      const same = agree.every(v=>v===agree[0]);
      insight = K+" heads each own an independent (a⁽ᵏ⁾,W⁽ᵏ⁾) and produce a different α over the same "+N+" neighbours. "
        + "The main edges and bars show the average; the thin coloured routes show each head. "
        + (same ? "All heads currently peak on the same neighbour — a stable preference." : "Heads peak on different neighbours — complementary evidence (average them only after inspecting each).");
      state = "K="+K+" heads · avg max α="+maxA.toFixed(3)+" · avg entropy H="+H.toFixed(3)+" · Σ(avg α)="+sumA.toFixed(3);
    } else {
      insight = "The hub's logit is forced high (co-expression / database over-representation), so α piles onto it (α_hub="+alpha[hubIdx].toFixed(3)+") and entropy collapses to H="+H.toFixed(3)+" (of "+Hmax.toFixed(3)+"). "
        + "Low entropy LOOKS decisive, but α is the model's routing weight, not a validated regulatory edge — a hub can win attention purely from feature similarity or DB bias.";
      state = "hub α="+alpha[hubIdx].toFixed(3)+" · entropy H="+H.toFixed(3)+" / "+Hmax.toFixed(3)+" · Σα="+sumA.toFixed(3)+" · needs perturbation validation";
    }

    return {
      badge: modeName + " · N="+N,
      formula: "eᵢⱼ=LeakyReLU(aᵀ[Whᵢ‖Whⱼ]) → αᵢⱼ=exp(eᵢⱼ)/Σₖexp(eᵢₖ) → h′ᵢ=σ(Σⱼ αᵢⱼ Whⱼ)",
      insight, state,
      metrics:{
        maxA: maxA.toFixed(3),
        ent: H.toFixed(3),
        hprime: hPrime.toFixed(3),
        check: mode==="multihead" ? ("K="+K) : ("Σα="+sumA.toFixed(3))
      },
      focus:{ center:[0,1.4,0.6], radius:15.5 }
    };
  }

  function setP(o,x,y,z){ o.position.set(x,y,z); return o; }

  /* ════════════════════════════════════════════════════════════════
     MathLab config
  ═════════════════════════════════════════════════════════════════*/
  MathLab.create({
    id:"b03", kind:"gat-attention-microscope",
    eyebrow:"Block B · GNN Architectures",
    title:"B03 · GAT attention microscope",
    subtitle:"A target gene scores each neighbour edge, softmaxes the scores into attention weights αᵢⱼ that sum to 1, and aggregates a weighted message. Raise one neighbour's evidence and watch the others lose mass — attention is competition, not proof.",
    selectedLabel:"Neighbour",
    selectedHint:"Click a neighbour, edge, or bar to inspect its α and logit.",

    modes:[
      {value:"attention",  label:"Attention (learned α)"},
      {value:"multihead",  label:"Multi-head GAT"},
      {value:"not-causal", label:"Attention ≠ causation"}
    ],

    params:[
      {key:"neighbors",     label:"neighbours N",            min:3, max:7, step:1, value:4, fmt:v=>Math.round(v).toString()},
      {key:"focusEvidence", label:"focusEvidence (raise TF1)", min:0, max:1, step:0.05, value:0.0, fmt:v=>v.toFixed(2), modes:["attention"]},
      {key:"heads",         label:"heads K",                 min:1, max:4, step:1, value:3, fmt:v=>Math.round(v).toString(), modes:["multihead"]},
      {key:"gcnCompare",    label:"GAT ⇄ GCN overlay",       min:0, max:1, step:1, value:0, fmt:v=>(v>=0.5?"ON":"OFF"), modes:["attention"]}
    ],

    metrics:[
      {key:"maxA",   label:"max α",             accent:"cyan"},
      {key:"ent",    label:"attention entropy", accent:"green"},
      {key:"hprime", label:"aggregated h′ᵢ",    accent:"amber"},
      {key:"check",  label:"Σα = 1 / #heads",   accent:"violet"}
    ],

    layers:[
      {group:"edges",   label:"α-weighted edges"},
      {group:"nodes",   label:"Genes"},
      {group:"softmax", label:"Softmax bars"},
      {group:"labels",  label:"Labels"}
    ],

    primary:{
      label:"Boost TF1 evidence",
      on:api=>{
        if(api.state.mode==="attention"){
          const v=Math.min(1, +((+api.state.focusEvidence||0)+0.2).toFixed(2));
          api.setParam("focusEvidence", v);
        } else if(api.state.mode==="multihead"){
          const v=Math.min(4, Math.round((+api.state.heads||1))%4 + 1);
          api.setParam("heads", v);
        }
      }
    },
    secondary:{
      label:"Cycle mode",
      on:api=>{
        const o=["attention","multihead","not-causal"];
        const sel=document.getElementById("ml-mode");
        if(sel){ sel.value=o[(o.indexOf(api.state.mode)+1)%o.length]; sel.dispatchEvent(new Event("change")); }
      }
    },

    defaultCam:{theta:-1.5708, phi:0.96, r:14.5},   // front-ish so bars + graph read together
    views:[
      {key:"3d",   label:"3D",    theta:-1.15, phi:0.92},
      {key:"front",label:"Front", theta:-1.5708, phi:1.02},
      {key:"top",  label:"Top",   theta:-1.5708, phi:0.30}
    ],

    hint:'<span class="c">edge thickness + glow</span> = attention α · node size grows with α · <span class="g">bars</span> = the softmax (Σα=1) · right gauge = <span class="g">entropy</span> (low = concentrated) · <span class="r">rose hub</span> = database bias (not-causal)',

    onParam(api){ api.frame([0,1.0,-0.8], 14.5); },

    onSelect(api,d){
      if(d && d.neighbour!==undefined){
        api.setSelected(d.name+" · α="+d.alpha.toFixed(4)+" · logit e="+d.logit.toFixed(3)+(d.isHub?" · DB HUB (bias)":""));
      }
    },

    build,

    snapshot(s){
      return Object.assign({
        mode:s.mode, neighbors:Math.round(s.neighbors),
        focusEvidence:+((+s.focusEvidence)||0).toFixed(3),
        heads: s.mode==="multihead"?Math.round(s.heads):1,
        gcnCompare: (s.mode==="attention" && (+s.gcnCompare||0)>=0.5)?1:0
      }, SNAP);
    }
  });
})();
</script>
</body>
</html>
