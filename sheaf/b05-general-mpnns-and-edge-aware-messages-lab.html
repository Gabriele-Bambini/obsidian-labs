<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B05 · General MPNNs and edge-aware messages</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // Deterministic pseudo-random — no Math.random, no Date
  const frac = i => { const x = Math.sin(i * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); };

  // ── Fixed neighbour templates ─────────────────────────────────────────────
  // Each: label, type, base h_j, sign (+1/-1), base confidence, 3D colour
  const NBR_TMPL = [
    { label:"TF-Act",  type:"TF→gene",       baseH:2.0, sign:+1, baseConf:0.88, color:"#34d399" },
    { label:"TF-Rep",  type:"TF→gene",       baseH:3.0, sign:-1, baseConf:0.72, color:"#fb7185" },
    { label:"PPI",     type:"PPI",           baseH:2.5, sign:+1, baseConf:0.55, color:"#a78bfa" },
    { label:"CoExpr",  type:"co-expression", baseH:4.0, sign:+1, baseConf:0.28, color:"#fbbf24" },
    { label:"Perturb", type:"perturbation",  baseH:1.8, sign:-1, baseConf:0.95, color:"#4dd7ff" },
    { label:"ChIP",    type:"TF→gene",       baseH:2.2, sign:+1, baseConf:0.60, color:"#34d399" },
  ];

  // Per-relation weight scalars for R-GCN (heterogeneous edge-types mode)
  const REL_W = {
    "TF→gene":      1.15,
    "PPI":          0.80,
    "co-expression":0.45,
    "perturbation": 1.30,
  };

  // ── Core message math ─────────────────────────────────────────────────────
  function computeAll(s) {
    const N   = Math.round(s.neighbors);
    const fc  = s.focusConfidence;
    const fs  = s.focusSign;       // +1 or -1

    // Build neighbour list
    const nbrs = [];
    for(let i = 0; i < N; i++){
      const t = NBR_TMPL[i % NBR_TMPL.length];
      let conf = t.baseConf;
      let sign = t.sign;
      if(s.mode === "edge-features" && i === 0){ conf = fc; sign = fs; }
      nbrs.push({ ...t, conf, sign, idx:i });
    }

    // Edge-blind: m_ij = 1.0 * h_j  (ignores sign, conf, type entirely)
    const msgs_blind = nbrs.map(nb => nb.baseH);
    const h_blind    = msgs_blind.reduce((a,b) => a+b, 0);

    // Edge-aware: m_ij = sign * conf * h_j
    const msgs_aware = nbrs.map(nb => nb.sign * nb.conf * nb.baseH);
    const h_aware    = msgs_aware.reduce((a,b) => a+b, 0);

    // Focus edge message (index 0)
    const focusNb  = nbrs[0];
    const focus_msg = focusNb.sign * focusNb.conf * focusNb.baseH;

    // R-GCN: group by type, apply W_r per type
    const byType = {};
    nbrs.forEach(nb => {
      const r = nb.type;
      if(byType[r] == null) byType[r] = 0;
      byType[r] += nb.sign * (REL_W[r] || 1.0) * nb.conf * nb.baseH;
    });
    const nTypes   = Object.keys(byType).length;
    const h_rgcn   = Object.values(byType).reduce((a,b) => a+b, 0);

    return { nbrs, msgs_blind, msgs_aware, h_blind, h_aware, focus_msg, byType, nTypes, h_rgcn };
  }

  // ── Geometry helpers ──────────────────────────────────────────────────────
  function setP(obj, x, y, z){ obj.position.set(x, y, z); return obj; }

  // ── Scene state for snapshot ──────────────────────────────────────────────
  let _snap = {};

  // ── Build function ─────────────────────────────────────────────────────────
  function build(api){
    const T  = api.THREE;
    const s  = api.state;
    const cm = computeAll(s);
    const { nbrs, msgs_blind, msgs_aware, h_blind, h_aware, focus_msg, byType, nTypes, h_rgcn } = cm;

    const gNodes  = api.group("nodes");
    const gEdges  = api.group("edges");
    const gLabels = api.group("labels");

    // ── Target node GeneX ─────────────────────────────────────────────────
    const TARGET = new T.Vector3(0, 0, 0);
    const tMat = new T.MeshStandardMaterial({
      color:0x4dd7ff, emissive:0x4dd7ff, emissiveIntensity:0.55, roughness:0.35
    });
    const tMesh = new T.Mesh(new T.SphereGeometry(0.72, 24, 24), tMat);
    tMesh.position.copy(TARGET);
    api.pick(tMesh, {
      role:"target",
      h_blind:  h_blind.toFixed(3),
      h_aware:  h_aware.toFixed(3)
    });
    gNodes.add(tMesh);
    gLabels.add(setP(api.bigLabel("GeneX", "#4dd7ff", 1.4), 0, 1.15, 0));

    // ── Neighbour nodes + edges ───────────────────────────────────────────
    const RADIUS = 4.2;
    nbrs.forEach((nb, i) => {
      const angle = (i / nbrs.length) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(angle) * RADIUS;
      const pz = Math.sin(angle) * RADIUS;

      const isFocus = (s.mode === "edge-features" && i === 0);
      const col = new T.Color(nb.color);
      const nMat = new T.MeshStandardMaterial({
        color: col,
        emissive: col.clone().multiplyScalar(0.4),
        emissiveIntensity: isFocus ? 0.9 : 0.45,
        roughness: 0.4
      });
      const nMesh = new T.Mesh(new T.SphereGeometry(0.48, 20, 20), nMat);
      nMesh.position.set(px, 0, pz);
      api.pick(nMesh, {
        role:      "neighbour",
        label:     nb.label,
        type:      nb.type,
        sign:      ""+nb.sign,
        conf:      nb.conf.toFixed(2),
        h_j:       nb.baseH.toFixed(2),
        msg_blind: msgs_blind[i].toFixed(3),
        msg_aware: msgs_aware[i].toFixed(3)
      });
      gNodes.add(nMesh);
      gLabels.add(setP(api.bigLabel(nb.label, nb.color, 1.0), px, 0.78, pz));

      // ── Edge cylinder ───────────────────────────────────────────────────
      // Which message to use for thickness?
      const useAware = (s.mode === "blind-vs-aware") ? (s.aware === 1) : true;
      const msgVal   = useAware ? msgs_aware[i] : msgs_blind[i];

      const eFrom = new T.Vector3(px, 0, pz);
      const eDir  = TARGET.clone().sub(eFrom);
      const eLen  = eDir.length();
      const eMid  = eFrom.clone().add(eDir.clone().multiplyScalar(0.5));

      const thick = 0.035 + 0.055 * Math.min(Math.abs(msgVal) / 4.5, 1.0);

      // Colour: per-type in edge-types mode, green/rose by sign otherwise
      let edgeCol;
      if(s.mode === "edge-types"){
        const tc = { "TF→gene":"#a78bfa","PPI":"#fbbf24","co-expression":"#4dd7ff","perturbation":"#fb7185" };
        edgeCol = new T.Color(tc[nb.type] || "#9fb4cc");
      } else {
        edgeCol = (useAware ? msgVal : msgs_aware[i]) >= 0
          ? new T.Color("#34d399") : new T.Color("#fb7185");
      }

      const eMat = new T.MeshStandardMaterial({
        color: edgeCol,
        emissive: edgeCol.clone().multiplyScalar(0.35),
        emissiveIntensity: 0.4,
        roughness: 0.5,
        transparent: true,
        opacity: 0.28 + nb.conf * 0.62
      });
      const cyl = new T.Mesh(new T.CylinderGeometry(thick, thick, eLen * 0.72, 8), eMat);
      cyl.position.copy(eMid);
      const axis = new T.Vector3(0, 1, 0);
      const quat = new T.Quaternion().setFromUnitVectors(axis, eDir.clone().normalize());
      cyl.setRotationFromQuaternion(quat);
      gEdges.add(cyl);

      // ── Focus edge decorations (edge-features mode) ───────────────────
      if(isFocus){
        // Amber ring
        const ring = new T.Mesh(
          new T.TorusGeometry(0.62, 0.06, 10, 32),
          new T.MeshBasicMaterial({ color:0xfbbf24 })
        );
        ring.position.set(px, 0, pz);
        ring.lookAt(TARGET);
        gEdges.add(ring);

        // Confidence bar above focus node
        const barH = 0.08 + nb.conf * 2.0;
        const barMat = new T.MeshStandardMaterial({
          color:0xfbbf24, emissive:0xfbbf24, emissiveIntensity:0.7
        });
        const bar = new T.Mesh(new T.BoxGeometry(0.22, barH, 0.22), barMat);
        bar.position.set(px, 0.85 + barH / 2, pz);
        gEdges.add(bar);
        gLabels.add(setP(
          api.bigLabel("conf="+nb.conf.toFixed(2)+(nb.sign>0?"  act":"  rep"), "#fbbf24", 0.92),
          px, 0.85 + barH + 0.32, pz
        ));
      }
    });

    // ── Blind-vs-aware comparison bars (behind GeneX) ─────────────────────
    if(s.mode === "blind-vs-aware"){
      // Blind bar
      const bh = 0.1 + Math.abs(h_blind) * 0.14;
      const bMat = new T.MeshStandardMaterial({
        color:0xfb7185, emissive:0xfb7185, emissiveIntensity:0.5,
        transparent:true, opacity:0.85
      });
      const bBar = new T.Mesh(new T.BoxGeometry(0.5, bh, 0.5), bMat);
      bBar.position.set(-1.2, h_blind >= 0 ? bh / 2 : -bh / 2, -3.0);
      gEdges.add(bBar);
      gLabels.add(setP(
        api.bigLabel("blind "+h_blind.toFixed(2), "#fb7185", 1.1),
        -1.2, (h_blind >= 0 ? bh : 0) + 0.44, -3.0
      ));

      // Aware bar
      const ah = 0.1 + Math.abs(h_aware) * 0.14;
      const aMat = new T.MeshStandardMaterial({
        color:0x34d399, emissive:0x34d399, emissiveIntensity:0.5,
        transparent:true, opacity:0.85
      });
      const aBar = new T.Mesh(new T.BoxGeometry(0.5, ah, 0.5), aMat);
      aBar.position.set(1.2, h_aware >= 0 ? ah / 2 : -ah / 2, -3.0);
      gEdges.add(aBar);
      gLabels.add(setP(
        api.bigLabel("aware "+h_aware.toFixed(2), "#34d399", 1.1),
        1.2, (h_aware >= 0 ? ah : 0) + 0.44, -3.0
      ));
    }

    // ── R-GCN per-type aggregation bars (edge-types mode) ─────────────────
    if(s.mode === "edge-types"){
      const typeList  = ["TF→gene","PPI","co-expression","perturbation"];
      const typeColors = {
        "TF→gene":"#a78bfa","PPI":"#fbbf24","co-expression":"#4dd7ff","perturbation":"#fb7185"
      };
      let yOff = 2.2;
      typeList.forEach(tp => {
        if(byType[tp] == null) return;
        const v   = byType[tp];
        const col = new T.Color(typeColors[tp] || "#9fb4cc");
        const bw  = 0.12 + Math.abs(v) * 0.20;
        const bMat = new T.MeshStandardMaterial({
          color:col, emissive:col.clone().multiplyScalar(0.5),
          emissiveIntensity:0.6, transparent:true, opacity:0.85
        });
        const bm = new T.Mesh(new T.BoxGeometry(bw, 0.26, 0.26), bMat);
        bm.position.set(v >= 0 ? bw / 2 : -bw / 2, yOff, -2.2);
        gEdges.add(bm);
        gLabels.add(setP(
          api.bigLabel(tp+"  "+v.toFixed(2), typeColors[tp], 0.90),
          0, yOff + 0.30, -2.2
        ));
        yOff -= 0.72;
      });
      // Combined sum
      const tCol = new T.Color("#e8eef6");
      const tw   = 0.12 + Math.abs(h_rgcn) * 0.20;
      const tMesh2 = new T.Mesh(new T.BoxGeometry(tw, 0.36, 0.36),
        new T.MeshStandardMaterial({
          color:tCol, emissive:tCol.clone().multiplyScalar(0.3), emissiveIntensity:0.5
        })
      );
      tMesh2.position.set(h_rgcn >= 0 ? tw / 2 : -tw / 2, yOff - 0.1, -2.2);
      gEdges.add(tMesh2);
      gLabels.add(setP(
        api.bigLabel("h\'ₓ="+h_rgcn.toFixed(2), "#e8eef6", 1.15),
        0, yOff + 0.14, -2.2
      ));
    }

    // ── Snapshot data ────────────────────────────────────────────────────────
    _snap = {
      mode:            s.mode,
      neighbors:       Math.round(s.neighbors),
      focusConfidence: +s.focusConfidence.toFixed(2),
      focusSign:       +s.focusSign,
      aware:           +s.aware,
      h_aware:         +h_aware.toFixed(3),
      h_blind:         +h_blind.toFixed(3),
      h_gap:           +(h_aware - h_blind).toFixed(3),
      focus_msg:       +focus_msg.toFixed(3),
      nTypes,
    };

    // ── Return display info ──────────────────────────────────────────────────
    let badge, formula, insight, state, metricVals;

    if(s.mode === "blind-vs-aware"){
      const gap  = h_aware - h_blind;
      const mode = s.aware === 1 ? "AWARE" : "BLIND";
      badge   = "Edge-blind ⇄ Edge-aware · "+Math.round(s.neighbors)+" neighbours";
      formula = "blind: mᵢⱼ=W·hⱼ (ignores eᵢⱼ) · aware: mᵢⱼ=sign·conf·hⱼ";
      insight = "Edge-blind treats every neighbour identically: a repressor (TF-Rep) wrongly "+
                "adds positive signal because sign is ignored. Edge-aware multiplies by sign×confidence so "+
                "repressors subtract and weak co-expression (CoExpr, conf=0.28) barely contributes. "+
                "The gap h\'ₓ_aware − h\'ₓ_blind shows how much biological meaning is thrown away "+
                "when the edge is ignored. Currently showing: "+mode+".";
      state   = "h\'ₓ_blind="+h_blind.toFixed(3)+" · h\'ₓ_aware="+h_aware.toFixed(3)+
                " · gap="+(gap>=0?"+":"")+gap.toFixed(3)+" ("+mode+")";
      metricVals = {
        h_aware: h_aware.toFixed(3),
        h_blind: h_blind.toFixed(3),
        gap:     gap.toFixed(3),
        nTypes:  ""+nTypes
      };
    } else if(s.mode === "edge-features"){
      const fc   = s.focusConfidence;
      const fs   = s.focusSign;
      const gap  = h_aware - h_blind;
      badge   = "Edge-feature conditioned · NNConv W(eᵢⱼ)·hⱼ · focus=index 0";
      formula = "mᵢⱼ=sign·conf·hⱼ · eᵢⱼ=[type, conf="+fc.toFixed(2)+", sign="+(fs>0?"+1":"-1")+"]";
      insight = "The focus edge (amber ring) has its confidence and sign exposed. "+
                "Lowering confidence shrinks the message magnitude; flipping sign turns "+
                "an activating edge into a repressing one and the contribution to h\'ₓ reverses. "+
                "This mirrors NNConv where an MLP on eᵢⱼ generates the weight matrix used to "+
                "transform the neighbour state — the edge controls its own filter.";
      state   = "focus msg="+focus_msg.toFixed(3)+" · h\'ₓ="+h_aware.toFixed(3)+
                " · conf="+fc.toFixed(2)+" sign="+(fs>0?"+1":"-1");
      metricVals = {
        h_aware: h_aware.toFixed(3),
        h_blind: h_blind.toFixed(3),
        gap:     gap.toFixed(3),
        nTypes:  ""+nTypes
      };
    } else {
      // edge-types / R-GCN
      const total = h_rgcn;
      badge   = "Heterogeneous / R-GCN · "+nTypes+" relation type"+(nTypes!==1?"s":"")+" active";
      formula = "mᵢⱼ=Wᵣ·hⱼ · separate Wᵣ per relation r · h\'ₓ=Σᵣ AGGᵣ";
      insight = "R-GCN routes each edge type (TF→gene, PPI, co-expression, perturbation) "+
                "through its own weight matrix Wᵣ. Messages are aggregated per relation separately, "+
                "then combined. A noisy co-expression channel cannot corrupt a strong perturbation "+
                "channel. The coloured bars show each relation channel's contribution to h\'ₓ before "+
                "the final sum.";
      state   = "h\'ₓ="+total.toFixed(3)+" from "+nTypes+" relation"+
                (nTypes!==1?"s":"")+": "+Object.keys(byType).join(", ");
      metricVals = {
        h_aware: total.toFixed(3),
        h_blind: h_blind.toFixed(3),
        gap:     (total - h_blind).toFixed(3),
        nTypes:  ""+nTypes
      };
    }

    return {
      badge, formula, insight, state,
      metrics: {
        h_aware: metricVals.h_aware,
        h_blind: metricVals.h_blind,
        gap:     metricVals.gap,
        nTypes:  metricVals.nTypes
      },
      focus: { center:[0, 0.5, 0], radius:11 }
    };
  }

  // ── MathLab.create ─────────────────────────────────────────────────────────
  MathLab.create({
    id:       "b05",
    kind:     "mpnn-edge-aware",
    eyebrow:  "Block B · GNN Architectures",
    title:    "B05 · General MPNNs and edge-aware messages",
    subtitle: "GeneX receives messages from N neighbours across different evidence types. "+
              "Toggle edge-blindness to see a repressor wrongly add signal. "+
              "Explore NNConv confidence/sign control and R-GCN relation routing.",

    selectedLabel: "Node / Edge",
    selectedHint:  "Click a node or edge to inspect its message.",

    modes:[
      { value:"blind-vs-aware", label:"Edge-blind vs edge-aware"           },
      { value:"edge-features",  label:"Edge-feature conditioned (NNConv)"  },
      { value:"edge-types",     label:"Heterogeneous edge types (R-GCN)"   },
    ],

    params:[
      {
        key:"neighbors", label:"neighbours N",
        min:2, max:6, step:1, value:4,
        fmt: v => Math.round(v)+""
      },
      {
        key:"focusConfidence", label:"focus edge confidence",
        min:0, max:1, step:0.05, value:0.9,
        fmt: v => v.toFixed(2),
        modes:["edge-features"]
      },
      {
        key:"focusSign", label:"focus sign (−1=repress / +1=activate)",
        min:-1, max:1, step:2, value:1,
        fmt: v => v > 0 ? "+1" : "-1",
        modes:["edge-features"]
      },
      {
        key:"aware", label:"edge-aware (1) vs blind (0)",
        min:0, max:1, step:1, value:1,
        fmt: v => +v === 1 ? "aware" : "blind",
        modes:["blind-vs-aware"]
      },
    ],

    metrics:[
      { key:"h_aware", label:"h\'ₓ aware",       accent:"green"  },
      { key:"h_blind", label:"h\'ₓ blind",        accent:"rose"   },
      { key:"gap",     label:"gap (aware−blind)", accent:"cyan"   },
      { key:"nTypes",  label:"# edge types",      accent:"violet" },
    ],

    layers:[
      { group:"nodes",  label:"Nodes"  },
      { group:"edges",  label:"Edges"  },
      { group:"labels", label:"Labels" },
    ],

    primary: {
      label:"Edge-blind ⇄ edge-aware",
      on: api => {
        const st = document.getElementById("ml-mode");
        if(st){ st.value = "blind-vs-aware"; st.dispatchEvent(new Event("change")); }
        api.setParam("aware", api.state.aware === 1 ? 0 : 1);
      }
    },
    secondary: {
      label:"Flip focus edge sign",
      on: api => {
        const st = document.getElementById("ml-mode");
        if(st){ st.value = "edge-features"; st.dispatchEvent(new Event("change")); }
        api.setParam("focusSign", api.state.focusSign > 0 ? -1 : 1);
      }
    },

    defaultCam: { theta:-0.4, phi:0.65, r:11 },

    hint: '<span style="color:#4dd7ff">cyan sphere</span> = GeneX target · '+
          'coloured spheres = neighbours · '+
          '<span style="color:#34d399">green edge</span> = activating · '+
          '<span style="color:#fb7185">rose edge</span> = repressing · '+
          'edge opacity ∝ confidence · '+
          '<span style="color:#fbbf24">amber ring</span> = focus edge (NNConv mode)',

    onParam(api){ api.frame([0, 0.5, 0], 11); },

    onSelect(api, d){
      if(d.role === "target"){
        api.setSelected(
          "GeneX · h\'ₓ_blind="+d.h_blind+" · h\'ₓ_aware="+d.h_aware
        );
      } else if(d.role === "neighbour"){
        api.setSelected(
          d.label+" ("+d.type+") · sign="+(+d.sign>0?"+1":"-1")+
          " conf="+d.conf+" h_j="+d.h_j+
          " · msg_blind="+d.msg_blind+" msg_aware="+d.msg_aware
        );
      }
    },

    build,

    snapshot(s){
      return {
        mode:        s.mode,
        neighbors:   Math.round(s.neighbors),
        focusConf:   +s.focusConfidence.toFixed(2),
        focusSign:   +s.focusSign,
        aware:       +s.aware,
        h_aware:     _snap.h_aware   != null ? _snap.h_aware   : 0,
        h_blind:     _snap.h_blind   != null ? _snap.h_blind   : 0,
        h_gap:       _snap.h_gap     != null ? _snap.h_gap     : 0,
        focus_msg:   _snap.focus_msg != null ? _snap.focus_msg : 0,
        nTypes:      _snap.nTypes    != null ? _snap.nTypes    : 0,
      };
    }
  });

})();
</script>
</body>
</html>
