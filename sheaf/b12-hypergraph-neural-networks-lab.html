<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B12 · Hypergraph neural networks</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random ──────────────────────────────────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── canonical worked example (note Section 5) ─────────────────────────────
  // First 5 are the curated regulatory program from note Section 5:
  //   A=TF1 B=TF2 C=GeneA D=GeneB E=StateMarker  (x_v = 0.8,0.6,0.2,0.4,0.9)
  // Members F..H extend the same module so size k can grow to 8 (clique → 28).
  const NAMES =["TF1","TF2","GeneA","GeneB","StateMarker","GeneC","GeneD","GeneE"];
  const SHORT =["A","B","C","D","E","F","G","H"];
  const BASEX =[0.8,0.6,0.2,0.4,0.9,0.3,0.5,0.7];   // node scalar features x_v
  const KIND  =["tf","tf","target","target","state","target","target","target"];

  let sceneSnap={};

  // mean aggregation over the first k members (deterministic)
  function meanFeat(k){
    let s=0; for(let i=0;i<k;i++) s+=BASEX[i];
    return s/k;
  }
  // group update x'_v = (1-mix) x_v + mix * m_e   (note uses mix=0.3)
  function updated(v,me,mix){ return (1-mix)*BASEX[v]+mix*me; }
  // clique expansion edge count k(k-1)/2
  function cliqueEdges(k){ return k*(k-1)/2; }

  // ── build ─────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const k    =Math.max(2,Math.min(8,Math.round(s.size)));   // hyperedge size
    const mix  =Math.max(0,Math.min(0.9,s.mix));              // group blend weight
    const conf =Math.max(0.1,Math.min(1,s.conf));             // hyperedge weight w_e
    const noise=Math.max(0,Math.min(0.6,s.noise));            // membership noise

    const gNodes =api.group("nodes");
    const gHyper =api.group("hyper");
    const gEdges =api.group("edges");
    const gLabels=api.group("labels");

    function addBig(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}
    function addSm (txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}

    const CY=new T.Color("#4dd7ff");   // TF / hyperedge route
    const GR=new T.Color("#34d399");   // target gene
    const AM=new T.Color("#fbbf24");   // state marker
    const VI=new T.Color("#a78bfa");   // group message / diffusion
    const RO=new T.Color("#fb7185");   // clique overclaim
    const SL=new T.Color("#54667c");
    const kindCol=kd=> kd==="tf"?CY : kd==="target"?GR : AM;

    // member ring positions (top k of the 5-gene program; deterministic)
    const R=3.6;
    const memberPos=[];
    for(let i=0;i<k;i++){
      const ang=-Math.PI/2 + i/k*Math.PI*2;
      memberPos.push(new T.Vector3(Math.cos(ang)*R,0,Math.sin(ang)*R));
    }
    // effective feature with deterministic noise (noise jitters membership trust)
    function effX(i){
      const j=(prand(i*9+3)-0.5)*2;              // [-1,1] deterministic
      return Math.max(0,Math.min(1,BASEX[i]+noise*j*0.5));
    }
    function meanEff(){
      let sum=0; for(let i=0;i<k;i++) sum+=effX(i);
      return sum/k;
    }

    // shared member-node drawing
    function drawMembers(yLift){
      for(let i=0;i<k;i++){
        const p=memberPos[i], col=kindCol(KIND[i]).clone();
        const x=effX(i);
        const sph=new T.Mesh(
          new T.SphereGeometry(0.22+0.20*x,18,14),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:0.55,roughness:0.4})
        );
        sph.position.set(p.x,yLift||0,p.z);
        gNodes.add(sph);
        api.pick(sph,{node:{i,name:NAMES[i],kind:KIND[i],x:+x.toFixed(3)}});
        addSm(SHORT[i]+"="+NAMES[i],kindCol(KIND[i]).getStyle(),0.34,p.x,(yLift||0)+0.62+0.20*x,p.z);
        addBig(x.toFixed(2),"#cfe0f0",0.95,p.x,(yLift||0)-0.62,p.z);
      }
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: incidence — ONE group relation (hyperedge + incidence column)
    // ════════════════════════════════════════════════════════════════
    if(mode==="incidence"){
      drawMembers(0);

      // hyperedge state node + spokes to each member
      const hub=new T.Mesh(new T.SphereGeometry(0.55,22,16),
        new T.MeshStandardMaterial({color:VI,emissive:VI,emissiveIntensity:0.6,roughness:0.3,transparent:true,opacity:0.92}));
      gHyper.add(hub);
      api.pick(hub,{hyper:{mean:+meanEff().toFixed(3),degree:k}});
      addBig("e₁ (w="+conf.toFixed(2)+")","#a78bfa",1.35,0,1.15,0);

      // translucent membership disc shows the GROUP boundary
      const disc=new T.Mesh(new T.CircleGeometry(R+0.5,Math.max(8,k*4)),
        new T.MeshBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.10,side:T.DoubleSide}));
      disc.rotation.x=-Math.PI/2; disc.position.y=-0.02; gHyper.add(disc);

      for(let i=0;i<k;i++){
        const p=memberPos[i];
        const sp=[new T.Vector3(0,0,0),new T.Vector3(p.x,0,p.z)];
        gHyper.add(new T.Line(new T.BufferGeometry().setFromPoints(sp),
          new T.LineBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.45+0.45*conf})));
      }

      // incidence column H[:,e1] floating to the side (one column of ones)
      const colX=R+2.6;
      addBig("H[:,e₁]","#4dd7ff",1.2,colX,2.7,0);
      for(let i=0;i<k;i++){
        const cy=2.0 - i*0.95;
        const tile=new T.Mesh(new T.BoxGeometry(0.8,0.7,0.12),
          new T.MeshStandardMaterial({color:CY,emissive:CY,emissiveIntensity:0.4,roughness:0.4}));
        tile.position.set(colX,cy,0); gHyper.add(tile);
        addBig("1","#071015",1.1,colX,cy,0.10);
        addSm(SHORT[i],"#8a99ad",0.32,colX-0.85,cy,0);
      }

      const me=meanEff();
      sceneSnap={mode,size:k,mix:+mix.toFixed(2),conf:+conf.toFixed(2),noise:+noise.toFixed(2),
        cliqueEdges:cliqueEdges(k),groupMean:+me.toFixed(3),hyperDegree:k,maxShift:0};

      return {
        badge:"Incidence · one hyperedge · |e₁|="+k,
        formula:"e₁ = {"+SHORT.slice(0,k).join(", ")+"}  →  H[v,e₁]=1,  δ(e₁)="+k,
        insight:"One hyperedge records that "+k+" entities share <b>one</b> regulatory program. The incidence column H[:,e₁] holds a single 1 per member — it claims co-membership, not pairwise interaction. The weight w="+conf.toFixed(2)+" is curation confidence; δ(e₁)="+k+" is the hyperedge degree.",
        state:"Hyperedge degree δ(e₁) = "+k+". Group mean of member features = "+me.toFixed(3)+". This is ONE relation, not "+cliqueEdges(k)+" pairwise claims.",
        metrics:{cliqueEdges:""+cliqueEdges(k),groupMean:me.toFixed(3),hyperDegree:""+k,maxShift:"0.000"},
        focus:{center:[1.2,0.3,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: clique — pairwise overclaim, edge explosion k(k-1)/2
    // ════════════════════════════════════════════════════════════════
    if(mode==="clique"){
      drawMembers(0);

      // draw every pair as a pairwise edge (the overclaim)
      for(let i=0;i<k;i++){
        for(let j=i+1;j<k;j++){
          const a=memberPos[i], b=memberPos[j];
          // a fake pair like TF1–StateMarker is highlighted in rose
          const fake=(KIND[i]==="state"||KIND[j]==="state")||(KIND[i]==="tf"&&KIND[j]==="target"&&prand(i*5+j)>0.5);
          const col=fake?RO:SL;
          const ln=new T.Line(new T.BufferGeometry().setFromPoints([a.clone(),b.clone()]),
            new T.LineBasicMaterial({color:col.getHex(),transparent:true,opacity:fake?0.85:0.5}));
          gEdges.add(ln);
        }
      }
      addBig("k(k−1)/2 = "+cliqueEdges(k)+" pairs","#fb7185",1.3,0,2.4,0);
      addBig("invented pairwise structure","#fb7185",1.05,0,-2.7,0);

      const hasState=k>=5;
      sceneSnap={mode,size:k,mix:+mix.toFixed(2),conf:+conf.toFixed(2),noise:+noise.toFixed(2),
        cliqueEdges:cliqueEdges(k),groupMean:+meanEff().toFixed(3),hyperDegree:k,maxShift:0};

      return {
        badge:"Clique expansion · "+cliqueEdges(k)+" pairwise edges",
        formula:"clique_edges(k) = k(k−1)/2 = "+k+"·"+(k-1)+"/2 = "+cliqueEdges(k),
        insight:"Flattening the same group into pairwise edges manufactures <b>"+cliqueEdges(k)+"</b> relationships from <b>one</b> membership fact. Rose edges (e.g. TF1–StateMarker) are pairs the data never measured. Edge count grows quadratically: k=5→10, k=8→28.",
        state:"k = "+k+" members → "+cliqueEdges(k)+" pairwise edges"+(hasState?". The pair TF1–StateMarker is a false direct interaction.":"."),
        metrics:{cliqueEdges:""+cliqueEdges(k),groupMean:meanEff().toFixed(3),hyperDegree:""+k,maxShift:"0.000"},
        focus:{center:[0,0.3,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: message — node → hyperedge → node diffusion (HGNN)
    // ════════════════════════════════════════════════════════════════
    // mode==="message"
    drawMembers(0);

    const me=meanEff();
    const hubY=2.6;
    const hub=new T.Mesh(new T.SphereGeometry(0.45+0.5*me,22,16),
      new T.MeshStandardMaterial({color:VI,emissive:VI,emissiveIntensity:0.7,roughness:0.3}));
    hub.position.set(0,hubY,0); gHyper.add(hub);
    api.pick(hub,{hyper:{mean:+me.toFixed(3),degree:k}});
    addBig("mₑ = "+me.toFixed(2),"#a78bfa",1.4,0,hubY+0.95,0);
    addSm("AGG({xᵥ : v ∈ e})","#8a99ad",0.36,0,hubY+0.45,0);

    // step 1: nodes → hyperedge (cyan up-lines)
    for(let i=0;i<k;i++){
      const p=memberPos[i];
      const from=new T.Vector3(p.x,0.25,p.z), to=new T.Vector3(0,hubY-0.5,0);
      gHyper.add(new T.Line(new T.BufferGeometry().setFromPoints([from,to]),
        new T.LineBasicMaterial({color:CY.getHex(),transparent:true,opacity:0.55})));
    }

    // step 2: hyperedge → nodes (violet update) + show x'_v shift bar
    let maxShift=0, shiftC=0, shiftE=0;
    for(let i=0;i<k;i++){
      const p=memberPos[i];
      const xv=effX(i);
      const xp=(1-mix)*xv+mix*me;        // updated feature
      const sh=xp-xv;
      if(Math.abs(sh)>Math.abs(maxShift)) maxShift=sh;
      if(SHORT[i]==="C") shiftC=xp;
      if(SHORT[i]==="E") shiftE=xp;

      const pull = sh>=0 ? GR : AM;       // green pulled up, amber pulled down
      const cone=new T.Mesh(new T.ConeGeometry(0.12,0.42,10),new T.MeshBasicMaterial({color:VI.getHex()}));
      cone.position.set(p.x*0.7,hubY*0.5,p.z*0.7); cone.lookAt(p.x,0.2,p.z); cone.rotateX(Math.PI/2);
      gHyper.add(cone);

      const bh=Math.max(0.04,Math.abs(sh)*4.5);
      const bar=new T.Mesh(new T.BoxGeometry(0.16,bh,0.16),
        new T.MeshStandardMaterial({color:pull,emissive:pull,emissiveIntensity:0.6,roughness:0.4}));
      bar.position.set(p.x,(sh>=0? bh/2 : -bh/2)+0.02,p.z);
      gNodes.add(bar);
      addBig("x'="+xp.toFixed(2),pull.getStyle(),0.95,p.x,(sh>=0?bh+0.35:-bh-0.35),p.z);
    }

    addBig("x'ᵥ = "+(1-mix).toFixed(1)+"·xᵥ + "+mix.toFixed(1)+"·mₑ","#a78bfa",1.2,0,-3.0,0);

    sceneSnap={mode,size:k,mix:+mix.toFixed(2),conf:+conf.toFixed(2),noise:+noise.toFixed(2),
      cliqueEdges:cliqueEdges(k),groupMean:+me.toFixed(3),hyperDegree:k,maxShift:+maxShift.toFixed(3),
      xprimeC:+shiftC.toFixed(3),xprimeE:+shiftE.toFixed(3)};

    return {
      badge:"Message passing · node→hyperedge→node · mix="+mix.toFixed(2),
      formula:"mₑ="+me.toFixed(2)+" ;  x'ᵥ = "+(1-mix).toFixed(1)+"·xᵥ + "+mix.toFixed(1)+"·"+me.toFixed(2),
      insight:"Each member sends its feature up to the hyperedge state mₑ="+me.toFixed(2)+" (cyan), then receives a group-aware update (violet). Low targets are pulled <span style='color:#34d399'>up</span>, the high marker is pulled <span style='color:#fbbf24'>down</span> toward the group. Large hyperedges or high noise over-smear unrelated biology.",
      state:"mₑ = "+me.toFixed(3)+". x'_C = "+shiftC.toFixed(3)+", x'_E = "+shiftE.toFixed(3)+". Max feature shift = "+maxShift.toFixed(3)+" (diffusion strength).",
      metrics:{cliqueEdges:""+cliqueEdges(k),groupMean:me.toFixed(3),hyperDegree:""+k,maxShift:maxShift.toFixed(3)},
      focus:{center:[0,1.0,0],radius:14}
    };
  }

  // ── MathLab.create ──────────────────────────────────────────────────────
  MathLab.create({
    id:"b12",
    kind:"hypergraph-neural-networks",
    eyebrow:"Block B · GNN Architectures",
    title:"B12 · Hypergraph neural networks",
    subtitle:"One hyperedge is one group relation, not many pairwise claims. Three views on the same 5-gene regulatory program: the incidence object, clique-expansion overclaim, and node→hyperedge→node message passing.",
    selectedLabel:"Element",
    selectedHint:"Click a member node or the hyperedge state.",
    insightLabel:"Reading the hypergraph",
    modes:[
      {value:"incidence",label:"Incidence (one group relation)"},
      {value:"clique",   label:"Clique expansion (pairwise overclaim)"},
      {value:"message",  label:"Message passing (node→edge→node)"}
    ],
    params:[
      {key:"size", label:"hyperedge size |e| (k)",min:2,max:8,step:1,value:5,
       fmt:v=>Math.round(v)+" members"},
      {key:"mix",  label:"group blend weight (mix)",min:0,max:0.9,step:0.05,value:0.3,
       fmt:v=>v.toFixed(2),modes:["message"]},
      {key:"conf", label:"hyperedge confidence w_e",min:0.1,max:1,step:0.05,value:0.8,
       fmt:v=>v.toFixed(2),modes:["incidence"]},
      {key:"noise",label:"membership noise",min:0,max:0.6,step:0.05,value:0,
       fmt:v=>v.toFixed(2),modes:["message","incidence"]}
    ],
    metrics:[
      {key:"cliqueEdges",label:"Pairwise edges if expanded",accent:"rose"},
      {key:"hyperDegree",label:"Hyperedge degree δ(e)",accent:"violet"},
      {key:"groupMean",  label:"Group mean mₑ",accent:"cyan"},
      {key:"maxShift",   label:"Max feature shift",accent:"amber"}
    ],
    layers:[
      {group:"nodes", label:"Member nodes"},
      {group:"hyper", label:"Hyperedge / incidence"},
      {group:"edges", label:"Clique edges"},
      {group:"labels",label:"Labels"}
    ],
    primary:{
      label:"k = 5 (note example)",
      on:api=>{api.setParam("size",5);}
    },
    secondary:{
      label:"k = 8 (28 pairs)",
      on:api=>{api.setParam("size",8);}
    },
    defaultCam:{theta:-0.5,phi:0.7,r:13},
    hint:'<span style="color:#4dd7ff">cyan</span>=TF · <span style="color:#34d399">green</span>=target gene · <span style="color:#fbbf24">amber</span>=state marker · <span style="color:#a78bfa">violet</span>=hyperedge / group message · <span style="color:#fb7185">rose</span>=invented pairwise edge.',
    onParam(api){
      const s=api.state;
      if(s.mode==="message") api.frame([0,1.0,0],14);
      else if(s.mode==="incidence") api.frame([1.2,0.3,0],13);
      else api.frame([0,0.3,0],13);
    },
    onSelect(api,d){
      if(d.node)  api.setSelected(d.node.name+" ("+d.node.kind+") · x="+d.node.x);
      if(d.hyper) api.setSelected("Hyperedge state · mₑ="+d.hyper.mean+" · δ(e)="+d.hyper.degree);
    },
    build,
    snapshot(s){
      const k=Math.max(2,Math.min(8,Math.round(s.size)));
      const mix=Math.max(0,Math.min(0.9,s.mix));
      const me=meanFeat(k);
      return {
        mode:s.mode,
        size:k,
        mix:+mix.toFixed(2),
        conf:+Math.max(0.1,Math.min(1,s.conf)).toFixed(2),
        noise:+Math.max(0,Math.min(0.6,s.noise)).toFixed(2),
        cliqueEdges:cliqueEdges(k),
        hyperDegree:k,
        groupMean:+me.toFixed(3),
        xprimeC:+updated(2,me,mix).toFixed(3),
        xprimeE:+updated(4,me,mix).toFixed(3),
        quadraticExplosion:cliqueEdges(k)>k
      };
    }
  });
})();
</script>
</body>
</html>
