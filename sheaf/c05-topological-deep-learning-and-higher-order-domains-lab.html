<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C05 · Topological deep learning and higher-order domains</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random ──────────────────────────────────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── FACTS · the note's Section-5 worked example (one regulatory triangle) ──
  // nodes  0=TF  1=GeneA  2=GeneB
  // edges  e0=TF→GeneA  e1=GeneA→GeneB  e2=TF→GeneB
  // B1 (nodes×edges):           B2 (edges×face f0):
  //          e0  e1  e2                 f0
  //   TF     -1   0  -1          e0      1
  //   GeneA   1  -1   0          e1      1
  //   GeneB   0   1   1          e2     -1
  // base edge signal x_edge = [0.8, 0.5, 0.1]  (strong / moderate / weak)
  // upper Hodge term  B2^T x_edge = 1*0.8 + 1*0.5 − 1*0.1 = 1.2  (curl around face)
  const B1=[[-1,0,-1],[1,-1,0],[0,1,1]];          // 3 nodes × 3 edges
  const B2=[1,1,-1];                               // 3 edges × 1 face
  const EDGES=[[0,1],[1,2],[0,2]];                 // endpoints (oriented u→v)
  const XBASE=[0.8,0.5,0.1];                       // default edge flow
  const NODE_NAMES=["TF","GeneA","GeneB"];

  // 3D positions of the triangle (a regulatory motif), TF at apex
  const POS=[[0,2.0,0],[-2.4,-1.4,0],[2.4,-1.4,0]];

  let sceneSnap={};

  // current edge flow given amplitude + a deterministic "noise" perturbation
  function edgeFlow(amp,noise){
    return XBASE.map((x,i)=>{
      const n=(prand(i*7+11)-0.5)*2*noise;     // deterministic ±noise
      return +(x*amp+n).toFixed(4);
    });
  }
  // gradient term  Σ |x_v − x_u|  weighted by boundary strength (lower adjacency)
  function lowerEnergy(x,bs){
    // L1 lower part uses B1^T B1 ; here we read it as endpoint disagreement
    let e=0;
    for(let i=0;i<3;i++){const [u,v]=EDGES[i];e+=Math.abs(x[i]); }
    // node potentials from divergence  B1 x  (how much flow piles up at a node)
    let div=[0,0,0];
    for(let n=0;n<3;n++){for(let i=0;i<3;i++) div[n]+=B1[n][i]*x[i];}
    const piles=div.reduce((a,d)=>a+d*d,0);
    return bs*piles;
  }
  // curl term around the face  (B2^T x)^2  weighted by face weight (upper adjacency)
  function curlValue(x){ return B2[0]*x[0]+B2[1]*x[1]+B2[2]*x[2]; }
  function upperEnergy(x,fw,facePresent){
    if(!facePresent) return 0;
    const c=curlValue(x);
    return fw*c*c;
  }

  // ── build ────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const fw=s.faceWeight;          // 0..1   upper-adjacency weight
    const bs=s.boundary;            // 0..1   lower-adjacency weight
    const amp=s.amplitude;          // 0.2..1.5  edge-signal scale
    const noise=s.noise;            // 0..0.6 deterministic perturbation
    const layer=Math.round(s.layer);// 0=nodes 1=edges 2=faces (hodge mode)

    const gGraph =api.group("graph");
    const gFace  =api.group("face");
    const gFlow  =api.group("flow");
    const gBars  =api.group("bars");
    const gLabels=api.group("labels");

    function addBig(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function addSm(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff");   // nodes
    const AM=new T.Color("#fbbf24");    // edges
    const GR=new T.Color("#34d399");    // faces / consistent
    const RO=new T.Color("#fb7185");    // inconsistency / curl
    const VI=new T.Color("#a78bfa");    // boundary / gates
    const SL=new T.Color("#54667c");

    const x=edgeFlow(amp,noise);
    const curl=curlValue(x);
    const facePresent=(mode==="simplicial"||mode==="hodge"||(mode==="decision"&&Math.round(s.faceJustified)===1));

    // ── shared scaffold: nodes + edges (drawn in every mode) ────────────────
    function drawNodes(){
      for(let i=0;i<3;i++){
        const p=POS[i];
        const sph=new T.Mesh(new T.SphereGeometry(0.34,18,14),
          new T.MeshStandardMaterial({color:CY,emissive:CY.clone().multiplyScalar(0.6),emissiveIntensity:0.6,roughness:0.4}));
        sph.position.set(p[0],p[1],p[2]);
        gGraph.add(sph);
        api.pick(sph,{node:{id:i,name:NODE_NAMES[i]}});
        addBig(NODE_NAMES[i],"#dff3ff",1.25,p[0],p[1]+0.62,p[2]);
      }
    }
    function drawEdges(){
      for(let i=0;i<3;i++){
        const [u,v]=EDGES[i];
        const a=new T.Vector3(...POS[u]), b=new T.Vector3(...POS[v]);
        const sig=x[i];
        const inten=Math.min(1,Math.abs(sig));
        const col=sig>=0?AM.clone():CY.clone();
        // edge as oriented arrow (flow direction u→v)
        const mid=a.clone().lerp(b,0.5);
        const dir=b.clone().sub(a).normalize();
        const len=a.distanceTo(b);
        const cyl=new T.Mesh(new T.CylinderGeometry(0.05+0.07*inten,0.05+0.07*inten,len*0.78,10),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.4+0.5*inten,roughness:0.4}));
        cyl.position.copy(mid);
        cyl.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);
        gGraph.add(cyl);
        api.pick(cyl,{edge:{id:i,from:NODE_NAMES[u],to:NODE_NAMES[v],flow:+sig.toFixed(3)}});
        // arrowhead
        const cone=new T.Mesh(new T.ConeGeometry(0.14,0.34,10),new T.MeshBasicMaterial({color:col}));
        cone.position.copy(a.clone().lerp(b,0.80));
        cone.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);
        gGraph.add(cone);
        addSm("e"+i+" "+sig.toFixed(2),col.getStyle(),0.36,mid.x,mid.y+0.28,mid.z);
      }
    }
    drawNodes(); drawEdges();

    // ── the filled 2-cell (face) ────────────────────────────────────────────
    function drawFace(){
      const geo=new T.BufferGeometry();
      const verts=new Float32Array([...POS[0],...POS[1],...POS[2]]);
      geo.setAttribute("position",new T.BufferAttribute(verts,3));
      geo.setIndex([0,1,2]); geo.computeVertexNormals();
      // colour the face by consistency: green if |curl| small, red if large
      const incon=Math.min(1,Math.abs(curl)/1.4);
      const faceCol=GR.clone().lerp(RO,incon);
      const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:faceCol,emissive:faceCol.clone().multiplyScalar(0.5),
        emissiveIntensity:0.35+0.45*incon*fw,roughness:0.5,transparent:true,opacity:0.30+0.40*fw,side:T.DoubleSide}));
      gFace.add(m);
      api.pick(m,{face:{name:"f0 = [TF,GeneA,GeneB]",curl:+curl.toFixed(3)}});
      addBig("f0","#bdf5d8",1.2,0,0.05,0);
    }

    // ════════════════════════════════════════════════════════════════════════
    // MODE: pairwise — triangle of edges only, no face. L1 has no upper term.
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="pairwise"){
      const lower=lowerEnergy(x,bs);
      const energy=lower;                 // upper term absent
      addBig("pairwise graph G=(V,E)","#9fe0ff",1.25,0,3.0,0);
      addBig("no face → L1 = B1ᵀB1","#fbbf24",1.05,0,-2.7,0);

      sceneSnap={mode,facePresent:0,layer:1,faceWeight:+fw.toFixed(2),boundary:+bs.toFixed(2),
        amplitude:+amp.toFixed(2),noise:+noise.toFixed(2),
        curl:+curl.toFixed(3),hodgeEnergy:+energy.toFixed(3),lowerEnergy:+lower.toFixed(3),upperEnergy:0,faceJustified:0};

      return {
        badge:"Pairwise graph · 3 nodes · 3 edges · no face",
        formula:"L₀ = B₁B₁ᵀ &nbsp; (only pairwise structure; B₂ absent)",
        insight:"As a pairwise graph this is just a triangle of oriented edges TF→GeneA→GeneB and TF→GeneB. The model can smooth node signals and process edges, but it has no object for the group. It cannot ask whether the three edges are internally consistent around the motif — there is no face, so the upper Hodge term B₂B₂ᵀ does not exist.",
        state:"Edge flow x = ["+x.map(v=>v.toFixed(2)).join(", ")+"]. Lower energy "+lower.toFixed(2)+". Curl is uncomputable: no face → group consistency is invisible.",
        metrics:{
          hodgeEnergy:energy.toFixed(2),
          curl:"—",
          higherOrder:"0%",
          caution:"flattened"
        },
        focus:{center:[0,0.2,0],radius:9}
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // MODE: simplicial — add the filled face. B2 appears; curl = B2ᵀ x_edge.
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="simplicial"){
      drawFace();
      const lower=lowerEnergy(x,bs);
      const upper=upperEnergy(x,fw,true);
      const energy=lower+upper;
      addBig("simplicial complex X=(X₀,X₁,X₂)","#9fe0ff",1.2,0,3.0,0);
      // curl read-out floating over the face
      const incon=Math.abs(curl);
      addBig("B₂ᵀx = "+curl.toFixed(2),(incon>0.6?"#fb7185":"#34d399"),1.35,0,-2.75,0);

      sceneSnap={mode,facePresent:1,layer:1,faceWeight:+fw.toFixed(2),boundary:+bs.toFixed(2),
        amplitude:+amp.toFixed(2),noise:+noise.toFixed(2),
        curl:+curl.toFixed(3),hodgeEnergy:+energy.toFixed(3),lowerEnergy:+lower.toFixed(3),upperEnergy:+upper.toFixed(3),faceJustified:1};

      return {
        badge:"Simplicial complex · face f0 added · curl "+curl.toFixed(2),
        formula:"L₁ = B₁ᵀB₁ + B₂B₂ᵀ &nbsp;·&nbsp; B₂ᵀx = +0.8 +0.5 −0.1 = 1.20",
        insight:"Filling the triangle adds a 2-cell f0 with its boundary map B₂ = [1, 1, −1]ᵀ. Now the upper Hodge term exists. B₂ᵀx measures curl around the face: at the base signal it equals 1.20 — the oriented edge flows do NOT cancel, so this module has a strong directional pattern that a graph-only model would silently smooth away. Raise Face weight to let that group inconsistency dominate the energy.",
        state:"Curl B₂ᵀx = "+curl.toFixed(2)+(Math.abs(curl)>0.6?" → inconsistent loop (red face)":" → consistent (green face)")+". Upper energy "+upper.toFixed(2)+", lower "+lower.toFixed(2)+", total "+energy.toFixed(2)+".",
        metrics:{
          hodgeEnergy:energy.toFixed(2),
          curl:curl.toFixed(2),
          higherOrder:"100%",
          caution:Math.abs(curl)>0.8?"inspect":Math.abs(curl)>0.4?"watch":"low"
        },
        focus:{center:[0,0.2,0],radius:9}
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // MODE: hodge — signal layer k ∈ {0 nodes, 1 edges, 2 faces}. Energy across
    // dimensions; bars show how lower vs upper terms enter each L_k.
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="hodge"){
      drawFace();
      const lower=lowerEnergy(x,bs);
      const upper=upperEnergy(x,fw,true);
      // energies per layer (schematic, derived from the worked numbers)
      const nodeDiv=[0,0,0];
      for(let n=0;n<3;n++){for(let i=0;i<3;i++) nodeDiv[n]+=B1[n][i]*x[i];}
      const E0=bs*nodeDiv.reduce((a,d)=>a+d*d,0);     // L0 acts on node cochains
      const E1=lower+upper;                            // L1 acts on edge cochains
      const E2=fw*curl*curl;                           // L2 ~ B2ᵀB2 on the face cochain
      const Es=[E0,E1,E2];
      const labels=["L₀ nodes","L₁ edges","L₂ faces"];
      const cols=[CY,AM,GR];
      const xPos=[-3.0,0,3.0];

      // mini bars showing energy at each dimension; active layer highlighted
      Es.forEach((E,k)=>{
        const h=0.2+Math.min(3.6,E)*0.9;
        const active=(k===layer);
        const col=cols[k];
        const bar=new T.Mesh(new T.BoxGeometry(1.3,h,1.3),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(active?0.8:0.2),
            emissiveIntensity:active?0.7:0.18,roughness:0.4,transparent:!active,opacity:active?1:0.4}));
        bar.position.set(xPos[k],h/2-2.6,0);
        gBars.add(bar);
        api.pick(bar,{layer:{k,name:labels[k],energy:+E.toFixed(3),active}});
        addBig(E.toFixed(2),col.getStyle(),1.25,xPos[k],h-2.0,0);
        addSm(labels[k],col.getStyle(),0.40,xPos[k],-2.95,0);
      });
      // active-layer marker arrow
      const aH=0.2+Math.min(3.6,Es[layer])*0.9;
      const arw=new T.Mesh(new T.ConeGeometry(0.15,0.4,8),new T.MeshBasicMaterial({color:0xfde68a}));
      arw.position.set(xPos[layer],aH-2.6+0.7,0); arw.rotation.x=Math.PI; gFlow.add(arw);
      addBig("signal on "+labels[layer].split(" ")[1],cols[layer].getStyle(),1.1,0,3.05,0);

      const Eact=Es[layer];
      sceneSnap={mode,facePresent:1,layer,faceWeight:+fw.toFixed(2),boundary:+bs.toFixed(2),
        amplitude:+amp.toFixed(2),noise:+noise.toFixed(2),
        curl:+curl.toFixed(3),hodgeEnergy:+Eact.toFixed(3),lowerEnergy:+lower.toFixed(3),upperEnergy:+upper.toFixed(3),
        E0:+E0.toFixed(3),E1:+E1.toFixed(3),E2:+E2.toFixed(3),faceJustified:1};

      return {
        badge:"Hodge Laplacian · "+labels[layer]+" · E="+Eact.toFixed(2),
        formula:"Lₖ = BₖᵀBₖ + Bₖ₊₁Bₖ₊₁ᵀ &nbsp;·&nbsp; L₁ = B₁ᵀB₁ + B₂B₂ᵀ",
        insight:"A signal can live on any dimension. L₀ on nodes is the ordinary graph Laplacian B₁B₁ᵀ. L₁ on edges is constrained from below by endpoints (B₁ᵀB₁) and from above by the face (B₂B₂ᵀ) — this is the key edge-flow operator. L₂ on the face uses B₂ᵀB₂. Switch the Signal layer slider to move the highlighted bar and read the energy the Hodge operator assigns at that dimension.",
        state:"Active layer "+labels[layer]+": energy "+Eact.toFixed(2)+". Lower (endpoints) "+lower.toFixed(2)+", upper (face) "+upper.toFixed(2)+", curl "+curl.toFixed(2)+".",
        metrics:{
          hodgeEnergy:Eact.toFixed(2),
          curl:curl.toFixed(2),
          higherOrder:layer===0?"node":layer===1?"edge":"face",
          caution:Math.abs(curl)>0.8?"inspect":"ok"
        },
        focus:{center:[0,-0.4,0],radius:9.5}
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // MODE: decision — the four gates that justify a face (Section 6). A face is
    // only honest topology when it is curated, carries a signal, drives the
    // operator, and survives a leakage check. Toggle faceJustified.
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="decision"){
      const justified=Math.round(s.faceJustified)===1;
      if(justified) drawFace();
      else {
        // ghost face: present in the file but not in the learning problem
        const geo=new T.BufferGeometry();
        const verts=new Float32Array([...POS[0],...POS[1],...POS[2]]);
        geo.setAttribute("position",new T.BufferAttribute(verts,3));
        geo.setIndex([0,1,2]); geo.computeVertexNormals();
        const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:SL,emissive:SL.clone().multiplyScalar(0.2),
          emissiveIntensity:0.12,roughness:0.6,transparent:true,opacity:0.10,side:T.DoubleSide}));
        gFace.add(m);
        addBig("decorative face (ignored)","#7f93a8",1.0,0,0.05,0);
      }
      // four gates as small panels above the motif
      const gates=[
        {q:"curated?",ok:justified,col:GR},
        {q:"has signal?",ok:justified,col:CY},
        {q:"drives B₂?",ok:justified,col:AM},
        {q:"leakage-safe?",ok:justified,col:VI}
      ];
      gates.forEach((g,i)=>{
        const gx=(i-1.5)*1.85;
        const col=g.ok?g.col:RO;
        const box=new T.Mesh(new T.BoxGeometry(1.5,0.5,0.16),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:g.ok?0.6:0.4,roughness:0.4}));
        box.position.set(gx,3.1,0);
        gBars.add(box);
        api.pick(box,{gate:{q:g.q,pass:g.ok}});
        addSm((g.ok?"✓ ":"✗ ")+g.q,g.ok?col.getStyle():"#fda4b0",0.34,gx,3.1,0.2);
      });

      const lower=lowerEnergy(x,bs);
      const upper=justified?upperEnergy(x,fw,true):0;
      const energy=lower+upper;
      const gatesPassed=justified?4:0;
      addBig(justified?"face changes the computation":"face is documentation, not topology",
        (justified?"#34d399":"#fb7185"),1.05,0,-2.8,0);

      sceneSnap={mode,facePresent:justified?1:0,layer:1,faceWeight:+fw.toFixed(2),boundary:+bs.toFixed(2),
        amplitude:+amp.toFixed(2),noise:+noise.toFixed(2),
        curl:+curl.toFixed(3),hodgeEnergy:+energy.toFixed(3),lowerEnergy:+lower.toFixed(3),upperEnergy:+upper.toFixed(3),
        faceJustified:justified?1:0,gatesPassed};

      return {
        badge:"Decision gates · "+gatesPassed+"/4 passed · "+(justified?"honest face":"decorative"),
        formula:"add face ⇔ curated ∧ carries-signal ∧ uses-B₂ ∧ leakage-safe",
        insight:"Adding a face is easy; justifying one is hard. Four gates decide: (1) is the group a curated/measured object, not a thresholded triangle; (2) does it carry a signal not reducible to its edges; (3) does it change the computation through B₂, L₁, or pooling; (4) does evaluation stay honest — a held-out edge hidden in a face leaks labels. When justified, B₂ enters and the upper energy "+upper.toFixed(2)+" appears; when not, the face is a grey ghost the operator ignores.",
        state:justified?("Justified: B₂ active, upper energy "+upper.toFixed(2)+", total "+energy.toFixed(2)+". Curl "+curl.toFixed(2)+".")
                       :("Decorative: B₂ ignored, upper energy 0, only pairwise energy "+lower.toFixed(2)+". The face is in the file but absent from learning."),
        metrics:{
          hodgeEnergy:energy.toFixed(2),
          curl:justified?curl.toFixed(2):"—",
          higherOrder:gatesPassed*25+"%",
          caution:justified?"honest":"leak risk"
        },
        focus:{center:[0,0.4,0],radius:9.5}
      };
    }

    return {badge:"C05",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:9}};
  }

  // ── MathLab.create ────────────────────────────────────────────────────────
  MathLab.create({
    id:"c05",
    kind:"topological-higher-order",
    eyebrow:"Block C · Geometric & Topological DL",
    title:"C05 · Topological deep learning and higher-order domains",
    subtitle:"One regulatory triangle TF→GeneA→GeneB. Watch the domain change from a pairwise graph to a simplicial complex with a filled face, then read the Hodge Laplacian and the gates that justify higher-order structure.",
    selectedLabel:"Element",
    selectedHint:"Click a node, edge, face, energy bar, or gate.",
    modes:[
      {value:"pairwise",   label:"Pairwise graph (no face)"},
      {value:"simplicial", label:"Add face → simplicial complex"},
      {value:"hodge",      label:"Hodge Laplacian (signal layers)"},
      {value:"decision",   label:"Decision gates (justify the face)"}
    ],
    params:[
      {key:"faceWeight",label:"face weight  (upper adjacency B₂B₂ᵀ)",min:0,max:1,step:0.05,value:0.70,
       fmt:v=>v.toFixed(2),modes:["simplicial","hodge","decision"]},
      {key:"boundary",  label:"boundary strength  (lower adjacency B₁ᵀB₁)",min:0,max:1,step:0.05,value:0.80,
       fmt:v=>v.toFixed(2)},
      {key:"amplitude", label:"signal amplitude  (scales x_edge)",min:0.2,max:1.5,step:0.05,value:1.0,
       fmt:v=>v.toFixed(2)},
      {key:"noise",     label:"noise  (deterministic perturbation)",min:0,max:0.6,step:0.02,value:0.0,
       fmt:v=>v.toFixed(2)},
      {key:"layer",     label:"signal layer  (0 nodes · 1 edges · 2 faces)",min:0,max:2,step:1,value:1,
       fmt:v=>["nodes","edges","faces"][Math.round(v)],modes:["hodge"]},
      {key:"faceJustified",label:"face justified?  (0 decorative · 1 honest)",min:0,max:1,step:1,value:1,
       fmt:v=>Math.round(v)===1?"honest":"decorative",modes:["decision"]}
    ],
    metrics:[
      {key:"hodgeEnergy", label:"Hodge energy xᵀLₖx",accent:"cyan"},
      {key:"curl",        label:"Curl  B₂ᵀx",accent:"rose"},
      {key:"higherOrder", label:"Higher-order content",accent:"green"},
      {key:"caution",     label:"Biology caution",accent:"amber"}
    ],
    layers:[
      {group:"graph",  label:"Nodes & edges"},
      {group:"face",   label:"Filled face (2-cell)"},
      {group:"flow",   label:"Flow markers"},
      {group:"bars",   label:"Energy bars / gates"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Reset signal x=[0.8,0.5,0.1]",
      on:api=>{api.setParam("amplitude",1.0);api.setParam("noise",0.0);}
    },
    secondary:{
      label:"Max face weight",
      on:api=>{api.setParam("faceWeight",1.0);}
    },
    defaultCam:{theta:-0.35,phi:0.5,r:9.5},
    hint:'<span style="color:#4dd7ff">cyan</span>=nodes/L₀ · <span style="color:#fbbf24">amber</span>=edges/flow · <span style="color:#34d399">green</span>=face/consistent · <span style="color:#fb7185">rose</span>=curl/inconsistency · <span style="color:#a78bfa">violet</span>=leakage gate. Worked example: B₂ᵀx = 1.20.',
    onParam(api){
      const s=api.state;
      if(s.mode==="hodge") api.frame([0,-0.4,0],9.5);
      else if(s.mode==="decision") api.frame([0,0.4,0],9.5);
      else api.frame([0,0.2,0],9);
    },
    onSelect(api,d){
      if(d.node)  api.setSelected("Node "+d.node.id+" · "+d.node.name);
      if(d.edge)  api.setSelected("Edge e"+d.edge.id+" · "+d.edge.from+"→"+d.edge.to+" · flow "+d.edge.flow);
      if(d.face)  api.setSelected(d.face.name+" · curl B₂ᵀx = "+d.face.curl);
      if(d.layer) api.setSelected(d.layer.name+" · energy "+d.layer.energy+(d.layer.active?" · ACTIVE":""));
      if(d.gate)  api.setSelected("Gate \""+d.gate.q+"\" · "+(d.gate.pass?"PASS":"FAIL"));
    },
    build,
    snapshot(s){
      const fw=s.faceWeight, bs=s.boundary, amp=s.amplitude, noise=s.noise;
      const layer=Math.round(s.layer);
      const x=edgeFlow(amp,noise);
      const curl=curlValue(x);
      const facePresent=(s.mode==="simplicial"||s.mode==="hodge"||(s.mode==="decision"&&Math.round(s.faceJustified)===1))?1:0;
      const lower=lowerEnergy(x,bs);
      const upper=facePresent?upperEnergy(x,fw,true):0;
      return {
        mode:s.mode,
        facePresent,
        layer,
        faceWeight:+fw.toFixed(2),
        boundary:+bs.toFixed(2),
        amplitude:+amp.toFixed(2),
        noise:+noise.toFixed(2),
        curl:+curl.toFixed(3),
        lowerEnergy:+lower.toFixed(3),
        upperEnergy:+upper.toFixed(3),
        hodgeEnergy:+(lower+upper).toFixed(3),
        faceJustified:Math.round(s.faceJustified||0),
        inconsistentLoop:Math.abs(curl)>0.6
      };
    }
  });
})();
</script>
