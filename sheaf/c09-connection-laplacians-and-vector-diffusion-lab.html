<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C09 · Connection Laplacians and vector diffusion</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // Fully deterministic lab: every number is computed in closed form from the
  // note's Section-5 worked example. No stochastic or time-based calls.

  // ════════════════════════════════════════════════════════════════════════
  // LESSON FACTS — Section 5 worked example: HSC→MPP→CMP→MEP differentiation.
  // Four cells, 2D local PC frames, edge rotations 15°/30°/45°.
  // ════════════════════════════════════════════════════════════════════════
  const CELLS=["HSC","MPP","CMP","MEP"];               // 4 cells, path graph
  const BASE_DEG=[15,30,45];                           // O_e angles (deg) e1,e2,e3
  const DEG=[1,2,2,1];                                 // node degrees on the path
  // observed local-PC stalk vectors x_v ∈ R^2
  const X=[[1.00,0.20],[0.85,0.45],[0.55,0.70],[0.20,0.95]];
  // PC-frame 1D layout positions along the trajectory (x axis)
  const PX=[-4.5,-1.5,1.5,4.5];

  // ── 2×2 rotation helpers ─────────────────────────────────────────────────
  const rad=d=>d*Math.PI/180;
  function rot(deg){const t=rad(deg),c=Math.cos(t),s=Math.sin(t);return [[c,-s],[s,c]];}
  function mv(M,v){return [M[0][0]*v[0]+M[0][1]*v[1], M[1][0]*v[0]+M[1][1]*v[1]];}
  function sub(a,b){return [a[0]-b[0],a[1]-b[1]];}
  function add(a,b){return [a[0]+b[0],a[1]+b[1]];}
  function n2(v){return v[0]*v[0]+v[1]*v[1];}          // squared norm

  // Per-edge frame-alignment energy ||x_v − M·x_u||² for an edge u→v.
  // mode: "transport" uses O(angle); "scalar" uses I; "anti" uses −I.
  function edgeEnergy(deg,xu,xv,mode){
    let M;
    if(mode==="scalar") M=[[1,0],[0,1]];
    else if(mode==="anti") M=[[-1,0],[0,-1]];
    else M=rot(deg);
    return n2(sub(xv,mv(M,xu)));
  }

  let sceneSnap={};

  // ── build ────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state, mode=s.mode;
    const rotScale=s.rotScale;                 // 0..2 multiplier on base angles
    const stalkSpin=s.stalkSpin;               // -60..60 deg, rotates all stalks
    const holoDeg=s.holoDeg;                   // -180..180 closing-edge angle (holonomy)
    const efIdx=Math.round(s.edgeFocus);       // 0..2 inspected edge

    const gNodes =api.group("nodes");
    const gFrames=api.group("frames");
    const gEdges =api.group("edges");
    const gBars  =api.group("bars");
    const gLabels=api.group("labels");

    function lbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}
    function slbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}

    const CY=new T.Color("#4dd7ff");   // self-renewal axis / aligned
    const GR=new T.Color("#34d399");   // low-energy / consistent
    const AM=new T.Color("#fbbf24");   // commitment axis / rotation
    const VI=new T.Color("#a78bfa");   // energy / misalignment
    const RO=new T.Color("#fb7185");   // high-energy / frustration
    const SL=new T.Color("#54667c");

    // effective edge angles for transport mode
    const effDeg=BASE_DEG.map(d=>d*rotScale);

    // rotate observed stalks by the global stalkSpin (a gauge wobble probe)
    const Xeff=X.map(v=>mv(rot(stalkSpin),v));

    // per-edge energies for the active mode
    function modeAngle(i){return mode==="transport"?effDeg[i]:0;}
    const eE=[0,1,2].map(i=>edgeEnergy(modeAngle(i),Xeff[i],Xeff[i+1],mode));
    const totalE=eE[0]+eE[1]+eE[2];

    // ════════════════════════════════════════════════════════════════
    // SHARED: draw the 4-cell trajectory with local frames + edge rotations
    //   Used by transport / scalar / anti. Holonomy mode draws a cycle.
    // ════════════════════════════════════════════════════════════════
    function drawTrajectory(cyclic){
      const nodeCols=[CY,CY.clone().lerp(AM,0.33),CY.clone().lerp(AM,0.66),AM];
      // nodes
      for(let i=0;i<4;i++){
        const sph=new T.Mesh(new T.SphereGeometry(0.34,24,18),
          new T.MeshStandardMaterial({color:nodeCols[i],emissive:nodeCols[i].clone().multiplyScalar(0.6),emissiveIntensity:0.7,roughness:0.35}));
        sph.position.set(PX[i],0,0);
        gNodes.add(sph);
        api.pick(sph,{cell:{i,name:CELLS[i],deg:DEG[i],x:X[i]}});
        lbl(CELLS[i],nodeCols[i].getStyle(),1.5,PX[i],0.95,0);
        slbl("deg "+DEG[i],"#6b7a8d",0.34,PX[i],-0.85,0);

        // local 2D PC frame: two short axes drawn from the node, ROTATED by the
        // cumulative edge rotation so you SEE the frame re-orient down the path.
        let cum=0; for(let k=0;k<i;k++) cum+= (mode==="transport"?effDeg[k]:0);
        const fr=rot(cum);
        const ax1=mv(fr,[1,0]), ax2=mv(fr,[0,1]);
        const aL=0.95;
        // PC1 axis (cyan = self-renewal), PC2 axis (amber = commitment)
        const a1=new T.ArrowHelper(new T.Vector3(ax1[0],ax1[1],0).normalize(),new T.Vector3(PX[i],0,0.02),aL,CY.getHex(),0.22,0.13);
        const a2=new T.ArrowHelper(new T.Vector3(ax2[0],ax2[1],0).normalize(),new T.Vector3(PX[i],0,0.02),aL,AM.getHex(),0.22,0.13);
        gFrames.add(a1); gFrames.add(a2);

        // observed stalk vector x_v drawn in the (possibly spun) frame — violet
        const xv=Xeff[i];
        const xn=Math.hypot(xv[0],xv[1])||1;
        const sa=new T.ArrowHelper(new T.Vector3(xv[0],xv[1],0).normalize(),new T.Vector3(PX[i],0,0.08),Math.min(1.35,xn*1.15),VI.getHex(),0.24,0.14);
        gFrames.add(sa);
      }

      // edges with the rotation badge + per-edge energy colour
      const eList=cyclic?[[0,1],[1,2],[2,3],[3,0]]:[[0,1],[1,2],[2,3]];
      eList.forEach((e,k)=>{
        const a=new T.Vector3(PX[e[0]],0,0), b=new T.Vector3(PX[e[1]],0,0);
        let angHere, en, closing=false;
        if(k<3){ angHere=mode==="transport"?effDeg[k]:(mode==="scalar"?0:180); en=eE[k]; }
        else { angHere=holoDeg; closing=true; en=0; }
        // closing wrap edge for the cycle: arc it above the row
        if(closing){
          const pts=[];
          for(let t=0;t<=24;t++){const u=t/24; const x=a.x+(b.x-a.x)*u; const y=2.6*Math.sin(Math.PI*u); pts.push(new T.Vector3(x,y,-0.6));}
          gEdges.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.8})));
          lbl("O_close = rot("+holoDeg.toFixed(0)+"°)",VI.getStyle(),1.05,(a.x+b.x)/2,2.95,-0.6);
        } else {
          // energy-coloured tube: green(low)→violet→rose(high)
          const eNorm=Math.min(1,en/0.12);
          const col=GR.clone().lerp(VI,Math.min(1,eNorm*2)).lerp(RO,Math.max(0,eNorm*2-1));
          const len=a.distanceTo(b);
          const tube=new T.Mesh(new T.CylinderGeometry(0.06+eNorm*0.10,0.06+eNorm*0.10,len,12),
            new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.6,roughness:0.4}));
          tube.position.copy(a).add(b).multiplyScalar(0.5);
          tube.rotation.z=Math.PI/2;
          gEdges.add(tube);
          api.pick(tube,{edge:{k,from:CELLS[e[0]],to:CELLS[e[1]],deg:angHere,energy:en}});
          const tag = mode==="transport" ? ("rot("+angHere.toFixed(0)+"°)")
                    : mode==="scalar" ? "O = I" : "O = −I";
          lbl(tag,col.getStyle(),0.95,(a.x+b.x)/2,1.55,0);
          slbl("E="+en.toFixed(3),col.getStyle(),0.34,(a.x+b.x)/2,1.15,0);
          // highlight the inspected edge with a halo ring
          if(k===efIdx && (mode==="transport"||mode==="scalar"||mode==="anti")){
            const ring=new T.Mesh(new T.TorusGeometry(0.5,0.04,8,28),new T.MeshBasicMaterial({color:0xfde68a}));
            ring.position.copy(a).add(b).multiplyScalar(0.5); ring.position.y=2.05; ring.rotation.x=Math.PI/2;
            gEdges.add(ring);
          }
        }
      });

      // baseline rail
      gEdges.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-5.6,-1.4,0),new T.Vector3(5.6,-1.4,0)]),new T.LineBasicMaterial({color:0x1e3046})));
    }

    // energy bars (e1,e2,e3) drawn behind the row in every "energy" mode
    function drawEnergyBars(){
      const bx=[-2.2,0.0,2.2], yBase=-3.6;
      eE.forEach((en,i)=>{
        const h=0.1+Math.min(1,en/0.12)*3.0;
        const eNorm=Math.min(1,en/0.12);
        const col=GR.clone().lerp(VI,Math.min(1,eNorm*2)).lerp(RO,Math.max(0,eNorm*2-1));
        const isF=i===efIdx;
        const bar=new T.Mesh(new T.BoxGeometry(1.1,h,1.0),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(isF?0.8:0.25),emissiveIntensity:isF?0.7:0.2,roughness:0.4,transparent:!isF,opacity:isF?1:0.6}));
        bar.position.set(bx[i],yBase+h/2,-2.2);
        gBars.add(bar);
        api.pick(bar,{bar:{edge:"e"+(i+1),energy:en}});
        lbl(en.toFixed(3),col.getStyle(),1.2,bx[i],yBase+h+0.5,-2.2);
        slbl("e"+(i+1),"#8a99ad",0.34,bx[i],yBase-0.35,-2.2);
      });
      slbl("per-edge frame energy ||x_v − O·x_u||²","#6b7a8d",0.4,0,yBase-0.95,-2.2);
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: transport  (connection Laplacian / vector diffusion)
    // ════════════════════════════════════════════════════════════════
    if(mode==="transport"){
      drawTrajectory(false);
      drawEnergyBars();
      lbl("self-renewal PC1","#4dd7ff",1.0,-4.5,-2.0,0);
      lbl("commitment PC2","#fbbf24",1.0,4.5,-2.0,0);

      const ef=eE[efIdx];
      sceneSnap={mode,rotScale:+rotScale.toFixed(3),stalkSpin:+stalkSpin.toFixed(1),
        edgeE1:+eE[0].toFixed(4),edgeE2:+eE[1].toFixed(4),edgeE3:+eE[2].toFixed(4),
        totalEnergy:+totalE.toFixed(4),focusEnergy:+ef.toFixed(4),holonomyDeg:0,coupling:1};

      return {
        badge:"Connection Laplacian · rot×"+rotScale.toFixed(2)+" · "+effDeg.map(d=>d.toFixed(0)+"°").join("/"),
        formula:"E_O(x) = Σ_e ‖x_v − O_{vu} x_u‖²   ·   (L_O x)_v = deg(v)·x_v − Σ_{u~v} O_{vu} x_u",
        insight:"Each edge carries a rotation O_uv that re-orients cell u's local PC frame into cell v's frame (cyan=PC1 self-renewal, amber=PC2 commitment). The energy ‖x_v − O·x_u‖² measures leftover frame mismatch. The 45° CMP→MEP turn (e3) is the biggest axis swap — GATA1/KLF1 take over — so e3 carries the most energy.",
        state:"Edge energies e1="+eE[0].toFixed(3)+", e2="+eE[1].toFixed(3)+", e3="+eE[2].toFixed(3)+" (total "+totalE.toFixed(3)+"). At rot×1.00 these match the note's [0.004, 0.015, 0.098].",
        metrics:{totalEnergy:totalE.toFixed(3),focusEnergy:ef.toFixed(3),holonomy:"0°",coupling:"on"},
        focus:{center:[0,-0.5,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: scalar  (O_uv = I → L_O = L ⊗ I_d, no coupling)
    // ════════════════════════════════════════════════════════════════
    if(mode==="scalar"){
      drawTrajectory(false);
      drawEnergyBars();
      lbl("frames never re-orient","#4dd7ff",1.05,0,-2.1,0);

      const ef=eE[efIdx];
      sceneSnap={mode,rotScale:+rotScale.toFixed(3),stalkSpin:+stalkSpin.toFixed(1),
        edgeE1:+eE[0].toFixed(4),edgeE2:+eE[1].toFixed(4),edgeE3:+eE[2].toFixed(4),
        totalEnergy:+totalE.toFixed(4),focusEnergy:+ef.toFixed(4),holonomyDeg:0,coupling:0};

      return {
        badge:"Scalar baseline · O = I · L_O = L ⊗ I₂",
        formula:"O_{uv} = I_d  ⇒  L_O = (D − A) ⊗ I_d = L ⊗ I_d   ·   E(x) = Σ_e ‖x_v − x_u‖²",
        insight:"Set every rotation to the identity. The connection Laplacian collapses to L ⊗ I_d: the two PC dimensions are processed independently with NO inter-dimensional coupling. Energy now just measures raw vector difference ‖x_v − x_u‖², ignoring that each cell's frame is oriented differently. Compare these bars to the transport mode — the same stalks, very different energy.",
        state:"With O=I: e1="+eE[0].toFixed(3)+", e2="+eE[1].toFixed(3)+", e3="+eE[2].toFixed(3)+" (total "+totalE.toFixed(3)+"). No rotation = orientation information is discarded.",
        metrics:{totalEnergy:totalE.toFixed(3),focusEnergy:ef.toFixed(3),holonomy:"0°",coupling:"off"},
        focus:{center:[0,-0.5,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: anti  (O_uv = −I → L_O = (D + A) ⊗ I_d, antagonistic)
    // ════════════════════════════════════════════════════════════════
    if(mode==="anti"){
      drawTrajectory(false);
      drawEnergyBars();
      lbl("antagonistic regulation","#fb7185",1.05,0,-2.1,0);

      const ef=eE[efIdx];
      sceneSnap={mode,rotScale:+rotScale.toFixed(3),stalkSpin:+stalkSpin.toFixed(1),
        edgeE1:+eE[0].toFixed(4),edgeE2:+eE[1].toFixed(4),edgeE3:+eE[2].toFixed(4),
        totalEnergy:+totalE.toFixed(4),focusEnergy:+ef.toFixed(4),holonomyDeg:0,coupling:-1};

      return {
        badge:"Anti-aligned · O = −I · L_O = (D + A) ⊗ I₂",
        formula:"O_{uv} = −I_d  ⇒  L_O = (D + A) ⊗ I_d   ·   E(x) = Σ_e ‖x_v + x_u‖²",
        insight:"Flip every rotation to −I (180° anti-alignment). The off-diagonal blocks become +I, so the energy minimises when adjacent cells are EQUAL AND OPPOSITE — the multi-dimensional analogue of a frustrated signed edge. This is the right model for mutually-repressing TF pairs (GATA1 vs PU.1): when one is active, its neighbour should be repressed.",
        state:"With O=−I: e1="+eE[0].toFixed(3)+", e2="+eE[1].toFixed(3)+", e3="+eE[2].toFixed(3)+" (total "+totalE.toFixed(3)+"). Energy is high because the observed stalks point the SAME way, not opposite.",
        metrics:{totalEnergy:totalE.toFixed(3),focusEnergy:ef.toFixed(3),holonomy:"180°",coupling:"anti"},
        focus:{center:[0,-0.5,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: holonomy  (close the path into a cycle, measure flatness)
    // ════════════════════════════════════════════════════════════════
    if(mode==="holonomy"){
      drawTrajectory(true);
      // holonomy angle = sum of the three forward rotations + closing edge.
      // Path HSC→MPP→CMP→MEP then closing MEP→HSC by holoDeg.
      const sumFwd=effDeg[0]+effDeg[1]+effDeg[2];   // 15+30+45 = 90 at rot×1
      const holo=((sumFwd+holoDeg)%360+360)%360;
      const holoSigned=holo>180?holo-360:holo;
      const flat=Math.abs(holoSigned)<0.5;

      // holonomy gauge dial: a rotating frame that has gone around the loop
      const dialC=new T.Vector3(0,-3.4,0);
      gBars.add(new T.Mesh(new T.TorusGeometry(1.2,0.03,10,40),new T.MeshBasicMaterial({color:0x2a3d52})));
      const dial=gBars.children[gBars.children.length-1]; dial.position.copy(dialC); dial.rotation.x=Math.PI/2;
      const dialCol=flat?GR:(Math.abs(holoSigned)<45?AM:RO);
      const ah=new T.ArrowHelper(new T.Vector3(Math.cos(rad(holoSigned)),Math.sin(rad(holoSigned)),0),dialC,1.2,dialCol.getHex(),0.3,0.18);
      gBars.add(ah);
      const ref=new T.ArrowHelper(new T.Vector3(1,0,0),dialC,1.2,0x4dd7ff,0.3,0.18);
      gBars.add(ref);
      lbl("holonomy "+holoSigned.toFixed(0)+"°",dialCol.getStyle(),1.3,0,-5.0,0);
      lbl(flat?"FLAT — globally alignable":"NON-FLAT — bifurcating","#"+dialCol.getHexString(),1.05,0,-5.55,0);
      slbl("Σ forward = "+sumFwd.toFixed(0)+"° · close = "+holoDeg.toFixed(0)+"°","#8a99ad",0.4,0,-2.6,0);

      sceneSnap={mode,rotScale:+rotScale.toFixed(3),stalkSpin:+stalkSpin.toFixed(1),
        edgeE1:+eE[0].toFixed(4),edgeE2:+eE[1].toFixed(4),edgeE3:+eE[2].toFixed(4),
        totalEnergy:+totalE.toFixed(4),focusEnergy:0,holonomyDeg:+holoSigned.toFixed(1),flat:flat?1:0,coupling:1};

      return {
        badge:"Holonomy · cycle · Σfwd "+sumFwd.toFixed(0)+"° + close "+holoDeg.toFixed(0)+"° → "+holoSigned.toFixed(0)+"°",
        formula:"hol(cycle) = O_close · O_{MEP,CMP} · O_{CMP,MPP} · O_{MPP,HSC}   ·   flat ⇔ hol = I",
        insight:"Close the trajectory into a cycle and multiply the rotations around the loop. The forward turns sum to "+sumFwd.toFixed(0)+"° (15+30+45 at rot×1). For the connection to be FLAT — frames globally alignable, like an orientable manifold — the closing edge must cancel them, i.e. close = −"+sumFwd.toFixed(0)+"°. Any residual holonomy means the loop is a genuine curvature patch: irreversible commitment, not a reversible orbit.",
        state:"Holonomy = "+holoSigned.toFixed(0)+"°. "+(flat?"Flat: drag close to −"+sumFwd.toFixed(0)+"° achieved.":"Non-flat: set close ≈ −"+sumFwd.toFixed(0)+"° to flatten."),
        metrics:{totalEnergy:totalE.toFixed(3),focusEnergy:"—",holonomy:holoSigned.toFixed(0)+"°",coupling:flat?"flat":"non-flat"},
        focus:{center:[0,-1.0,0],radius:14}
      };
    }

    return {badge:"C09",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:13}};
  }

  // ── MathLab.create ────────────────────────────────────────────────────────
  MathLab.create({
    id:"c09",
    kind:"connection-laplacian-vector-diffusion",
    eyebrow:"Block C · Geometric & Topological DL",
    title:"C09 · Connection Laplacians and vector diffusion",
    subtitle:"Four cells HSC→MPP→CMP→MEP, each with a 2D local PC frame. Edge rotations re-orient the self-renewal/commitment axes; the connection Laplacian measures leftover frame mismatch. Four views: vector transport, the scalar O=I baseline, anti-aligned O=−I, and holonomy / flatness.",
    selectedLabel:"Element",
    selectedHint:"Click a cell, edge, or energy bar.",
    modes:[
      {value:"transport", label:"Vector transport (connection L_O)"},
      {value:"scalar",    label:"Scalar baseline (O = I → L⊗I)"},
      {value:"anti",      label:"Anti-aligned (O = −I)"},
      {value:"holonomy",  label:"Holonomy / flatness (cycle)"}
    ],
    params:[
      {key:"rotScale", label:"rotation scale ×base(15/30/45°)",min:0,max:2,step:0.05,value:1,
       fmt:v=>v.toFixed(2)+"×",modes:["transport","holonomy"]},
      {key:"stalkSpin",label:"stalk gauge spin (°)",min:-60,max:60,step:1,value:0,
       fmt:v=>Math.round(v)+"°"},
      {key:"edgeFocus",label:"inspect edge (0=e1 1=e2 2=e3)",min:0,max:2,step:1,value:2,
       fmt:v=>"e"+(Math.round(v)+1),modes:["transport","scalar","anti"]},
      {key:"holoDeg",  label:"closing-edge angle (°)",min:-180,max:180,step:1,value:0,
       fmt:v=>Math.round(v)+"°",modes:["holonomy"]}
    ],
    metrics:[
      {key:"totalEnergy",  label:"Total frame energy E_O(x)",accent:"violet"},
      {key:"focusEnergy",  label:"Inspected-edge energy",accent:"amber"},
      {key:"holonomy",     label:"Cycle holonomy",accent:"rose"},
      {key:"coupling",     label:"Dim coupling",accent:"cyan"}
    ],
    layers:[
      {group:"nodes",  label:"Cells"},
      {group:"frames", label:"Local PC frames + stalks"},
      {group:"edges",  label:"Edge rotations"},
      {group:"bars",   label:"Energy bars / holonomy dial"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Flatten cycle",
      on:api=>{ if(api.state.mode==="holonomy"){ const sf=(15+30+45)*api.state.rotScale; api.setParam("holoDeg",-sf); } else { api.setMode("holonomy"); } }
    },
    secondary:{
      label:"Reset rotations (×1)",
      on:api=>{ api.setParam("rotScale",1); api.setParam("stalkSpin",0); }
    },
    defaultCam:{theta:-0.55,phi:0.78,r:14},
    hint:'<span style="color:#4dd7ff">cyan</span>=PC1 self-renewal axis · <span style="color:#fbbf24">amber</span>=PC2 commitment axis · <span style="color:#a78bfa">violet</span>=observed stalk x_v / energy · <span style="color:#34d399">green</span>=low energy → <span style="color:#fb7185">rose</span>=high. Edge tube thickness/colour = frame-mismatch energy.',
    onParam(api){
      const s=api.state;
      if(s.mode==="holonomy") api.frame([0,-1.0,0],14); else api.frame([0,-0.5,0],13);
    },
    onMode(api){
      const s=api.state;
      if(s.mode==="holonomy") api.frame([0,-1.0,0],14); else api.frame([0,-0.5,0],13);
    },
    onSelect(api,d){
      if(d.cell) api.setSelected(d.cell.name+" · deg "+d.cell.deg+" · x=["+d.cell.x[0].toFixed(2)+", "+d.cell.x[1].toFixed(2)+"]");
      if(d.edge) api.setSelected(d.edge.from+"→"+d.edge.to+" · rot "+d.edge.deg.toFixed(0)+"° · E="+d.edge.energy.toFixed(3));
      if(d.bar)  api.setSelected(d.bar.edge+" frame energy = "+d.bar.energy.toFixed(3));
    },
    build,
    snapshot(s){
      // deterministic recompute so the verifier sees fields move with controls
      const mode=s.mode, rs=s.rotScale, spin=s.stalkSpin;
      const Xs=X.map(v=>mv(rot(spin),v));
      const effDeg=BASE_DEG.map(d=>d*rs);
      const ang=i=>mode==="transport"?effDeg[i]:0;
      const e=[0,1,2].map(i=>edgeEnergy(ang(i),Xs[i],Xs[i+1],mode));
      const tot=e[0]+e[1]+e[2];
      const ef=Math.round(s.edgeFocus);
      const sumFwd=effDeg[0]+effDeg[1]+effDeg[2];
      let holo=0,flat=0;
      if(mode==="holonomy"){ let h=((sumFwd+s.holoDeg)%360+360)%360; holo=h>180?h-360:h; flat=Math.abs(holo)<0.5?1:0; }
      const couple = mode==="scalar"?0 : mode==="anti"?-1 : 1;
      return {
        mode,
        rotScale:+rs.toFixed(3),
        stalkSpin:+spin.toFixed(1),
        edgeFocus:ef,
        edgeE1:+e[0].toFixed(4),
        edgeE2:+e[1].toFixed(4),
        edgeE3:+e[2].toFixed(4),
        totalEnergy:+tot.toFixed(4),
        focusEnergy:mode==="holonomy"?0:+e[ef].toFixed(4),
        holonomyDeg:+holo.toFixed(1),
        flat,
        coupling:couple,
        e3IsLargest:(e[2]>=e[0] && e[2]>=e[1])?1:0
      };
    }
  });
})();
</script>
