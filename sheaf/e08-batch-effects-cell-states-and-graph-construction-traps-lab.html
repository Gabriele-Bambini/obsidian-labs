<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E08 · Batch effects, cell states, and graph construction traps</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (no nondeterministic sources used) ───────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);
  const gauss=(i)=>{ // deterministic ~N(0,1) via two hashes (Box-Muller-ish)
    const u1=Math.max(1e-6,prand(i*3.13+1.7));
    const u2=prand(i*7.77+5.3);
    return Math.sqrt(-2*Math.log(u1))*Math.cos(6.28318530718*u2);
  };

  let sceneSnap={};

  // ── worked-example constants (E08 §5: erythroid-monocyte contamination) ───
  // Batch1 = Monday/patient: 4800 cells, median 2100 UMI
  // Batch2 = Thursday/controls: 6200 cells, median 3400 UMI
  const N1=4800, N2=6200, UMI1=2100, UMI2=3400, HVG=3000;
  const B=2; // two batches

  // Cross-batch kNN edge fraction & erythroid contamination, by regime.
  // mode index: 0 uncorrected, 1 harmony, 2 scvi.  (note §5 numbers)
  const XBATCH =[0.22,0.48,0.44];   // cross-batch edge fraction
  const CONTAM =[0.23,0.08,0.06];   // non-erythroid contamination in erythroid kNN
  const DISEASE=[0.92,0.34,0.78];   // disease HBB signal retained (uncorrected keeps it but mixed w/ batch; harmony erases; scVI keeps)
  const PCBATCH=[0.71,0.12,0.07];   // PC1 batch R^2 (uncorrected top PC is batch)

  // demo cell cloud — 18 cells per batch, 4 lineages (HSC, MEP, Eryth, Mono)
  const NPER=18;
  const LIN=["HSC","MEP","Eryth","Mono"]; // lineage of each demo cell index 0..NPER-1
  // lineage colours: cyan=HSC, green=Eryth lineage core, amber=Mono, violet=disease MEP
  function linOf(i){const r=prand(i*2.7+0.3); if(r<0.18)return 0; if(r<0.46)return 1; if(r<0.74)return 2; return 3;}

  // ── kNN / receptive-field model (note §4.5, §7 misconception 4) ──────────
  function hop2(k){return k + k*k;}            // ~2-hop neighbourhood size
  function batchMix(xbatch){return xbatch;}     // mixing score = cross-batch frac; ideal=(B-1)/B=0.5

  // ── build ────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const k=Math.round(s.nNeighbors);
    const batchHVG=Math.round(s.batchHVG);        // # batch-driven HVGs kept (0..600)
    const depth=Math.round(s.depthConfound);      // 0 off / 1 on : deep cells form hub
    const showCt=Math.round(s.showContam);        // 0/1 highlight erythroid contamination

    const gCells =api.group("cells");
    const gEdges =api.group("edges");
    const gAxes  =api.group("axes");
    const gBars  =api.group("bars");
    const gLabels=api.group("labels");

    function L(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function l(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff"); // HSC / batch1 / corrected axis
    const GR=new T.Color("#34d399"); // erythroid / good integration
    const AM=new T.Color("#fbbf24"); // monocyte / depth / scratch
    const VI=new T.Color("#a78bfa"); // disease MEP / contamination flag
    const SL=new T.Color("#54667c");
    const linCol=[CY,VI,GR,AM]; // HSC, MEP(disease), Eryth, Mono

    // how strongly batch drives the embedding for the 3 correction regimes
    const modeIdx = mode==="uncorrected"?0 : mode==="harmony"?1 : mode==="scvi"?2 : 0;

    // ════════════════════════════════════════════════════════════════
    // SHARED: place the two-batch cell cloud in an embedding (PCA/latent)
    // x-axis = "batch/biology axis", z = secondary, y small jitter.
    // In uncorrected mode batch pushes the two clouds apart along x.
    // HVG fraction amplifies the batch split; correction collapses it.
    // ════════════════════════════════════════════════════════════════
    function buildCloud(){
      // batch-driven push: scaled by how many batch HVGs are kept, damped by correction
      const hvgFrac = batchHVG/600;                 // 0..1
      const corrDamp = modeIdx===0?1.0 : modeIdx===1?0.18 : 0.12;
      const batchPush = (2.6 + 2.2*hvgFrac)*corrDamp; // x separation between batch centroids
      const cells=[];
      for(let bb=0; bb<2; bb++){
        const bx = bb===0? -batchPush : +batchPush;  // batch centroid on x
        const depthShift = depth? (bb===1? 0.0 : 0.0) : 0; // depth handled per-cell below
        for(let i=0;i<NPER;i++){
          const gi=bb*100+i;
          const lin=linOf(gi);
          // biological position: lineages spread along z (HSC..MEP..Eryth / Mono branch)
          const zBio = lin===0? -2.4 : lin===1? -0.4 : lin===2? 1.9 : (1.1 + 1.6); // mono offset
          const xBio = lin===3? 1.4 : (lin===1?0.5:0.0); // mono/MEP slight x
          // disease MEP (batch1 only) sits apart in uncorrected; harmony drags it to Eryth
          const isDiseaseMEP = (bb===0 && lin===1 && prand(gi*5+9)>0.45);
          // depth confounding: deep-sequenced cells (batch2) cluster tighter -> hub
          const dHub = (depth && bb===1)? 0.55 : 1.0;
          let px = bx + xBio + gauss(gi*1.7+3)*0.55*dHub;
          let pz = zBio + gauss(gi*2.3+7)*0.5*dHub;
          let py = gauss(gi*4.1+2)*0.25;
          // correction collapses batch axis: in harmony/scvi clouds intermix
          if(modeIdx>0){ px = xBio + gauss(gi*1.7+3)*0.7 + (bb===0?-0.3:0.3); }
          // HARMONY over-correction trap: disease MEPs pushed INTO late erythroblast cluster
          let pushed=false;
          if(isDiseaseMEP){
            if(modeIdx===1){ pz = 1.9 + gauss(gi+1)*0.3; px = 0.0 + gauss(gi+2)*0.4; pushed=true; }
            else if(modeIdx===0){ px = bx + 0.9; pz = -0.4; } // isolated patient MEP island
            else { pz = -0.1 + gauss(gi+1)*0.35; px = 0.2 + gauss(gi+2)*0.4; } // scVI: keeps near MEP
          }
          cells.push({gi,bb,lin,px,py,pz,isDiseaseMEP,pushed,deep:(bb===1)});
        }
      }
      return {cells,batchPush};
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: kNN sensitivity (receptive-field blow-up) — special scene
    // ════════════════════════════════════════════════════════════════
    if(mode==="knn"){
      // central cell, ring of k 1-hop neighbours, fan of 2-hop -> receptive field
      const h2=hop2(k);
      const center=new T.Vector3(0,0,0);
      const c=api.node([0,0,0],{r:0.34,color:"#4dd7ff",label:"cell i",group:"cells"});
      const ring=Math.min(k,18);
      const R1=2.4;
      for(let i=0;i<ring;i++){
        const ang=i/ring*Math.PI*2;
        const p=new T.Vector3(Math.cos(ang)*R1,0,Math.sin(ang)*R1);
        api.edge([0,0,0],[p.x,p.y,p.z],{color:"#1f3a55",width:0.04,group:"edges"});
        api.node([p.x,p.y,p.z],{r:0.16,color:"#34d399",halo:false,group:"cells"});
        // 2-hop fan
        const branch=Math.min(k,6);
        for(let j=0;j<branch;j++){
          const a2=ang+(j-branch/2)*0.18;
          const q=new T.Vector3(Math.cos(a2)*(R1+2.0),0,Math.sin(a2)*(R1+2.0));
          api.edge([p.x,p.y,p.z],[q.x,q.y,q.z],{color:"#15304a",width:0.025,opacity:0.6,group:"edges"});
          api.node([q.x,q.y,q.z],{r:0.085,color:"#26405c",halo:false,group:"cells"});
        }
      }
      // receptive-field disk scaled by 2-hop size
      const rfR=1.6+Math.sqrt(h2)/4.2;
      api.plane([0,-0.05,0],{w:rfR*2,h:rfR*2,color:k>=30?"#fbbf24":"#a78bfa",opacity:0.10,group:"axes"});
      L("k = "+k,"#4dd7ff",1.5,0,1.5,0);
      L("2-hop ≈ "+h2+" cells","#a78bfa",1.25,0,-0.2,R1+2.6);
      L(k>=30?"over-smoothing risk":"local neighbourhood","#fbbf24",1.15,0,0.1,-(R1+2.6));

      const stable = k>=10 && k<=30; // §6 diag3 stability band
      sceneSnap={mode,nNeighbors:k,twoHop:h2,crossBatchFrac:null,contamination:null,
                 pcBatchR2:null,batchMixIdeal:+((B-1)/B).toFixed(2),oversmooth:k>=30};
      return {
        badge:"kNN sensitivity · n_neighbors = "+k+" · 2-hop ≈ "+h2,
        formula:"|N₂(i)| ≈ k + k² &nbsp;→&nbsp; "+k+" + "+(k*k)+" = "+h2,
        insight:"n_neighbors is not a default — it sets the GNN receptive field. At k=5 a 2-hop reach is ~30 cells; at k=30 it is ~930. Too small disconnects rare cells; too large over-smooths biologically distinct cells into one message-passing pool.",
        state:"k="+k+" → 1-hop "+k+", 2-hop ≈ "+h2+" cells. "+(k>=30?"Receptive field large: over-smoothing likely.":(k<10?"Sparse: rare cells may disconnect.":"Stable band (Jaccard-robust).")),
        metrics:{crossBatch:"—",contamination:"—",pcR2:"—",twoHop:""+h2},
        focus:{center:[0,0,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODES: uncorrected / harmony / scvi  — the two-batch cell cloud
    // ════════════════════════════════════════════════════════════════
    const {cells,batchPush}=buildCloud();

    // axes hint (embedding frame)
    api.edge([-6,0,-3.6],[6,0,-3.6],{color:"#2a3d52",width:0.02,group:"axes"});
    l(modeIdx===0?"batch axis (PC1)":"corrected axis","#6b7a8d",0.42,0,0.05,-3.95);

    // draw cells
    cells.forEach(cd=>{
      const base=linCol[cd.lin].clone();
      let col=base;
      // batch tint: batch1 slightly cyan-shifted, batch2 warmer, to read batch when uncorrected
      if(modeIdx===0){ col=base.clone().lerp(cd.bb===0?CY:AM,0.30); }
      const isFlagged = showCt && (cd.lin===3) && (cd.pz>0.7); // mono near erythroid region
      const r = cd.isDiseaseMEP?0.24:(cd.lin===2?0.2:0.18);
      const mcol = cd.isDiseaseMEP? VI.clone() : col;
      const dot=new T.Mesh(new T.SphereGeometry(r,18,14),
        new T.MeshStandardMaterial({color:mcol,emissive:mcol.clone().multiplyScalar(0.6),
          emissiveIntensity:cd.isDiseaseMEP?0.85:0.55,roughness:0.4,
          transparent:isFlagged,opacity:isFlagged?0.55:1.0}));
      dot.position.set(cd.px,cd.py,cd.pz);
      gCells.add(dot);
      api.pick(dot,{cell:{lin:LIN[cd.lin],batch:cd.bb===0?"Mon/patient":"Thu/control",disease:cd.isDiseaseMEP,pushed:cd.pushed}});
      // contamination flag ring on monocyte cells caught in erythroid kNN
      if(isFlagged){
        const ring=new T.Mesh(new T.TorusGeometry(0.3,0.03,8,18),new T.MeshBasicMaterial({color:VI}));
        ring.position.set(cd.px,cd.py,cd.pz); ring.rotation.x=Math.PI/2; gCells.add(ring);
      }
      // pushed disease MEP gets an arrow showing harmony dragged it
      if(cd.pushed){
        const ar=new T.Mesh(new T.ConeGeometry(0.1,0.34,8),new T.MeshBasicMaterial({color:VI}));
        ar.position.set(cd.px,cd.py+0.55,cd.pz); ar.rotation.z=Math.PI; gCells.add(ar);
      }
    });

    // draw kNN edges between near cells; count within vs cross batch
    let within=0, cross=0;
    for(let a=0;a<cells.length;a++){
      // find nearest few
      const dists=[];
      for(let b2=0;b2<cells.length;b2++){ if(a===b2)continue;
        const dx=cells[a].px-cells[b2].px, dy=cells[a].py-cells[b2].py, dz=cells[a].pz-cells[b2].pz;
        dists.push({b2,d:dx*dx+dy*dy+dz*dz});
      }
      dists.sort((p,q)=>p.d-q.d);
      const kk=Math.min(3,dists.length);
      for(let n=0;n<kk;n++){
        const j=dists[n].b2;
        if(a<j){
          const sameB=cells[a].bb===cells[j].bb;
          if(sameB)within++; else cross++;
          const ec = sameB? "#22364c" : (modeIdx===0?"#3a2a14":"#1f4a3a");
          api.edge([cells[a].px,cells[a].py,cells[a].pz],[cells[j].px,cells[j].py,cells[j].pz],
            {color:ec,width:0.022,opacity:0.7,group:"edges"});
        }
      }
    }
    const totalE=within+cross||1;
    const measuredCross=cross/totalE;
    // canonical note numbers drive the metric; geometry corroborates
    const xbatch=XBATCH[modeIdx];
    const contam=CONTAM[modeIdx];
    const disease=DISEASE[modeIdx];
    const pcR2=PCBATCH[modeIdx];

    // batch-HVG diagnostic bar (left) + cross-batch / contamination bars (right)
    const hvgFrac=batchHVG/600;
    function bar(x,h,col,lbl,val){
      const m=new T.Mesh(new T.BoxGeometry(0.9,Math.max(0.05,h),0.9),
        new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.55,roughness:0.4}));
      m.position.set(x,h/2,3.4); gBars.add(m);
      L(val,"#"+col.getHexString(),1.2,x,h+0.5,3.4);
      l(lbl,"#9fb0c4",0.4,x,0.05,3.4);
    }
    bar(-2.6, xbatch*4.0, GR, "cross-batch", (xbatch*100).toFixed(0)+"%");
    bar(-0.9, contam*4.0, VI, "contam", (contam*100).toFixed(0)+"%");
    bar( 0.8, disease*4.0, CY, "disease kept", (disease*100).toFixed(0)+"%");
    bar( 2.5, pcR2*4.0, AM, "PC1 batch R²", pcR2.toFixed(2));
    // ideal mixing line (B-1)/B = 0.5
    api.edge([-3.1,0.5*4.0,3.4],[1.3,0.5*4.0,3.4],{color:"#3a4a5e",width:0.015,group:"bars",dashed:true});
    l("ideal mix 0.50","#6b7a8d",0.4,-1.0,0.5*4.0+0.3,3.4);

    // legend labels for the cloud
    L(modeIdx===0?"UNCORRECTED PCA":modeIdx===1?"HARMONY":"scVI","#e8eef6",1.4,0,3.0,-3.6);
    L("batch 1 (Mon · patient · "+N1+")","#4dd7ff",1.0,-batchPush-0.5,2.2,-2.6);
    L("batch 2 (Thu · ctrl · "+N2+")","#fbbf24",1.0,(modeIdx===0?batchPush:1.5)+0.5,2.2,-2.6);

    const mixIdeal=(B-1)/B;
    const tag = modeIdx===0?"batch drives the graph"
              : modeIdx===1?"integrated, but disease erased"
              : "integrated, disease preserved";

    sceneSnap={mode,nNeighbors:k,batchHVG,depthConfound:depth,
               crossBatchFrac:+xbatch.toFixed(3),contamination:+contam.toFixed(3),
               diseaseRetained:+disease.toFixed(3),pcBatchR2:+pcR2.toFixed(3),
               batchMixScore:+xbatch.toFixed(3),batchMixIdeal:+mixIdeal.toFixed(2),
               measuredCrossEdges:+measuredCross.toFixed(3),twoHop:hop2(k),
               batchHVGfrac:+hvgFrac.toFixed(3),overCorrected:disease<0.5};

    const formulas={
      uncorrected:"d(zᵢ,zⱼ) = ‖PCA_bio + PCA_batch‖₂ &nbsp;→&nbsp; batch term dominates",
      harmony:"zᵢ ← zᵢ − Σ_c r_{ic} δ_{b,c} &nbsp;(centroid offsets)",
      scvi:"q(z | x, batch) , &nbsp; p(x | z, batch) &nbsp;→&nbsp; z is batch-free"
    };
    const insights={
      uncorrected:"PC1 is batch (R²="+pcR2.toFixed(2)+"), so the kNN graph wires cells by sequencing run, not biology: only "+(xbatch*100).toFixed(0)+"% of edges cross batches and "+(contam*100).toFixed(0)+"% of the erythroid neighbourhood is monocyte contamination. The two batch clouds barely touch.",
      harmony:"Harmony moves embeddings toward cluster centroids: cross-batch edges rise to "+(xbatch*100).toFixed(0)+"% and contamination falls to "+(contam*100).toFixed(0)+"%. But the disease MEPs (violet, arrow) are dragged into the late-erythroblast cluster — only "+(disease*100).toFixed(0)+"% of the β-thalassemia HBB signal survives. Over-correction is the trap.",
      scvi:"scVI gives the decoder the batch covariate explicitly, so the latent z stays batch-free without erasing biology. Cross-batch "+(xbatch*100).toFixed(0)+"%, contamination "+(contam*100).toFixed(0)+"%, and "+(disease*100).toFixed(0)+"% of the disease HBB signal is retained — the violet MEPs stay near MEP, not erythroblast."
    };
    return {
      badge:(modeIdx===0?"Uncorrected":modeIdx===1?"Harmony":"scVI")+" · cross-batch "+(xbatch*100).toFixed(0)+"% · "+tag,
      formula:formulas[mode]||"",
      insight:insights[mode]||"",
      state:"Mixing score "+(xbatch).toFixed(2)+" (ideal "+mixIdeal.toFixed(2)+") · erythroid contamination "+(contam*100).toFixed(0)+"% · disease retained "+(disease*100).toFixed(0)+"% · PC1 batch R²="+pcR2.toFixed(2)+". "+(disease<0.5?"⚠ biology partly erased.":"biology preserved."),
      metrics:{
        crossBatch:(xbatch*100).toFixed(0)+"%",
        contamination:(contam*100).toFixed(0)+"%",
        pcR2:pcR2.toFixed(2),
        twoHop:""+hop2(k)
      },
      focus:{center:[0,0.6,0],radius:14}
    };
  }

  // ── MathLab.create ────────────────────────────────────────────────────────
  MathLab.create({
    id:"e08",
    kind:"batch-effects-graph-traps",
    eyebrow:"Block E · Single-Cell and Multi-Omics",
    title:"E08 · Batch effects, cell states, and graph construction traps",
    subtitle:"A bone-marrow β-thalassemia dataset (batch 1 = Mon/patient 4800 cells; batch 2 = Thu/controls 6200). Watch the kNN cell graph encode batch vs biology across Uncorrected PCA → Harmony → scVI, plus the kNN receptive-field trap.",
    selectedLabel:"Cell / element",
    selectedHint:"Click a cell, bar, or neighbour.",
    modes:[
      {value:"uncorrected", label:"Uncorrected PCA (batch drives graph)"},
      {value:"harmony",     label:"Harmony (integrates, can erase disease)"},
      {value:"scvi",        label:"scVI (batch-free latent, disease kept)"},
      {value:"knn",         label:"kNN sensitivity (receptive field)"}
    ],
    params:[
      {key:"nNeighbors",   label:"n_neighbors (k)",min:5,max:50,step:1,value:15,
       fmt:v=>Math.round(v).toString()},
      {key:"batchHVG",     label:"batch-driven HVGs kept",min:0,max:600,step:25,value:350,
       fmt:v=>Math.round(v)+" / "+3000,modes:["uncorrected","harmony","scvi"]},
      {key:"depthConfound",label:"depth confounding (0 off / 1 on)",min:0,max:1,step:1,value:0,
       fmt:v=>Math.round(v)===0?"off":"on (deep hub)",modes:["uncorrected","harmony","scvi"]},
      {key:"showContam",   label:"flag erythroid contamination",min:0,max:1,step:1,value:1,
       fmt:v=>Math.round(v)===0?"hide":"show",modes:["uncorrected","harmony","scvi"]}
    ],
    metrics:[
      {key:"crossBatch",   label:"Cross-batch edge fraction",accent:"green"},
      {key:"contamination",label:"Erythroid contamination",accent:"violet"},
      {key:"pcR2",         label:"PC1 batch R²",accent:"amber"},
      {key:"twoHop",       label:"2-hop reach (cells)",accent:"cyan"}
    ],
    layers:[
      {group:"cells", label:"Cells"},
      {group:"edges", label:"kNN edges"},
      {group:"bars",  label:"Diagnostics"},
      {group:"axes",  label:"Frame"},
      {group:"labels",label:"Labels"}
    ],
    primary:{
      label:"Default k (15)",
      on:api=>{api.setParam("nNeighbors",15);}
    },
    secondary:{
      label:"Over-smooth k (50)",
      on:api=>{api.setParam("nNeighbors",50);}
    },
    defaultCam:{theta:-0.5,phi:0.62,r:14},
    hint:'<span style="color:#4dd7ff">cyan</span>=HSC/batch1 · <span style="color:#34d399">green</span>=erythroid · <span style="color:#fbbf24">amber</span>=monocyte/batch2 · <span style="color:#a78bfa">violet</span>=disease MEP / contamination · arrow=Harmony drag. Ideal batch-mix = (B−1)/B = 0.50.',
    onParam(api){
      const s=api.state;
      if(s.mode==="knn") api.frame([0,0,0],13);
      else api.frame([0,0.6,0],14);
    },
    onSelect(api,d){
      if(d.cell) api.setSelected(d.cell.lin+" · "+d.cell.batch+(d.cell.disease?" · DISEASE MEP":"")+(d.cell.pushed?" · PUSHED by Harmony":""));
    },
    build,
    snapshot(s){
      const k=Math.round(s.nNeighbors);
      const mode=s.mode;
      const idx=mode==="uncorrected"?0:mode==="harmony"?1:mode==="scvi"?2:-1;
      const xb=idx>=0?XBATCH[idx]:null;
      const ct=idx>=0?CONTAM[idx]:null;
      const ds=idx>=0?DISEASE[idx]:null;
      const pc=idx>=0?PCBATCH[idx]:null;
      return {
        mode,
        nNeighbors:k,
        batchHVG:Math.round(s.batchHVG),
        depthConfound:Math.round(s.depthConfound),
        showContam:Math.round(s.showContam),
        twoHop:hop2(k),
        crossBatchFrac:xb==null?null:+xb.toFixed(3),
        contamination:ct==null?null:+ct.toFixed(3),
        diseaseRetained:ds==null?null:+ds.toFixed(3),
        pcBatchR2:pc==null?null:+pc.toFixed(3),
        batchMixIdeal:+((B-1)/B).toFixed(2),
        oversmooth:k>=30,
        overCorrected:ds!=null&&ds<0.5
      };
    }
  });
})();
</script>
</body>
</html>
