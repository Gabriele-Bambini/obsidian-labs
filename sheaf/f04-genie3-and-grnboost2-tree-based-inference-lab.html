<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F04 · GENIE3 and GRNBoost2 tree-based inference</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (no Math.random / Date) ───────────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── FACTS · the note's Section-5 worked example (4 cells × 5 genes) ────────
  // Expression matrix X (rows = cells, cols = TF_A,TF_B,TF_C,G1,G2)
  const X=[
    [0,0,1, 0.1,0.9],   // cell1
    [0,0,0, 0.2,0.1],   // cell2
    [1,0,0, 0.8,0.2],   // cell3
    [1,1,0, 0.9,0.1]    // cell4
  ];
  // TF_D (collinear with TF_A) column for the collinear mode
  const TFD=[0,0,1,1];
  const TFN=["TF_A","TF_B","TF_C","TF_D"];
  // canonical MDI importance matrix W from the note (forest / GENIE3)
  const W_FOREST={
    G1:{TF_A:0.85,TF_B:0.05,TF_C:0.10},
    G2:{TF_A:0.05,TF_B:0.05,TF_C:0.90}
  };
  // collinear mode: TF_A's 0.85 splits between TF_A and TF_D (note numbers)
  const W_COLLIN={
    G1:{TF_A:0.45,TF_D:0.40,TF_B:0.05,TF_C:0.10},
    G2:{TF_A:0.025,TF_D:0.025,TF_B:0.05,TF_C:0.90}
  };
  // Pearson |r| (signed in note) for the importance-vs-correlation contrast
  const PEARSON={
    G1:{TF_A:0.98,TF_B:0.58,TF_C:-0.58},
    G2:{TF_A:-0.82,TF_B:-0.33,TF_C:0.55}
  };
  // boost vs forest cost facts (Section 3 table)
  const COST={
    forest:{trees:1000,minutes:30,imp:"MDI",stop:"none"},
    boost :{trees:300, minutes:3, imp:"Gain",stop:"val-MSE"}
  };

  // ── variance helpers (real numbers, computed from X) ──────────────────────
  function mean(a){let s=0;for(const v of a)s+=v;return a.length?s/a.length:0;}
  function variance(a){if(!a.length)return 0;const m=mean(a);let s=0;for(const v of a)s+=(v-m)*(v-m);return s/a.length;}
  // split target column (idxT in 0..4) by feature column at threshold 0.5
  function splitVarReduction(featCol,idxT){
    const y=X.map(r=>r[idxT]);
    const L=[],R=[];
    for(let c=0;c<4;c++){ (featCol[c]>=0.5?R:L).push(X[c][idxT]); }
    const vBefore=variance(y);
    const pL=L.length/4, pR=R.length/4;
    const vAfter=pL*variance(L)+pR*variance(R);
    return {vBefore,vAfter,delta:vBefore-vAfter,L,R,nL:L.length,nR:R.length,vL:variance(L),vR:variance(R)};
  }
  const featOf={TF_A:X.map(r=>r[0]),TF_B:X.map(r=>r[1]),TF_C:X.map(r=>r[2]),TF_D:TFD};
  const colIdx={G1:3,G2:4};

  // ── scene snapshot state ─────────────────────────────────────────────────
  let sceneSnap={};

  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const target = Math.round(s.target)===1 ? "G2" : "G1";   // 0=G1, 1=G2
    const nTrees = Math.round(s.nTrees);
    const thr    = s.threshold;                               // split threshold display
    const minLeaf= Math.round(s.minLeaf);

    const gMat   =api.group("matrix");
    const gTree  =api.group("tree");
    const gBars  =api.group("bars");
    const gLabels=api.group("labels");

    function addLbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}
    function addSlbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}

    const CY=new T.Color("#4dd7ff");  // TF_A / forest / strong
    const GR=new T.Color("#34d399");  // correct / activation
    const AM=new T.Color("#fbbf24");  // TF_C / boost / amber
    const VI=new T.Color("#a78bfa");  // TF_D / gain / collinear
    const RO=new T.Color("#fb7185");  // spurious / Pearson
    const SL=new T.Color("#54667c");

    // importance variance estimate shrinks with more trees (deterministic jitter)
    const treeNoise=1/Math.sqrt(Math.max(1,nTrees));            // 0.03..0.7
    function jitterW(base,seed){
      const w=base+(prand(seed)-0.5)*treeNoise*0.18;
      return Math.max(0,Math.min(1,w));
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: forest — GENIE3 random forest on the worked example
    // ════════════════════════════════════════════════════════════════
    if(mode==="forest"){
      const idxT=colIdx[target];
      const tfs=["TF_A","TF_B","TF_C"];
      const cols={TF_A:CY,TF_B:RO,TF_C:AM};
      // real variance reductions for each TF split on this target
      const splits=tfs.map(tf=>({tf,...splitVarReduction(featOf[tf],idxT)}));
      const best=splits.reduce((a,b)=>b.delta>a.delta?b:a,splits[0]);

      // ── left: expression matrix X (4 cells × 5 genes) as a grid of plates ──
      const geneCols=["TF_A","TF_B","TF_C","G1","G2"];
      const x0=-6.2, z0=-2.2, dx=1.0, dz=1.0;
      for(let c=0;c<4;c++){
        for(let g=0;g<5;g++){
          const val=X[c][g];
          const isTarget=(geneCols[g]===target);
          const isBest=(geneCols[g]===best.tf);
          const shade=0.18+0.62*val;
          let base=new T.Color("#16243a").lerp(new T.Color("#cfe7ff"),shade);
          if(isTarget) base=new T.Color("#16243a").lerp(GR,shade);
          else if(isBest) base=new T.Color("#16243a").lerp(CY,shade);
          const plate=new T.Mesh(new T.BoxGeometry(0.86,0.12,0.86),
            new T.MeshStandardMaterial({color:base,emissive:base.clone().multiplyScalar(0.4),emissiveIntensity:0.5,roughness:0.5}));
          plate.position.set(x0+g*dx, val*1.4, z0+c*dz);
          gMat.add(plate);
          api.pick(plate,{cell:{cell:c+1,gene:geneCols[g],value:val}});
        }
      }
      // gene + cell labels on the matrix
      geneCols.forEach((g,gi)=>addSlbl(g,(g===target?"#34d399":(g===best.tf?"#4dd7ff":"#8a99ad")),0.34,x0+gi*dx,2.5,z0-1.0));
      for(let c=0;c<4;c++) addSlbl("c"+(c+1),"#6b7a8d",0.30,x0-1.0,0.2,z0+c*dz);
      addLbl("expression X","#8a99ad",1.05,x0+2*dx,3.2,z0-1.6);

      // ── middle: the winning split (a tiny regression-tree node) ──
      const tx=0.4;
      const rootY=2.8;
      const root=new T.Mesh(new T.SphereGeometry(0.42,18,14),new T.MeshStandardMaterial({color:CY,emissive:CY,emissiveIntensity:0.6,roughness:0.3}));
      root.position.set(tx,rootY,0); gTree.add(root);
      addLbl(best.tf+" ≥ "+thr.toFixed(1),"#4dd7ff",1.15,tx,rootY+0.8,0);
      api.pick(root,{split:{feature:best.tf,delta:best.delta,thr}});
      // two leaves
      const leafX=[tx-1.7,tx+1.7], leafY=0.9;
      const leafStats=[{n:best.nL,v:best.vL,lab:"<"},{n:best.nR,v:best.vR,lab:"≥"}];
      leafStats.forEach((ls,i)=>{
        const leaf=new T.Mesh(new T.SphereGeometry(0.30+0.05*ls.n,14,12),new T.MeshStandardMaterial({color:GR,emissive:GR,emissiveIntensity:0.5,roughness:0.35}));
        leaf.position.set(leafX[i],leafY,0); gTree.add(leaf);
        gTree.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(tx,rootY,0),new T.Vector3(leafX[i],leafY,0)]),new T.LineBasicMaterial({color:0x2a5a48})));
        addSlbl(ls.lab+thr.toFixed(1)+" · n="+ls.n,"#7fe7c0",0.30,leafX[i],leafY+0.55,0);
        addSlbl("Var="+ls.v.toFixed(3),"#8a99ad",0.28,leafX[i],leafY-0.55,0);
      });
      addLbl("ΔVar = "+best.delta.toFixed(4),"#34d399",1.1,tx,-0.4,0);

      // ── right: MDI importance bars W[:, target] ──
      const bx0=4.4, bw=0.9, gap=1.25;
      const order=["TF_A","TF_B","TF_C"];
      const wcol=W_FOREST[target];
      order.forEach((tf,i)=>{
        const w=jitterW(wcol[tf],i*13+colIdx[target]*5);
        const h=0.12+w*4.4;
        const isMax=(wcol[tf]===Math.max(...order.map(t=>wcol[t])));
        const col=cols[tf];
        const bar=new T.Mesh(new T.BoxGeometry(bw,h,bw),
          new T.MeshStandardMaterial({color:col.clone(),emissive:col.clone().multiplyScalar(isMax?0.8:0.25),emissiveIntensity:isMax?0.7:0.2,roughness:0.4,transparent:!isMax,opacity:isMax?1:0.6}));
        bar.position.set(bx0+i*gap,h/2,1.4); gBars.add(bar);
        api.pick(bar,{imp:{tf,target,w:wcol[tf]}});
        addLbl(w.toFixed(2),col.getStyle(),1.4,bx0+i*gap,h+0.5,1.4);
        addSlbl(tf,col.getStyle(),0.32,bx0+i*gap,0.05,1.4);
      });
      addLbl("W[:, "+target+"]  (Σ=1)","#cfe0f0",1.05,bx0+gap,5.4,1.4);

      const topTF = target==="G1"?"TF_A":"TF_C";
      const topW  = wcol[topTF];
      const ratio = best.delta / (splits.find(sp=>sp.tf===(target==="G1"?"TF_C":"TF_A")).delta || 1e-6);
      sceneSnap={mode,target,nTrees,minLeaf,bestFeature:best.tf,deltaVar:+best.delta.toFixed(4),
        topImportance:+topW.toFixed(3),collinearSplit:0,gainVsMDI:0,speedup:1,
        varBefore:+best.vBefore.toFixed(4)};

      return {
        badge:"GENIE3 forest · target "+target+" · "+nTrees+" trees",
        formula:"W[i,j] = MDI(TF_i, gene_j) = (1/K) Σ_t Σ_v p(v)·ΔVar_v",
        insight:"For target "+target+", each tree picks the TF split that most reduces expression variance. "+best.tf+" wins (ΔVar = "+best.delta.toFixed(4)+"), separating low/high "+target+" cells cleanly. Averaged over "+nTrees+" trees the MDI importances become W[:, "+target+"], normalized to sum 1. "+topTF+" is correctly the dominant regulator of "+target+".",
        state:"Best split: "+best.tf+" ≥ "+thr.toFixed(1)+" · Var "+best.vBefore.toFixed(3)+" → "+best.vAfter.toFixed(3)+" · ΔVar="+best.delta.toFixed(4)+". W["+topTF+","+target+"]≈"+topW.toFixed(2)+" (top). More trees → lower-variance importance estimates.",
        metrics:{topImportance:topW.toFixed(2),deltaVar:best.delta.toFixed(3),bestFeature:best.tf,speedup:"1×"},
        focus:{center:[0,2,0],radius:14}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: collinear — TF_A & TF_D perfectly co-expressed → split importance
    // ════════════════════════════════════════════════════════════════
    if(mode==="collinear"){
      const target2="G1"; // collinear artifact illustrated on G1 (TF_A's true target)
      const tfs=["TF_A","TF_D","TF_B","TF_C"];
      const cols={TF_A:CY,TF_D:VI,TF_B:RO,TF_C:AM};

      // show the two collinear feature columns side by side (identical pattern)
      const x0=-5.6;
      [["TF_A",featOf.TF_A,CY],["TF_D",featOf.TF_D,VI]].forEach((pair,pi)=>{
        const [nm,colv,cc]=pair;
        for(let c=0;c<4;c++){
          const on=colv[c]>=0.5;
          const cube=new T.Mesh(new T.BoxGeometry(0.7,0.7,0.7),
            new T.MeshStandardMaterial({color:on?cc.clone():new T.Color("#16243a"),emissive:on?cc.clone().multiplyScalar(0.6):new T.Color("#0c1322"),emissiveIntensity:on?0.6:0.15,roughness:0.4}));
          cube.position.set(x0+pi*1.0, 0.4, -1.6+c*1.0); gMat.add(cube);
          api.pick(cube,{col:{tf:nm,cell:c+1,on}});
        }
        addSlbl(nm,cc.getStyle(),0.34,x0+pi*1.0,1.4,-2.4);
      });
      addLbl("identical columns","#a78bfa",1.0,x0+0.5,2.0,-3.0);
      // equality bracket
      addLbl("TF_A ≡ TF_D  (r = 1.0)","#c4b5fd",1.0,x0+0.5,-0.6,1.6);

      // bars: importance splits ~0.45 / 0.40 between collinear TFs
      const bx0=-0.4, gap=1.3;
      const wcol=W_COLLIN[target2];
      const order=["TF_A","TF_D","TF_B","TF_C"];
      order.forEach((tf,i)=>{
        const w=jitterW(wcol[tf],i*17+99);
        const h=0.12+w*5.2;
        const isColl=(tf==="TF_A"||tf==="TF_D");
        const col=cols[tf];
        const bar=new T.Mesh(new T.BoxGeometry(0.9,h,0.9),
          new T.MeshStandardMaterial({color:col.clone(),emissive:col.clone().multiplyScalar(isColl?0.75:0.22),emissiveIntensity:isColl?0.7:0.2,roughness:0.4,transparent:!isColl,opacity:isColl?1:0.55}));
        bar.position.set(bx0+i*gap,h/2,0); gBars.add(bar);
        api.pick(bar,{imp:{tf,target:target2,w:wcol[tf]}});
        addLbl(w.toFixed(2),col.getStyle(),1.35,bx0+i*gap,h+0.5,0);
        addSlbl(tf,col.getStyle(),0.32,bx0+i*gap,0.05,0);
      });
      addLbl("W[:, G1] — importance split","#cfe0f0",1.05,bx0+1.5*gap,6.2,0);

      // ghost "true" TF_A bar (0.85) behind for contrast
      const trueH=0.12+0.85*5.2;
      const ghost=new T.Mesh(new T.BoxGeometry(0.9,trueH,0.9),new T.MeshBasicMaterial({color:CY.getHex(),transparent:true,opacity:0.14,wireframe:true}));
      ghost.position.set(bx0,trueH/2,-1.4); gBars.add(ghost);
      addSlbl("true W[TF_A]=0.85","#4dd7ff",0.30,bx0,trueH+0.5,-1.4);

      const sumColl=W_COLLIN[target2].TF_A+W_COLLIN[target2].TF_D;
      sceneSnap={mode,target:target2,nTrees,minLeaf,bestFeature:"TF_A≈TF_D",deltaVar:0,
        topImportance:+W_COLLIN[target2].TF_A.toFixed(3),collinearSplit:+sumColl.toFixed(3),
        gainVsMDI:0,speedup:1,varBefore:0};

      return {
        badge:"Collinear TFs · TF_A ≡ TF_D · split importance",
        formula:"W[TF_A,G1] + W[TF_D,G1] ≈ W_true[TF_A,G1] = 0.85",
        insight:"TF_A and TF_D are perfectly co-expressed, so every tree randomly picks one for the split. The true importance of TF_A (0.85) is split arbitrarily — W[TF_A,G1]≈0.45, W[TF_D,G1]≈0.40. Neither appears dominant, even though only TF_A binds G1. Tree ensembles cannot resolve collinear features; ATAC-seq or perturbation (KO TF_A vs KO TF_D) is required.",
        state:"Collinear sum W[TF_A]+W[TF_D] = "+sumColl.toFixed(2)+" ≈ true 0.85, but each alone is ~0.4 — the dominant-regulator signal is lost. Ghost bar = the un-split true importance.",
        metrics:{topImportance:W_COLLIN[target2].TF_A.toFixed(2),deltaVar:"—",bestFeature:"TF_A≈TF_D",speedup:"1×"},
        focus:{center:[0,2.4,0],radius:14}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: boost — GRNBoost2 vs GENIE3: fewer trees, gain importance, speedup
    // ════════════════════════════════════════════════════════════════
    if(mode==="boost"){
      const target3=target;
      // two cost columns: GENIE3 (1000 trees) vs GRNBoost2 (nTrees, early-stop)
      const usedBoost=Math.min(nTrees, COST.boost.trees);
      const speedup=COST.forest.trees/Math.max(1,usedBoost);
      // gain-based importance tracks MDI ranking (same dominant TF), slightly sharper
      const wMDI=W_FOREST[target3];
      const order=["TF_A","TF_B","TF_C"];
      const cols={TF_A:CY,TF_B:RO,TF_C:AM};

      // left: tree-count "stacks" — GENIE3 tall fixed, GRNBoost2 short + early stop
      function stack(label,count,x,col,note){
        const rows=Math.min(20,Math.round(count/50));
        for(let r=0;r<rows;r++){
          const cube=new T.Mesh(new T.BoxGeometry(0.7,0.18,0.7),
            new T.MeshStandardMaterial({color:col.clone(),emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.45,transparent:true,opacity:0.55+0.45*(r/Math.max(1,rows))}));
          cube.position.set(x,0.3+r*0.22,-2.2); gTree.add(cube);
        }
        addLbl(label,col.getStyle(),1.1,x,0.3+rows*0.22+0.7,-2.2);
        addSlbl(count+" trees","#8a99ad",0.30,x,0.0,-2.2);
        if(note) addSlbl(note,"#fde68a",0.28,x,-0.45,-2.2);
      }
      stack("GENIE3",COST.forest.trees,-3.4,CY,"fixed 1000");
      stack("GRNBoost2",usedBoost,-0.4,AM,"early stop");
      // early-stopping marker: validation-MSE plateau arrow
      const stopY=0.3+Math.min(20,Math.round(usedBoost/50))*0.22+0.2;
      const cone=new T.Mesh(new T.ConeGeometry(0.16,0.42,8),new T.MeshBasicMaterial({color:GR.getHex()}));
      cone.position.set(-0.4,stopY+0.5,-2.2); gTree.add(cone);
      addSlbl("val-MSE plateau","#34d399",0.28,-0.4,stopY+1.0,-2.2);

      // right: gain-importance bars (same ranking as MDI)
      const bx0=3.2, gap=1.3;
      order.forEach((tf,i)=>{
        const wg=jitterW(wMDI[tf]*1.04,i*23+colIdx[target3]*7);
        const h=0.12+Math.min(0.97,wg)*4.4;
        const isMax=(wMDI[tf]===Math.max(...order.map(t=>wMDI[t])));
        const col=cols[tf];
        const bar=new T.Mesh(new T.BoxGeometry(0.9,h,0.9),
          new T.MeshStandardMaterial({color:col.clone(),emissive:col.clone().multiplyScalar(isMax?0.8:0.25),emissiveIntensity:isMax?0.7:0.2,roughness:0.4,transparent:!isMax,opacity:isMax?1:0.6}));
        bar.position.set(bx0+i*gap,h/2,1.6); gBars.add(bar);
        api.pick(bar,{imp:{tf,target:target3,w:wMDI[tf],kind:"gain"}});
        addLbl(Math.min(0.97,wg).toFixed(2),col.getStyle(),1.35,bx0+i*gap,h+0.5,1.6);
        addSlbl(tf,col.getStyle(),0.32,bx0+i*gap,0.05,1.6);
      });
      addLbl("Gain[:, "+target3+"]","#fbbf24",1.05,bx0+gap,5.4,1.6);
      addLbl("≈"+speedup.toFixed(0)+"× faster, same ranking","#7fe7c0",1.0,bx0+gap,-0.9,1.6);

      const topTF = target3==="G1"?"TF_A":"TF_C";
      sceneSnap={mode,target:target3,nTrees:usedBoost,minLeaf,bestFeature:topTF,deltaVar:0,
        topImportance:+wMDI[topTF].toFixed(3),collinearSplit:0,gainVsMDI:1,
        speedup:+speedup.toFixed(2),varBefore:0};

      return {
        badge:"GRNBoost2 · "+usedBoost+" trees · gain · ≈"+speedup.toFixed(0)+"× faster",
        formula:"Gain(TF_i) = Σ_splits ΔMSE   ·   early-stop on val-MSE",
        insight:"GRNBoost2 swaps the random forest for gradient-boosted trees with early stopping on a 10% validation fold. It needs ~"+usedBoost+" trees instead of GENIE3's "+COST.forest.trees+", giving a ≈"+speedup.toFixed(0)+"× speedup (~"+COST.boost.minutes+" min vs ~"+COST.forest.minutes+" min). Gain importance ranks the same dominant regulator ("+topTF+" for "+target3+"); SCENIC uses this as its first step.",
        state:"GENIE3: "+COST.forest.trees+" trees (MDI). GRNBoost2: "+usedBoost+" trees (gain), early-stop at val-MSE plateau → ≈"+speedup.toFixed(0)+"× faster, identical top regulator "+topTF+" for "+target3+".",
        metrics:{topImportance:wMDI[topTF].toFixed(2),deltaVar:"—",bestFeature:topTF,speedup:speedup.toFixed(0)+"×"},
        focus:{center:[0,2,0],radius:14}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: pearson — GENIE3 importance vs Pearson correlation
    // ════════════════════════════════════════════════════════════════
    if(mode==="pearson"){
      const target4=target;
      const order=["TF_A","TF_B","TF_C"];
      const cols={TF_A:CY,TF_B:RO,TF_C:AM};
      const wcol=W_FOREST[target4];
      const rcol=PEARSON[target4];

      // back row: GENIE3 importance (positive bars)
      const gap=1.5, bx0=-2.2, depthGenie=-1.4, depthPears=1.4;
      order.forEach((tf,i)=>{
        const w=wcol[tf];
        const h=0.12+w*4.4;
        const isMax=(w===Math.max(...order.map(t=>wcol[t])));
        const col=cols[tf];
        const bar=new T.Mesh(new T.BoxGeometry(0.85,h,0.85),
          new T.MeshStandardMaterial({color:col.clone(),emissive:col.clone().multiplyScalar(isMax?0.8:0.25),emissiveIntensity:isMax?0.7:0.2,roughness:0.4,transparent:!isMax,opacity:isMax?1:0.6}));
        bar.position.set(bx0+i*gap,h/2,depthGenie); gBars.add(bar);
        api.pick(bar,{imp:{tf,target:target4,w}});
        addLbl(w.toFixed(2),col.getStyle(),1.25,bx0+i*gap,h+0.45,depthGenie);
        addSlbl(tf,col.getStyle(),0.30,bx0+i*gap,0.05,depthGenie);
      });
      addLbl("GENIE3 W (unsigned)","#4dd7ff",1.05,bx0+gap,5.2,depthGenie);

      // front row: Pearson |r| (signed → split colors by sign, height = |r|)
      order.forEach((tf,i)=>{
        const r=rcol[tf];
        const h=0.12+Math.abs(r)*4.4;
        const pos=r>=0;
        const col=pos?GR.clone():RO.clone();
        const bar=new T.Mesh(new T.BoxGeometry(0.85,h,0.85),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.45),emissiveIntensity:0.45,roughness:0.4,transparent:true,opacity:0.8}));
        bar.position.set(bx0+i*gap,h/2,depthPears); gBars.add(bar);
        api.pick(bar,{pear:{tf,target:target4,r}});
        addLbl((r>=0?"+":"")+r.toFixed(2),col.getStyle(),1.2,bx0+i*gap,h+0.45,depthPears);
        addSlbl(tf,col.getStyle(),0.30,bx0+i*gap,0.05,depthPears);
      });
      addLbl("Pearson r (signed)","#fb7185",1.05,bx0+gap,5.2,depthPears);

      // separation gauge: GENIE3 top/second vs Pearson — cleaner contrast
      const wSorted=order.map(t=>wcol[t]).sort((a,b)=>b-a);
      const rSorted=order.map(t=>Math.abs(rcol[t])).sort((a,b)=>b-a);
      const sepGenie=wSorted[0]-wSorted[1];          // 0.85-0.10 = 0.75
      const sepPears=rSorted[0]-rSorted[1];          // 0.98-0.58 = 0.40
      addLbl("GENIE3 gap "+sepGenie.toFixed(2)+"  >  Pearson gap "+sepPears.toFixed(2),"#7fe7c0",1.0,bx0+gap,-0.9,0);

      sceneSnap={mode,target:target4,nTrees,minLeaf,bestFeature:(target4==="G1"?"TF_A":"TF_C"),
        deltaVar:0,topImportance:+wcol[(target4==="G1"?"TF_A":"TF_C")].toFixed(3),
        collinearSplit:0,gainVsMDI:0,speedup:1,varBefore:0,
        sepGenie:+sepGenie.toFixed(3),sepPearson:+sepPears.toFixed(3)};

      return {
        badge:"Importance vs Pearson · target "+target4,
        formula:"GENIE3: unsigned MDI   ·   Pearson r: signed, linear-only",
        insight:"Both methods agree on the top regulator of "+target4+", but GENIE3 gives a cleaner magnitude contrast (top−second gap "+sepGenie.toFixed(2)+" vs Pearson "+sepPears.toFixed(2)+"). Tree splits capture threshold-gated regulation that Pearson's linear r blurs; the price is that importance is unsigned — activators and repressors look identical.",
        state:"GENIE3 gap "+sepGenie.toFixed(2)+" (sharper) vs Pearson |r| gap "+sepPears.toFixed(2)+". Green = positive r, rose = negative r — GENIE3 cannot recover that sign.",
        metrics:{topImportance:wcol[(target4==="G1"?"TF_A":"TF_C")].toFixed(2),deltaVar:"—",bestFeature:(target4==="G1"?"TF_A":"TF_C"),speedup:"1×"},
        focus:{center:[0,2,0],radius:14}
      };
    }

    return {badge:"F04",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:14}};
  }

  // ── MathLab.create ──────────────────────────────────────────────────────
  MathLab.create({
    id:"f04",
    kind:"genie3-grnboost2-trees",
    eyebrow:"Block F · GRN Inference",
    title:"F04 · GENIE3 and GRNBoost2 tree-based inference",
    subtitle:"Per-target regression: train a tree ensemble to predict each gene from all TFs, read feature importances as edge weights. Worked on the note's 4-cell × 5-gene example.",
    selectedLabel:"Element",
    selectedHint:"Click a matrix cell, split node, or importance bar.",
    modes:[
      {value:"forest",    label:"GENIE3 forest (variance reduction → MDI)"},
      {value:"collinear", label:"Collinear TFs (split-importance artifact)"},
      {value:"boost",     label:"GRNBoost2 (gain + early stopping)"},
      {value:"pearson",   label:"Importance vs Pearson correlation"}
    ],
    params:[
      {key:"target",   label:"target gene (0=G1 1=G2)",min:0,max:1,step:1,value:0,
       fmt:v=>Math.round(v)===0?"G1":"G2",modes:["forest","boost","pearson"]},
      {key:"nTrees",   label:"# trees in ensemble",min:50,max:1000,step:50,value:1000,
       fmt:v=>Math.round(v).toString()},
      {key:"threshold",label:"split threshold τ",min:0.1,max:0.9,step:0.1,value:0.5,
       fmt:v=>v.toFixed(1),modes:["forest"]},
      {key:"minLeaf",  label:"min samples / leaf",min:1,max:3,step:1,value:1,
       fmt:v=>Math.round(v).toString(),modes:["forest","boost"]}
    ],
    metrics:[
      {key:"topImportance",label:"Top W[i,j]",accent:"cyan"},
      {key:"deltaVar",     label:"ΔVar (best split)",accent:"green"},
      {key:"bestFeature",  label:"Top regulator",accent:"amber"},
      {key:"speedup",      label:"Speedup vs GENIE3",accent:"violet"}
    ],
    layers:[
      {group:"matrix", label:"Expression matrix"},
      {group:"tree",   label:"Tree / splits"},
      {group:"bars",   label:"Importance bars"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"GENIE3 (1000 trees)",
      on:api=>{api.setParam("nTrees",1000);}
    },
    secondary:{
      label:"GRNBoost2 (300 trees)",
      on:api=>{api.setParam("nTrees",300);}
    },
    defaultCam:{theta:-0.5,phi:0.62,r:14},
    hint:'<span style="color:#4dd7ff">cyan</span>=TF_A/forest · <span style="color:#fbbf24">amber</span>=TF_C/boost · <span style="color:#a78bfa">violet</span>=TF_D/gain · <span style="color:#fb7185">rose</span>=TF_B/neg-r · <span style="color:#34d399">green</span>=correct split / pos-r.',
    onParam(api){
      const s=api.state;
      api.frame([0,2,0],14);
    },
    onSelect(api,d){
      if(d.cell)  api.setSelected("cell "+d.cell.cell+" · "+d.cell.gene+" = "+d.cell.value.toFixed(1));
      if(d.split) api.setSelected("split "+d.split.feature+" ≥ "+d.split.thr.toFixed(1)+" · ΔVar="+d.split.delta.toFixed(4));
      if(d.imp)   api.setSelected("W["+d.imp.tf+","+d.imp.target+"] = "+d.imp.w.toFixed(2)+(d.imp.kind?" ("+d.imp.kind+")":""));
      if(d.pear)  api.setSelected("Pearson r("+d.pear.tf+","+d.pear.target+") = "+(d.pear.r>=0?"+":"")+d.pear.r.toFixed(2));
      if(d.col)   api.setSelected(d.col.tf+" · cell "+d.col.cell+" · "+(d.col.on?"ON":"off"));
    },
    build,
    snapshot(s){
      const target=Math.round(s.target)===1?"G2":"G1";
      const nTrees=Math.round(s.nTrees);
      const topTF=target==="G1"?"TF_A":"TF_C";
      return {
        mode:s.mode,
        target,
        nTrees,
        minLeaf:Math.round(s.minLeaf),
        threshold:+(+s.threshold).toFixed(2),
        topImportance:+(W_FOREST[target][topTF]).toFixed(3),
        topRegulator:topTF,
        collinearSum:+(W_COLLIN.G1.TF_A+W_COLLIN.G1.TF_D).toFixed(3),
        speedup:+(COST.forest.trees/Math.max(1,Math.min(nTrees,COST.boost.trees))).toFixed(2),
        ...sceneSnap
      };
    }
  });
})();
</script>
