<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F16 · Cell-type-specific and condition-specific GRNs</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (no rng / clock; hash of sin) ─────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── F16 worked-example FACTS (note Section 5) ─────────────────────────────
  // 4 TFs, 4 target genes, two cell types A and B.
  // Mean expression per TF in each type:
  const EXPR={
    A:{TF1:8.2,TF2:1.1,TF3:4.5,TF4:2.0,GeneA:9.1,GeneB:1.0,GeneC:4.2,GeneD:1.5},
    B:{TF1:1.0,TF2:7.8,TF3:4.3,TF4:5.5,GeneA:1.2,GeneB:8.7,GeneC:4.0,GeneD:6.8}
  };
  // Canonical TF→target edges and their weights in the three regimes.
  // sharedTrue = the honest pooled answer; shared = what pooled inference returns
  // (note: shared inflates TF2->GeneB to 0.68 vs true 0.04 in Type A view).
  const EDGES=[
    {tf:"TF1",gene:"GeneA",shared:0.72,A:0.87,B:0.03},
    {tf:"TF2",gene:"GeneB",shared:0.68,A:0.04,B:0.91},
    {tf:"TF3",gene:"GeneC",shared:0.60,A:0.61,B:0.58},
    {tf:"TF4",gene:"GeneD",shared:0.55,A:0.21,B:0.74}
  ];
  // Strategy 1 statistical-power floor (note Section 6): ~200 cells for stable GENIE3.
  const CELL_FLOOR=200;

  let sceneSnap={};

  // weight under current context with the multi-task tradeoff lambda applied:
  // lambda=0 -> shrink fully toward shared average; lambda=1 -> full context weight.
  function ctxWeight(e,ctx,lambda){
    const cw=(ctx==="A")?e.A:(ctx==="B")?e.B:e.shared;
    if(ctx==="shared") return e.shared;
    return e.shared+lambda*(cw-e.shared);
  }
  // colour for a weight 0..1: slate -> cyan as it strengthens
  function wColor(T,w){
    const lo=new T.Color("#22384e"), hi=new T.Color("#4dd7ff");
    return lo.clone().lerp(hi,Math.max(0,Math.min(1,w)));
  }

  // ── build ─────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;                         // shared | typeA | typeB
    const ctx=(mode==="typeA")?"A":(mode==="typeB")?"B":"shared";
    const lambda=Math.max(0,Math.min(1,s.lambda));
    const cellsRare=Math.round(s.cellsRare);   // cells available for the rare type
    const rank=Math.round(s.rank);             // factorized D_c rank 0..4
    const thr=Math.max(0,Math.min(1,s.thr));   // edge-call threshold

    const gNet =api.group("network");
    const gBars=api.group("bars");
    const gCtx =api.group("context");
    const gLabels=api.group("labels");

    function addLbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function addSlbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff");   // strong / activator
    const GR=new T.Color("#34d399");   // shared regulator
    const AM=new T.Color("#fbbf24");   // type-A master / context cue
    const VI=new T.Color("#a78bfa");   // deviation D_c
    const RO=new T.Color("#fb7185");   // spurious / weak
    const SL=new T.Color("#54667c");

    // The rank of D_c limits how far context weights may deviate from shared.
    // rank 0 -> no deviation (=shared), rank 4 -> full deviation. Only meaningful
    // when a context is selected.
    const rankFrac=(ctx==="shared")?0:rank/4;
    // For rare-type underpowering (Strategy 1): few cells shrink the context weight
    // back toward the noisy shared estimate.
    const power=Math.max(0,Math.min(1,(cellsRare-20)/(CELL_FLOOR-20)));

    // ── 3D regulatory wiring : 4 TFs (left) -> 4 target genes (right) ─────────
    const TFy=[2.6,0.9,-0.9,-2.6];
    const tfNames=["TF1","TF2","TF3","TF4"];
    const geneNames=["GeneA","GeneB","GeneC","GeneD"];
    const tfX=-3.6, geneX=3.6;

    // TF nodes — size encodes context expression of that TF
    EDGES.forEach((e,i)=>{
      const tfExpr=(ctx==="shared")?(EXPR.A[e.tf]+EXPR.B[e.tf])/2:EXPR[ctx][e.tf];
      const r=0.22+0.045*tfExpr;                       // expression -> radius
      const expressed=tfExpr>=4.0;
      const baseCol=expressed?AM.clone():SL.clone();
      const tf=new T.Mesh(new T.SphereGeometry(r,20,16),
        new T.MeshStandardMaterial({color:baseCol,emissive:baseCol.clone().multiplyScalar(expressed?0.6:0.2),emissiveIntensity:expressed?0.7:0.25,roughness:0.4}));
      tf.position.set(tfX,TFy[i],0);
      gNet.add(tf);
      api.pick(tf,{tf:{name:e.tf,expr:+tfExpr.toFixed(2),expressed}});
      addSlbl(e.tf,expressed?"#fbbf24":"#7c8ba0",0.4,tfX-1.0,TFy[i],0);
      addSlbl(tfExpr.toFixed(1),"#9fb0c4",0.32,tfX-1.0,TFy[i]-0.42,0);
    });

    // Target gene nodes — size encodes context expression of the gene
    EDGES.forEach((e,i)=>{
      const gExpr=(ctx==="shared")?(EXPR.A[e.gene]+EXPR.B[e.gene])/2:EXPR[ctx][e.gene];
      const r=0.22+0.045*gExpr;
      const gHigh=gExpr>=4.0;
      const baseCol=gHigh?CY.clone():SL.clone();
      const gn=new T.Mesh(new T.SphereGeometry(r,20,16),
        new T.MeshStandardMaterial({color:baseCol,emissive:baseCol.clone().multiplyScalar(gHigh?0.55:0.2),emissiveIntensity:gHigh?0.65:0.25,roughness:0.4}));
      gn.position.set(geneX,TFy[i],0);
      gNet.add(gn);
      api.pick(gn,{gene:{name:e.gene,expr:+gExpr.toFixed(2),high:gHigh}});
      addSlbl(e.gene,gHigh?"#4dd7ff":"#7c8ba0",0.4,geneX+1.0,TFy[i],0);
      addSlbl(gExpr.toFixed(1),"#9fb0c4",0.32,geneX+1.0,TFy[i]-0.42,0);
    });

    // canonical TF_i -> Gene_i edges, weight = context weight, modulated by
    // multi-task lambda, factorized rank, and rare-type statistical power.
    let nCalled=0, sumW=0, spurious=0;
    EDGES.forEach((e,i)=>{
      let w=ctxWeight(e,ctx,lambda);
      // rank caps the deviation from shared
      if(ctx!=="shared"){ w=e.shared+(w-e.shared)*rankFrac; }
      // rare-type underpowering pulls context estimate back to shared
      if(ctx!=="shared"){ w=e.shared+(w-e.shared)*power; }
      w=Math.max(0,Math.min(1,w));
      const a=new T.Vector3(tfX,TFy[i],0), b=new T.Vector3(geneX,TFy[i],0);
      const called=w>=thr;
      if(called){ nCalled++; sumW+=w; }
      const ec=wColor(T,w);
      // arrow shaft thickness scales with weight
      const arr=new T.Mesh(new T.CylinderGeometry(0.03+0.07*w,0.03+0.07*w,a.distanceTo(b)-0.7,10,1,true),
        new T.MeshStandardMaterial({color:ec,emissive:ec.clone().multiplyScalar(0.4),emissiveIntensity:called?0.7:0.25,roughness:0.5,transparent:!called,opacity:called?1.0:0.32}));
      const mid=a.clone().add(b).multiplyScalar(0.5);
      arr.position.copy(mid);
      arr.rotation.z=-Math.PI/2;
      gNet.add(arr);
      api.pick(arr,{edge:{tf:e.tf,gene:e.gene,w:+w.toFixed(3),called}});
      // arrowhead
      const head=new T.Mesh(new T.ConeGeometry(0.13+0.05*w,0.34,10),new T.MeshBasicMaterial({color:ec.getHex(),transparent:!called,opacity:called?1.0:0.35}));
      head.position.set(geneX-0.42,TFy[i],0); head.rotation.z=-Math.PI/2;
      gNet.add(head);
      addLbl(w.toFixed(2),ec.getStyle(),1.0,0,TFy[i]+0.34,0);

      // SPURIOUS cross-edge: in the pooled/shared regime TF1 and GeneB co-vary
      // across cell types -> a phantom TF1->GeneB edge appears (note Section 5).
      if(mode==="shared" && e.tf==="TF1"){
        const gb=new T.Vector3(geneX,TFy[1],0); // GeneB row
        const sp=new T.Vector3(tfX,TFy[0],0);   // TF1 row
        const spuriousW=0.42;
        if(spuriousW>=thr){ spurious++; }
        const sm=new T.Mesh(new T.CylinderGeometry(0.04,0.04,sp.distanceTo(gb),8,1,true),
          new T.MeshStandardMaterial({color:RO,emissive:RO.clone().multiplyScalar(0.4),emissiveIntensity:0.5,roughness:0.5,transparent:true,opacity:0.7}));
        const smid=sp.clone().add(gb).multiplyScalar(0.5);
        sm.position.copy(smid);
        const dir=gb.clone().sub(sp).normalize();
        sm.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);
        gNet.add(sm);
        api.pick(sm,{edge:{tf:"TF1",gene:"GeneB",w:spuriousW,spurious:true}});
        addLbl("0.42 spurious","#fb7185",0.95,0,(TFy[0]+TFy[1])/2+0.3,1.0);
      }
    });

    addLbl("TFs","#fbbf24",1.2,tfX,TFy[0]+1.2,0);
    addLbl("targets","#4dd7ff",1.2,geneX,TFy[0]+1.2,0);

    // ── side bar chart : the 4 canonical edge weights across regimes ─────────
    const bx0=-2.4, bw=1.5, bgap=1.6, bz=-4.0;
    EDGES.forEach((e,i)=>{
      let w=ctxWeight(e,ctx,lambda);
      if(ctx!=="shared"){ w=e.shared+(w-e.shared)*rankFrac; w=e.shared+(w-e.shared)*power; }
      w=Math.max(0,Math.min(1,w));
      const x=bx0+i*bgap;
      const h=0.1+w*4.2;
      const ec=wColor(T,w);
      const bar=new T.Mesh(new T.BoxGeometry(bw,h,bw),
        new T.MeshStandardMaterial({color:ec,emissive:ec.clone().multiplyScalar(0.5),emissiveIntensity:0.55,roughness:0.4}));
      bar.position.set(x,h/2,bz);
      gBars.add(bar);
      api.pick(bar,{bar:{tf:e.tf,gene:e.gene,w:+w.toFixed(3)}});
      addLbl(w.toFixed(2),ec.getStyle(),1.2,x,h+0.5,bz);
      addSlbl(e.tf+"→"+e.gene[4],"#8a99ad",0.34,x,0.05,bz);
    });
    // threshold plane across the bars
    const thrY=0.1+thr*4.2;
    gBars.add(new T.Mesh(new T.PlaneGeometry(7.5,0.06),
      new T.MeshBasicMaterial({color:0xfb7185,transparent:true,opacity:0.8,side:T.DoubleSide})).translateX(bx0+1.5*bgap).translateY(thrY).translateZ(bz));
    addSlbl("threshold "+thr.toFixed(2),"#fb7185",0.36,bx0+3*bgap+0.2,thrY,bz);

    // ── context cue : floating context vector u_c marker over the scene ──────
    if(ctx!=="shared"){
      const cuCol=(ctx==="A")?AM:VI;
      const cue=new T.Mesh(new T.OctahedronGeometry(0.5),
        new T.MeshStandardMaterial({color:cuCol,emissive:cuCol.clone().multiplyScalar(0.7),emissiveIntensity:0.8,roughness:0.3}));
      cue.position.set(0,4.0,0);
      gCtx.add(cue);
      addLbl("u_"+ctx+"  context vector","#a78bfa",1.25,0,4.85,0);
      // underpowered warning when below cell floor
      if(power<0.5){
        addLbl("rare type: "+cellsRare+" < "+CELL_FLOOR+" cells (underpowered)","#fb7185",1.1,0,3.3,0);
      }
    } else {
      addLbl("pooled — averages over both cell types","#fbbf24",1.2,0,4.2,0);
    }

    // ── metrics ──────────────────────────────────────────────────────────────
    // recovered TF1->GeneA weight (the cell-type-A signature edge)
    let wTF1A=ctxWeight(EDGES[0],ctx,lambda);
    if(ctx!=="shared"){ wTF1A=EDGES[0].shared+(wTF1A-EDGES[0].shared)*rankFrac; wTF1A=EDGES[0].shared+(wTF1A-EDGES[0].shared)*power; }
    let wTF2B=ctxWeight(EDGES[1],ctx,lambda);
    if(ctx!=="shared"){ wTF2B=EDGES[1].shared+(wTF2B-EDGES[1].shared)*rankFrac; wTF2B=EDGES[1].shared+(wTF2B-EDGES[1].shared)*power; }
    // specificity gap: how well this regime separates Type-A edge from Type-B edge
    const specGap=Math.abs(wTF1A-wTF2B);
    const meanW=nCalled>0?sumW/nCalled:0;

    api.setMetric("edgesCalled",nCalled+(spurious>0?" (+"+spurious+" sp)":""));
    api.setMetric("specGap",specGap.toFixed(2));
    api.setMetric("tf1a",wTF1A.toFixed(2));
    api.setMetric("tf2b",wTF2B.toFixed(2));

    const regimeName=(mode==="shared")?"Pooled / shared GRN":(mode==="typeA")?"Type A GRN (u_A)":"Type B GRN (u_B)";

    sceneSnap={
      mode,ctx,lambda:+lambda.toFixed(2),cellsRare,rank,thr:+thr.toFixed(2),
      edgesCalled:nCalled,spurious,
      wTF1_GeneA:+wTF1A.toFixed(3),
      wTF2_GeneB:+wTF2B.toFixed(3),
      specGap:+specGap.toFixed(3),
      meanCalledWeight:+meanW.toFixed(3),
      power:+power.toFixed(3)
    };

    let insight, formula, state;
    if(mode==="shared"){
      formula="w(TF,g) ≈ corr_pooled(TF,g)  &nbsp;→&nbsp; confounds cell-type identity";
      insight="Pooling both cell types confounds Type-A-specific (TF1→GeneA) and Type-B-specific (TF2→GeneB) signals. TF1 and GeneA are both high in Type A and low in Type B, so they correlate — but so do TF1 and GeneB (rose), a SPURIOUS edge driven by shared cell-type identity, not regulation. The pooled estimate also inflates TF2→GeneB to 0.68 even though TF2 is silent in Type A.";
      state="Pooled GRN: "+nCalled+" canonical edges called"+(spurious>0?" + "+spurious+" spurious (TF1→GeneB)":"")+". Specificity gap (TF1A vs TF2B) is "+specGap.toFixed(2)+" — pooling cannot tell the two cell-type signatures apart.";
    } else {
      formula="w(TF,g | u_"+ctx+") = w_shared + D_"+ctx+",&nbsp; D_"+ctx+"=U·V_"+ctx+"ᵀ (rank "+rank+")";
      insight=(ctx==="A")
        ? "Conditioning on u_A reweights edges to Type A's program: TF1→GeneA strengthens to 0.87 (master regulator active), while TF2→GeneB collapses to 0.04 because TF2 is not expressed in Type A. The factorized deviation D_A = U·V_Aᵀ (rank slider) and the multi-task λ control how far the context departs from the shared backbone."
        : "Conditioning on u_B reweights edges to Type B's program: TF2→GeneB becomes the master edge at 0.91 and TF4→GeneD activates at 0.74, while TF1→GeneA falls to 0.03 (TF1 silent in Type B). The rank of D_B and λ trade expressiveness against data hunger.";
      state="Context "+ctx+": "+nCalled+" edges called. TF1→GeneA="+wTF1A.toFixed(2)+", TF2→GeneB="+wTF2B.toFixed(2)+", specificity gap "+specGap.toFixed(2)+". "+(power<0.5?("Rare type underpowered ("+cellsRare+"<"+CELL_FLOOR+" cells): estimate shrinks toward the pooled average."):("Cell count "+cellsRare+" ≥ "+CELL_FLOOR+": context estimate is well powered."));
    }

    return {
      badge:regimeName+" · λ="+lambda.toFixed(2)+" · rank "+rank,
      formula,
      insight,
      state,
      metrics:{
        edgesCalled:nCalled+(spurious>0?" (+"+spurious+")":""),
        specGap:specGap.toFixed(2),
        tf1a:wTF1A.toFixed(2),
        tf2b:wTF2B.toFixed(2)
      },
      focus:{center:[0,1.2,-1.2],radius:13}
    };
  }

  // ── MathLab.create ──────────────────────────────────────────────────────────
  MathLab.create({
    id:"f16",
    kind:"context-specific-grn",
    eyebrow:"Block F · GRN Inference",
    title:"F16 · Cell-type-specific and condition-specific GRNs",
    subtitle:"Same genome, different GRN. A 4-TF / 4-gene model across two cell types: pooled inference confounds identity with regulation, while context conditioning (u_A, u_B) recovers the true cell-type-selective edges.",
    selectedLabel:"Element",
    selectedHint:"Click a TF, a target gene, an edge, or a bar.",
    modes:[
      {value:"shared", label:"Pooled / shared GRN (no context)"},
      {value:"typeA",  label:"Type A GRN (context u_A)"},
      {value:"typeB",  label:"Type B GRN (context u_B)"}
    ],
    params:[
      {key:"lambda",   label:"multi-task λ (shrink ↔ context)",min:0,max:1,step:0.05,value:1,
       fmt:v=>v.toFixed(2),modes:["typeA","typeB"]},
      {key:"rank",     label:"factorized D_c rank (0=shared … 4=full)",min:0,max:4,step:1,value:4,
       fmt:v=>Math.round(v).toString(),modes:["typeA","typeB"]},
      {key:"cellsRare",label:"cells in this type (Strategy-1 power)",min:20,max:400,step:10,value:300,
       fmt:v=>Math.round(v)+" cells",modes:["typeA","typeB"]},
      {key:"thr",      label:"edge-call threshold",min:0,max:1,step:0.02,value:0.30,
       fmt:v=>v.toFixed(2)}
    ],
    metrics:[
      {key:"edgesCalled",label:"Edges called",accent:"cyan"},
      {key:"specGap",    label:"Specificity gap |TF1A−TF2B|",accent:"violet"},
      {key:"tf1a",       label:"w(TF1→GeneA)",accent:"amber"},
      {key:"tf2b",       label:"w(TF2→GeneB)",accent:"green"}
    ],
    layers:[
      {group:"network",label:"Regulatory wiring"},
      {group:"bars",   label:"Edge-weight bars"},
      {group:"context",label:"Context vector"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Pooled view",
      on:api=>{api.setMode("shared");}
    },
    secondary:{
      label:"Compare A → B",
      on:api=>{api.setMode(api.state.mode==="typeB"?"typeA":"typeB");}
    },
    defaultCam:{theta:-0.5,phi:0.62,r:13},
    hint:'<span style="color:#fbbf24">amber</span>=expressed TF / Type-A cue · <span style="color:#4dd7ff">cyan</span>=high target / strong edge · <span style="color:#a78bfa">violet</span>=context deviation D_c · <span style="color:#fb7185">rose</span>=spurious pooled edge · grey=silent / below threshold.',
    onMode(api){
      api.frame([0,1.2,-1.2],13);
    },
    onParam(api){
      api.frame([0,1.2,-1.2],13);
    },
    onSelect(api,d){
      if(d.tf)   api.setSelected(d.tf.name+" · expr "+d.tf.expr+(d.tf.expressed?" · expressed":" · silent"));
      if(d.gene) api.setSelected(d.gene.name+" · expr "+d.gene.expr+(d.gene.high?" · high":" · low"));
      if(d.edge) api.setSelected(d.edge.tf+"→"+d.edge.gene+" · w="+d.edge.w+(d.edge.spurious?" · SPURIOUS (pooled artefact)":(d.edge.called?" · called":" · below threshold")));
      if(d.bar)  api.setSelected(d.bar.tf+"→"+d.bar.gene+" · w="+d.bar.w);
    },
    build,
    snapshot(s){
      const ctx=(s.mode==="typeA")?"A":(s.mode==="typeB")?"B":"shared";
      const lambda=Math.max(0,Math.min(1,s.lambda));
      const cellsRare=Math.round(s.cellsRare);
      const rank=Math.round(s.rank);
      const thr=Math.max(0,Math.min(1,s.thr));
      const rankFrac=(ctx==="shared")?0:rank/4;
      const power=Math.max(0,Math.min(1,(cellsRare-20)/(CELL_FLOOR-20)));
      function w(e){
        let v=ctxWeight(e,ctx,lambda);
        if(ctx!=="shared"){ v=e.shared+(v-e.shared)*rankFrac; v=e.shared+(v-e.shared)*power; }
        return Math.max(0,Math.min(1,v));
      }
      const wTF1A=w(EDGES[0]), wTF2B=w(EDGES[1]);
      let called=0; EDGES.forEach(e=>{ if(w(e)>=thr) called++; });
      const spurious=(s.mode==="shared" && 0.42>=thr)?1:0;
      return {
        mode:s.mode,
        ctx,
        lambda:+lambda.toFixed(2),
        rank,
        cellsRare,
        thr:+thr.toFixed(2),
        edgesCalled:called,
        spurious,
        wTF1_GeneA:+wTF1A.toFixed(3),
        wTF2_GeneB:+wTF2B.toFixed(3),
        specGap:+Math.abs(wTF1A-wTF2B).toFixed(3),
        power:+power.toFixed(3),
        underpowered:(ctx!=="shared" && power<0.5)
      };
    }
  });
})();
</script>
</body>
</html>
