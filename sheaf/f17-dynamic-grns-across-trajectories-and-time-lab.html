<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F17 · Dynamic GRNs across trajectories and time</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (NO Math.random / Date) ──────────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── canonical worked example (note Section 5) ────────────────────────────
  // 4 cells ordered by pseudotime; 5 genes TF1, TF2, GeneA, GeneB, GeneC.
  const PT=[0.1,0.4,0.7,0.9];                     // pseudotime per cell
  const GENES=["TF1","TF2","GeneA","GeneB","GeneC"];
  // expression matrix: rows = cells, cols = genes (exact note numbers)
  const EXPR=[
    [8.1,1.2,7.5,1.0,4.0],   // Cell 1  t=0.1  early progenitor
    [5.5,3.8,4.2,3.5,4.1],   // Cell 2  t=0.4  mid transition
    [2.1,7.2,1.5,7.0,3.9],   // Cell 3  t=0.7  late transition
    [0.9,8.8,0.8,8.5,3.8]    // Cell 4  t=0.9  differentiated
  ];
  // per-bin inferred edge weights (note Section 5)
  // edges: TF1->GeneA , TF2->GeneB , (constitutive) ->GeneC
  const G1={tf1A:0.85, tf2B:0.31, geneC:0.10};    // Bin 1 = cells 1,2
  const G2={tf1A:0.11, tf2B:0.88, geneC:0.09};    // Bin 2 = cells 3,4
  const DELTA={tf1A:G2.tf1A-G1.tf1A, tf2B:G2.tf2B-G1.tf2B, geneC:G2.geneC-G1.geneC}; // -0.74,+0.57,-0.01
  const POOLED_TF2B=0.998;                          // pooled corr(TF2,GeneB) over 4 cells
  const ACT_THRESH=0.30;                            // |Δ| activation/silencing threshold

  // 4 methods the lesson contrasts (for the "method" param dimming story)
  const METHODS=["SCODE","CellOracle","Dictys","binned-GENIE3"];

  let sceneSnap={};

  // smooth pseudotime profile of a gene from its 4 sampled cells (deterministic)
  function exprAt(geneIdx,t){
    // piecewise-linear interpolation through the 4 cell samples in PT
    if(t<=PT[0]) return EXPR[0][geneIdx];
    if(t>=PT[3]) return EXPR[3][geneIdx];
    for(let k=0;k<3;k++){
      if(t>=PT[k]&&t<=PT[k+1]){
        const f=(t-PT[k])/(PT[k+1]-PT[k]);
        return EXPR[k][geneIdx]*(1-f)+EXPR[k+1][geneIdx]*f;
      }
    }
    return EXPR[3][geneIdx];
  }

  // continuous edge weight w(t): ramps with the relevant TF, modulated by bin midpoint
  function edgeWeightAt(edge,t){
    // edge in {tf1A, tf2B, geneC}; smooth logistic-ish blend from G1->G2 around t=0.5
    const s=1/(1+Math.exp(-(t-0.5)*9));            // 0..1 sigmoid over pseudotime
    return G1[edge]*(1-s)+G2[edge]*s;
  }

  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const tCursor=Math.max(0,Math.min(1,s.pseudotime));
    const nBins=Math.round(s.nBins);               // 2..6
    const methodIdx=Math.round(s.method);          // 0..3
    const thr=s.threshold;                         // 0.05..0.60

    const gTraj  =api.group("traj");
    const gGRN   =api.group("grn");
    const gDelta =api.group("delta");
    const gLabels=api.group("labels");

    function lbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function slbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff");   // TF1 / progenitor program / activated
    const RO=new T.Color("#fb7185");   // TF2 / differentiation program
    const AM=new T.Color("#fbbf24");   // GeneC / constitutive / static
    const VI=new T.Color("#a78bfa");   // Δ / transition
    const GR=new T.Color("#34d399");   // GeneA / GeneB targets
    const SL=new T.Color("#54667c");

    // ════════════════════════════════════════════════════════════════
    // MODE: trajectory — 4 cells along pseudotime, expression manifold
    // ════════════════════════════════════════════════════════════════
    if(mode==="trajectory"){
      const xS=8.0, xOff=-4.0;                      // pseudotime axis maps to x
      const yS=0.62;                                // expression -> height

      // pseudotime baseline
      gTraj.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(xOff,0,0),new T.Vector3(xOff+xS,0,0)]),
        new T.LineBasicMaterial({color:0x2a3d52})));
      slbl("pseudotime t",  "#8a99ad",0.42,xOff+xS*0.5,-0.55,0);
      slbl("t=0",            "#8a99ad",0.36,xOff,-0.55,0);
      slbl("t=1",            "#8a99ad",0.36,xOff+xS,-0.55,0);

      // smooth expression ribbons for TF1, TF2, GeneA(target of TF1), GeneB(target of TF2)
      const tracks=[
        {g:0,col:CY,name:"TF1",z:-1.6},
        {g:1,col:RO,name:"TF2",z:-0.5},
        {g:2,col:GR,name:"GeneA",z:0.6},
        {g:3,col:GR.clone().lerp(RO,0.5),name:"GeneB",z:1.7},
        {g:4,col:AM,name:"GeneC",z:2.8}
      ];
      tracks.forEach(tr=>{
        const pts=[];
        for(let k=0;k<=40;k++){
          const t=k/40;
          pts.push(new T.Vector3(xOff+t*xS, exprAt(tr.g,t)*yS, tr.z));
        }
        gTraj.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),
          new T.LineBasicMaterial({color:tr.col.getHex()})));
        slbl(tr.name, tr.col.getStyle(),0.40, xOff+xS+0.35, exprAt(tr.g,1)*yS, tr.z);
      });

      // the 4 sampled cells as spheres (the actual measured points)
      EXPR.forEach((row,ci)=>{
        const t=PT[ci];
        const x=xOff+t*xS;
        tracks.forEach(tr=>{
          const y=row[tr.g]*yS;
          const dot=new T.Mesh(new T.SphereGeometry(0.13,12,10),
            new T.MeshStandardMaterial({color:tr.col,emissive:tr.col,emissiveIntensity:0.7,roughness:0.4}));
          dot.position.set(x,y,tr.z);
          gTraj.add(dot);
          api.pick(dot,{cell:{i:ci+1,t,gene:tr.name,expr:row[tr.g]}});
        });
        lbl("Cell"+(ci+1),"#cfe0f0",0.95,x,exprAt(0,t)*yS+0.7,-1.6);
      });

      // moving pseudotime cursor plane
      const cx=xOff+tCursor*xS;
      const cursor=new T.Mesh(new T.PlaneGeometry(0.04,6.2),
        new T.MeshBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.85,side:T.DoubleSide}));
      cursor.position.set(cx,2.6,0.6);
      gTraj.add(cursor);
      lbl("t="+tCursor.toFixed(2),"#a78bfa",1.05,cx,5.6,0.6);

      // current TF expressions + which program dominates
      const tf1=exprAt(0,tCursor), tf2=exprAt(1,tCursor);
      const dom = tf1>tf2 ? "TF1 (progenitor)" : "TF2 (differentiated)";
      const domCol = tf1>tf2 ? CY : RO;
      lbl(dom, domCol.getStyle(),1.15, cx, 6.4, 0.6);

      sceneSnap={mode,pseudotime:+tCursor.toFixed(3),nBins,method:methodIdx,threshold:+thr.toFixed(3),
        tf1Expr:+tf1.toFixed(2),tf2Expr:+tf2.toFixed(2),
        edgeTF1A:+edgeWeightAt("tf1A",tCursor).toFixed(3),
        edgeTF2B:+edgeWeightAt("tf2B",tCursor).toFixed(3),
        deltaSilenced:+DELTA.tf1A.toFixed(2),deltaActivated:+DELTA.tf2B.toFixed(2)};

      return {
        badge:"Trajectory · t="+tCursor.toFixed(2)+" · "+dom,
        formula:"G(t) = (V, E(t), w(t)) ,  t ∈ [0,1] pseudotime",
        insight:"Four scRNA-seq cells are ordered by pseudotime, not real time. TF1 (cyan, progenitor master regulator) decays 8.1→0.9 while TF2 (rose, differentiation regulator) rises 1.2→8.8. GeneA tracks TF1, GeneB tracks TF2, GeneC (amber) stays flat ≈4.0. Drag pseudotime to sweep the cursor and watch which regulatory program dominates.",
        state:"At t="+tCursor.toFixed(2)+": TF1="+tf1.toFixed(1)+", TF2="+tf2.toFixed(1)+" → "+dom+" dominates. The same cell could be mis-ordered to t±0.1, shifting its bin — the compounding-uncertainty problem.",
        metrics:{
          activeEdge:(tf1>tf2?"TF1→GeneA":"TF2→GeneB"),
          edgeWeight:edgeWeightAt(tf1>tf2?"tf1A":"tf2B",tCursor).toFixed(2),
          deltaSwitch:DELTA.tf1A.toFixed(2)+" / +"+DELTA.tf2B.toFixed(2),
          staticLoss:"hidden"
        },
        focus:{center:[0,2.6,0.6],radius:11}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: bins — per-bin GRNs (G1, G2 …) as edge-weight bars
    // ════════════════════════════════════════════════════════════════
    if(mode==="bins"){
      // K bins over [0,1]; for each bin take its midpoint and read continuous w(t)
      const K=nBins;
      const edges=[
        {key:"tf1A",name:"TF1→GeneA",col:CY},
        {key:"tf2B",name:"TF2→GeneB",col:RO},
        {key:"geneC",name:"→GeneC",col:AM}
      ];
      const binW=1/K;
      const xStep=Math.min(2.6, 9.0/K);
      const xStart=-(K-1)*xStep/2;
      const wScale=4.4;

      for(let b=0;b<K;b++){
        const tMid=(b+0.5)*binW;
        const bx=xStart+b*xStep;
        // bin floor marker + label
        slbl("Bin"+(b+1),"#cfe0f0",0.40,bx,-0.45,2.2);
        slbl("t≈"+tMid.toFixed(2),"#8a99ad",0.34,bx,-0.8,2.2);

        edges.forEach((e,ei)=>{
          const w=edgeWeightAt(e.key,tMid);
          const z=2.2-ei*1.5;
          const h=0.08+w*wScale;
          const isActive = w>thr;
          const bar=new T.Mesh(new T.BoxGeometry(xStep*0.42,h,0.9),
            new T.MeshStandardMaterial({
              color:e.col.clone(),
              emissive:e.col.clone().multiplyScalar(isActive?0.8:0.18),
              emissiveIntensity:isActive?0.7:0.16,
              roughness:0.4, transparent:!isActive, opacity:isActive?1.0:0.4}));
          bar.position.set(bx,h/2,z);
          gGRN.add(bar);
          api.pick(bar,{edge:{name:e.name,bin:b+1,t:tMid,w,active:isActive}});
          if(b===0||b===K-1) slbl(w.toFixed(2),e.col.getStyle(),0.34,bx,h+0.3,z);
        });
      }

      // edge legend (z lanes)
      edges.forEach((e,ei)=>{
        const z=2.2-ei*1.5;
        lbl(e.name, e.col.getStyle(),0.9, xStart-xStep*0.9, 1.2, z);
      });

      // threshold plane
      const thPlane=new T.Mesh(new T.PlaneGeometry(K*xStep+1.6,3.4),
        new T.MeshBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.10,side:T.DoubleSide}));
      thPlane.rotation.x=-Math.PI/2;
      thPlane.position.set(0,0.08+thr*wScale,0.7);
      gGRN.add(thPlane);
      lbl("active threshold "+thr.toFixed(2),"#a78bfa",0.85, xStart, 0.08+thr*wScale+0.4, -2.0);

      lbl(METHODS[methodIdx]+" per-bin estimator","#cfe0f0",1.05, 0, 5.3, 0.7);

      const w1=edgeWeightAt("tf1A",binW*0.5), w2=edgeWeightAt("tf2B",(K-0.5)*binW);
      sceneSnap={mode,pseudotime:+tCursor.toFixed(3),nBins:K,method:methodIdx,threshold:+thr.toFixed(3),
        bin1_TF1A:+edgeWeightAt("tf1A",binW*0.5).toFixed(3),
        binK_TF2B:+edgeWeightAt("tf2B",(K-0.5)*binW).toFixed(3),
        g1_TF1A:G1.tf1A,g2_TF2B:G2.tf2B};

      return {
        badge:"Per-bin GRNs · K="+K+" · "+METHODS[methodIdx],
        formula:"G_k = "+METHODS[methodIdx]+"( cells with pseudotime in bin k )",
        insight:"Pseudotime is split into K bins; a GRN is inferred per bin. The note's 2-bin case: Bin 1 (cells 1,2) gives TF1→GeneA = 0.85 (strong) and TF2→GeneB = 0.31 (weak); Bin 2 (cells 3,4) gives TF1→GeneA = 0.11 (silenced) and TF2→GeneB = 0.88 (strong). The TF1→TF2 master-regulator switch appears as the bars trade height across bins. More bins = finer resolution but fewer cells/bin (≥200 advised) = noisier estimates.",
        state:"K="+K+" bins · "+METHODS[methodIdx]+". First-bin TF1→GeneA="+w1.toFixed(2)+", last-bin TF2→GeneB="+w2.toFixed(2)+". Edges below "+thr.toFixed(2)+" (violet plane) are read as inactive.",
        metrics:{
          activeEdge:"TF1→A / TF2→B",
          edgeWeight:"0.85 → 0.11",
          deltaSwitch:"0.31 → 0.88",
          staticLoss:"resolved"
        },
        focus:{center:[0,2.0,0.4],radius:12}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: dynamic — Δ = G2 − G1 transition + static-pooling loss
    // ════════════════════════════════════════════════════════════════
    // (mode==="dynamic")
    {
      const edges=[
        {key:"tf1A",name:"TF1→GeneA",g1:G1.tf1A,g2:G2.tf1A,d:DELTA.tf1A},
        {key:"tf2B",name:"TF2→GeneB",g1:G1.tf2B,g2:G2.tf2B,d:DELTA.tf2B},
        {key:"geneC",name:"→GeneC",   g1:G1.geneC,g2:G2.geneC,d:DELTA.geneC}
      ];
      const xPos=[-3.4,0,3.4];
      const wScale=4.2;

      // zero baseline
      gDelta.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(-5.2,0,0),new T.Vector3(5.2,0,0)]),
        new T.LineBasicMaterial({color:0x2a3d52})));

      edges.forEach((e,i)=>{
        const x=xPos[i];
        // classify by threshold-on-Δ
        let cls, col;
        if(e.d> thr){ cls="activated"; col=GR; }
        else if(e.d< -thr){ cls="silenced"; col=RO; }
        else { cls="stable"; col=AM; }

        // G1 (back) and G2 (front) reference bars + a signed Δ bar in the middle
        const h1=e.g1*wScale, h2=e.g2*wScale;
        const mk=(h,z,c,op)=>{
          const m=new T.Mesh(new T.BoxGeometry(0.9,Math.max(0.04,h),0.7),
            new T.MeshStandardMaterial({color:c,emissive:c.clone().multiplyScalar(0.4),
              emissiveIntensity:0.4,roughness:0.45,transparent:true,opacity:op}));
          m.position.set(x,h/2,z); return m;
        };
        const b1=mk(h1,-1.4,CY.clone().lerp(SL,0.35),0.55); gDelta.add(b1);
        const b2=mk(h2, 1.4,RO.clone().lerp(SL,0.35),0.55); gDelta.add(b2);
        slbl("G1 "+e.g1.toFixed(2),"#7f93a8",0.32,x,h1+0.2,-1.4);
        slbl("G2 "+e.g2.toFixed(2),"#7f93a8",0.32,x,h2+0.2,1.4);

        // signed Δ bar (grows up if activated, down if silenced)
        const dh=Math.abs(e.d)*wScale;
        const sign=e.d>=0?1:-1;
        const dbar=new T.Mesh(new T.BoxGeometry(1.4,Math.max(0.05,dh),1.2),
          new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.7,roughness:0.35}));
        dbar.position.set(x, sign*dh/2, 0);
        gDelta.add(dbar);
        api.pick(dbar,{delta:{name:e.name,d:e.d,cls,g1:e.g1,g2:e.g2}});

        lbl((e.d>=0?"+":"")+e.d.toFixed(2), col.getStyle(),1.35, x, sign*dh+sign*0.5, 0);
        slbl(e.name,"#cfe0f0",0.40,x,-0.0+ (sign<0? -dh-0.7 : 0.0) , 0);
        lbl(cls, col.getStyle(),0.95, x, sign*dh+sign*1.1, 0);
      });

      // |Δ| threshold guides (±thr)
      [thr,-thr].forEach(tv=>{
        gDelta.add(new T.Line(new T.BufferGeometry().setFromPoints([
          new T.Vector3(-5.0,tv*wScale,0),new T.Vector3(5.0,tv*wScale,0)]),
          new T.LineBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.55})));
      });
      lbl("Δ = G2 − G1","#cfe0f0",1.2, 0, 4.6, 0);

      // static-pooling loss panel: pooled corr(TF2,GeneB)=0.998 vs binned 0.31→0.88
      const px=-5.6;
      const poolBar=new T.Mesh(new T.BoxGeometry(0.8,POOLED_TF2B*wScale,0.7),
        new T.MeshStandardMaterial({color:SL,emissive:SL,emissiveIntensity:0.3,roughness:0.5}));
      poolBar.position.set(px,POOLED_TF2B*wScale/2,-2.6);
      gDelta.add(poolBar);
      api.pick(poolBar,{pooled:{rho:POOLED_TF2B}});
      slbl("pooled ρ "+POOLED_TF2B.toFixed(2),"#8a99ad",0.36,px,POOLED_TF2B*wScale+0.3,-2.6);
      lbl("static loses\nWHEN it switched","#fbbf24",0.85,px,-1.1,-2.6);

      const nActivated=edges.filter(e=>e.d>thr).length;
      const nSilenced =edges.filter(e=>e.d< -thr).length;
      const nStable   =edges.length-nActivated-nSilenced;

      sceneSnap={mode,pseudotime:+tCursor.toFixed(3),nBins,method:methodIdx,threshold:+thr.toFixed(3),
        deltaTF1A:+DELTA.tf1A.toFixed(2),deltaTF2B:+DELTA.tf2B.toFixed(2),deltaGeneC:+DELTA.geneC.toFixed(2),
        nActivated,nSilenced,nStable,pooledRho:POOLED_TF2B};

      return {
        badge:"Δ transition · "+nSilenced+" silenced · "+nActivated+" activated",
        formula:"Δ_k = w_{t_{k+1}} − w_{t_k} ;  |Δ|>τ ⇒ switch",
        insight:"The dynamic GRN is the change between bins. TF1→GeneA: 0.11−0.85 = −0.74 (silenced, rose, the progenitor program shuts down). TF2→GeneB: 0.88−0.31 = +0.57 (activated, green, the differentiation program turns on). →GeneC: 0.09−0.10 = −0.01 (stable, amber, constitutive). Pooling all 4 cells gives corr(TF2,GeneB)=0.998 — a high static weight that hides WHEN the edge activated, the key developmental fact.",
        state:nSilenced+" silenced, "+nActivated+" activated, "+nStable+" stable at τ="+thr.toFixed(2)+". Static pooled ρ=0.998 overstates Bin-1 strength and erases the transition timing.",
        metrics:{
          activeEdge:"Δ classify",
          edgeWeight:DELTA.tf1A.toFixed(2),
          deltaSwitch:"+"+DELTA.tf2B.toFixed(2),
          staticLoss:"ρ=0.998"
        },
        focus:{center:[-0.6,1.2,-0.4],radius:13}
      };
    }
  }

  // ── MathLab.create ─────────────────────────────────────────────────────
  MathLab.create({
    id:"f17",
    kind:"dynamic-grn-trajectory",
    eyebrow:"Block F · GRN Inference",
    title:"F17 · Dynamic GRNs across trajectories and time",
    subtitle:"A GRN is not one graph but a sequence G(t) along pseudotime. Three views: the cell trajectory, per-bin GRNs, and the Δ = G2 − G1 regulatory switch that static inference hides.",
    selectedLabel:"Element",
    selectedHint:"Click a cell, an edge bar, or a Δ bar.",
    modes:[
      {value:"trajectory", label:"Trajectory (4 cells, pseudotime)"},
      {value:"bins",       label:"Per-bin GRNs (G_k)"},
      {value:"dynamic",    label:"Δ transition (silenced / activated)"}
    ],
    params:[
      {key:"pseudotime", label:"pseudotime cursor t",min:0,max:1,step:0.01,value:0.5,
       fmt:v=>(+v).toFixed(2),modes:["trajectory"]},
      {key:"nBins",      label:"# pseudotime bins K",min:2,max:6,step:1,value:2,
       fmt:v=>Math.round(v).toString(),modes:["bins"]},
      {key:"method",     label:"per-bin estimator (0..3)",min:0,max:3,step:1,value:3,
       fmt:v=>["SCODE","CellOracle","Dictys","binned-GENIE3"][Math.round(v)],modes:["bins"]},
      {key:"threshold",  label:"activation threshold τ",min:0.05,max:0.60,step:0.01,value:0.30,
       fmt:v=>(+v).toFixed(2),modes:["bins","dynamic"]}
    ],
    metrics:[
      {key:"activeEdge",  label:"Active edge / op",accent:"cyan"},
      {key:"edgeWeight",  label:"Edge weight w(t)",accent:"rose"},
      {key:"deltaSwitch", label:"Δ switch (silence/activate)",accent:"violet"},
      {key:"staticLoss",  label:"Static-GRN info",accent:"amber"}
    ],
    layers:[
      {group:"traj",   label:"Trajectory ribbons"},
      {group:"grn",    label:"Per-bin GRN bars"},
      {group:"delta",  label:"Δ transition"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Sweep to differentiated (t=0.9)",
      on:api=>{api.setParam("pseudotime",0.9);}
    },
    secondary:{
      label:"Reset to progenitor (t=0.1)",
      on:api=>{api.setParam("pseudotime",0.1);}
    },
    defaultCam:{theta:-0.5,phi:0.55,r:12},
    hint:'<span style="color:#4dd7ff">cyan</span>=TF1 / progenitor · <span style="color:#fb7185">rose</span>=TF2 / silenced · <span style="color:#34d399">green</span>=target / activated · <span style="color:#fbbf24">amber</span>=GeneC constitutive / static · <span style="color:#a78bfa">violet</span>=pseudotime cursor &amp; Δ.',
    onParam(api){
      const s=api.state;
      if(s.mode==="trajectory") api.frame([0,2.6,0.6],11);
      else if(s.mode==="bins")  api.frame([0,2.0,0.4],12);
      else api.frame([-0.6,1.2,-0.4],13);
    },
    onSelect(api,d){
      if(d.cell)   api.setSelected("Cell "+d.cell.i+" · t="+d.cell.t.toFixed(2)+" · "+d.cell.gene+"="+d.cell.expr.toFixed(1));
      if(d.edge)   api.setSelected(d.edge.name+" · Bin "+d.edge.bin+" · w="+d.edge.w.toFixed(2)+(d.edge.active?" · ACTIVE":" · below τ"));
      if(d.delta)  api.setSelected(d.delta.name+" · Δ="+(d.delta.d>=0?"+":"")+d.delta.d.toFixed(2)+" · "+d.delta.cls+" ("+d.delta.g1.toFixed(2)+"→"+d.delta.g2.toFixed(2)+")");
      if(d.pooled) api.setSelected("Pooled corr(TF2,GeneB) over all 4 cells · ρ="+d.pooled.rho.toFixed(3)+" · hides the transition");
    },
    build,
    snapshot(s){
      const t=Math.max(0,Math.min(1,s.pseudotime));
      const K=Math.round(s.nBins);
      const mIdx=Math.round(s.method);
      const thr=s.threshold;
      const wTF1A=edgeWeightAt("tf1A",t), wTF2B=edgeWeightAt("tf2B",t);
      const nAct=[DELTA.tf1A,DELTA.tf2B,DELTA.geneC].filter(d=>d>thr).length;
      const nSil=[DELTA.tf1A,DELTA.tf2B,DELTA.geneC].filter(d=>d< -thr).length;
      return {
        mode:s.mode,
        pseudotime:+t.toFixed(3),
        nBins:K,
        method:mIdx,
        methodName:METHODS[mIdx],
        threshold:+thr.toFixed(3),
        tf1Expr:+exprAt(0,t).toFixed(2),
        tf2Expr:+exprAt(1,t).toFixed(2),
        edgeTF1A:+wTF1A.toFixed(3),
        edgeTF2B:+wTF2B.toFixed(3),
        deltaTF1A:+DELTA.tf1A.toFixed(2),
        deltaTF2B:+DELTA.tf2B.toFixed(2),
        deltaGeneC:+DELTA.geneC.toFixed(2),
        nActivated:nAct,
        nSilenced:nSil,
        pooledRho:POOLED_TF2B,
        switchVisible:(Math.abs(DELTA.tf1A)>thr||Math.abs(DELTA.tf2B)>thr)
      };
    }
  });
})();
</script>
