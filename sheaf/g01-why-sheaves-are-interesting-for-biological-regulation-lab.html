<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G01 · Why sheaves are interesting for biological regulation</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (hash-based; no clock, no entropy) ───────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── WORKED EXAMPLE (note §5) — single source of truth ────────────────────
  // 3-gene GRN: TF1 activates GeneA (e1, +), TF1 represses GeneB (e2, −).
  // Each node carries an R^2 stalk = (expression, chromatin_accessibility).
  const X = {
    TF1 : [2.0, 1.5],   // active TF, open chromatin
    A   : [1.8, 1.2],   // expressed, accessible
    B   : [0.3, 0.8]    // repressed, partially accessible
  };
  // Diagonal restriction maps on the tail (TF1); heads use identity.
  const R1 = [0.9, 0.8];   // F(TF1,e1) diag — activation
  const R2 = [-0.8,-0.5];  // F(TF1,e2) diag — repression

  // matrix-vector for a 2x2 stored as [[m00,m01],[m10,m11]]
  function mv(M,v){ return [M[0][0]*v[0]+M[0][1]*v[1], M[1][0]*v[0]+M[1][1]*v[1]]; }
  function diagM(d){ return [[d[0],0],[0,d[1]]]; }
  function sub(a,b){ return [a[0]-b[0], a[1]-b[1]]; }
  function nrm2(a){ return a[0]*a[0]+a[1]*a[1]; }

  // Off-diagonal cross-modal map for "multimodal" mode (note §4, Type 3):
  // w couples chromatin->expression and expression->accessibility.
  function R1full(cross){ return [[0.9, cross],[cross*0.6, 0.8]]; }

  let sceneSnap={};

  // ── per-mode energy of the worked example ────────────────────────────────
  // gain    scales restriction-map magnitude (regulatory strength slider).
  // repress (0..1) interpolates the sign on e2 (1 = full repression).
  // cross   off-diagonal coupling (multimodal mode).
  // bState  diffusion: 1 = observed GeneB, →0 drives GeneB toward consistency.
  function edgeEnergies(mode,gain,repress,cross,bState){
    const xB=[X.B[0]*bState, X.B[1]*bState];
    let R1m, R2m;
    if(mode==="multimodal"){ R1m=R1full(cross); }
    else { R1m=diagM([R1[0]*gain, R1[1]*gain]); }
    const projTF1_e1=mv(R1m,X.TF1);
    const headA=X.A.slice();
    const E1=nrm2(sub(headA,projTF1_e1));

    if(mode==="scalar"){
      // scalar GCN: magnitude only, sign erased -> uses |R2|
      R2m=diagM([Math.abs(R2[0])*gain, Math.abs(R2[1])*gain]);
    } else {
      const sgn = repress*2-1; // repress=1 -> -1 (repress), repress=0 -> +1 (activate)
      R2m=diagM([Math.abs(R2[0])*gain*sgn, Math.abs(R2[1])*gain*sgn]);
      if(mode==="multimodal"){ R2m=[[R2m[0][0],-cross],[-cross*0.6,R2m[1][1]]]; }
    }
    const projTF1_e2=mv(R2m,X.TF1);
    const headB=xB;
    const E2=nrm2(sub(headB,projTF1_e2));
    return {E1,E2,Etot:E1+E2,projTF1_e1,projTF1_e2,headA,headB:xB,R1m,R2m};
  }

  // ── build ────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const gain=s.gain;
    const repress=s.repress;
    const cross=s.cross;
    const bState=s.diffuse;

    const gGraph =api.group("graph");
    const gStalk =api.group("stalk");
    const gBars  =api.group("bars");
    const gLabels=api.group("labels");

    function addLbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function addSlbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff");  // TF1 / projection
    const GR=new T.Color("#34d399");  // activation / consistent
    const AM=new T.Color("#fbbf24");  // GeneA
    const RO=new T.Color("#f87171");  // repression / discordant
    const VI=new T.Color("#a78bfa");  // GeneB / energy
    const SL=new T.Color("#54667c");

    const E=edgeEnergies(mode,gain,repress,cross,bState);

    // ── node layout (the canonical 3-gene GRN) ──────────────────────────────
    const pTF1=new T.Vector3(0, 0, 0);
    const pA  =new T.Vector3(-3.2, 0, 2.6);
    const pB  =new T.Vector3( 3.2, 0, 2.6);

    function geneNode(pos,col,r){
      const m=new T.Mesh(new T.SphereGeometry(r,22,16),
        new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:0.6,roughness:0.35}));
      m.position.copy(pos); gGraph.add(m); return m;
    }
    const nTF1=geneNode(pTF1,CY,0.62);
    const nA  =geneNode(pA,AM,0.5);
    const nB  =geneNode(pB,VI,0.5);
    api.pick(nTF1,{gene:{id:"TF1",x:X.TF1}});
    api.pick(nA,{gene:{id:"GeneA",x:E.headA}});
    api.pick(nB,{gene:{id:"GeneB",x:E.headB}});

    addLbl("TF1","#4dd7ff",1.55,0,0.95,0);
    addLbl("GeneA","#fbbf24",1.3,-3.2,0.85,2.6);
    addLbl("GeneB","#a78bfa",1.3,3.2,0.85,2.6);

    // ── directed edges with arrowheads (TF1 is the tail of both) ─────────────
    function dirEdge(a,b,col,thick){
      const dir=new T.Vector3().subVectors(b,a);
      const len=dir.length();
      const mid=new T.Vector3().addVectors(a,b).multiplyScalar(0.5);
      const cyl=new T.Mesh(new T.CylinderGeometry(thick,thick,len*0.74,10),
        new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.4),emissiveIntensity:0.5,roughness:0.5}));
      const up=new T.Vector3(0,1,0);
      cyl.quaternion.setFromUnitVectors(up,dir.clone().normalize());
      cyl.position.copy(mid);
      gGraph.add(cyl);
      const cone=new T.Mesh(new T.ConeGeometry(thick*2.4,0.5,12),new T.MeshBasicMaterial({color:col}));
      cone.quaternion.setFromUnitVectors(up,dir.clone().normalize());
      cone.position.copy(b).addScaledVector(dir.clone().normalize(),-0.62);
      gGraph.add(cone);
    }
    const e1col=GR;
    let e2col;
    if(mode==="scalar") e2col=SL.clone();                // sign erased
    else e2col=(repress>0.5)?RO.clone():GR.clone();      // signed
    dirEdge(pTF1,pA,e1col,0.07);
    dirEdge(pTF1,pB,e2col,0.07);
    addSlbl(mode==="scalar"?"w₁ = 0.9":"e1 +",e1col.getStyle(),0.4,-1.6,0.2,1.3);
    addSlbl(mode==="scalar"?"w₂ = 0.8":(repress>0.5?"e2 −":"e2 +"),e2col.getStyle(),0.4,1.6,0.2,1.3);

    // ── stalk frames: the R^2 vector (expression, accessibility) per gene ────
    function stalkFrame(pos,vec,col,scale){
      const base=pos.clone().add(new T.Vector3(0,1.7,0));
      const ax=[new T.Vector3(base.x-0.05,base.y,base.z),new T.Vector3(base.x+1.0,base.y,base.z)];
      const ay=[new T.Vector3(base.x,base.y-0.05,base.z),new T.Vector3(base.x,base.y+1.0,base.z)];
      gStalk.add(new T.Line(new T.BufferGeometry().setFromPoints(ax),new T.LineBasicMaterial({color:0x33485e})));
      gStalk.add(new T.Line(new T.BufferGeometry().setFromPoints(ay),new T.LineBasicMaterial({color:0x33485e})));
      const tip=new T.Vector3(base.x+vec[0]*scale,base.y+vec[1]*scale,base.z);
      gStalk.add(new T.Line(new T.BufferGeometry().setFromPoints([base,tip]),new T.LineBasicMaterial({color:col.getHex()})));
      const dot=new T.Mesh(new T.SphereGeometry(0.09,10,10),new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.85,roughness:0.3}));
      dot.position.copy(tip); gStalk.add(dot);
    }
    const sc=0.34;
    stalkFrame(pTF1,X.TF1,CY,sc);
    stalkFrame(pA,E.headA,AM,sc);
    stalkFrame(pB,E.headB,VI,sc);
    addSlbl("(expr, access)","#6b7a8d",0.34,0,3.05,0);

    // ── per-edge consistency energy bars ‖δx_e‖² ────────────────────────────
    const barX=[-1.4,1.4], barZ=-3.4;
    const evals=[E.E1,E.E2];
    const ecols=[GR,VI];
    const elabs=["e1 ‖δ‖²","e2 ‖δ‖²"];
    const maxBar=Math.max(0.5,E.E1,E.E2);
    evals.forEach((ev,i)=>{
      const h=0.1+(ev/Math.max(maxBar,0.001))*3.6;
      const bar=new T.Mesh(new T.BoxGeometry(0.9,h,0.9),
        new T.MeshStandardMaterial({color:ecols[i],emissive:ecols[i].clone().multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));
      bar.position.set(barX[i],h/2,barZ);
      gBars.add(bar);
      api.pick(bar,{ebar:{edge:i===0?"e1":"e2",energy:ev}});
      addLbl(ev.toFixed(2),ecols[i].getStyle(),1.2,barX[i],h+0.45,barZ);
      addSlbl(elabs[i],ecols[i].getStyle(),0.36,barX[i],0.05,barZ);
    });
    gBars.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-2.6,0,barZ),new T.Vector3(2.6,0,barZ)]),new T.LineBasicMaterial({color:0x1e3046})));

    // ── consistency residual marker on the energy edge (when nonzero) ────────
    if(E.E2>0.05){
      const gp0=pB.clone().add(new T.Vector3(0,2.7,0));
      const gp1=gp0.clone().add(new T.Vector3(0,Math.min(2.0,E.E2*0.28),0));
      gStalk.add(new T.Line(new T.BufferGeometry().setFromPoints([gp0,gp1]),new T.LineBasicMaterial({color:VI.getHex()})));
    }

    // ── numbers + framing strings ────────────────────────────────────────────
    const e2share = E.Etot>1e-9 ? (E.E2/E.Etot*100) : 0;
    let badge, formula, insight, state;
    const f="<span style='color:#4dd7ff'>x_TF1</span>=[2.0,1.5] · GeneA=[1.8,1.2] · GeneB=[0.3,0.8]";

    if(mode==="scalar"){
      badge="GCN scalar edge · sign erased";
      formula="msg(e) = w·x<sub>src</sub> ,  w ∈ ℝ<sub>≥0</sub>  (one number, no sign)";
      insight="A standard GCN puts ONE non-negative number on each edge. TF1→GeneA (w₁=0.9) and the repressive TF1→GeneB (w₂=0.8) look identical in sign — the repression is invisible. With symmetric, sign-blind weights the model cannot tell activation from repression, so the energy on e2 stays low and hides the biological inconsistency.";
      state="Scalar weights: e1="+E.E1.toFixed(2)+", e2="+E.E2.toFixed(2)+". The repressor's sign is gone — both edges treated as positive. Switch to 'signed' to expose the real inconsistency.";
    } else if(mode==="signed"){
      badge="Signed sheaf · diagonal R · e2 holds "+e2share.toFixed(0)+"%";
      formula="(δx)<sub>e</sub> = F(v,e)x<sub>v</sub> − F(u,e)x<sub>u</sub> ,  E<sub>F</sub>=Σ‖δx‖²";
      insight="Now activation gets R=+diag (e1) and repression gets R=−diag (e2). Consistency check: F(TF1,e1)x_TF1=[1.80,1.20] matches GeneA exactly → e1≈0. But F(TF1,e2)x_TF1=[−1.60,−0.75] is far from GeneB=[0.3,0.8] → e2="+E.E2.toFixed(2)+". The sign is what makes the repressive edge report high energy: the observed state contradicts the repression hypothesis.";
      state="Signed maps: e1="+E.E1.toFixed(2)+" (consistent), e2="+E.E2.toFixed(2)+" ("+e2share.toFixed(0)+"% of E_F="+E.Etot.toFixed(2)+"). Drag 'repress' to 0 to flip e2 to activation and watch its energy collapse; drag 'diffuse' to relax GeneB.";
    } else { // multimodal
      badge="2×2 restriction map · cross-modal w="+cross.toFixed(2);
      formula="F(TF1,e) = [[0.9, w],[0.6w, 0.8]]  — off-diagonals couple modalities";
      insight="With 2-D stalks (expression, accessibility) the restriction map is a 2×2 matrix. The off-diagonal w lets TF1's chromatin accessibility predict GeneA's expression directly — a cross-modal coupling no scalar weight can express. Increasing w rotates the projected TF1 stalk and changes both edge energies. This is the geometric content of the note's Type-3 transformation.";
      state="2×2 maps, cross-modal w="+cross.toFixed(2)+": e1="+E.E1.toFixed(2)+", e2="+E.E2.toFixed(2)+". Off-diagonals mix expression and accessibility; e1 is no longer exactly 0 because TF1's projection rotates in the stalk plane.";
    }

    sceneSnap={
      mode,
      gain:+gain.toFixed(3),
      repress:+repress.toFixed(3),
      cross:+cross.toFixed(3),
      diffuse:+bState.toFixed(3),
      e1Energy:+E.E1.toFixed(4),
      e2Energy:+E.E2.toFixed(4),
      totalEnergy:+E.Etot.toFixed(4),
      e2Share:+e2share.toFixed(1),
      signEncoded: mode!=="scalar",
      crossModal: mode==="multimodal"
    };

    return {
      badge,
      formula:f+"<br>"+formula,
      insight,
      insightLabel:"What this mode shows",
      state,
      metrics:{
        e1Energy:E.E1.toFixed(2),
        e2Energy:E.E2.toFixed(2),
        totalEnergy:E.Etot.toFixed(2),
        e2Share:e2share.toFixed(0)+"%"
      },
      focus:{center:[0,1.0,0],radius:11}
    };
  }

  // ── MathLab.create ────────────────────────────────────────────────────────
  MathLab.create({
    id:"g01",
    kind:"sheaf-grn-regulation",
    eyebrow:"Block G · Sheaf GNN for Biology",
    title:"G01 · Why sheaves are interesting for biological regulation",
    subtitle:"A 3-gene GRN — TF1 activates GeneA, TF1 represses GeneB — with R² stalks (expression, accessibility). Compare a scalar GCN edge, a signed sheaf restriction map, and a 2×2 cross-modal map.",
    selectedLabel:"Element",
    selectedHint:"Click a gene node or an energy bar.",
    insightLabel:"What this mode shows",
    modes:[
      {value:"scalar",     label:"Scalar GCN edge (sign-blind)"},
      {value:"signed",     label:"Signed sheaf map (±diag)"},
      {value:"multimodal", label:"2×2 cross-modal restriction map"}
    ],
    params:[
      {key:"gain",   label:"restriction-map strength (×R)",min:0.4,max:1.4,step:0.05,value:1.0,
       fmt:v=>v.toFixed(2)+"×"},
      {key:"repress",label:"e2 sign (0=activate 1=repress)",min:0,max:1,step:0.05,value:1.0,
       fmt:v=>v<0.5?"activate":"repress",modes:["signed"]},
      {key:"cross",  label:"cross-modal coupling w",min:0,max:0.6,step:0.02,value:0.25,
       fmt:v=>v.toFixed(2),modes:["multimodal"]},
      {key:"diffuse",label:"GeneB state (1=observed →0 diffused)",min:0.0,max:1.0,step:0.05,value:1.0,
       fmt:v=>v.toFixed(2),modes:["signed","multimodal"]}
    ],
    metrics:[
      {key:"e1Energy",   label:"e1 energy ‖δ‖²",accent:"green"},
      {key:"e2Energy",   label:"e2 energy ‖δ‖²",accent:"violet"},
      {key:"totalEnergy",label:"total E_F(x)",  accent:"cyan"},
      {key:"e2Share",    label:"e2 share of E_F",accent:"amber"}
    ],
    layers:[
      {group:"graph",  label:"GRN nodes / edges"},
      {group:"stalk",  label:"Stalk frames (R²)"},
      {group:"bars",   label:"Energy bars"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Diffuse GeneB → consistent",
      on:api=>{api.setParam("diffuse",0.0);}
    },
    secondary:{
      label:"Reset observed state",
      on:api=>{api.setParam("diffuse",1.0);api.setParam("repress",1.0);}
    },
    defaultCam:{theta:-0.5,phi:0.62,r:11},
    hint:'<span style="color:#4dd7ff">cyan</span>=TF1 · <span style="color:#fbbf24">amber</span>=GeneA · <span style="color:#a78bfa">violet</span>=GeneB / energy · <span style="color:#34d399">green</span>=activation · <span style="color:#f87171">rose</span>=repression · grey=sign-erased scalar edge.',
    onParam(api){ api.frame([0,1.0,0],11); },
    onMode(api){ api.frame([0,1.0,0],11); },
    onSelect(api,d){
      if(d.gene) api.setSelected(d.gene.id+" stalk x=["+d.gene.x.map(v=>(+v).toFixed(2)).join(", ")+"]  (expr, access)");
      if(d.ebar) api.setSelected(d.ebar.edge+" consistency energy ‖δx‖² = "+d.ebar.energy.toFixed(3));
    },
    build,
    snapshot(s){
      const E=edgeEnergies(s.mode,s.gain,s.repress,s.cross,s.diffuse);
      const share=E.Etot>1e-9?(E.E2/E.Etot*100):0;
      return {
        mode:s.mode,
        gain:+(+s.gain).toFixed(3),
        repress:+(+s.repress).toFixed(3),
        cross:+(+s.cross).toFixed(3),
        diffuse:+(+s.diffuse).toFixed(3),
        e1Energy:+E.E1.toFixed(4),
        e2Energy:+E.E2.toFixed(4),
        totalEnergy:+E.Etot.toFixed(4),
        e2Share:+share.toFixed(1),
        signEncoded: s.mode!=="scalar",
        crossModal: s.mode==="multimodal",
        repressorHidden: s.mode==="scalar"
      };
    }
  });
})();
</script>
</body>
</html>
