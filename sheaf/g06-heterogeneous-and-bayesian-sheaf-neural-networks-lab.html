<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G06 · Heterogeneous and Bayesian Sheaf Neural Networks</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (sine-hash; no rng, no clock) ─────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── Section-5 worked example: the canonical 4-node heterogeneous GRN ──────
  // Node types: TF (d=3: expression, SCENIC, motif_acc), gene (d=2: expression, ATAC)
  // Edge stalk dimension d_e = 2 for every edge.
  const X = {
    TF1 :[2.1,1.4,0.9],   // type TF , d=3
    TF2 :[0.4,0.2,0.3],   // type TF , d=3
    GeneA:[1.8,0.7],      // type gene, d=2
    GeneB:[0.2,0.4]       // type gene, d=2
  };
  // restriction-map scalars (diagonal d_e×d_node maps) initialised from motif score
  const MOTIF={e1:0.85,e2:0.45,e3:0.35};
  // edges: tail (TF) -> head (gene), with sign (activation +1 / repression −1)
  const EDGES=[
    {id:"e1",tail:"TF1",head:"GeneA",sign:+1,motif:MOTIF.e1,kind:"activation"},
    {id:"e2",tail:"TF2",head:"GeneA",sign:-1,motif:MOTIF.e2,kind:"repression"},
    {id:"e3",tail:"TF2",head:"GeneB",sign:+1,motif:MOTIF.e3,kind:"activation"}
  ];
  // Bayesian posterior first-row (mu,sigma) per edge tail map (from the note)
  const POST={
    e1:{mu:[0.87,0.02,-0.01], sig:[0.04,0.12,0.09]},
    e2:{mu:[-0.43,0.01,-0.02],sig:[0.18,0.31,0.27]},
    e3:{mu:[0.34,0.03,-0.02], sig:[0.11,0.20,0.16]}  // intermediate evidence
  };

  // ── per-edge sheaf algebra (exact, deterministic) ─────────────────────────
  // R_{tail->e} is a 2×d_tail diagonal map with INTRINSIC scale = motif·sign (a
  // repressor map is genuinely negative). R_{head->e} = identity (2×2).
  //   unsigned energy : ‖R_t x_t − x_h‖²        (standard sheaf coboundary)
  //   signed  energy  : ‖R_t x_t + x_h‖²        (anti-alignment test for repression)
  // Matches the note's Section-5 numbers exactly: E_e2(unsigned)=4.544,
  // E_e2(signed)=2.996, while activators e1,e3 are nearly unchanged.
  function cob(edge,signed){
    const xt=X[edge.tail], xh=X[edge.head];
    const s=edge.motif*edge.sign;                // intrinsically-signed restriction map
    const proj=[s*xt[0], s*xt[1]];               // R_{tail->e} x_tail  (first 2 coords)
    const dx = signed
      ? [proj[0]+xh[0], proj[1]+xh[1]]           // ‖R_t x_t + x_h‖²  (repression alignment)
      : [proj[0]-xh[0], proj[1]-xh[1]];          // ‖R_t x_t − x_h‖²
    const E=dx[0]*dx[0]+dx[1]*dx[1];
    return {proj,xh,dx,E};
  }
  // Bayesian per-edge uncertainty: sum sigma^2 over the 2 rows of the tail map
  // (head map is identity init → negligible). Matches note: u(e)=Σσ² · 2 rows.
  function uncert(edge){
    const p=POST[edge.id]; let s2=0;
    for(let k=0;k<3;k++) s2+=p.sig[k]*p.sig[k];
    return 2*s2;                                  // two rows of the 2×3 map
  }
  function couplingStrength(edge){                // ‖mu‖_F (first-row proxy ×√2 rows)
    const p=POST[edge.id]; let m2=0;
    for(let k=0;k<3;k++) m2+=p.mu[k]*p.mu[k];
    return Math.sqrt(2*m2);
  }

  let sceneSnap={};

  // ── build ─────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state, mode=s.mode;
    const evidence=Math.round(s.evidence);          // # cells (×1000) → shrinks posterior σ
    const lambda=s.lambda;                           // prior strength (KL weight)
    const signed=Math.round(s.signed)===1;           // 0=unsigned energy, 1=signed energy
    const selEdge=Math.round(s.edge);                // 1,2,3 → highlight e1/e2/e3

    const gNodes =api.group("nodes");
    const gMaps  =api.group("maps");
    const gEnergy=api.group("energy");
    const gLabels=api.group("labels");

    function lbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function slbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff");   // TF / expression
    const GR=new T.Color("#34d399");   // gene / activation / low-uncertainty
    const AM=new T.Color("#fbbf24");   // edge stalk / energy
    const VI=new T.Color("#a78bfa");   // restriction map / uncertainty
    const RS=new T.Color("#fb7185");   // repression / high-uncertainty
    const SL=new T.Color("#54667c");

    // fixed 3D positions for the 4 nodes (two TF on the left, two gene on the right)
    const POS={
      TF1 :new T.Vector3(-3.6, 1.6,0),
      TF2 :new T.Vector3(-3.6,-1.6,0),
      GeneA:new T.Vector3( 3.6, 1.6,0),
      GeneB:new T.Vector3( 3.6,-1.6,0)
    };
    const isTF=n=>n==="TF1"||n==="TF2";
    const dimOf=n=>isTF(n)?3:2;

    // ════════════════════════════════════════════════════════════════════════
    // MODE: heterogeneous — different stalk dimensions + rectangular maps
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="hetero"){
      // draw each node as a stack of unit cubes = its stalk dimension
      Object.keys(POS).forEach(n=>{
        const d=dimOf(n), p=POS[n];
        const col=isTF(n)?CY:GR;
        const feat=X[n];
        for(let k=0;k<d;k++){
          const h=0.28+0.5*Math.abs(feat[k]);     // bar height ∝ |feature value|
          const cube=new T.Mesh(new T.BoxGeometry(0.62,h,0.62),
            new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:0.55,roughness:0.4}));
          cube.position.set(p.x,p.y-0.95+k*0.95,p.z);
          gNodes.add(cube);
          api.pick(cube,{node:{id:n,dim:d,coord:k,val:feat[k]}});
          slbl(feat[k].toFixed(1),isTF(n)?"#bfe9ff":"#bdf0d9",0.34,p.x,p.y-0.95+k*0.95+h*0.5+0.18,p.z);
        }
        lbl(n+"  (R^"+d+")",isTF(n)?"#4dd7ff":"#34d399",1.2,p.x,p.y+1.9,p.z);
      });

      // restriction maps as rectangular plates between tail and head
      EDGES.forEach((e,ei)=>{
        const pa=POS[e.tail], pb=POS[e.head];
        const active=(ei+1===selEdge);
        const ecol=e.sign>0?GR:RS;
        // edge body
        const mid=pa.clone().add(pb).multiplyScalar(0.5);
        const edgeLine=new T.Line(new T.BufferGeometry().setFromPoints([pa,pb]),
          new T.LineBasicMaterial({color:active?0x9bb4cc:0x33485e,transparent:true,opacity:active?0.9:0.5}));
        gMaps.add(edgeLine);
        // rectangular "2 × d_tail" plate at the tail side
        const dT=dimOf(e.tail);
        const plate=new T.Mesh(new T.PlaneGeometry(0.34*dT,0.7),
          new T.MeshBasicMaterial({color:VI.getHex(),transparent:true,opacity:active?0.9:0.42,side:T.DoubleSide}));
        plate.position.copy(pa.clone().lerp(pb,0.30)); plate.position.z=0.05;
        gMaps.add(plate);
        api.pick(plate,{map:{id:e.id,rows:2,cols:dT,kind:e.kind}});
        lbl("R_"+e.id+" 2×"+dT,active?"#c4b5fd":"#7c6ea8",active?1.15:0.95,
          mid.x,mid.y+(e.tail==="TF2"&&e.head==="GeneA"?-0.55:0.55),0.1);
        // small identity plate at head side (2×2)
        const idp=new T.Mesh(new T.PlaneGeometry(0.68,0.7),
          new T.MeshBasicMaterial({color:AM.getHex(),transparent:true,opacity:active?0.8:0.35,side:T.DoubleSide}));
        idp.position.copy(pa.clone().lerp(pb,0.72)); idp.position.z=0.05;
        gMaps.add(idp);
      });

      lbl("TF stalk  R^3","#4dd7ff",1.05,-3.6,3.0,0);
      lbl("gene stalk  R^2","#34d399",1.05,3.6,3.0,0);
      lbl("edge stalk  d_e = 2","#fbbf24",1.05,0,-3.2,0);

      const dimC0=2*3+2*2;                          // ΣE d_v = 3+3+2+2 = 10
      const offBlock="3×2";                          // (TF1,GeneA) rectangular off-diag block
      sceneSnap={mode,selEdge,dimTF:3,dimGene:2,sectionDim:dimC0,
        offDiagRows:3,offDiagCols:2,energyTotal:null,uncertaintyRatio:null,evidence,lambda:+lambda.toFixed(2),signed:0};

      return {
        badge:"Heterogeneous · ΣE d_v = "+dimC0+" · L_F^het blocks vary",
        formula:"R_{u→e}: R^{d_τ(u)} → R^{d_e}   ·   d_TF=3, d_gene=2, d_e=2",
        insight:"Each node type lives in its own stalk: TF nodes carry R³ (expression, SCENIC, motif accessibility), gene nodes carry R² (expression, ATAC). The restriction maps (violet plates) are therefore RECTANGULAR 2×d_τ matrices, and the off-diagonal Laplacian block for (TF1,GeneA) is a 3×2 — not square. The section space C⁰(F) has total dimension Σ d_v = "+dimC0+".",
        state:"Node bar heights = |feature values|. Highlighted edge e"+selEdge+": tail map R is 2×"+dimOf(EDGES[selEdge-1].tail)+", head map is the 2×2 identity. Off-diagonal block (TF1,GeneA) = "+offBlock+".",
        metrics:{energyTotal:"—",worstEdge:"e2",uncertaintyRatio:"—",sectionDim:dimC0+" dims"},
        focus:{center:[0,0,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // MODE: coboundary — per-edge consistency energy (signed vs unsigned)
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="coboundary"){
      // compute energies for all edges
      const E=EDGES.map(e=>cob(e,signed));
      const Etot=E.reduce((a,c)=>a+c.E,0);

      // draw the 4 nodes (small spheres) + edges, then a bar per edge for energy
      Object.keys(POS).forEach(n=>{
        const p=POS[n], col=isTF(n)?CY:GR;
        const sp=new T.Mesh(new T.SphereGeometry(0.34,20,16),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.6),emissiveIntensity:0.6,roughness:0.4}));
        sp.position.copy(p); gNodes.add(sp);
        api.pick(sp,{node:{id:n,dim:dimOf(n)}});
        lbl(n,isTF(n)?"#4dd7ff":"#34d399",1.05,p.x,p.y+0.8,p.z);
      });

      EDGES.forEach((e,ei)=>{
        const pa=POS[e.tail], pb=POS[e.head];
        const active=(ei+1===selEdge);
        const ec=E[ei];
        const ecol=e.sign>0?GR:RS;
        // edge thickness ∝ energy
        const w=0.05+Math.min(0.42,ec.E*0.09);
        const len=pa.distanceTo(pb);
        const cyl=new T.Mesh(new T.CylinderGeometry(w,w,len,10,1,true),
          new T.MeshStandardMaterial({color:ecol,emissive:ecol.clone().multiplyScalar(active?0.8:0.3),
            emissiveIntensity:active?0.7:0.25,roughness:0.5,transparent:true,opacity:active?1:0.6}));
        cyl.position.copy(pa.clone().add(pb).multiplyScalar(0.5));
        const dir=pb.clone().sub(pa).normalize();
        cyl.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);
        gMaps.add(cyl);
        api.pick(cyl,{edge:{id:e.id,kind:e.kind,energy:ec.E,dx:ec.dx}});

        // energy bar rising at the edge midpoint
        const mid=pa.clone().add(pb).multiplyScalar(0.5);
        const h=0.12+Math.min(3.6,ec.E*0.78);
        const bar=new T.Mesh(new T.BoxGeometry(0.7,h,0.7),
          new T.MeshStandardMaterial({color:AM,emissive:AM.clone().multiplyScalar(active?0.85:0.25),
            emissiveIntensity:active?0.72:0.2,roughness:0.4,transparent:!active,opacity:active?1:0.5}));
        bar.position.set(mid.x,h/2-2.7,mid.z-0.0);
        gEnergy.add(bar);
        lbl(e.id+"  E="+ec.E.toFixed(2),active?"#fde68a":"#b89456",active?1.25:1.0,mid.x,h-2.7+0.5,mid.z);
        slbl(e.kind+(e.sign<0?" (−)":" (+)"),e.sign>0?"#9be8c4":"#ffb3c0",0.36,mid.x,-2.95,mid.z);
        // coboundary vector annotation for the selected edge
        if(active){
          lbl("δx = ["+ec.dx[0].toFixed(2)+", "+ec.dx[1].toFixed(2)+"]","#cfe0f0",0.95,mid.x,mid.y+0.65,mid.z+0.1);
        }
      });

      // baseline
      gEnergy.add(new T.Line(new T.BufferGeometry().setFromPoints(
        [new T.Vector3(-5,-2.7,0),new T.Vector3(5,-2.7,0)]),new T.LineBasicMaterial({color:0x2a3d52})));
      lbl("‖δx_e‖²  consistency energy","#fbbf24",1.05,0,2.1,0);

      const worst=E.reduce((wi,c,i,arr)=>c.E>arr[wi].E?i:wi,0);
      sceneSnap={mode,selEdge,signed:signed?1:0,
        E1:+E[0].E.toFixed(3),E2:+E[1].E.toFixed(3),E3:+E[2].E.toFixed(3),
        energyTotal:+Etot.toFixed(3),worstEdgeIdx:worst+1,evidence,lambda:+lambda.toFixed(2),uncertaintyRatio:null};

      return {
        badge:"Coboundary · "+(signed?"signed":"unsigned")+" energy · E_F = "+Etot.toFixed(2),
        formula:signed
          ? "E_e^signed = ‖R_{u→e}x_u + R_{v→e}x_v‖²   (repression = anti-alignment)"
          : "E_F(x) = Σ_e ‖R_{u→e}x_u − R_{v→e}x_v‖²",
        insight:signed
          ? "The signed energy tests ANTI-alignment for repression: e2 drops from 4.54 to 2.996 because a weak repressor (TF2) acting on a high gene (GeneA) is a partial — not total — inconsistency. The activating edges e1, e3 are barely affected. This is exactly why signed/directed sheaves matter for GRNs."
          : "Each edge's coboundary δx = R_{tail}x_tail − R_{head}x_head measures regulatory disagreement. e1 (TF1→GeneA) is nearly consistent (E=0.24); e2 (TF2⊣GeneA) is the worst (E=4.54): the restriction map says an active TF2 should predict LOW GeneA, but GeneA is high. The tallest amber bar is the edge the model flags.",
        state:"Selected e"+selEdge+": "+EDGES[selEdge-1].kind+", motif="+EDGES[selEdge-1].motif.toFixed(2)+
          " · δx=["+E[selEdge-1].dx[0].toFixed(2)+", "+E[selEdge-1].dx[1].toFixed(2)+"] · E="+E[selEdge-1].E.toFixed(3)+
          " · total E_F="+Etot.toFixed(2)+".",
        metrics:{energyTotal:Etot.toFixed(2),worstEdge:"e"+(worst+1),uncertaintyRatio:"—",sectionDim:"10 dims"},
        focus:{center:[0,-0.4,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════════════
    // MODE: bayesian — posterior over restriction maps + per-edge uncertainty
    // ════════════════════════════════════════════════════════════════════════
    if(mode==="bayesian"){
      // more cells (evidence) and stronger prior (lambda) shrink σ.
      // shrink factor ∈ (0,1]; at evidence=1000 cells, lambda=1 → factor 1 (note's numbers).
      const ev=Math.max(1,evidence);
      const evShrink=Math.sqrt(1000/(1000+ (ev-1000>0?0:(1000-ev)) ));  // <=1 only if fewer cells
      // simpler, monotone, deterministic: more cells → smaller σ; bigger λ → smaller σ
      const shrink=Math.sqrt(1000/(ev+1)) * Math.sqrt(1/Math.max(0.25,lambda));
      const sCl=v=>Math.max(0.2,Math.min(2.2,v));    // clamp the multiplier sensibly
      const k=sCl(shrink/Math.sqrt(1000/1001));      // normalised so ev=1000,λ=1 ≈ 1

      // per-edge uncertainty with the current multiplier (σ scaled by k)
      const u=EDGES.map(e=>{
        const p=POST[e.id]; let s2=0; for(let i=0;i<3;i++){const sg=p.sig[i]*k; s2+=sg*sg;}
        return 2*s2;
      });
      const cstr=EDGES.map(e=>couplingStrength(e));

      // draw each edge as a "cloud" of sample restriction maps: spheres jittered
      // by σ around the mean map position. Tight cloud = confident; wide = uncertain.
      Object.keys(POS).forEach(n=>{
        const p=POS[n], col=isTF(n)?CY:GR;
        const sp=new T.Mesh(new T.SphereGeometry(0.30,18,14),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));
        sp.position.copy(p); gNodes.add(sp);
        lbl(n,isTF(n)?"#4dd7ff":"#34d399",0.95,p.x,p.y+0.75,p.z);
      });

      EDGES.forEach((e,ei)=>{
        const pa=POS[e.tail], pb=POS[e.head];
        const active=(ei+1===selEdge);
        const mid=pa.clone().add(pb).multiplyScalar(0.5);
        const ui=u[ei];
        // colour by uncertainty: low→green, high→rose
        const tcol=GR.clone().lerp(RS, Math.min(1,ui/0.45));
        // mean-map marker
        const meanM=new T.Mesh(new T.SphereGeometry(0.20,16,12),
          new T.MeshStandardMaterial({color:tcol,emissive:tcol,emissiveIntensity:0.9,roughness:0.25}));
        meanM.position.copy(mid); gMaps.add(meanM);
        api.pick(meanM,{post:{id:e.id,uncertainty:ui,coupling:cstr[ei],kind:e.kind}});
        // posterior sample cloud — radius ∝ sqrt(uncertainty)
        const rad=0.25+Math.sqrt(ui)*1.5;
        const nS=active?26:14;
        for(let q=0;q<nS;q++){
          const a1=prand(ei*53+q*7.3)*Math.PI*2;
          const a2=prand(ei*91+q*3.1)*Math.PI;
          const rr=rad*Math.cbrt(prand(ei*131+q*5.7));      // deterministic jitter
          const dot=new T.Mesh(new T.SphereGeometry(0.055,8,8),
            new T.MeshStandardMaterial({color:tcol,emissive:tcol,emissiveIntensity:0.7,roughness:0.4,transparent:true,opacity:active?0.85:0.5}));
          dot.position.set(mid.x+rr*Math.sin(a2)*Math.cos(a1),
                           mid.y+rr*Math.cos(a2),
                           mid.z+rr*Math.sin(a2)*Math.sin(a1));
          gMaps.add(dot);
        }
        // thin edge line
        gMaps.add(new T.Line(new T.BufferGeometry().setFromPoints([pa,pb]),
          new T.LineBasicMaterial({color:0x2a3d52,transparent:true,opacity:0.5})));
        lbl(e.id+"  u="+ui.toFixed(3),active?(ui>0.2?"#fda4af":"#86efac"):"#7c8a9c",active?1.2:0.95,
          mid.x, mid.y+(e.tail==="TF2"&&e.head==="GeneA"?-0.95:0.95),mid.z);
      });

      // ranking readout: bars to the side comparing uncertainty
      const xB=[-1.4,0,1.4];
      u.forEach((ui,ei)=>{
        const h=0.1+Math.min(3.4,ui*7.5);
        const active=(ei+1===selEdge);
        const tcol=GR.clone().lerp(RS, Math.min(1,ui/0.45));
        const bar=new T.Mesh(new T.BoxGeometry(0.6,h,0.6),
          new T.MeshStandardMaterial({color:tcol,emissive:tcol.clone().multiplyScalar(active?0.8:0.3),
            emissiveIntensity:active?0.7:0.25,roughness:0.4,transparent:!active,opacity:active?1:0.55}));
        bar.position.set(xB[ei],h/2-3.4,2.6);
        gEnergy.add(bar);
        lbl(EDGES[ei].id,active?"#e8eef6":"#90a0b4",active?1.1:0.92,xB[ei],-3.55,2.6);
      });
      lbl("per-edge uncertainty  Σσ²","#a78bfa",1.05,0,0.6,2.6);

      const ratio=u[1]/Math.max(1e-6,u[0]);          // e2 / e1 confidence ratio
      sceneSnap={mode,selEdge,evidence:ev,lambda:+lambda.toFixed(2),sigmaScale:+k.toFixed(3),
        uE1:+u[0].toFixed(3),uE2:+u[1].toFixed(3),uE3:+u[2].toFixed(3),
        uncertaintyRatio:+ratio.toFixed(2),energyTotal:null,signed:0};

      return {
        badge:"Bayesian · "+ev+" cells · λ="+lambda.toFixed(2)+" · u(e2)/u(e1)="+ratio.toFixed(1)+"×",
        formula:"R_{u→e} ~ N(μ_{u→e}, Σ_{u→e})   ·   u(e) = tr(Σ_{u→e}) + tr(Σ_{v→e})",
        insight:"Each restriction map is now a DISTRIBUTION, not a point. The sample cloud's radius is the posterior uncertainty: e1 (TF1→GeneA) is tight and green (u≈"+u[0].toFixed(3)+"), e2 (TF2⊣GeneA) is a wide rose cloud (u≈"+u[1].toFixed(3)+"). The model is "+ratio.toFixed(0)+"× more certain about e1 than e2 — so e1 is actionable, e2 is speculative. More cells or a stronger prior λ shrink every cloud.",
        state:"Selected e"+selEdge+": coupling ‖μ‖="+cstr[selEdge-1].toFixed(2)+", uncertainty u="+u[selEdge-1].toFixed(3)+
          ". σ-scale="+k.toFixed(2)+" (evidence "+ev+" cells, λ="+lambda.toFixed(2)+"). Tight green cloud = validate; wide rose cloud = gather more data.",
        metrics:{energyTotal:"—",worstEdge:"e2",uncertaintyRatio:ratio.toFixed(1)+"×",sectionDim:"σ-scale "+k.toFixed(2)},
        focus:{center:[0,-0.4,0.6],radius:13}
      };
    }

    return {badge:"G06",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:13}};
  }

  // ── MathLab.create ──────────────────────────────────────────────────────────
  MathLab.create({
    id:"g06",
    kind:"heterogeneous-bayesian-sheaf",
    eyebrow:"Block G · Sheaf GNN for Biology",
    title:"G06 · Heterogeneous and Bayesian Sheaf Neural Networks",
    subtitle:"The Section-5 4-node GRN (TF1, TF2, GeneA, GeneB). Three views: heterogeneous stalks with rectangular maps, per-edge coboundary energy, and Bayesian per-edge uncertainty.",
    selectedLabel:"Element",
    selectedHint:"Click a node, restriction map, edge, or posterior cloud.",
    insightLabel:"What to watch",
    modes:[
      {value:"hetero",     label:"Heterogeneous stalks (R³ TF · R² gene)"},
      {value:"coboundary", label:"Coboundary energy (signed / unsigned)"},
      {value:"bayesian",   label:"Bayesian uncertainty (posterior maps)"}
    ],
    params:[
      {key:"edge",     label:"highlighted edge (1=e1 2=e2 3=e3)",min:1,max:3,step:1,value:2,
       fmt:v=>"e"+Math.round(v)},
      {key:"signed",   label:"energy (0=unsigned 1=signed)",min:0,max:1,step:1,value:0,
       fmt:v=>Math.round(v)===1?"signed":"unsigned",modes:["coboundary"]},
      {key:"evidence", label:"# cells (evidence)",min:50,max:5000,step:50,value:1000,
       fmt:v=>Math.round(v)+" cells",modes:["bayesian"]},
      {key:"lambda",   label:"prior strength λ (KL weight)",min:0.25,max:4,step:0.25,value:1,
       fmt:v=>"λ="+v.toFixed(2),modes:["bayesian"]}
    ],
    metrics:[
      {key:"energyTotal",     label:"Total sheaf energy E_F",accent:"amber"},
      {key:"worstEdge",       label:"Worst / least-certain edge",accent:"rose"},
      {key:"uncertaintyRatio",label:"u(e2) / u(e1)",accent:"violet"},
      {key:"sectionDim",      label:"Section / scale",accent:"cyan"}
    ],
    layers:[
      {group:"nodes", label:"Nodes / stalks"},
      {group:"maps",  label:"Restriction maps"},
      {group:"energy",label:"Energy / uncertainty bars"},
      {group:"labels",label:"Labels"}
    ],
    primary:{
      label:"Focus repressor e2",
      on:api=>{api.setParam("edge",2);}
    },
    secondary:{
      label:"Focus e1 (confident)",
      on:api=>{api.setParam("edge",1);}
    },
    defaultCam:{theta:-0.5,phi:0.7,r:13},
    hint:'<span style="color:#4dd7ff">cyan</span>=TF / R³ · <span style="color:#34d399">green</span>=gene / low-uncertainty · <span style="color:#fbbf24">amber</span>=edge stalk / energy · <span style="color:#a78bfa">violet</span>=restriction map · <span style="color:#fb7185">rose</span>=repression / high-uncertainty.',
    onParam(api){
      const s=api.state;
      if(s.mode==="hetero") api.frame([0,0,0],13);
      else if(s.mode==="coboundary") api.frame([0,-0.4,0],13);
      else api.frame([0,-0.4,0.6],13);
    },
    onSelect(api,d){
      if(d.node) api.setSelected("Node "+d.node.id+" · stalk R^"+d.node.dim+(d.node.coord!=null?" · coord "+d.node.coord+" = "+d.node.val.toFixed(2):""));
      if(d.map)  api.setSelected("R_"+d.map.id+" · "+d.map.rows+"×"+d.map.cols+" · "+d.map.kind);
      if(d.edge) api.setSelected("Edge "+d.edge.id+" · "+d.edge.kind+" · E="+d.edge.energy.toFixed(3)+" · δx=["+d.edge.dx[0].toFixed(2)+", "+d.edge.dx[1].toFixed(2)+"]");
      if(d.post) api.setSelected("Posterior "+d.post.id+" · ‖μ‖="+d.post.coupling.toFixed(2)+" · u="+d.post.uncertainty.toFixed(3)+" · "+d.post.kind);
    },
    build,
    snapshot(s){
      const selEdge=Math.round(s.edge);
      const signed=Math.round(s.signed)===1;
      const ev=Math.max(1,Math.round(s.evidence));
      const lambda=s.lambda;
      // recompute the lesson numbers so a verifier sees modes/params move them
      const E=EDGES.map(e=>cob(e,signed&&s.mode==="coboundary"));
      const Etot=E.reduce((a,c)=>a+c.E,0);
      const shrink=Math.sqrt(1000/(ev+1)) * Math.sqrt(1/Math.max(0.25,lambda));
      const k=Math.max(0.2,Math.min(2.2,shrink/Math.sqrt(1000/1001)));
      const u=EDGES.map(e=>{const p=POST[e.id];let s2=0;for(let i=0;i<3;i++){const sg=p.sig[i]*k;s2+=sg*sg;}return 2*s2;});
      const ratio=u[1]/Math.max(1e-6,u[0]);
      return {
        mode:s.mode,
        selEdge,
        signed:signed?1:0,
        evidence:ev,
        lambda:+lambda.toFixed(2),
        E1:+E[0].E.toFixed(3),
        E2:+E[1].E.toFixed(3),
        E3:+E[2].E.toFixed(3),
        energyTotal:+Etot.toFixed(3),
        dimTF:3,
        dimGene:2,
        sectionDim:10,
        sigmaScale:+k.toFixed(3),
        uE1:+u[0].toFixed(3),
        uE2:+u[1].toFixed(3),
        uE3:+u[2].toFixed(3),
        uncertaintyRatio:+ratio.toFixed(2),
        e2IsWorst:E[1].E>=E[0].E && E[1].E>=E[2].E
      };
    }
  });
})();
</script>
</body>
</html>
