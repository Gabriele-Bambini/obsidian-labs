<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H07 · Leakage audits for biological GNNs</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (hash of sin; no clock, no rng) ───────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── lesson FACTS (note Sections 1,2,3,5) ──────────────────────────────────
  // Section 5 worked example: 20-gene GRN, prior leakage clean-vs-leaky.
  const FACT={
    aucCleanBase:0.612,   // AUC clean (no test positives in training)
    aucLeakyBase:0.847,   // AUC leaky (8/10 test positives in training prior)
    permClean:0.518,      // AUC_permuted clean ≈ 0.52 -> PASS
    permLeaky:0.684,      // AUC_permuted leaky ≈ 0.68 -> FAIL
    nTestPos:10,          // 10 held-out test positives
    nLeakDefault:8,       // 8 of 10 leaked into training prior
    failThresh:0.55,      // permutation FAIL threshold (AUC_permuted)
    jaccardThresh:0.05,   // prior-leakage Jaccard FAIL threshold
    trueClean:0.58,       // combined-inflation ladder (Section 1/2)
    ppNeg:0.15,           // +15pp easy negatives (H06)
    ppPrior:0.12          // +12pp prior leakage (H07)
  };

  // The six leakage pathways — name, MI weight (Section 4), accent.
  // mi = relative mutual-information contribution to I(Y_test;X_train).
  const PATHS=[
    {id:1,name:"direct edge",   mi:1.00, det:"split check",        ch:"labels"},
    {id:2,name:"feature",       mi:0.55, det:"fit-on-train",       ch:"features"},
    {id:3,name:"prior",         mi:0.55, det:"Jaccard<0.05",       ch:"labels"},
    {id:4,name:"augmentation",  mi:0.40, det:"train subgraph",     ch:"structure"},
    {id:5,name:"temporal",      mi:0.30, det:"frozen DB version",  ch:"labels"},
    {id:6,name:"batch",         mi:0.20, det:"train-only Harmony", ch:"features"}
  ];

  let sceneSnap={};

  // ── deterministic AUC model for the clean-vs-leaky experiment ─────────────
  // nLeak: 0..10 test positives leaked into the training prior.
  // auditStrength: 0..1 how aggressively the audit removes leaked edges.
  // More leak -> AUC drifts from clean base toward leaky base.
  // A strong audit pulls the leaky AUC back toward the clean (honest) value.
  // f is normalized so the CANONICAL run (nLeak=8 of 10) lands exactly on the
  // note's worked-example numbers: AUC_leaky=0.847, AUC_perm=0.684.
  function leakFrac(nLeak){
    return Math.max(0,Math.min(1.25,Math.max(0,Math.min(10,nLeak))/FACT.nLeakDefault));
  }
  function expAUC(nLeak,auditStrength){
    const f=leakFrac(nLeak);                                  // 1.0 at nLeak=8
    const inflate=(FACT.aucLeakyBase-FACT.aucCleanBase)*f;     // +0.235 at f=1
    const leaky=FACT.aucCleanBase+inflate;
    const clean=FACT.aucCleanBase;                            // audited away
    const reported=leaky-(leaky-clean)*Math.max(0,Math.min(1,auditStrength));
    return {clean:clean,leaky:leaky,reported:reported,inflate:inflate,frac:f};
  }

  // Permuted AUC grows with the leaked fraction (structural memorization).
  function permAUC(nLeak){
    const f=leakFrac(nLeak);
    return FACT.permClean+(FACT.permLeaky-FACT.permClean)*f;
  }

  // Prior-leakage Jaccard from shared edges (Section 5 / exercise 3 style).
  // At the canonical nLeak=8 this reproduces the note: 154 shared,
  // Jaccard 0.017, 18% of test positives in prior.
  function jaccardFor(nLeak){
    const f=leakFrac(nLeak);
    const shared=Math.round(154*f);                          // 154 at nLeak=8
    const prior=8400, gold=854;
    const jac=shared/Math.max(1,(prior+gold-shared));
    const fracTest=shared/gold;
    return {shared:shared,jaccard:jac,fracTest:fracTest,prior:prior,gold:gold};
  }

  // ── build ─────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const nLeak=Math.round(s.nLeak);
    const auditStrength=Math.max(0,Math.min(1,s.audit/100));
    const nPaths=Math.round(s.nPaths);          // how many pathways are "open"
    const miGain=Math.max(0.2,Math.min(2,s.miGain/100));

    const gMain  =api.group("graph");
    const gBars  =api.group("bars");
    const gFlow  =api.group("flow");
    const gLabels=api.group("labels");

    function addLbl(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function addSlbl(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    const CY=new T.Color("#4dd7ff");   // clean / honest
    const GR=new T.Color("#34d399");   // pass / genuine signal
    const AM=new T.Color("#fbbf24");   // warning / structural
    const RO=new T.Color("#fb7185");   // leak / fail
    const VI=new T.Color("#a78bfa");   // mutual information / gap
    const SL=new T.Color("#54667c");

    // ════════════════════════════════════════════════════════════════
    // MODE: experiment — clean vs leaky vs audited AUC (Section 5)
    // ════════════════════════════════════════════════════════════════
    if(mode==="experiment"){
      const e=expAUC(nLeak,auditStrength);

      // 20-gene ring GRN; leaked test-positive edges glow rose.
      const N=20, R=3.4;
      const pos=[];
      for(let i=0;i<N;i++){const a=i/N*Math.PI*2;pos.push(new T.Vector3(Math.cos(a)*R,0,Math.sin(a)*R));}
      for(let i=0;i<N;i++){
        const isTF=(i%5===0);
        const col=isTF?CY.clone():SL.clone().lerp(CY,0.25);
        const sph=new T.Mesh(new T.SphereGeometry(isTF?0.26:0.18,16,12),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:0.5,roughness:0.4}));
        sph.position.copy(pos[i]); gMain.add(sph);
        api.pick(sph,{node:{id:i,tf:isTF}});
      }
      // 10 held-out test-positive edges; first nLeak are leaked into training prior.
      for(let k=0;k<FACT.nTestPos;k++){
        const a=k*2, b=(k*2+ ((k%3)+3))%N;   // deterministic chord pairs
        const leaked=(k<nLeak);
        const col=leaked?RO:GR;
        const pts=[pos[a].clone().setY(0.04),pos[b].clone().setY(0.04)];
        const ln=new T.Line(new T.BufferGeometry().setFromPoints(pts),
          new T.LineBasicMaterial({color:col.getHex(),transparent:true,opacity:leaked?0.95:0.5}));
        gMain.add(ln);
        const mid=pos[a].clone().add(pos[b]).multiplyScalar(0.5).setY(0.5);
        if(leaked){
          const mk=new T.Mesh(new T.SphereGeometry(0.13,10,10),new T.MeshStandardMaterial({color:RO,emissive:RO,emissiveIntensity:0.85,roughness:0.3}));
          mk.position.copy(mid); gMain.add(mk);
          api.pick(mk,{leakEdge:{idx:k}});
        }
      }
      addLbl("20-gene GRN · 10 test positives","#8a99ad",1.15,0,-0.1,R+1.1);
      addLbl(nLeak+" leaked into prior","#fb7185",1.25,0,0.95,-(R+0.9));

      // three AUC bars: clean / leaky / reported(after audit)
      const vals=[e.clean,e.leaky,e.reported];
      const cols=[CY,RO,AM];
      const labs=["clean","leaky","reported"];
      const xPos=[-3.2,0,3.2];
      vals.forEach((v,idx)=>{
        const x=xPos[idx], h=0.15+v*4.5;
        const c=cols[idx];
        const bar=new T.Mesh(new T.BoxGeometry(1.5,h,1.3),
          new T.MeshStandardMaterial({color:c.clone(),emissive:c.clone().multiplyScalar(0.6),emissiveIntensity:0.5,roughness:0.4}));
        bar.position.set(x,h/2,4.4); gBars.add(bar);
        api.pick(bar,{bar:{kind:labs[idx],auc:v}});
        addLbl(v.toFixed(3),c.getStyle(),1.5,x,h+0.5,4.4);
        addSlbl(labs[idx],c.getStyle(),0.4,x,0.05,4.4);
      });
      // 0.5 random baseline + 0.70 BEELINE ceiling reference lines
      gBars.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-4.4,0.15+0.5*4.5,4.4),new T.Vector3(4.4,0.15+0.5*4.5,4.4)]),new T.LineBasicMaterial({color:0x35506a})));
      addSlbl("0.50 random","#54667c",0.34,4.7,0.15+0.5*4.5,4.4);
      gBars.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-4.4,0.15+0.70*4.5,4.4),new T.Vector3(4.4,0.15+0.70*4.5,4.4)]),new T.LineBasicMaterial({color:0x4a6a40})));
      addSlbl("0.70 BEELINE ceiling","#6fae5f",0.34,4.7,0.15+0.70*4.5,4.4);

      const inflateNow=e.reported-e.clean;
      sceneSnap={mode,nLeak,audit:Math.round(auditStrength*100),nPaths,
        aucClean:+e.clean.toFixed(3),aucLeaky:+e.leaky.toFixed(3),aucReported:+e.reported.toFixed(3),
        inflation:+(e.leaky-e.clean).toFixed(3),residualInflation:+inflateNow.toFixed(3),
        permAUC:+permAUC(nLeak).toFixed(3),jaccard:+jaccardFor(nLeak).jaccard.toFixed(4)};

      return {
        badge:"Experiment · "+nLeak+"/10 leaked · audit "+(auditStrength*100).toFixed(0)+"%",
        formula:"AUC_leaky − AUC_clean = "+ (e.leaky-e.clean).toFixed(3) +"  ·  fix: remove shared test edges",
        insight:"Section 5 worked example on a 20-gene GRN. "+nLeak+" of 10 held-out test-positive edges (rose) were copied into the training prior, inflating the leaky AUC to "+e.leaky.toFixed(3)+" versus a clean "+FACT.aucCleanBase.toFixed(3)+". The audit slider removes shared edges and pulls the reported score back toward the honest value. A clean GRN model rarely beats BEELINE's ~0.70 ceiling — anything above 0.80 should trigger an audit.",
        state:"clean "+e.clean.toFixed(3)+" · leaky "+e.leaky.toFixed(3)+" · reported "+e.reported.toFixed(3)+". Raw inflation "+((e.leaky-e.clean)*100).toFixed(0)+"pp; residual after audit "+(inflateNow*100).toFixed(0)+"pp.",
        metrics:{aucReported:e.reported.toFixed(3),inflation:((e.leaky-e.clean)*100).toFixed(0)+"pp",permAUC:permAUC(nLeak).toFixed(3),jaccard:jaccardFor(nLeak).jaccard.toFixed(3)},
        focus:{center:[0,1.2,1.5],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: permutation — permuted-AUC distribution vs true AUC (Section 4)
    // ════════════════════════════════════════════════════════════════
    if(mode==="permutation"){
      const e=expAUC(nLeak,0);                 // unaudited model under test
      const aucTrue=e.leaky;
      const permMean=permAUC(nLeak);
      const permStd=0.03;
      const genuine=aucTrue-permMean;
      const z=genuine/(permStd+1e-8);
      const structFrac=permMean/Math.max(1e-6,aucTrue);
      const fail=permMean>FACT.failThresh;

      // a 1D number line from 0.4..0.9 with a permuted-AUC histogram bell.
      const x0=-4.2, xS=9.2;                   // maps auc 0.4..0.9 -> x
      const mapX=auc=>x0+(auc-0.4)/0.5*xS;
      // axis
      gFlow.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(x0,0,0),new T.Vector3(x0+xS,0,0)]),new T.LineBasicMaterial({color:0x2a3d52})));
      addSlbl("0.40",  "#54667c",0.34,x0,-0.45,0);
      addSlbl("0.55 FAIL line","#fbbf24",0.34,mapX(0.55),-0.45,0);
      addSlbl("0.90",  "#54667c",0.34,x0+xS,-0.45,0);

      // FAIL threshold marker
      gFlow.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(mapX(0.55),0,0),new T.Vector3(mapX(0.55),3.6,0)]),new T.LineBasicMaterial({color:AM.getHex()})));

      // permuted distribution: deterministic gaussian-ish bars around permMean
      for(let b=0;b<25;b++){
        const auc=0.45+b*(0.40/24);
        const d=(auc-permMean)/permStd;
        const hgt=Math.exp(-0.5*d*d)*3.0;
        if(hgt<0.04) continue;
        const c=(auc>FACT.failThresh)?RO.clone():GR.clone();
        const bar=new T.Mesh(new T.BoxGeometry(0.30,hgt,0.30),
          new T.MeshStandardMaterial({color:c,emissive:c.clone().multiplyScalar(0.5),emissiveIntensity:0.45,roughness:0.4,transparent:true,opacity:0.85}));
        bar.position.set(mapX(auc),hgt/2,0); gFlow.add(bar);
      }
      // permuted-mean marker (violet)
      const pm=new T.Mesh(new T.SphereGeometry(0.2,14,14),new T.MeshStandardMaterial({color:VI,emissive:VI,emissiveIntensity:0.9,roughness:0.2}));
      pm.position.set(mapX(permMean),0.0,0.0); gFlow.add(pm);
      api.pick(pm,{perm:{permMean:permMean}});
      addLbl("AUC_perm "+permMean.toFixed(3),"#a78bfa",1.2,mapX(permMean),3.9,0);

      // true-AUC marker (cyan, tall pin)
      const tx=mapX(aucTrue);
      gFlow.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(tx,0,0),new T.Vector3(tx,4.4,0)]),new T.LineBasicMaterial({color:CY.getHex()})));
      const tp=new T.Mesh(new T.SphereGeometry(0.22,14,14),new T.MeshStandardMaterial({color:CY,emissive:CY,emissiveIntensity:0.95,roughness:0.2}));
      tp.position.set(tx,4.4,0); gFlow.add(tp);
      api.pick(tp,{trueAuc:{auc:aucTrue}});
      addLbl("AUC_true "+aucTrue.toFixed(3),"#4dd7ff",1.25,tx,4.9,0);

      // genuine-signal bracket (violet) between permMean and true
      gFlow.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(mapX(permMean),4.2,0.1),new T.Vector3(tx,4.2,0.1)]),new T.LineBasicMaterial({color:VI.getHex()})));
      addLbl("genuine "+genuine.toFixed(3),"#a78bfa",1.1,(mapX(permMean)+tx)/2,4.5,0.1);

      addLbl(fail?"FAIL · structural memorization":"PASS · biology-dependent",fail?"#fb7185":"#34d399",1.45,0,-1.4,0);

      sceneSnap={mode,nLeak,audit:0,nPaths,aucTrue:+aucTrue.toFixed(3),permAUC:+permMean.toFixed(3),
        genuineSignal:+genuine.toFixed(3),zScore:+z.toFixed(2),structuralFraction:+structFrac.toFixed(3),
        verdictFail:fail,jaccard:+jaccardFor(nLeak).jaccard.toFixed(4)};

      return {
        badge:"Permutation · AUC_perm "+permMean.toFixed(3)+" · "+(fail?"FAIL":"PASS"),
        formula:"z = (AUC_true − AUC_perm)/σ = "+z.toFixed(2)+"  ·  genuine = "+genuine.toFixed(3),
        insight:"Permuting test labels 1000× keeps the features fixed. If AUC_permuted stays near 0.50 the score is biology-dependent (PASS); if it climbs above "+FACT.failThresh.toFixed(2)+" the model assigns high scores to certain pairs regardless of label — structural memorization (FAIL). At "+nLeak+"/10 leaked, "+(structFrac*100).toFixed(0)+"% of the AUC comes from structure, leaving only "+genuine.toFixed(3)+" of genuine signal.",
        state:"AUC_true "+aucTrue.toFixed(3)+" · AUC_perm "+permMean.toFixed(3)+"±"+permStd.toFixed(2)+" · z "+z.toFixed(2)+" · "+(fail?"FAIL (>0.55)":"PASS (<0.55)"),
        metrics:{aucReported:aucTrue.toFixed(3),inflation:(structFrac*100).toFixed(0)+"%",permAUC:permMean.toFixed(3),jaccard:jaccardFor(nLeak).jaccard.toFixed(3)},
        focus:{center:[0,1.8,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: pathways — the six leakage channels into I(Y_test;X_train)
    // ════════════════════════════════════════════════════════════════
    if(mode==="pathways"){
      // X_train target sphere on the left; Y_test source on the right.
      const xT=new T.Mesh(new T.SphereGeometry(0.8,24,18),new T.MeshStandardMaterial({color:CY,emissive:CY,emissiveIntensity:0.5,roughness:0.3}));
      xT.position.set(-4.4,0.2,0); gMain.add(xT); api.pick(xT,{node:{tag:"X_train"}});
      addLbl("X_train","#4dd7ff",1.5,-4.4,1.5,0);
      const yT=new T.Mesh(new T.SphereGeometry(0.8,24,18),new T.MeshStandardMaterial({color:RO,emissive:RO,emissiveIntensity:0.5,roughness:0.3}));
      yT.position.set(4.4,0.2,0); gMain.add(yT); api.pick(yT,{node:{tag:"Y_test"}});
      addLbl("Y_test","#fb7185",1.5,4.4,1.5,0);

      // six pathway ribbons, stacked in Z; open pathways glow, closed are dim.
      let miTotal=0;
      PATHS.forEach((p,idx)=>{
        const open=(idx<nPaths);
        const z=(idx-2.5)*1.25;
        const sag=-0.4-p.mi*1.6;             // bigger MI -> deeper sag (heavier channel)
        const a=new T.Vector3(-4.4,0.2,0), c=new T.Vector3(0,sag,z), b=new T.Vector3(4.4,0.2,0);
        const pts=[];
        for(let t=0;t<=24;t++){const u=t/24;
          const x=(1-u)*(1-u)*a.x+2*(1-u)*u*c.x+u*u*b.x;
          const y=(1-u)*(1-u)*a.y+2*(1-u)*u*c.y+u*u*b.y;
          const zz=(1-u)*(1-u)*a.z+2*(1-u)*u*c.z+u*u*b.z;
          pts.push(new T.Vector3(x,y,zz));}
        const col=open?(p.mi>=0.55?RO:AM):SL;
        const ln=new T.Line(new T.BufferGeometry().setFromPoints(pts),
          new T.LineBasicMaterial({color:col.getHex(),transparent:true,opacity:open?0.95:0.18}));
        gFlow.add(ln);
        // flow magnitude bead at the sag
        const beadR=0.10+ (open? p.mi*miGain*0.22 : 0.04);
        const bead=new T.Mesh(new T.SphereGeometry(beadR,12,12),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.6),emissiveIntensity:open?0.8:0.2,roughness:0.4,transparent:!open,opacity:open?1:0.3}));
        bead.position.set(0,sag,z); gFlow.add(bead);
        api.pick(bead,{path:{id:p.id,name:p.name,mi:p.mi,det:p.det,open:open}});
        addSlbl(p.id+"·"+p.name,(open?col.getStyle():"#54667c"),0.36,0,sag-0.45,z);
        if(open) miTotal+=p.mi*miGain;
      });
      addLbl("I(Y_test ; X_train) = "+miTotal.toFixed(2),"#a78bfa",1.5,0,2.7,0);
      addLbl(nPaths+" of 6 channels open","#8a99ad",1.15,0,-3.6,0);

      const clean=(nPaths===0);
      sceneSnap={mode,nLeak,audit:0,nPaths,miGain:+miGain.toFixed(2),
        mutualInfo:+miTotal.toFixed(3),channelsOpen:nPaths,cleanExperiment:clean,
        permAUC:+permAUC(nLeak).toFixed(3),jaccard:+jaccardFor(nLeak).jaccard.toFixed(4)};

      return {
        badge:"Pathways · "+nPaths+"/6 open · I="+miTotal.toFixed(2),
        formula:"clean ⇔ I(Y_test ; X_train) = 0   ·   leaky ⇔ I > 0",
        insight:"Six distinct channels carry test-label information back into training inputs. Direct-edge and prior leakage are the heaviest (MI≈"+PATHS[0].mi.toFixed(2)+"/"+PATHS[2].mi.toFixed(2)+", rose); batch and temporal leak the least (amber). A clean experiment closes every channel so I(Y_test;X_train)=0. Open one and mutual information — hence inflated AUC — becomes positive.",
        state:nPaths+" channels open · total MI "+miTotal.toFixed(2)+(clean?" · CLEAN (I=0)":" · LEAKY (I>0)"),
        metrics:{aucReported:"—",inflation:miTotal.toFixed(2)+" MI",permAUC:permAUC(nLeak).toFixed(3),jaccard:jaccardFor(nLeak).jaccard.toFixed(3)},
        focus:{center:[0,0,0],radius:14}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: audit — prior-leakage Jaccard + combined-inflation ladder
    // ════════════════════════════════════════════════════════════════
    if(mode==="audit"){
      const j=jaccardFor(nLeak);
      const e=expAUC(nLeak,auditStrength);

      // Left: prior(8400) vs gold(854) as two overlapping discs; overlap = shared.
      const priorDisc=new T.Mesh(new T.CircleGeometry(2.0,40),new T.MeshBasicMaterial({color:CY.getHex(),transparent:true,opacity:0.22,side:T.DoubleSide}));
      priorDisc.rotation.x=-Math.PI/2; priorDisc.position.set(-4.1,0,0); gMain.add(priorDisc);
      addLbl("prior 8,400","#4dd7ff",1.2,-4.6,0.2,-2.4);
      const goldR=1.05;
      const overlap=0.6*j.fracTest;            // visual shift: more shared -> more overlap
      const goldDisc=new T.Mesh(new T.CircleGeometry(goldR,40),new T.MeshBasicMaterial({color:RO.getHex(),transparent:true,opacity:0.30,side:T.DoubleSide}));
      goldDisc.rotation.x=-Math.PI/2; goldDisc.position.set(-2.4-1.4*(1-j.fracTest),0.02,0); gMain.add(goldDisc);
      addLbl("gold 854","#fb7185",1.2,-2.0,0.2,2.4);
      // shared lens marker
      const lens=new T.Mesh(new T.SphereGeometry(0.18+0.5*j.fracTest,14,14),new T.MeshStandardMaterial({color:VI,emissive:VI,emissiveIntensity:0.85,roughness:0.3}));
      lens.position.set(-3.0,0.3,0); gMain.add(lens);
      api.pick(lens,{lens:{shared:j.shared,jaccard:j.jaccard}});
      addLbl(j.shared+" shared","#a78bfa",1.15,-3.0,1.0,0);
      addLbl("Jaccard "+j.jaccard.toFixed(3)+(j.jaccard>FACT.jaccardThresh?" FAIL":" PASS"),(j.jaccard>FACT.jaccardThresh?"#fb7185":"#34d399"),1.25,-3.0,-1.6,0);

      // Right: the combined-inflation ladder (Section 1/2):
      // clean 0.58 -> +15pp easy negatives -> 0.73 -> +12pp prior -> 0.85
      const ladder=[
        {lab:"true clean", v:FACT.trueClean, c:CY},
        {lab:"+neg "+(FACT.ppNeg*100).toFixed(0)+"pp", v:FACT.trueClean+FACT.ppNeg, c:AM},
        {lab:"+prior "+(FACT.ppPrior*100).toFixed(0)+"pp", v:FACT.trueClean+FACT.ppNeg+FACT.ppPrior, c:RO}
      ];
      const xPos=[2.0,4.0,6.0];
      ladder.forEach((d,idx)=>{
        const h=0.15+d.v*4.2;
        const bar=new T.Mesh(new T.BoxGeometry(1.3,h,1.2),
          new T.MeshStandardMaterial({color:d.c.clone(),emissive:d.c.clone().multiplyScalar(0.6),emissiveIntensity:0.5,roughness:0.4}));
        bar.position.set(xPos[idx],h/2,0); gBars.add(bar);
        api.pick(bar,{ladder:{stage:d.lab,auc:d.v}});
        addLbl(d.v.toFixed(2),d.c.getStyle(),1.35,xPos[idx],h+0.45,0);
        addSlbl(d.lab,d.c.getStyle(),0.36,xPos[idx],0.05,0);
      });
      addLbl("combined inflation 0.58→0.85","#fbbf24",1.2,4.0,-1.0,0);

      const verdict=(j.jaccard>FACT.jaccardThresh)?"FAIL":"PASS";
      sceneSnap={mode,nLeak,audit:Math.round(auditStrength*100),nPaths,
        shared:j.shared,jaccard:+j.jaccard.toFixed(4),fracTestInPrior:+j.fracTest.toFixed(3),
        verdictFail:(j.jaccard>FACT.jaccardThresh),combinedAUC:+(FACT.trueClean+FACT.ppNeg+FACT.ppPrior).toFixed(3),
        aucReported:+e.reported.toFixed(3),permAUC:+permAUC(nLeak).toFixed(3)};

      return {
        badge:"Audit · Jaccard "+j.jaccard.toFixed(3)+" · "+verdict,
        formula:"Jaccard = "+j.shared+"/(8400+854−"+j.shared+") = "+j.jaccard.toFixed(3)+"  ·  test-in-prior "+(j.fracTest*100).toFixed(0)+"%",
        insight:"The prior-leakage audit intersects the training prior (8,400 edges) with the evaluation gold standard (854). "+j.shared+" shared edges give Jaccard "+j.jaccard.toFixed(3)+" — "+(j.jaccard>FACT.jaccardThresh?"above":"below")+" the 0.05 FAIL line — and put "+(j.fracTest*100).toFixed(0)+"% of test positives in the prior. The ladder shows how H06 easy negatives (+15pp) and H07 prior leakage (+12pp) stack a true 0.58 model up to a published 0.85.",
        state:"shared "+j.shared+" · Jaccard "+j.jaccard.toFixed(3)+" ("+verdict+") · "+(j.fracTest*100).toFixed(0)+"% test in prior · combined ceiling 0.85.",
        metrics:{aucReported:e.reported.toFixed(3),inflation:((FACT.ppNeg+FACT.ppPrior)*100).toFixed(0)+"pp",permAUC:permAUC(nLeak).toFixed(3),jaccard:j.jaccard.toFixed(3)},
        focus:{center:[0.5,0.6,0],radius:14}
      };
    }

    return {badge:"H07",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:13}};
  }

  // ── MathLab.create ──────────────────────────────────────────────────────
  MathLab.create({
    id:"h07",
    kind:"leakage-audit",
    eyebrow:"Block H · Benchmarks and Datasets",
    title:"H07 · Leakage audits for biological GNNs",
    subtitle:"Trace every bit of test-label information back into training. Four views: the clean-vs-leaky experiment, the permutation test, the six leakage pathways, and the prior-leakage audit.",
    selectedLabel:"Element",
    selectedHint:"Click a node, edge, bar, pathway, or marker.",
    modes:[
      {value:"experiment",  label:"Experiment (clean vs leaky AUC)"},
      {value:"permutation", label:"Permutation test (structural memorization)"},
      {value:"pathways",    label:"Pathways (6 leakage channels)"},
      {value:"audit",       label:"Audit (Jaccard + inflation ladder)"}
    ],
    params:[
      {key:"nLeak",  label:"test positives leaked into prior (of 10)",min:0,max:10,step:1,value:8,
       fmt:v=>Math.round(v)+"/10"},
      {key:"audit",  label:"audit strength (remove shared edges) %",min:0,max:100,step:5,value:0,
       fmt:v=>Math.round(v)+"%",modes:["experiment","audit"]},
      {key:"nPaths", label:"open leakage channels (of 6)",min:0,max:6,step:1,value:1,
       fmt:v=>Math.round(v)+"/6",modes:["pathways"]},
      {key:"miGain", label:"MI flow gain %",min:20,max:200,step:5,value:100,
       fmt:v=>Math.round(v)+"%",modes:["pathways"]}
    ],
    metrics:[
      {key:"aucReported",label:"Reported AUC",accent:"cyan"},
      {key:"inflation",  label:"Inflation / structure",accent:"rose"},
      {key:"permAUC",    label:"AUC permuted",accent:"violet"},
      {key:"jaccard",    label:"Prior Jaccard",accent:"amber"}
    ],
    layers:[
      {group:"graph",  label:"GRN / sets"},
      {group:"bars",   label:"AUC bars"},
      {group:"flow",   label:"Distribution / channels"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Make it clean (0 leak)",
      on:api=>{api.setParam("nLeak",0);api.setParam("nPaths",0);}
    },
    secondary:{
      label:"Max leak (8/10)",
      on:api=>{api.setParam("nLeak",8);api.setParam("nPaths",6);}
    },
    defaultCam:{theta:-0.45,phi:0.62,r:13},
    hint:'<span style="color:#4dd7ff">cyan</span>=clean/honest · <span style="color:#fb7185">rose</span>=leak/FAIL · <span style="color:#fbbf24">amber</span>=warning/structural · <span style="color:#a78bfa">violet</span>=mutual information/genuine signal · <span style="color:#34d399">green</span>=PASS. Target: permuted AUC &lt; 0.55, Jaccard &lt; 0.05.',
    onParam(api){
      const s=api.state;
      if(s.mode==="experiment") api.frame([0,1.2,1.5],13);
      else if(s.mode==="permutation") api.frame([0,1.8,0],13);
      else api.frame([0,0,0],14);
    },
    onSelect(api,d){
      if(d.node&&d.node.tag) api.setSelected(d.node.tag+" anchor");
      else if(d.node) api.setSelected((d.node.tf?"TF":"gene")+" node "+(d.node.id!=null?d.node.id:""));
      if(d.leakEdge) api.setSelected("Leaked test-positive edge #"+(d.leakEdge.idx+1)+" — present in training prior");
      if(d.bar) api.setSelected(d.bar.kind+" AUC "+d.bar.auc.toFixed(3));
      if(d.perm) api.setSelected("Permuted-AUC mean "+d.perm.permMean.toFixed(3));
      if(d.trueAuc) api.setSelected("True AUC "+d.trueAuc.auc.toFixed(3));
      if(d.path) api.setSelected("Type "+d.path.id+" — "+d.path.name+" · MI "+d.path.mi.toFixed(2)+" · fix: "+d.path.det+" · "+(d.path.open?"OPEN":"closed"));
      if(d.lens) api.setSelected(d.lens.shared+" shared edges · Jaccard "+d.lens.jaccard.toFixed(3));
      if(d.ladder) api.setSelected(d.ladder.stage+" → AUC "+d.ladder.auc.toFixed(2));
    },
    build,
    snapshot(s){
      const nLeak=Math.round(s.nLeak);
      const auditStrength=Math.max(0,Math.min(1,s.audit/100));
      const nPaths=Math.round(s.nPaths);
      const e=expAUC(nLeak,auditStrength);
      const j=jaccardFor(nLeak);
      const perm=permAUC(nLeak);
      return {
        mode:s.mode,
        nLeak:nLeak,
        audit:Math.round(auditStrength*100),
        nPaths:nPaths,
        aucClean:+e.clean.toFixed(3),
        aucLeaky:+e.leaky.toFixed(3),
        aucReported:+e.reported.toFixed(3),
        inflation:+(e.leaky-e.clean).toFixed(3),
        residualInflation:+(e.reported-e.clean).toFixed(3),
        permAUC:+perm.toFixed(3),
        genuineSignal:+(e.leaky-perm).toFixed(3),
        permFail:perm>FACT.failThresh,
        sharedEdges:j.shared,
        jaccard:+j.jaccard.toFixed(4),
        fracTestInPrior:+j.fracTest.toFixed(3),
        jaccardFail:j.jaccard>FACT.jaccardThresh,
        channelsOpen:nPaths,
        cleanExperiment:nPaths===0&&nLeak===0
      };
    }
  });
})();
</script>
