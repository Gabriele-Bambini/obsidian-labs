<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J02 · Trustworthy GNNs — fairness, explainability, privacy</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (hash of sin; no wall-clock, no RNG) ──────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── scene snapshot state ──────────────────────────────────────────────────
  let sceneSnap={};

  // ════════════════════════════════════════════════════════════════════════
  // FACTS — note Section 5 worked example: 500-gene co-regulatory network,
  // 2-layer GAT with attention readout. Every number below is from the note.
  // ════════════════════════════════════════════════════════════════════════
  const F={
    nGenes:500,
    // Fairness: degree-stratified AUROC (note §5)
    quantAUROC:[0.54,0.68,0.79,0.87],          // Q1..Q4
    quantLabels:["Q1·deg1-3","Q2·deg4-8","Q3·deg9-20","Q4·deg21+"],
    meanAUROC:0.74,
    randomBaseline:0.50,
    // Explainability: GNNExplainer on GATA1 (note §5)
    gata1Conf:0.91,
    explEdges:[                                  // [src,dst,edge_mask]
      ["GATA1","KLF1",0.89],
      ["GATA1","TAL1",0.82],
      ["GATA1","FOG1",0.76],
      ["KLF1","TAL1",0.71]
    ],
    explFeats:[                                  // [dim,name,mask]
      ["dim3","ATAC accessibility",0.85],
      ["dim7","motif enrichment",0.72],
      ["dim1","log expression",0.61]
    ],
    // Privacy: membership inference + DP (note §5)
    miAttackNoDP:0.71,
    miAttackDP:0.55,
    aurocNoDP:0.74,
    aurocDP:0.71,
    epsilonRef:8
  };

  // erythroid subgraph node layout (deterministic, hand-placed for clarity)
  const ERY=[
    {id:"GATA1",x:0.0, z:0.0,  hub:true},
    {id:"KLF1", x:2.6, z:1.5},
    {id:"TAL1", x:2.6, z:-1.5},
    {id:"FOG1", x:-2.9,z:0.2}
  ];

  // ── degree-stratified AUROC under a fairness intervention ────────────────
  // fairW: 0 = report mean only (raw), 1 = full degree-normalized re-weight
  // returns per-quantile AUROC; intervention lifts low-degree, slightly lowers high.
  function fairnessAUROC(fairW){
    const w=Math.max(0,Math.min(1,fairW));
    return F.quantAUROC.map((a,i)=>{
      // up-weight rare low-degree nodes (Q1,Q2), modest cost to hubs (Q4)
      const pull=[0.16,0.10,0.03,-0.07][i];     // toward parity at w=1
      return Math.max(0.50,Math.min(0.95,a+pull*w));
    });
  }

  // ── privacy: MI attack accuracy as a function of DP budget epsilon ───────
  // eps small => strong privacy => attack near 0.50 ; eps large => approaches 0.71
  function miAttack(eps){
    const e=Math.max(0.5,Math.min(20,eps));
    // anchor: eps=8 -> 0.55 ; eps->inf -> ~0.71 ; eps->0 -> ~0.50
    const sat=F.miAttackNoDP-F.randomBaseline;     // 0.21 (no-DP advantage, ε→∞)
    // calibrated so ε=8 → 0.55 (note §5 reference); ε small → ~0.50; ε large → toward 0.71
    const t=1-Math.exp(-e/29.4);
    return F.randomBaseline+sat*t;
  }
  // utility (mean AUROC) sacrificed by DP noise: eps small => big drop
  function dpAUROC(eps){
    const e=Math.max(0.5,Math.min(20,eps));
    const drop=(F.aurocNoDP-F.aurocDP)*Math.exp(-(e-F.epsilonRef)/6.0); // ref at eps=8
    return Math.max(0.55,Math.min(F.aurocNoDP,F.aurocNoDP-Math.max(0,drop)));
  }

  // ── build ─────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const fairW=s.fairW;            // 0..1   fairness intervention strength
    const topK=Math.round(s.topK);  // 1..4   GNNExplainer edges kept
    const eps=s.epsilon;            // 0.5..20 DP budget
    const noise=s.noise;            // 0..1   biological perturbation (robustness flavor)

    const gGraph =api.group("graph");
    const gBars  =api.group("bars");
    const gPlane =api.group("plane");
    const gLabels=api.group("labels");

    function L(txt,c,sz,x,y,z){const sp=api.bigLabel(txt,c,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}
    function Ls(txt,c,sz,x,y,z){const sp=api.label(txt,c,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}

    const CY="#4dd7ff", GR="#34d399", AM="#fbbf24", VI="#a78bfa", RO="#fb7185", SL="#54667c";

    // ════════════════════════════════════════════════════════════════
    // MODE: fairness — degree-stratified AUROC, hub bias
    // ════════════════════════════════════════════════════════════════
    if(mode==="fairness"){
      const auc=fairnessAUROC(fairW);
      const xPos=[-3.9,-1.3,1.3,3.9];
      const cols=[RO,AM,GR,CY];          // low-degree red → high-degree cyan
      const yS=5.2;

      // baseline (random 0.50) reference line
      const randLine=new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(-5.2,F.randomBaseline*yS,-0.9),new T.Vector3(5.2,F.randomBaseline*yS,-0.9)]),
        new T.LineDashedMaterial({color:0x6b7a8d,dashSize:0.22,gapSize:0.16}));
      randLine.computeLineDistances();
      gPlane.add(randLine);
      L("random 0.50","#6b7a8d",0.95,4.0,F.randomBaseline*yS+0.3,-0.9);

      // mean-AUROC plane (the misleading headline number)
      gPlane.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(-5.2,F.meanAUROC*yS,-0.9),new T.Vector3(5.2,F.meanAUROC*yS,-0.9)]),
        new T.LineBasicMaterial({color:0x35506e})));
      L("reported mean "+F.meanAUROC.toFixed(2),"#7f97ad",1.0,-3.6,F.meanAUROC*yS+0.32,-0.9);

      // per-quantile AUROC bars
      auc.forEach((a,idx)=>{
        const x=xPos[idx];
        const h=Math.max(0.12,(a-0.45)*yS);
        const col=cols[idx];
        const bar=new T.Mesh(new T.BoxGeometry(1.7,h,1.4),
          new T.MeshStandardMaterial({color:new T.Color(col),emissive:new T.Color(col).multiplyScalar(0.55),
            emissiveIntensity:0.6,roughness:0.4}));
        bar.position.set(x,0.45*yS+h/2,-0.9);
        gBars.add(bar);
        api.pick(bar,{quant:{q:idx+1,label:F.quantLabels[idx],auroc:a}});
        L(a.toFixed(2),col,1.55,x,0.45*yS+h+0.5,-0.9);
        Ls(F.quantLabels[idx],col,0.36,x,0.45*yS-0.18,-0.9);
      });

      // fairness-gap bracket between Q1 and Q4
      const gap=auc[3]-auc[0];
      const yTop=0.45*yS+Math.max(0.12,(auc[3]-0.45)*yS);
      const yBot=0.45*yS+Math.max(0.12,(auc[0]-0.45)*yS);
      gBars.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(xPos[0]-0.2,yBot,1.4),new T.Vector3(xPos[0]-0.2,yTop,1.4)]),
        new T.LineBasicMaterial({color:0xa78bfa})));
      L("gap "+gap.toFixed(2),"#a78bfa",1.35,xPos[0]-1.05,(yTop+yBot)/2,1.4);

      // degree glyph row: tiny spheres scaling with degree (hub bias intuition)
      [2,6,14,28].forEach((deg,idx)=>{
        const r=0.10+Math.min(0.34,deg*0.012);
        const m=new T.Mesh(new T.SphereGeometry(r,14,12),
          new T.MeshStandardMaterial({color:new T.Color(cols[idx]),emissive:new T.Color(cols[idx]),
            emissiveIntensity:0.7,roughness:0.4}));
        m.position.set(xPos[idx],0.18,2.6);
        gGraph.add(m);
      });
      L("node degree →","#8a99ad",1.0,0,0.18,3.55);

      const minQ=auc[0];
      sceneSnap={mode,fairW:+fairW.toFixed(3),
        fairnessGap:+gap.toFixed(3),
        lowDegreeAUROC:+minQ.toFixed(3),
        highDegreeAUROC:+auc[3].toFixed(3),
        meanAUROC:F.meanAUROC,
        aboveRandom:minQ>F.randomBaseline+0.02,
        miAttack:null,explanationEdges:null};

      return {
        badge:"Fairness · gap "+gap.toFixed(2)+" AUROC · "+(fairW>0?"re-weighted":"raw"),
        formula:"gap = AUROC(top 20% deg) − AUROC(bottom 20% deg)",
        insight:"Mean AUROC "+F.meanAUROC.toFixed(2)+" looks fine, but stratifying by degree exposes hub bias: well-studied hub TFs (cyan, Q4) score "+auc[3].toFixed(2)+" while understudied low-degree genes (red, Q1) sit at "+minQ.toFixed(2)+" — barely above random. Drag the fairness re-weight (1/√deg loss) to lift rare genes toward parity at a small cost to hubs.",
        state:"Q1 "+auc[0].toFixed(2)+" · Q2 "+auc[1].toFixed(2)+" · Q3 "+auc[2].toFixed(2)+" · Q4 "+auc[3].toFixed(2)+". Fairness gap "+gap.toFixed(2)+". Low-degree "+(minQ>0.52?"above":"≈")+" random.",
        metrics:{
          fairnessGap:gap.toFixed(2),
          lowHighAUROC:minQ.toFixed(2)+" / "+auc[3].toFixed(2),
          miAttack:"—",
          utilityAUROC:F.meanAUROC.toFixed(2)
        },
        focus:{center:[0,2.0,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: explain — GNNExplainer subgraph on GATA1 (erythroid network)
    // ════════════════════════════════════════════════════════════════
    if(mode==="explain"){
      // node id -> position
      const pos={};
      ERY.forEach(n=>pos[n.id]=new T.Vector3(n.x,0,n.z));

      // edges sorted by mask; keep top-K (GNNExplainer sparsity / L1)
      const sorted=F.explEdges.slice().sort((a,b)=>b[2]-a[2]);
      let kept=0, keptMask=0;
      sorted.forEach((e,i)=>{
        const inExpl=i<topK;
        if(inExpl){kept++;keptMask+=e[2];}
        const a=pos[e[0]], b=pos[e[1]];
        const w=inExpl?(0.04+e[2]*0.10):0.03;
        const col=inExpl?VI:"#21303f";
        const eg=new T.Mesh(
          new T.CylinderGeometry(w,w,a.distanceTo(b),12,1,true),
          new T.MeshStandardMaterial({color:new T.Color(col),
            emissive:new T.Color(col).multiplyScalar(inExpl?0.6:0.1),
            emissiveIntensity:inExpl?0.7:0.15,roughness:0.5,
            transparent:!inExpl,opacity:inExpl?1.0:0.35}));
        eg.position.copy(a.clone().add(b).multiplyScalar(0.5));
        const up=new T.Vector3(0,1,0),dir=b.clone().sub(a).normalize(),q=new T.Quaternion();
        q.setFromUnitVectors(up,dir);eg.quaternion.copy(q);
        gGraph.add(eg);
        api.pick(eg,{edge:{src:e[0],dst:e[1],mask:e[2],kept:inExpl}});
        if(inExpl){
          const mid=a.clone().add(b).multiplyScalar(0.5);
          L(e[2].toFixed(2),VI,1.05,mid.x,0.55,mid.z);
        }
      });

      // nodes
      ERY.forEach(n=>{
        const isHub=n.hub;
        const r=isHub?0.52:0.36;
        const col=isHub?CY:GR;
        const sph=new T.Mesh(new T.SphereGeometry(r,28,20),
          new T.MeshStandardMaterial({color:new T.Color(col),emissive:new T.Color(col).multiplyScalar(0.6),
            emissiveIntensity:isHub?0.8:0.55,roughness:0.35}));
        sph.position.copy(pos[n.id]);
        gGraph.add(sph);
        api.pick(sph,{gene:{id:n.id,hub:!!isHub}});
        L(n.id,isHub?CY:"#cfe0f0",isHub?1.7:1.3,pos[n.id].x,r+0.7,pos[n.id].z);
      });

      // prediction halo over GATA1
      const halo=new T.Mesh(new T.RingGeometry(0.7,0.92,40),
        new T.MeshBasicMaterial({color:new T.Color(AM),side:T.DoubleSide,transparent:true,opacity:0.5}));
      halo.rotation.x=-Math.PI/2;halo.position.set(0,0.02,0);
      gGraph.add(halo);
      L("predict GATA1 active · "+F.gata1Conf.toFixed(2),"#fbbf24",1.25,0,2.4,0);

      // feature-importance bars (node feature mask) off to the side
      const fx=4.6, fy0=-2.4, fbW=0.7;
      F.explFeats.forEach((f,i)=>{
        const inK=i<Math.min(topK+1,3);    // top features tracked with edges loosely
        const h=f[2]*3.2;
        const col=[CY,AM,GR][i];
        const bar=new T.Mesh(new T.BoxGeometry(fbW,h,fbW),
          new T.MeshStandardMaterial({color:new T.Color(col),
            emissive:new T.Color(col).multiplyScalar(inK?0.6:0.2),
            emissiveIntensity:inK?0.65:0.2,roughness:0.4,
            transparent:!inK,opacity:inK?1.0:0.4}));
        bar.position.set(fx,fy0+h/2,i*1.0-1.0);
        gBars.add(bar);
        api.pick(bar,{feat:{dim:f[0],name:f[1],mask:f[2]}});
        L(f[2].toFixed(2),col,0.95,fx+0.9,fy0+h/2,i*1.0-1.0);
        Ls(f[0],col,0.34,fx,fy0-0.25,i*1.0-1.0);
      });
      L("feature mask","#8a99ad",1.0,fx,fy0+2.9,0);

      const sparsity=topK/F.explEdges.length;
      const fidelity=Math.min(1,(keptMask/(F.explEdges.reduce((a,e)=>a+e[2],0)))*1.0);
      sceneSnap={mode,topK,
        explanationEdges:kept,
        explanationMass:+keptMask.toFixed(3),
        sparsity:+sparsity.toFixed(3),
        fidelity:+fidelity.toFixed(3),
        gata1Conf:F.gata1Conf,
        fairnessGap:null,miAttack:null};

      return {
        badge:"Explain · GNNExplainer · "+kept+"/"+F.explEdges.length+" edges kept",
        formula:"max_{G_S,F} MI(Y,(G_S,F)) − λ·‖M_A‖₁ − μ·‖M_X‖₁",
        insight:"GNNExplainer keeps the minimal erythroid subgraph that reproduces the 0.91 GATA1 prediction. GATA1–KLF1 (0.89), GATA1–TAL1 (0.82) and GATA1–FOG1 (0.76) are the load-bearing edges; the L1 mask penalty drops weaker ones. The top feature mask — ATAC accessibility 0.85, motif enrichment 0.72 — matches erythroid biology, so the explanation passes a sanity check. Fewer edges = sparser, more L1-penalized explanation.",
        state:"Kept "+kept+" edge(s), mask mass "+keptMask.toFixed(2)+", sparsity "+(sparsity*100).toFixed(0)+"%, fidelity "+(fidelity*100).toFixed(0)+"%. GATA1 confidence "+F.gata1Conf.toFixed(2)+".",
        metrics:{
          fairnessGap:"—",
          lowHighAUROC:"—",
          miAttack:"—",
          utilityAUROC:"conf "+F.gata1Conf.toFixed(2)
        },
        focus:{center:[1.2,0.4,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: privacy — membership inference vs differential-privacy budget
    // ════════════════════════════════════════════════════════════════
    if(mode==="privacy"){
      const mi=miAttack(eps);
      const util=dpAUROC(eps);
      const yS=6.0;

      // axes: x = epsilon (log-ish), plot MI-attack curve + utility curve
      const xOff=-4.6, xS=9.2/20, yOff=-2.6;
      // x axis
      gPlane.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(xOff,yOff,0),new T.Vector3(xOff+20*xS,yOff,0)]),
        new T.LineBasicMaterial({color:0x2a3d52})));
      // y axis
      gPlane.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(xOff,yOff,0),new T.Vector3(xOff,yOff+yS*0.5,0)]),
        new T.LineBasicMaterial({color:0x2a3d52})));

      // random-baseline line (0.50 attack)
      const yRand=yOff+(F.randomBaseline-0.45)*yS;
      gPlane.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(xOff,yRand,0),new T.Vector3(xOff+20*xS,yRand,0)]),
        new T.LineBasicMaterial({color:0x4a5d72})));
      L("random 0.50","#6b7a8d",0.9,xOff+20*xS-1.3,yRand-0.35,0);

      // MI attack curve (rose) and utility curve (cyan) across epsilon
      const miPts=[], utPts=[];
      for(let k=0;k<=40;k++){
        const e=0.5+ (20-0.5)*k/40;
        const x=xOff+e*xS;
        miPts.push(new T.Vector3(x,yOff+(miAttack(e)-0.45)*yS,0));
        utPts.push(new T.Vector3(x,yOff+(dpAUROC(e)-0.45)*yS,0.04));
      }
      gGraph.add(new T.Line(new T.BufferGeometry().setFromPoints(miPts),new T.LineBasicMaterial({color:new T.Color(RO).getHex()})));
      gGraph.add(new T.Line(new T.BufferGeometry().setFromPoints(utPts),new T.LineBasicMaterial({color:new T.Color(CY).getHex()})));

      // current epsilon markers
      const mx=xOff+eps*xS;
      const myMI=yOff+(mi-0.45)*yS;
      const myUT=yOff+(util-0.45)*yS;
      const mkMI=new T.Mesh(new T.SphereGeometry(0.2,14,12),new T.MeshStandardMaterial({color:new T.Color(RO),emissive:new T.Color(RO),emissiveIntensity:0.9,roughness:0.25}));
      mkMI.position.set(mx,myMI,0.12);gGraph.add(mkMI);api.pick(mkMI,{curve:{type:"MI attack",eps:eps,val:mi}});
      const mkUT=new T.Mesh(new T.SphereGeometry(0.2,14,12),new T.MeshStandardMaterial({color:new T.Color(CY),emissive:new T.Color(CY),emissiveIntensity:0.9,roughness:0.25}));
      mkUT.position.set(mx,myUT,0.12);gGraph.add(mkUT);api.pick(mkUT,{curve:{type:"utility",eps:eps,val:util}});

      // vertical epsilon guide
      gGraph.add(new T.Line(new T.BufferGeometry().setFromPoints([
        new T.Vector3(mx,yOff,0.06),new T.Vector3(mx,Math.max(myMI,myUT)+0.2,0.06)]),
        new T.LineBasicMaterial({color:0x35506e})));
      L("ε="+eps.toFixed(1),"#cfe0f0",1.2,mx,yOff-0.4,0);

      // privacy-regime plane shading (strong privacy ε<1 .. weak ε>10)
      L("MI attack "+mi.toFixed(2),RO,1.3,mx+1.4,myMI+0.2,0);
      L("utility "+util.toFixed(2),CY,1.3,mx+1.4,myUT-0.45,0);

      // reference anchors (note §5): ε=8 → MI 0.55, AUROC 0.71
      const xRef=xOff+F.epsilonRef*xS;
      const refRing=new T.Mesh(new T.RingGeometry(0.28,0.36,28),new T.MeshBasicMaterial({color:new T.Color(AM),side:T.DoubleSide,transparent:true,opacity:0.7}));
      refRing.position.set(xRef,yOff+(F.miAttackDP-0.45)*yS,0.14);
      gGraph.add(refRing);
      L("ε=8 ref","#fbbf24",0.95,xRef,yOff+(F.miAttackDP-0.45)*yS+0.55,0);

      // axis labels
      L("strong privacy","#8a99ad",0.95,xOff+1.5,yOff-0.95,0);
      L("weak privacy","#8a99ad",0.95,xOff+18*xS,yOff-0.95,0);
      L("privacy budget ε →","#8a99ad",1.05,xOff+9*xS,yOff-1.7,0);

      const leaks=mi>0.60;
      sceneSnap={mode,epsilon:+eps.toFixed(2),
        miAttack:+mi.toFixed(3),
        utilityAUROC:+util.toFixed(3),
        privacyLeak:leaks,
        attackAdvantage:+(mi-F.randomBaseline).toFixed(3),
        fairnessGap:null,explanationEdges:null};

      return {
        badge:"Privacy · ε="+eps.toFixed(1)+" · MI attack "+mi.toFixed(2),
        formula:"DP-SGD: g̃ = clip(g, C) + N(0, σ²C²) ;  smaller ε → more noise",
        insight:"A membership-inference attack reads training membership from model confidence — at no privacy it hits "+F.miAttackNoDP.toFixed(2)+" (vs 0.50 random), a real patient-data leak. Differential privacy clips and noises gradients: tightening ε pushes the rose attack curve toward random but the cyan utility curve falls. At the note's ε=8 reference (amber ring), attack drops to "+F.miAttackDP.toFixed(2)+" while mean AUROC slips only "+(F.aurocNoDP-F.aurocDP).toFixed(2)+" — a cheap, meaningful privacy gain.",
        state:"ε="+eps.toFixed(1)+": MI attack "+mi.toFixed(2)+" (adv +"+(mi-0.5).toFixed(2)+"), utility AUROC "+util.toFixed(2)+". "+(leaks?"Leaking — tighten ε.":"Near-random — protected."),
        metrics:{
          fairnessGap:"—",
          lowHighAUROC:"—",
          miAttack:mi.toFixed(2),
          utilityAUROC:util.toFixed(2)
        },
        focus:{center:[0,0.4,0],radius:13}
      };
    }

    return {badge:"J02",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:13}};
  }

  // ── MathLab.create ──────────────────────────────────────────────────────
  MathLab.create({
    id:"j02",
    kind:"trustworthy-gnns",
    eyebrow:"Block J · Advanced GNN Theory",
    title:"J02 · Trustworthy GNNs",
    subtitle:"Accuracy is orthogonal to trust. One 500-gene GAT, three audits: fairness (hub bias), explainability (GNNExplainer on GATA1), and privacy (membership inference vs differential privacy).",
    selectedLabel:"Element",
    selectedHint:"Click a bar, gene, edge, or curve marker.",
    modes:[
      {value:"fairness", label:"Fairness (degree-stratified AUROC)"},
      {value:"explain",  label:"Explainability (GNNExplainer subgraph)"},
      {value:"privacy",  label:"Privacy (membership inference vs DP)"}
    ],
    params:[
      {key:"fairW",  label:"fairness re-weight (1/√deg loss)",min:0,max:1,step:0.05,value:0,
       fmt:v=>v<=0?"raw mean":"re-weight "+v.toFixed(2),modes:["fairness"]},
      {key:"topK",   label:"GNNExplainer edges kept (L1 sparsity)",min:1,max:4,step:1,value:3,
       fmt:v=>Math.round(v)+" / 4 edges",modes:["explain"]},
      {key:"epsilon",label:"DP privacy budget ε",min:0.5,max:20,step:0.5,value:8,
       fmt:v=>"ε="+v.toFixed(1),modes:["privacy"]},
      {key:"noise",  label:"expression perturbation (robustness)",min:0,max:1,step:0.05,value:0.18,
       fmt:v=>v.toFixed(2)}
    ],
    metrics:[
      {key:"fairnessGap",  label:"Fairness gap (AUROC)",accent:"violet"},
      {key:"lowHighAUROC", label:"Low / high-deg AUROC",accent:"rose"},
      {key:"miAttack",     label:"Membership-inf. attack",accent:"amber"},
      {key:"utilityAUROC", label:"Utility (AUROC / conf)",accent:"cyan"}
    ],
    layers:[
      {group:"graph",  label:"Graph / curves"},
      {group:"bars",   label:"Bars"},
      {group:"plane",  label:"Axes / baselines"},
      {group:"labels", label:"Labels"}
    ],
    primary:{
      label:"Tighten privacy (ε=1)",
      on:api=>{ if(api.state.mode==="privacy") api.setParam("epsilon",1);
                else if(api.state.mode==="fairness") api.setParam("fairW",1);
                else api.setParam("topK",2); }
    },
    secondary:{
      label:"Relax privacy (ε=20)",
      on:api=>{ if(api.state.mode==="privacy") api.setParam("epsilon",20);
                else if(api.state.mode==="fairness") api.setParam("fairW",0);
                else api.setParam("topK",4); }
    },
    defaultCam:{theta:-0.45,phi:0.62,r:13},
    hint:'<span style="color:#fb7185">rose</span>=low-degree / privacy attack · <span style="color:#4dd7ff">cyan</span>=hub / utility · <span style="color:#a78bfa">violet</span>=explanation mask / gap · <span style="color:#fbbf24">amber</span>=reference (mean / ε=8).',
    onParam(api){
      const m=api.state.mode;
      if(m==="fairness") api.frame([0,2.0,0],13);
      else if(m==="explain") api.frame([1.2,0.4,0],13);
      else api.frame([0,0.4,0],13);
    },
    onMode(api){
      const m=api.state.mode;
      if(m==="fairness") api.frame([0,2.0,0],13);
      else if(m==="explain") api.frame([1.2,0.4,0],13);
      else api.frame([0,0.4,0],13);
    },
    onSelect(api,d){
      if(d.quant) api.setSelected(d.quant.label+" · AUROC "+d.quant.auroc.toFixed(2));
      if(d.gene)  api.setSelected("Gene "+d.gene.id+(d.gene.hub?" · HUB (prediction target)":" · neighbour"));
      if(d.edge)  api.setSelected(d.edge.src+"–"+d.edge.dst+" · mask "+d.edge.mask.toFixed(2)+(d.edge.kept?" · KEPT":" · pruned (L1)"));
      if(d.feat)  api.setSelected(d.feat.dim+" "+d.feat.name+" · mask "+d.feat.mask.toFixed(2));
      if(d.curve) api.setSelected(d.curve.type+" @ ε="+d.curve.eps.toFixed(1)+" → "+d.curve.val.toFixed(2));
    },
    build,
    snapshot(s){
      const mode=s.mode;
      const fairW=s.fairW, eps=s.epsilon, topK=Math.round(s.topK);
      const auc=fairnessAUROC(fairW);
      const gap=auc[3]-auc[0];
      const mi=miAttack(eps);
      const util=dpAUROC(eps);
      const keptMass=F.explEdges.slice().sort((a,b)=>b[2]-a[2]).slice(0,topK).reduce((a,e)=>a+e[2],0);
      return {
        mode:mode,
        fairW:+fairW.toFixed(3),
        topK:topK,
        epsilon:+eps.toFixed(2),
        noise:+s.noise.toFixed(3),
        fairnessGap:+gap.toFixed(3),
        lowDegreeAUROC:+auc[0].toFixed(3),
        highDegreeAUROC:+auc[3].toFixed(3),
        meanAUROC:F.meanAUROC,
        miAttack:+mi.toFixed(3),
        attackAdvantage:+(mi-F.randomBaseline).toFixed(3),
        utilityAUROC:+util.toFixed(3),
        explanationEdges:topK,
        explanationMass:+keptMass.toFixed(3),
        privacyLeak:mi>0.60,
        lowDegreeAboveRandom:auc[0]>F.randomBaseline+0.02
      };
    }
  });
})();
</script>
</body>
</html>
