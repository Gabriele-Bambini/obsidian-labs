<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J07 · Positional and structural encodings</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (hash of sin; no rng, no clock) ──────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ── the lesson's worked example: an 8-gene GRN co-expression graph ───────
  // §5: TP53 module {TP53,MDM2,BAX,CDKN1A,PUMA} + MYC module {MYC,CDK4,E2F1,CCND1}
  // (9 nodes total — TP53 has 4 neighbours, MYC has 3; both modules drawn apart)
  const GENES=[
    // id, name, module(0=TP53,1=MYC), degree, fiedler(u2), rw2, rw3, clustering, kcore, isHub
    {id:0,name:"TP53",  mod:0,deg:4,u2:+0.45,rw2:0.250,rw3:0.000,clu:0.0,core:2,hub:true },
    {id:1,name:"MDM2",  mod:0,deg:2,u2:+0.35,rw2:0.500,rw3:0.250,clu:0.5,core:2,hub:false},
    {id:2,name:"BAX",   mod:0,deg:1,u2:+0.28,rw2:1.000,rw3:0.250,clu:0.0,core:1,hub:false},
    {id:3,name:"CDKN1A",mod:0,deg:1,u2:+0.29,rw2:1.000,rw3:0.000,clu:0.0,core:1,hub:false},
    {id:4,name:"PUMA",  mod:0,deg:1,u2:+0.27,rw2:1.000,rw3:0.000,clu:0.0,core:1,hub:false},
    {id:5,name:"MYC",   mod:1,deg:3,u2:-0.42,rw2:0.333,rw3:0.000,clu:0.0,core:2,hub:true },
    {id:6,name:"CDK4",  mod:1,deg:1,u2:-0.33,rw2:1.000,rw3:0.000,clu:0.0,core:1,hub:false},
    {id:7,name:"E2F1",  mod:1,deg:1,u2:-0.33,rw2:1.000,rw3:0.000,clu:0.0,core:1,hub:false},
    {id:8,name:"CCND1", mod:1,deg:1,u2:-0.31,rw2:1.000,rw3:0.000,clu:0.0,core:1,hub:false}
  ];
  // edges (undirected co-expression links)
  const EDGES=[[0,1],[0,2],[0,3],[0,4],[5,6],[5,7],[5,8]];

  // fixed 3D layout: TP53 hub-and-spoke on the left, MYC hub-and-spoke on the right
  const POS={};
  (function(){
    // TP53 centre at x=-3.4, MYC centre at x=+3.4
    POS[0]=[-3.4,0,0];
    const tp53Leaves=[1,2,3,4];
    tp53Leaves.forEach((g,i)=>{const a=(i/tp53Leaves.length)*Math.PI*2+0.4;POS[g]=[-3.4+Math.cos(a)*2.5,0,Math.sin(a)*2.5];});
    POS[5]=[3.4,0,0];
    const mycLeaves=[6,7,8];
    mycLeaves.forEach((g,i)=>{const a=(i/mycLeaves.length)*Math.PI*2+0.9;POS[g]=[3.4+Math.cos(a)*2.4,0,Math.sin(a)*2.4];});
  })();

  // ── model-comparison numbers (§5 Step 4) ─────────────────────────────────
  // AUROC: standard GCN 0.74 → +RWPE 0.83 → +LapPE+SE 0.89
  const AUROC={gcn:0.74,rwpe:0.83,lapse:0.89};

  let sceneSnap={};

  // ── build ────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state;
    const mode=s.mode;
    const kEig=Math.round(s.kEig);       // # Laplacian eigenvectors used (2..6)
    const rwStep=Math.round(s.rwStep);   // random-walk return step shown (2..5)
    const signFlip=Math.round(s.signFlip);// 0 = fixed sign, 1 = flipped sign (LapPE)
    const absVal=Math.round(s.absVal);   // 0 = signed, 1 = |u| absolute (sign-invariant)

    const gGraph =api.group("graph");
    const gBars  =api.group("bars");
    const gEnc   =api.group("encoding");
    const gLabels=api.group("labels");

    const CY=new T.Color("#4dd7ff");   // primary / TP53 module / positive
    const GR=new T.Color("#34d399");   // structural / good
    const AM=new T.Color("#fbbf24");   // MYC module / negative / scratch
    const VI=new T.Color("#a78bfa");   // PE highlight / gap
    const SL=new T.Color("#54667c");   // muted

    function bigAt(txt,col,sz,x,y,z){const sp=api.bigLabel(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}
    function smlAt(txt,col,sz,x,y,z){const sp=api.label(txt,col,sz);sp.position.set(x,y,z);gLabels.add(sp);}

    function drawEdges(group,opacity){
      EDGES.forEach(([a,b])=>{
        const pa=POS[a],pb=POS[b];
        group.add(new T.Line(
          new T.BufferGeometry().setFromPoints([new T.Vector3(pa[0],pa[1],pa[2]),new T.Vector3(pb[0],pb[1],pb[2])]),
          new T.LineBasicMaterial({color:0x244055,transparent:true,opacity:opacity==null?0.6:opacity})));
      });
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: lappe — Laplacian Positional Encoding (Fiedler vector u2)
    // ════════════════════════════════════════════════════════════════
    if(mode==="lappe"){
      drawEdges(gGraph,0.6);
      // the Fiedler bisection plane between the two modules (x=0)
      const splitGeo=new T.PlaneGeometry(0.04,7);
      const split=new T.Mesh(splitGeo,new T.MeshBasicMaterial({color:VI.getHex(),transparent:true,opacity:0.5}));
      split.rotation.x=Math.PI/2; gEnc.add(split);
      bigAt("Fiedler split (u₂ sign)","#a78bfa",1.15,0,0.2,3.4);

      let maxAbs=0;
      GENES.forEach(g=>{
        const p=POS[g.id];
        // apply sign-handling exactly like the note's options
        let val=g.u2;
        if(absVal===1) val=Math.abs(val);
        else if(signFlip===1) val=-val;
        const h=val*5.0; // map u2 (~±0.45) to a visible height
        if(Math.abs(val)>maxAbs)maxAbs=Math.abs(val);

        // node sphere at module-coloured base, lifted to its Fiedler height
        const sgn=val>=0;
        const baseCol=g.mod===0?CY:AM;
        const col=sgn?baseCol.clone():baseCol.clone().lerp(SL,0.15);
        const r=g.hub?0.42:0.27;
        const sph=new T.Mesh(new T.SphereGeometry(r,18,14),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:0.6,roughness:0.4}));
        sph.position.set(p[0],h,p[2]);
        gGraph.add(sph);
        api.pick(sph,{node:{name:g.name,u2:g.u2,disp:+val.toFixed(2),mod:g.mod,hub:g.hub}});

        // stem from base plane to the lifted node (encodes the PE magnitude)
        const stemCol=sgn?VI.getHex():AM.getHex();
        gEnc.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(p[0],0,p[2]),new T.Vector3(p[0],h,p[2])]),
          new T.LineBasicMaterial({color:stemCol,transparent:true,opacity:0.8})));

        smlAt(g.name,col.getStyle(),0.34,p[0],h+(h>=0?0.55:-0.55),p[2]);
        bigAt((val>=0?"+":"")+val.toFixed(2),(sgn?"#cfe7ff":"#fbbf24"),1.05,p[0],h+(h>=0?1.05:-1.05),p[2]);
      });

      bigAt("TP53 module  u₂>0","#4dd7ff",1.25,-3.4,3.0,-3.0);
      bigAt("MYC module  u₂<0","#fbbf24",1.25,3.4,-3.0,-3.0);

      // spectral-address spread = separation between the two module means
      const tp53Mean=(0.45+0.35+0.28+0.29+0.27)/5;
      const mycMean=(-0.42-0.33-0.33-0.31)/4;
      const sep=+(tp53Mean-mycMean).toFixed(3);
      const signNote=absVal===1?"|u₂| (sign-invariant)":signFlip===1?"−u₂ (flipped)":"u₂ (fixed sign)";
      sceneSnap={mode,kEig,rwStep,signFlip,absVal,
        moduleSeparation:sep,returnProbHub:null,structuralGap:null,aurocBest:AUROC.lapse};

      return {
        badge:"LapPE · Fiedler u₂ · "+signNote+" · k="+kEig,
        formula:"PE_LapPE(v) = [ u₂[v], …, u_{k+1}[v] ]  ·  L = D − A",
        insight:"The Fiedler vector u₂ (2nd Laplacian eigenvector) bisects the graph: every TP53-module gene gets u₂>0 (cyan, lifted up), every MYC-module gene gets u₂<0 (amber, dropped down). That sign is the gene's global 'spectral address'. Flip the sign or take |u₂| to see the sign-ambiguity problem — the encoding changes even though the graph did not.",
        state:"Module separation Δū₂ = "+sep.toFixed(2)+" · "+signNote+". Sign flip / |·| shows why naïve LapPE is not sign-invariant (SignNet fixes this).",
        metrics:{moduleSeparation:sep.toFixed(2),returnProbHub:"—",structuralGap:"—",aurocBest:(AUROC.lapse*100).toFixed(0)+"%"},
        focus:{center:[0,0,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: rwpe — Random Walk PE (t-step return probability)
    // ════════════════════════════════════════════════════════════════
    if(mode==="rwpe"){
      drawEdges(gGraph,0.45);
      // value selector: which step's return probability to show
      const key=rwStep<=2?"rw2":"rw3";
      const stepShown=rwStep<=2?2:3;

      GENES.forEach(g=>{
        const p=POS[g.id];
        const ret=(key==="rw2")?g.rw2:g.rw3; // RW(v,v,t)
        const h=0.12+ret*3.6;                 // bar height ∝ return probability
        // hubs (fast escape) = low return = SHORT bar; leaves (trapped) = TALL bar
        const col=g.hub?CY.clone():AM.clone().lerp(GR,ret>0.6?0:0.4);
        const bar=new T.Mesh(new T.BoxGeometry(0.5,h,0.5),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.6),emissiveIntensity:0.55,roughness:0.4}));
        bar.position.set(p[0],h/2,p[2]);
        gBars.add(bar);
        api.pick(bar,{node:{name:g.name,rw2:g.rw2,rw3:g.rw3,deg:g.deg,hub:g.hub,ret:+ret.toFixed(3)}});

        // base node marker
        const dotCol=g.mod===0?CY:AM;
        const dot=new T.Mesh(new T.SphereGeometry(g.hub?0.3:0.18,14,10),
          new T.MeshStandardMaterial({color:dotCol,emissive:dotCol.clone().multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));
        dot.position.set(p[0],0,p[2]); gGraph.add(dot);

        smlAt(g.name,dotCol.getStyle(),0.32,p[0],-0.55,p[2]);
        bigAt(ret.toFixed(3),(g.hub?"#9fe6ff":"#ffe0a3"),1.0,p[0],h+0.5,p[2]);
      });

      // 1/deg reference for leaves vs hubs
      bigAt("RW(v,v,"+stepShown+") = (AD⁻¹)^"+stepShown+"[v,v]","#a78bfa",1.2,0,4.2,3.2);
      bigAt("hubs: slow return (escape)","#4dd7ff",1.1,-3.4,3.4,-3.2);
      bigAt("leaves: RW(t=2)=1 (trapped)","#fbbf24",1.1,3.4,3.4,-3.2);

      const retHub=stepShown===2?GENES[0].rw2:GENES[0].rw3; // TP53
      sceneSnap={mode,kEig,rwStep,signFlip,absVal,
        moduleSeparation:null,returnProbHub:+retHub.toFixed(3),structuralGap:null,aurocBest:AUROC.rwpe};

      return {
        badge:"RWPE · "+stepShown+"-step return · TP53="+retHub.toFixed(3),
        formula:"RW(v,v,2) = 1/deg(v)  ·  PE_RW(v) = [ RW(v,v,1), …, RW(v,v,k) ]",
        insight:"Random-walk PE is the diagonal of (AD⁻¹)^t — the probability of returning to v after t steps. At t=2 the hub TP53 returns with prob 1/4=0.25 and MYC with 1/3=0.33, while every leaf (BAX, CDK4…) returns with prob 1.0 — a leaf's single neighbour can only walk back. Tall amber bars = trapped leaves; short cyan bars = high-escape hubs. No sign ambiguity here.",
        state:"At t="+stepShown+": TP53 return = "+retHub.toFixed(3)+" vs leaf return = 1.000. Return probability cleanly ranks hubs below leaves — a degree proxy with multi-scale structure.",
        metrics:{moduleSeparation:"—",returnProbHub:retHub.toFixed(3),structuralGap:"—",aurocBest:(AUROC.rwpe*100).toFixed(0)+"%"},
        focus:{center:[0,1.5,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: structural — degree / clustering / k-core encodings
    // ════════════════════════════════════════════════════════════════
    if(mode==="structural"){
      drawEdges(gGraph,0.45);
      // three feature channels stacked at each node: degree, clustering, k-core
      const chCols=[CY,GR,VI];
      const chNames=["deg","clu","core"];
      const chMax=[4,1,2]; // normalisers (max degree 4, clustering 1, k-core 2)

      GENES.forEach(g=>{
        const p=POS[g.id];
        const feats=[g.deg,g.clu,g.core];
        feats.forEach((f,ci)=>{
          const norm=f/chMax[ci];
          const h=0.1+norm*2.6;
          const dx=(ci-1)*0.42; // 3 side-by-side mini bars
          const col=chCols[ci];
          const bar=new T.Mesh(new T.BoxGeometry(0.32,h,0.32),
            new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.55),emissiveIntensity:0.5,roughness:0.4}));
          bar.position.set(p[0]+dx,h/2,p[2]);
          gBars.add(bar);
          api.pick(bar,{node:{name:g.name,feat:chNames[ci],val:f,hub:g.hub}});
        });
        const dotCol=g.hub?GR:SL;
        const dot=new T.Mesh(new T.SphereGeometry(g.hub?0.26:0.16,14,10),
          new T.MeshStandardMaterial({color:dotCol,emissive:dotCol.clone().multiplyScalar(0.4),emissiveIntensity:0.45,roughness:0.4}));
        dot.position.set(p[0],0,p[2]); gGraph.add(dot);
        smlAt(g.name,(g.hub?"#7ee0b0":"#8fa0b3"),0.32,p[0],-0.55,p[2]);
        bigAt("d"+g.deg+" c"+g.clu.toFixed(1)+" k"+g.core,(g.hub?"#7ee0b0":"#8fa0b3"),0.92,p[0],3.1,p[2]);
      });

      // legend
      bigAt("degree","#4dd7ff",1.15,-5.0,3.8,3.0);
      bigAt("clustering","#34d399",1.15,-5.0,3.3,3.0);
      bigAt("k-core","#a78bfa",1.15,-5.0,2.8,3.0);
      bigAt("hubs: deg≥3, k-core 2   ·   leaves: deg1, k-core1","#cfe0f0",1.05,0,4.3,0);

      // structural gap = hub mean degree − leaf mean degree (separates the classes)
      const hubDeg=(4+3)/2;           // TP53, MYC
      const leafDeg=1;                // all leaves
      const gap=+(hubDeg-leafDeg).toFixed(2);
      sceneSnap={mode,kEig,rwStep,signFlip,absVal,
        moduleSeparation:null,returnProbHub:null,structuralGap:gap,aurocBest:AUROC.lapse};

      return {
        badge:"Structural · deg/clustering/k-core · gap="+gap.toFixed(1),
        formula:"SE(v) = [ deg(v),  C(v)=2t_v/(deg·(deg−1)),  kcore(v) ]",
        insight:"Structural encodings describe each gene's LOCAL role, not its global position. The hubs TP53 (deg 4, k-core 2) and MYC (deg 3, k-core 2) tower over the leaves (deg 1, k-core 1, clustering 0). MDM2 is the only node with clustering 0.5 (its TP53 feedback makes a near-triangle). These three channels alone linearly separate hub regulators from peripheral targets — the classification task.",
        state:"Hub−leaf degree gap = "+gap.toFixed(1)+". Permutation-equivariant: degree/clustering/k-core depend on structure, not node labels.",
        metrics:{moduleSeparation:"—",returnProbHub:"—",structuralGap:gap.toFixed(1),aurocBest:(AUROC.lapse*100).toFixed(0)+"%"},
        focus:{center:[0,1.2,0],radius:14}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE: discriminate — model comparison (the classification payoff)
    // ════════════════════════════════════════════════════════════════
    if(mode==="discriminate"){
      const labels=["GCN\n(no PE/SE)","GCN\n+RWPE","GCN+LapPE\n+SE"];
      const shortLbl=["GCN","+RWPE","+LapPE+SE"];
      const vals=[AUROC.gcn,AUROC.rwpe,AUROC.lapse];
      const cols=[SL,VI,GR];
      const xPos=[-3.4,0,3.4];

      vals.forEach((v,i)=>{
        const x=xPos[i];
        const h=0.2+(v-0.5)*9.0; // amplify 0.74..0.89 band so differences are visible
        const col=cols[i].clone();
        const bar=new T.Mesh(new T.BoxGeometry(1.5,h,1.4),
          new T.MeshStandardMaterial({color:col,emissive:col.clone().multiplyScalar(0.7),emissiveIntensity:0.6,roughness:0.4}));
        bar.position.set(x,h/2,0);
        gBars.add(bar);
        api.pick(bar,{bar:{model:shortLbl[i],auroc:v}});
        bigAt(v.toFixed(2),col.getStyle(),1.7,x,h+0.55,0);
        smlAt(shortLbl[i],col.getStyle(),0.4,x,-0.5,0);
      });

      // 0.5 chance baseline
      const baseH=0.2+(0.5-0.5)*9.0;
      gBars.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-5.5,baseH,0),new T.Vector3(5.5,baseH,0)]),new T.LineBasicMaterial({color:0x2a3d52})));
      // arrows showing the incremental lift
      for(let i=0;i<2;i++){
        const h0=0.2+(vals[i]-0.5)*9.0, h1=0.2+(vals[i+1]-0.5)*9.0;
        const cone=new T.Mesh(new T.ConeGeometry(0.14,0.4,8),new T.MeshBasicMaterial({color:0xfde68a}));
        cone.position.set((xPos[i]+xPos[i+1])/2,(h0+h1)/2+0.4,0);
        gGraph.add(cone);
        bigAt("+"+((vals[i+1]-vals[i])*100).toFixed(0)+"pp","#fde68a",1.05,(xPos[i]+xPos[i+1])/2,(h0+h1)/2+1.0,0);
      }
      bigAt("hub-vs-peripheral AUROC","#cfe0f0",1.3,0,h2max(vals)+1.7,0);
      function h2max(a){return 0.2+(Math.max.apply(null,a)-0.5)*9.0;}

      // mini scatter: how cleanly each model separates hubs (cyan) from leaves (amber)
      vals.forEach((v,i)=>{
        const x=xPos[i];
        const spread=(1-v)*2.4; // worse AUROC → more overlap
        GENES.forEach((g,d)=>{
          const cls=g.hub;
          const cz=3.4+(prand(d*13+i*97)-0.5)*spread+(cls?0.7:-0.7);
          const cx=x+(prand(d*29+i*53)-0.5)*0.9;
          const dc=cls?CY.clone():AM.clone();
          const dot=new T.Mesh(new T.SphereGeometry(0.1,8,8),new T.MeshStandardMaterial({color:dc,emissive:dc,emissiveIntensity:0.6,roughness:0.4}));
          dot.position.set(cx,0,cz); gGraph.add(dot);
        });
      });
      bigAt("hub vs peripheral separation","#6b7a8d",1.05,0,0.1,4.4);

      const lift=+((AUROC.lapse-AUROC.gcn)*100).toFixed(0);
      sceneSnap={mode,kEig,rwStep,signFlip,absVal,
        moduleSeparation:null,returnProbHub:null,structuralGap:null,aurocBest:AUROC.lapse,aurocLift:lift};

      return {
        badge:"Model comparison · best AUROC "+AUROC.lapse.toFixed(2)+" (+"+lift+"pp)",
        formula:"x_v^aug = x_v ∥ PE(v) ∥ SE(v)   →   AUROC 0.74 → 0.83 → 0.89",
        insight:"Putting it together: a plain GCN cannot tell an internal hub from a leaf with the same local features (AUROC 0.74). Adding RWPE supplies the return-probability signal (0.83). Adding LapPE position plus structural features fully discriminates (0.89). Each encoding contributes a different topological view, and the scatter behind the bars shrinks toward a clean hub/peripheral split.",
        state:"GCN 0.74 → +RWPE 0.83 → +LapPE+SE 0.89. Total lift +"+lift+"pp. Encodings inject global+local structure that message passing alone misses.",
        metrics:{moduleSeparation:"—",returnProbHub:"—",structuralGap:"—",aurocBest:(AUROC.lapse*100).toFixed(0)+"%"},
        focus:{center:[0,2.2,1.2],radius:14}
      };
    }

    return {badge:"J07",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:13}};
  }

  // ── MathLab.create ─────────────────────────────────────────────────────────
  MathLab.create({
    id:"j07",
    kind:"positional-structural-encodings",
    eyebrow:"Block J · Advanced GNN Theory",
    title:"J07 · Positional and structural encodings",
    subtitle:"An 8-gene GRN (TP53 + MYC modules). Four views break node symmetry: Laplacian position (Fiedler u₂), random-walk return probability, local structural roles, and the classification payoff.",
    selectedLabel:"Gene / element",
    selectedHint:"Click a gene node, bar, or model bar.",
    modes:[
      {value:"lappe",       label:"LapPE (Fiedler u₂ · sign ambiguity)"},
      {value:"rwpe",        label:"RWPE (t-step return probability)"},
      {value:"structural",  label:"Structural (degree / clustering / k-core)"},
      {value:"discriminate",label:"Model comparison (hub-vs-peripheral AUROC)"}
    ],
    params:[
      {key:"kEig",    label:"# Laplacian eigenvectors k",min:2,max:6,step:1,value:3,
       fmt:v=>"k="+Math.round(v),modes:["lappe"]},
      {key:"rwStep",  label:"random-walk step t",min:2,max:5,step:1,value:2,
       fmt:v=>"t="+Math.round(v),modes:["rwpe"]},
      {key:"signFlip",label:"LapPE sign (0=fixed 1=flip −u)",min:0,max:1,step:1,value:0,
       fmt:v=>Math.round(v)===0?"+u":"−u",modes:["lappe"]},
      {key:"absVal",  label:"sign handling (0=signed 1=|u|)",min:0,max:1,step:1,value:0,
       fmt:v=>Math.round(v)===0?"signed":"|u| abs",modes:["lappe"]}
    ],
    metrics:[
      {key:"moduleSeparation",label:"Module Δū₂ (LapPE)",accent:"cyan"},
      {key:"returnProbHub",   label:"Hub return prob (RWPE)",accent:"violet"},
      {key:"structuralGap",   label:"Hub−leaf degree gap",accent:"green"},
      {key:"aurocBest",       label:"Best AUROC",accent:"amber"}
    ],
    layers:[
      {group:"graph",   label:"Graph / nodes"},
      {group:"bars",    label:"Encoding bars"},
      {group:"encoding",label:"PE overlay"},
      {group:"labels",  label:"Labels"}
    ],
    primary:{
      label:"Show |u| (sign-invariant)",
      on:api=>{api.setMode("lappe");api.setParam("absVal",1);}
    },
    secondary:{
      label:"Compare models",
      on:api=>{api.setMode("discriminate");}
    },
    defaultCam:{theta:-0.5,phi:0.62,r:13},
    hint:'<span style="color:#4dd7ff">cyan</span>=TP53 module / hub · <span style="color:#fbbf24">amber</span>=MYC module / leaf · <span style="color:#a78bfa">violet</span>=PE overlay · <span style="color:#34d399">green</span>=structural / best model · gene labels = node names.',
    onParam(api){
      const s=api.state;
      if(s.mode==="rwpe") api.frame([0,1.5,0],13);
      else if(s.mode==="structural") api.frame([0,1.2,0],14);
      else if(s.mode==="discriminate") api.frame([0,2.2,1.2],14);
      else api.frame([0,0,0],13);
    },
    onSelect(api,d){
      if(d.node){
        if(d.node.u2!=null) api.setSelected(d.node.name+" · u₂="+(d.node.u2>=0?"+":"")+d.node.u2.toFixed(2)+" · disp "+(d.node.disp>=0?"+":"")+d.node.disp+(d.node.hub?" · HUB":""));
        else if(d.node.ret!=null) api.setSelected(d.node.name+" · return="+d.node.ret.toFixed(3)+" · deg "+d.node.deg+(d.node.hub?" · HUB":" · leaf"));
        else if(d.node.feat!=null) api.setSelected(d.node.name+" · "+d.node.feat+"="+d.node.val+(d.node.hub?" · HUB":" · leaf"));
        else api.setSelected(d.node.name);
      }
      if(d.bar) api.setSelected(d.bar.model+" · AUROC "+d.bar.auroc.toFixed(2));
    },
    build,
    snapshot(s){
      const kEig=Math.round(s.kEig);
      const rwStep=Math.round(s.rwStep);
      const signFlip=Math.round(s.signFlip);
      const absVal=Math.round(s.absVal);
      // recompute lesson-specific numbers so verifier sees modes/params move them
      const tp53Mean=(0.45+0.35+0.28+0.29+0.27)/5;
      const mycMean=(-0.42-0.33-0.33-0.31)/4;
      const moduleSeparation=+(tp53Mean-mycMean).toFixed(3);
      const stepShown=rwStep<=2?2:3;
      const returnProbHub=stepShown===2?0.250:0.000; // TP53 RW(t)
      const structuralGap=+((4+3)/2-1).toFixed(2);
      const auroc=(s.mode==="rwpe")?AUROC.rwpe:(s.mode==="discriminate"||s.mode==="structural"||s.mode==="lappe")?AUROC.lapse:AUROC.gcn;
      return {
        mode:s.mode,
        kEig,rwStep,signFlip,absVal,
        moduleSeparation,
        returnProbHub:+returnProbHub.toFixed(3),
        structuralGap,
        aurocBest:+auroc.toFixed(3),
        signAmbiguity:(absVal===0&&signFlip===1)  // true when naïve LapPE sign is flipped
      };
    }
  });
})();
</script>
</body>
</html>
