<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K01 · Pretraining objectives for graph foundation models</title>
<link rel="stylesheet" href="shared/lab-engine.css">
</head>
<body>
<script src="shared/three.min.js"></script>
<script src="shared/lab-engine.js"></script>
<script>
(function(){
  "use strict";

  // ── deterministic pseudo-random (no Math.random / Date) ───────────────────
  const frac=v=>{const a=v-Math.floor(v);return a<0?a+1:a;};
  const prand=i=>frac(Math.sin(i*127.1+31.7)*43758.5453);

  // ════════════════════════════════════════════════════════════════════════
  // WORKED EXAMPLE — Section 5 of the note: the TP53 cell-cycle GRN.
  //   6 nodes: TP53, MDM2, CDKN1A, CCND1, E2F1, RB1
  //   Edges (undirected for the example):
  //     TP53–MDM2, TP53–CDKN1A, TP53–CCND1, E2F1–CCND1, E2F1–RB1, RB1–CDKN1A
  //   Masked node prediction: mask CDKN1A and CCND1 (2/6 = 33%).
  //   Expression channel (ground truth & predictions from the note):
  //     CDKN1A true 0.85 / pred 0.79   ·   CCND1 true 0.22 / pred 0.31
  //     L_mask = ½[(0.85−0.79)² + (0.22−0.31)²] = ½[0.0036+0.0081] = 0.00585
  // ════════════════════════════════════════════════════════════════════════
  const GENES=["TP53","MDM2","CDKN1A","CCND1","E2F1","RB1"];
  // hexagon layout (x,z), y=0 plane
  const POS=(()=>{const R=3.4,p=[];for(let i=0;i<6;i++){const a=Math.PI/2 - i/6*Math.PI*2;p.push([Math.cos(a)*R,0,Math.sin(a)*R]);}return p;})();
  const EDGES=[[0,1],[0,2],[0,3],[4,3],[4,5],[5,2]]; // index pairs into GENES
  // ground-truth expression channel per gene (note gives CDKN1A=0.85, CCND1=0.22)
  const EXPR_TRUE=[0.71,0.40,0.85,0.22,0.66,0.48];

  // note-exact reconstruction for the two default-masked genes
  const PRED_NOTE={2:0.79,3:0.31};

  // adjacency (neighbour index lists)
  const ADJ=(()=>{const a=GENES.map(()=>[]);EDGES.forEach(([u,v])=>{a[u].push(v);a[v].push(u);});return a;})();

  let sceneSnap={};

  // ── masked-node reconstruction model (deterministic, structure-aware) ─────
  // A masked node is reconstructed from its UNMASKED neighbours (a 1-layer
  // mean-aggregation GCN proxy). For the two default masked genes we honour the
  // note's exact predicted numbers; otherwise the neighbour-mean still moves
  // the scene for any masking choice.
  function reconstruct(maskSet){
    const pred={},err={};let sumSE=0,cnt=0;
    const canonical=(maskSet.length===2 && maskSet.indexOf(2)>=0 && maskSet.indexOf(3)>=0);
    maskSet.forEach(i=>{
      let p;
      if(canonical && PRED_NOTE[i]!=null){ p=PRED_NOTE[i]; }
      else {
        const nbr=ADJ[i].filter(j=>maskSet.indexOf(j)<0);
        if(nbr.length){ p=nbr.reduce((s,j)=>s+EXPR_TRUE[j],0)/nbr.length; }
        else { p=0.50; } // no visible neighbour → fall back to prior mean
        p=p*0.6+EXPR_TRUE[i]*0.4; // mild structural shrinkage toward the truth
      }
      const e=(EXPR_TRUE[i]-p); pred[i]=p; err[i]=e; sumSE+=e*e; cnt++;
    });
    const Lm=cnt? sumSE/cnt : 0;
    return {pred,err,L:Lm,cnt,canonical};
  }

  // ── edge reconstruction model (BCE proxy) ─────────────────────────────────
  function edgeScore(u,v){
    const sExpr=1-Math.abs(EXPR_TRUE[u]-EXPR_TRUE[v]);          // 0..1
    const sDeg =1-Math.abs(ADJ[u].length-ADJ[v].length)/3;     // 0..1
    return Math.max(0.04,Math.min(0.97,0.5*sExpr+0.5*sDeg));
  }
  function sigmoidLossEdge(removedFrac,negHard){
    const nRem=Math.max(1,Math.round(removedFrac*EDGES.length));
    let posL=0;for(let k=0;k<nRem;k++){const e=EDGES[k%EDGES.length];const s=edgeScore(e[0],e[1]);posL+= -Math.log(Math.max(1e-3,s));}
    posL/=nRem;
    const negS=negHard? 0.46:0.12;                 // hard negatives look edge-like
    const negL=-Math.log(Math.max(1e-3,1-negS));
    return {pos:posL,neg:negL,total:posL+negL,nRem,negS};
  }

  // ── contrastive model (NT-Xent proxy) ─────────────────────────────────────
  function contrastive(tau,dropRate){
    const simPos=Math.max(0.30,0.99-0.9*dropRate);   // heavier augment → views drift
    const simNeg=0.42;                                // a distant subgraph
    const ePos=Math.exp(simPos/tau), eNeg=Math.exp(simNeg/tau);
    const pPos=ePos/(ePos+eNeg);
    const loss=-Math.log(pPos);
    return {simPos,simNeg,pPos,loss,tau,dropRate};
  }

  // ── context prediction model (Hu et al.) ──────────────────────────────────
  function contextMatch(centerHops){
    const acc=Math.max(0.40,Math.min(0.96,0.50+0.18*centerHops));
    const ringSize=centerHops===1?3:5;
    return {acc,ringSize,centerHops};
  }

  // ── build ─────────────────────────────────────────────────────────────────
  function build(api){
    const T=api.THREE, s=api.state, mode=s.mode;
    const pMask=s.pMask;                 // masking rate 0.10..0.50
    const negHard=Math.round(s.negHard); // 0 easy / 1 hard negatives
    const tau=s.tau;                     // contrastive temperature 0.1..1.0
    const dropRate=s.dropRate;           // augmentation edge-drop 0..0.6
    const centerHops=Math.round(s.centerHops); // 1 or 2

    const gGraph =api.group("graph");
    const gMarks =api.group("marks");
    const gPanel =api.group("panel");
    const gLabels=api.group("labels");

    const CY="#4dd7ff", GR="#34d399", AM="#fbbf24", VI="#a78bfa", RO="#fb7185", SL="#54667c";
    function L(txt,c,sz,x,y,z){const sp=api.bigLabel(txt,c,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}
    function Ls(txt,c,sz,x,y,z){const sp=api.label(txt,c,sz);sp.position.set(x,y,z);gLabels.add(sp);return sp;}

    // ── draw the shared GRN skeleton (modes share this canonical object) ──
    function drawGRN(maskSet,opt){
      opt=opt||{};
      EDGES.forEach((e,k)=>{
        const a=POS[e[0]],b=POS[e[1]];
        let col=0x223a52, op=0.7;
        if(opt.dropped && opt.dropped.indexOf(k)>=0){col=0x3a2030;op=0.32;}
        if(opt.removedEdge!=null && k<opt.removedEdge){col=new T.Color(VI).getHex();op=0.95;}
        gGraph.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(a[0],a[1],a[2]),new T.Vector3(b[0],b[1],b[2])]),new T.LineBasicMaterial({color:col,transparent:true,opacity:op})));
      });
      GENES.forEach((g,i)=>{
        const p=POS[i];
        const masked=maskSet&&maskSet.indexOf(i)>=0;
        const baseCol=i===0?CY:(i===4?GR:(masked?SL:AM)); // TP53 cyan, E2F1 green
        const col=masked?"#1e2d45":baseCol;
        const emi=masked?0.18:0.6;
        const sph=new T.Mesh(new T.SphereGeometry(masked?0.30:0.40,20,16),
          new T.MeshStandardMaterial({color:new T.Color(col),emissive:new T.Color(col).multiplyScalar(emi),emissiveIntensity:masked?0.3:0.7,roughness:0.4}));
        sph.position.set(p[0],p[1],p[2]);
        gGraph.add(sph);
        api.pick(sph,{gene:{idx:i,name:g,masked:!!masked,expr:EXPR_TRUE[i]}});
        L(g,masked?"#7f93ad":(i===0?CY:(i===4?GR:"#e8eef6")),1.15,p[0],0.78,p[2]);
        if(masked){
          const cone=new T.Mesh(new T.ConeGeometry(0.13,0.42,10),new T.MeshBasicMaterial({color:new T.Color(VI)}));
          cone.rotation.z=Math.PI; cone.position.set(p[0],1.42,p[2]); gMarks.add(cone);
        }
      });
    }

    // ════════════════════════════════════════════════════════════════
    // MODE 1 — masked-node prediction (the Section-5 worked example)
    // ════════════════════════════════════════════════════════════════
    if(mode==="masked"){
      const target=Math.max(1,Math.round(pMask*6));
      let maskSet=[2,3]; // CDKN1A, CCND1 canonical pair
      const growOrder=[4,0,5,1];
      let gi=0; while(maskSet.length<target && gi<growOrder.length){const c=growOrder[gi++]; if(maskSet.indexOf(c)<0)maskSet.push(c);}
      if(maskSet.length>target) maskSet=maskSet.slice(0,target);
      maskSet.sort((a,b)=>a-b);

      drawGRN(maskSet);
      const rec=reconstruct(maskSet);

      // encoder hub + spokes to every gene
      const enc=new T.Mesh(new T.SphereGeometry(0.55,24,18),new T.MeshStandardMaterial({color:new T.Color(CY),emissive:new T.Color(CY),emissiveIntensity:0.5,roughness:0.3}));
      enc.position.set(0,0,0); gMarks.add(enc);
      L("GNN_θ","#4dd7ff",1.25,0,0.95,0);
      GENES.forEach((g,i)=>{const p=POS[i];gMarks.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,0),new T.Vector3(p[0],0,p[2])]),new T.LineBasicMaterial({color:0x18324f,transparent:true,opacity:0.32})));});

      // side panel: per-masked-gene true vs predicted bars
      const px=5.2, baseY=-1.6, bw=0.55, gap=1.5;
      L("reconstruct masked expr","#a78bfa",1.05,px+1.0,3.0,0);
      maskSet.forEach((idx,k)=>{
        const xt=px+k*gap, xp=px+k*gap+0.7;
        const hT=EXPR_TRUE[idx]*3.0, hP=rec.pred[idx]*3.0;
        const barT=new T.Mesh(new T.BoxGeometry(bw,Math.max(0.04,hT),bw),new T.MeshStandardMaterial({color:new T.Color(CY),emissive:new T.Color(CY).multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));
        barT.position.set(xt,baseY+hT/2,0); gPanel.add(barT);
        const barP=new T.Mesh(new T.BoxGeometry(bw,Math.max(0.04,hP),bw),new T.MeshStandardMaterial({color:new T.Color(GR),emissive:new T.Color(GR).multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));
        barP.position.set(xp,baseY+hP/2,0); gPanel.add(barP);
        Ls(GENES[idx],"#cfe0f0",0.34,xt+0.35,baseY-0.18,0);
        L(EXPR_TRUE[idx].toFixed(2),CY,0.85,xt,baseY+hT+0.3,0);
        L(rec.pred[idx].toFixed(2),GR,0.85,xp,baseY+hP+0.3,0);
      });
      Ls("true","#4dd7ff",0.34,px-0.1,baseY-0.55,0);
      Ls("pred","#34d399",0.34,px+0.7,baseY-0.55,0);

      sceneSnap={mode,pMask:+pMask.toFixed(2),nMasked:maskSet.length,maskRatePct:Math.round(maskSet.length/6*100),Lmask:+rec.L.toFixed(5),canonical:rec.canonical,objective:"masked-node"};

      return {
        badge:"Masked-node · "+maskSet.length+"/6 masked ("+Math.round(maskSet.length/6*100)+"%)"+(rec.canonical?" · note example":""),
        formula:"L_mask = (1/|M|) Σ<sub>i∈M</sub> ‖ GNN<sub>θ</sub>(G̃)<sub>i</sub> − x<sub>i</sub> ‖²",
        insight:"Mask node features (grey), reconstruct them from unmasked neighbours through the graph. CDKN1A is recovered from TP53 + RB1; CCND1 from TP53 + E2F1. The model is forced to encode regulatory neighbourhood context, not node identity. Raise the rate and the surviving context — and accuracy — collapse.",
        state:rec.canonical
          ? ("Note example: CDKN1A 0.85→0.79, CCND1 0.22→0.31. L_mask = ½[(0.85−0.79)²+(0.22−0.31)²] = "+rec.L.toFixed(5)+".")
          : (maskSet.length+" nodes masked ("+Math.round(maskSet.length/6*100)+"%). L_mask = "+rec.L.toFixed(5)+" — more masking removes the neighbours that make reconstruction possible."),
        metrics:{objective:"masked-node",pretextLoss:rec.L.toFixed(5),maskRate:Math.round(maskSet.length/6*100)+"%",hardness:"—"},
        focus:{center:[1.5,0,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE 2 — edge reconstruction (link prediction as pretext)
    // ════════════════════════════════════════════════════════════════
    if(mode==="edge"){
      const removedFrac=Math.max(0.16,Math.min(0.84,pMask)); // reuse pMask as edge-removal fraction
      const nRem=Math.max(1,Math.round(removedFrac*EDGES.length));
      drawGRN(null,{removedEdge:nRem});
      const er=sigmoidLossEdge(removedFrac,negHard);

      const enc=new T.Mesh(new T.SphereGeometry(0.5,24,18),new T.MeshStandardMaterial({color:new T.Color(CY),emissive:new T.Color(CY),emissiveIntensity:0.45,roughness:0.3}));
      gMarks.add(enc); L("GNN_θ","#4dd7ff",1.2,0,0.9,0);

      // negative edge (dashed rose) between two non-adjacent genes
      const negPair=negHard?[0,4]:[1,4]; // hard: TP53–E2F1; easy: MDM2–E2F1
      const a=POS[negPair[0]],b=POS[negPair[1]];
      const negLine=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(a[0],0.05,a[2]),new T.Vector3(b[0],0.05,b[2])]),new T.LineDashedMaterial({color:new T.Color(RO).getHex(),dashSize:0.22,gapSize:0.16}));
      negLine.computeLineDistances(); gMarks.add(negLine);
      L("negative ("+(negHard?"hard":"easy")+")",RO,1.0,(a[0]+b[0])/2,0.5,(a[2]+b[2])/2);

      // side bars: positive-edge loss vs negative-edge loss
      const px=5.2, baseY=-1.6;
      L("BCE loss terms","#a78bfa",1.05,px+0.6,3.0,0);
      const terms=[{l:"pos",v:er.pos,c:GR},{l:"neg",v:er.neg,c:RO}];
      terms.forEach((tm,k)=>{const x=px+k*1.2;const h=Math.max(0.04,tm.v*1.6);
        const bar=new T.Mesh(new T.BoxGeometry(0.6,h,0.6),new T.MeshStandardMaterial({color:new T.Color(tm.c),emissive:new T.Color(tm.c).multiplyScalar(0.5),emissiveIntensity:0.5,roughness:0.4}));
        bar.position.set(x,baseY+h/2,0); gPanel.add(bar);
        Ls(tm.l,"#cfe0f0",0.34,x,baseY-0.2,0); L(tm.v.toFixed(2),tm.c,0.85,x,baseY+h+0.3,0);});

      sceneSnap={mode,removedFrac:+removedFrac.toFixed(2),nRemoved:nRem,negHard,negScore:+er.negS.toFixed(2),posLoss:+er.pos.toFixed(3),negLoss:+er.neg.toFixed(3),Ledge:+er.total.toFixed(3),objective:"edge-recon"};

      return {
        badge:"Edge-recon · "+nRem+"/6 edges removed · "+(negHard?"hard":"easy")+" negatives",
        formula:"L_edge = −Σ<sub>(u,v)∈E</sub> log σ(h<sub>u</sub>·h<sub>v</sub>) − Σ<sub>neg</sub> log(1−σ(h<sub>u</sub>·h<sub>v</sub>))",
        insight:"Hide real edges (violet), sample negatives (rose dashes), and score edges by endpoint compatibility h_u·h_v. Easy negatives connect unrelated genes — rejected on surface features, nothing structural learned. Hard negatives (e.g. TP53–E2F1, both cell-cycle hubs) force genuine structural reasoning.",
        state:nRem+" edge(s) removed. Negative score = "+er.negS.toFixed(2)+" ("+(negHard?"hard — close to a real edge":"easy — trivially wrong")+"). Total BCE = "+er.total.toFixed(3)+".",
        metrics:{objective:"edge-recon",pretextLoss:er.total.toFixed(3),maskRate:Math.round(removedFrac*100)+"%",hardness:negHard?"hard":"easy"},
        focus:{center:[1.5,0,0],radius:13}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE 3 — graph contrastive (two augmented views, NT-Xent)
    // ════════════════════════════════════════════════════════════════
    if(mode==="contrastive"){
      const drop1=[],drop2=[];
      for(let k=0;k<EDGES.length;k++){ if(prand(k*3+1)<dropRate)drop1.push(k); if(prand(k*5+2)<dropRate)drop2.push(k);}
      const offX=4.2;
      [[-offX,drop1,"view 1",CY],[offX,drop2,"view 2",GR]].forEach(function(v){
        const ox=v[0],drop=v[1],name=v[2],c=v[3];
        EDGES.forEach((e,k)=>{const a=POS[e[0]],b=POS[e[1]];const dropped=drop.indexOf(k)>=0;
          gGraph.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(a[0]*0.6+ox,a[1],a[2]*0.6),new T.Vector3(b[0]*0.6+ox,b[1],b[2]*0.6)]),new T.LineBasicMaterial({color:dropped?0x3a2030:0x223a52,transparent:true,opacity:dropped?0.25:0.7})));});
        GENES.forEach((g,i)=>{const p=POS[i];const col=i===0?CY:(i===4?GR:AM);
          const sph=new T.Mesh(new T.SphereGeometry(0.26,16,12),new T.MeshStandardMaterial({color:new T.Color(col),emissive:new T.Color(col).multiplyScalar(0.5),emissiveIntensity:0.55,roughness:0.4}));
          sph.position.set(p[0]*0.6+ox,p[1],p[2]*0.6); gGraph.add(sph);api.pick(sph,{gene:{idx:i,name:g,masked:false,expr:EXPR_TRUE[i]}});});
        const z=new T.Mesh(new T.SphereGeometry(0.42,20,16),new T.MeshStandardMaterial({color:new T.Color(c),emissive:new T.Color(c),emissiveIntensity:0.6,roughness:0.3}));
        z.position.set(ox,2.6,0); gMarks.add(z); L(name,c,1.05,ox,3.4,0);
      });

      const cr=contrastive(tau,dropRate);
      gMarks.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-offX,2.6,0),new T.Vector3(offX,2.6,0)]),new T.LineBasicMaterial({color:new T.Color(GR).getHex()})));
      L("pull together  (sim="+cr.simPos.toFixed(2)+")",GR,1.0,0,3.0,0);

      const zNeg=new T.Mesh(new T.SphereGeometry(0.36,20,16),new T.MeshStandardMaterial({color:new T.Color(RO),emissive:new T.Color(RO),emissiveIntensity:0.55,roughness:0.3}));
      zNeg.position.set(0,-2.6,0); gMarks.add(zNeg); L("negative subgraph (sim="+cr.simNeg.toFixed(2)+")",RO,1.0,0,-3.4,0);
      [[-offX],[offX]].forEach(function(o){const ox=o[0];gMarks.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(ox,2.6,0),new T.Vector3(0,-2.6,0)]),new T.LineBasicMaterial({color:new T.Color(RO).getHex(),transparent:true,opacity:0.45})));});

      sceneSnap={mode,tau:+tau.toFixed(2),dropRate:+dropRate.toFixed(2),simPos:+cr.simPos.toFixed(3),simNeg:+cr.simNeg.toFixed(3),pPos:+cr.pPos.toFixed(3),Lcon:+cr.loss.toFixed(3),objective:"contrastive"};

      return {
        badge:"Contrastive · drop "+(dropRate*100).toFixed(0)+"% · τ="+tau.toFixed(2),
        formula:"L_con = −log[ e<sup>sim(z₁,z₂)/τ</sup> / Σ<sub>k</sub> e<sup>sim(z₁,z_k)/τ</sup> ]",
        insight:"Two augmented views of the SAME regulatory subgraph (drop edges / mask features) should map to nearby readouts z₁, z₂ — pulled together (green). A distant subgraph is a negative — pushed apart (rose). Heavy augmentation breaks biological identity: drop too many edges and the two views stop representing the same regulatory program.",
        state:"sim(view1,view2)="+cr.simPos.toFixed(3)+" vs negative "+cr.simNeg.toFixed(3)+". p(positive)="+cr.pPos.toFixed(3)+", L_con="+cr.loss.toFixed(3)+" at τ="+tau.toFixed(2)+".",
        metrics:{objective:"contrastive",pretextLoss:cr.loss.toFixed(3),maskRate:Math.round(dropRate*100)+"%",hardness:"τ="+tau.toFixed(2)},
        focus:{center:[0,0,0],radius:14}
      };
    }

    // ════════════════════════════════════════════════════════════════
    // MODE 4 — context prediction (center subgraph vs context ring)
    // ════════════════════════════════════════════════════════════════
    if(mode==="context"){
      const center=2; // CDKN1A
      const dist=GENES.map(()=>99); dist[center]=0;
      let frontier=[center];for(let d=0;d<3;d++){const nx=[];frontier.forEach(u=>{ADJ[u].forEach(v=>{if(dist[v]>d+1){dist[v]=d+1;nx.push(v);}});});frontier=nx;}
      drawGRN(null,{});
      GENES.forEach((g,i)=>{const p=POS[i];let c;
        if(dist[i]<=centerHops){c=CY;}
        else if(dist[i]<=centerHops+1){c=AM;}
        else {c=SL;}
        const ring=new T.Mesh(new T.RingGeometry(0.50,0.62,24),new T.MeshBasicMaterial({color:new T.Color(c),side:T.DoubleSide,transparent:true,opacity:0.85}));
        ring.rotation.x=-Math.PI/2; ring.position.set(p[0],0.02,p[2]); gMarks.add(ring);
      });
      const cm=contextMatch(centerHops);
      const cp=POS[center];
      L("center (≤"+centerHops+" hops)","#4dd7ff",1.05,cp[0],1.7,cp[2]);
      L("context ring","#fbbf24",1.05,0,-3.4,3.4);
      GENES.forEach((g,i)=>{if(dist[i]===centerHops+1){const p=POS[i];gMarks.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(cp[0],0.04,cp[2]),new T.Vector3(p[0],0.04,p[2])]),new T.LineBasicMaterial({color:new T.Color(VI).getHex(),transparent:true,opacity:0.8})));}});

      sceneSnap={mode,centerHops,ringSize:cm.ringSize,matchAcc:+cm.acc.toFixed(3),objective:"context"};

      return {
        badge:"Context · center ≤"+centerHops+" hops · ring "+cm.ringSize+" nodes",
        formula:"discriminate ( z_center(v), z_context(v) )  vs  ( z_center(v), z_context(w) )",
        insight:"Center = CDKN1A's k-hop neighbourhood (cyan); context = the ring beyond it (amber). The model must match each center to its own surrounding ring (violet links). This forces bridging multiple hops explicitly — a transcription factor's immediate targets must predict the broader regulatory program around them.",
        state:"Center ≤"+centerHops+" hops, context ring = "+cm.ringSize+" nodes. Center→context match accuracy "+(cm.acc*100).toFixed(0)+"%. Larger centers carry more signal about their ring.",
        metrics:{objective:"context",pretextLoss:(1-cm.acc).toFixed(3),maskRate:"—",hardness:centerHops+"-hop"},
        focus:{center:[0,0,0],radius:13}
      };
    }

    return {badge:"K01",formula:"",insight:"",state:"",metrics:{},focus:{center:[0,0,0],radius:13}};
  }

  // ── MathLab.create ──────────────────────────────────────────────────────────
  MathLab.create({
    id:"k01",
    kind:"pretraining-objectives",
    eyebrow:"Block K · Graph Foundation Models",
    title:"K01 · Pretraining objectives for graph foundation models",
    subtitle:"One tiny cell-cycle GRN (TP53–MDM2–CDKN1A–CCND1–E2F1–RB1), four self-supervised pretext tasks. Each objective is a different hypothesis about which graph structure transfers downstream.",
    selectedLabel:"Element",
    selectedHint:"Click a gene node.",
    insightLabel:"What this objective teaches",
    modes:[
      {value:"masked",      label:"Masked-node prediction (worked example)"},
      {value:"edge",        label:"Edge reconstruction (negatives matter)"},
      {value:"contrastive", label:"Graph contrastive (two views)"},
      {value:"context",     label:"Context prediction (center vs ring)"}
    ],
    params:[
      {key:"pMask",     label:"masking / edge-removal rate",min:0.10,max:0.50,step:0.01,value:0.33,
       fmt:v=>(v*100).toFixed(0)+"%",modes:["masked","edge"]},
      {key:"negHard",   label:"negatives (0=easy 1=hard)",min:0,max:1,step:1,value:1,
       fmt:v=>Math.round(v)===0?"easy":"hard",modes:["edge"]},
      {key:"tau",       label:"contrastive temperature τ",min:0.10,max:1.00,step:0.05,value:0.50,
       fmt:v=>v.toFixed(2),modes:["contrastive"]},
      {key:"dropRate",  label:"augmentation edge-drop",min:0.00,max:0.60,step:0.05,value:0.20,
       fmt:v=>(v*100).toFixed(0)+"%",modes:["contrastive"]},
      {key:"centerHops",label:"context center radius (hops)",min:1,max:2,step:1,value:1,
       fmt:v=>Math.round(v)+"-hop",modes:["context"]}
    ],
    metrics:[
      {key:"objective",  label:"Pretext objective",accent:"cyan"},
      {key:"pretextLoss",label:"Pretext loss",accent:"violet"},
      {key:"maskRate",   label:"Corruption rate",accent:"amber"},
      {key:"hardness",   label:"Negative / regime",accent:"green"}
    ],
    layers:[
      {group:"graph", label:"GRN graph"},
      {group:"marks", label:"Encoder / targets"},
      {group:"panel", label:"Loss panel"},
      {group:"labels",label:"Labels"}
    ],
    primary:{
      label:"Note example (33%)",
      on:api=>{api.setMode("masked");api.setParam("pMask",0.33);}
    },
    secondary:{
      label:"Max masking (50%)",
      on:api=>{api.setMode("masked");api.setParam("pMask",0.50);}
    },
    defaultCam:{theta:-0.45,phi:0.62,r:13},
    hint:'<span style="color:#4dd7ff">cyan</span>=TP53 / center · <span style="color:#34d399">green</span>=E2F1 / pred / positive · <span style="color:#fbbf24">amber</span>=gene / context · <span style="color:#a78bfa">violet</span>=reconstruction target · <span style="color:#fb7185">rose</span>=negative · dark grey=masked.',
    onMode(api){
      const s=api.state;
      if(s.mode==="contrastive") api.frame([0,0,0],14);
      else api.frame([1.0,0,0],13);
    },
    onParam(api){
      const s=api.state;
      if(s.mode==="contrastive") api.frame([0,0,0],14);
      else api.frame([1.0,0,0],13);
    },
    onSelect(api,d){
      if(d.gene) api.setSelected(d.gene.name+" · expr="+d.gene.expr.toFixed(2)+(d.gene.masked?" · MASKED (reconstruct)":""));
    },
    build,
    snapshot(s){
      const out={mode:s.mode};
      if(s.mode==="masked"){
        const target=Math.max(1,Math.round(s.pMask*6));
        let m=[2,3];const go=[4,0,5,1];let gi=0;while(m.length<target&&gi<go.length){const c=go[gi++];if(m.indexOf(c)<0)m.push(c);}if(m.length>target)m=m.slice(0,target);m.sort((a,b)=>a-b);
        const rec=reconstruct(m);
        out.pMask=+s.pMask.toFixed(2);out.nMasked=m.length;out.maskRatePct=Math.round(m.length/6*100);out.Lmask=+rec.L.toFixed(5);out.canonical=rec.canonical;out.objective="masked-node";
      } else if(s.mode==="edge"){
        const rf=Math.max(0.16,Math.min(0.84,s.pMask));const er=sigmoidLossEdge(rf,Math.round(s.negHard));
        out.removedFrac=+rf.toFixed(2);out.nRemoved=er.nRem;out.negHard=Math.round(s.negHard);out.posLoss=+er.pos.toFixed(3);out.negLoss=+er.neg.toFixed(3);out.Ledge=+er.total.toFixed(3);out.objective="edge-recon";
      } else if(s.mode==="contrastive"){
        const cr=contrastive(s.tau,s.dropRate);
        out.tau=+s.tau.toFixed(2);out.dropRate=+s.dropRate.toFixed(2);out.simPos=+cr.simPos.toFixed(3);out.simNeg=+cr.simNeg.toFixed(3);out.pPos=+cr.pPos.toFixed(3);out.Lcon=+cr.loss.toFixed(3);out.objective="contrastive";
      } else if(s.mode==="context"){
        const ch=Math.round(s.centerHops);const cm=contextMatch(ch);
        out.centerHops=ch;out.ringSize=cm.ringSize;out.matchAcc=+cm.acc.toFixed(3);out.objective="context";
      }
      return out;
    }
  });
})();
</script>
